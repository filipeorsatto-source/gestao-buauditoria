/* ---------------------------------------------------------------
   GOALS — Gestão de Metas
--------------------------------------------------------------- */

// Dado o id de uma pessoa, retorna o Set de nomes de clientes que ela atende, com base nas
// funções cadastradas em "Papéis e Responsabilidades" (data.tarefas[].responsaveis: {clienteId: pessoaId}).
// Retorna null quando não há pessoa selecionada (= sem filtro, considera todos os clientes).
function getPessoaClienteNomes(pessoaId, data){
  if(!pessoaId) return null;
  const clienteById = Object.fromEntries((data.clientes || []).map(c => [c.id, c.nome]));
  const nomes = new Set();
  (data.tarefas || []).forEach(t => {
    Object.entries(t.responsaveis || {}).forEach(([cid, pid]) => {
      if(pid === pessoaId && clienteById[cid]) nomes.add(clienteById[cid]);
    });
  });
  return nomes;
}

// Conecta cada meta (pelo slug do indicador) ao "Realizado" já calculado nas telas de
// Acompanhamento de Metas, mês a mês, para alimentar o gráfico de Budget x Realizado.
// clienteNomesFilter (opcional): Set de nomes de clientes — quando presente, restringe o cálculo
// apenas aos clientes daquele conjunto, para as metas cujo número é apurado por cliente.
function getMetaRealizadoByMonth(slug, data, clienteNomesFilter){
  const clientesCols = (data.clientes || []).filter(c => c.nome.toLowerCase() !== 'interno' && (!clienteNomesFilter || clienteNomesFilter.has(c.nome)));

  if(slug === 'margem-bruta'){
    const pnlYear = (data.financeiro && data.financeiro.pnl && data.financeiro.pnl[CURRENT_YEAR]) || {};
    const out = {};
    MONTHS.forEach(m => {
      const d = pnlYear[m.n];
      out[m.n] = d ? (d.grossProfit / d.receitaTotal * 100) : null;
    });
    return out;
  }

  if(slug === 'upsell-score'){
    const yearData = (data.upsellScore && data.upsellScore[CURRENT_YEAR]) || {};
    const out = {};
    MONTHS.forEach(m => {
      out[m.n] = avgOf(clientesCols.map(c => computeUpsellScore((yearData[m.n]||{})[c.id])));
    });
    return out;
  }

  if(slug === 'contas-finalizadas'){
    const clientNames = ['Einstein SP','Einstein GO','Sírio SP','Sírio BSB','HCOR','HAOC','AC Camargo']
      .filter(c => !clienteNomesFilter || clienteNomesFilter.has(c));
    const yearData = (data.financeiro && data.financeiro.contasFinalizadas && data.financeiro.contasFinalizadas[CURRENT_YEAR]) || {};
    const out = {};
    MONTHS.forEach(m => {
      const has = clientNames.some(c => (yearData[c]||{})[m.n] !== undefined);
      out[m.n] = has ? clientNames.reduce((sum, c) => sum + (((yearData[c]||{})[m.n]) || 0), 0) : null;
    });
    return out;
  }

  if(slug === 'nps'){
    const yearData = (data.nps && data.nps[CURRENT_YEAR]) || {};
    const totalRow = yearData['_total'] || {};
    const out = {};
    MONTHS.forEach(m => {
      const v = totalRow[m.n];
      out[m.n] = (v === undefined || v === null || v === '') ? null : Number(v);
    });
    return out;
  }

  if(slug === 'penetracao-regras' || slug === 'efetividade-regras'){
    const dataKey = slug === 'penetracao-regras' ? 'penetracaoRegras' : 'efetividadeRegras';
    const yearData = (data[dataKey] && data[dataKey][CURRENT_YEAR]) || {};
    const out = {};
    MONTHS.forEach(m => {
      const vals = clientesCols
        .map(c => (yearData[c.id]||{})[m.n])
        .filter(v => v !== undefined && v !== null && v !== '')
        .map(Number);
      out[m.n] = vals.length ? vals.reduce((a,b)=>a+b,0) / vals.length : null;
    });
    return out;
  }

  if(slug === 'cobertura-dados'){
    const coberturaYear = (data.coberturaDados && data.coberturaDados[CURRENT_YEAR]) || {};
    const totalCampos = COBERTURA_BASES.length * COBERTURA_ITENS.length;
    const totalFields = totalCampos * clientesCols.length;
    const out = {};
    MONTHS.forEach(m => {
      const monthData = coberturaYear[m.n];
      if(!monthData || !totalFields){ out[m.n] = null; return; }
      let checked = 0;
      clientesCols.forEach(c => {
        COBERTURA_BASES.forEach(base => COBERTURA_ITENS.forEach(item => {
          const rowKey = coberturaRowKey(base.key, item);
          if(monthData[rowKey] && monthData[rowKey][c.id]) checked++;
        }));
      });
      out[m.n] = checked / totalFields * 100;
    });
    return out;
  }

  if(slug === 'entregas-prazo'){
    const merged = buildDemandasMerged(data.demandasCustom, data.demandasBase);
    const base = merged.filter(m => m.classificacao && m.classificacao.startsWith('Desenvolvimento') && m.mesPlanning
      && (!clienteNomesFilter || clienteNomesFilter.has(m.cliente)));
    const out = {};
    MONTHS.forEach(m => {
      const subset = base.filter(x => String(x.mesPlanning) === String(m.n));
      out[m.n] = subset.length ? (subset.filter(x => x.concluidaNoPrazo).length / subset.length * 100) : null;
    });
    return out;
  }

  if(slug === 'csat-tech' || slug === 'csat-atendimento' || slug === 'csat-produto'){
    const matchFn = slug === 'csat-tech' ? (c => c.startsWith('Desenvolvimento'))
      : slug === 'csat-produto' ? (c => c === 'Desenvolvimento Produto')
      : (c => c.startsWith('Atendimento'));
    const merged = buildDemandasMerged(data.demandasCustom, data.demandasBase);
    const scoped = merged.filter(m => m.classificacao && matchFn(m.classificacao) && m.mesPlanning
      && (!clienteNomesFilter || clienteNomesFilter.has(m.cliente)));
    const out = {};
    MONTHS.forEach(m => {
      const subset = scoped.filter(x => String(x.mesPlanning) === String(m.n));
      out[m.n] = avgCsat(subset.map(x => x.csat));
    });
    return out;
  }

  if(slug === 'dias-ticket-aberto'){
    const merged = buildDemandasMerged(data.demandasCustom, data.demandasBase);
    const scoped = merged.filter(m => !!m.mesPlanning && m.diasEmAberto !== null && m.diasEmAberto !== undefined
      && (!clienteNomesFilter || clienteNomesFilter.has(m.cliente)));
    const out = {};
    MONTHS.forEach(m => {
      const subset = scoped.filter(x => String(x.mesPlanning) === String(m.n));
      out[m.n] = avgOf(subset.map(x => x.diasEmAberto));
    });
    return out;
  }

  return null;
}

// Para as 3 metas cujo Budget agora é definido direto na tela do indicador (não em Gestão de Metas),
// retorna os valores mensais equivalentes ao goal.budgets. Para as demais, retorna null (usa goal.budgets normalmente).
function getMetaBudgetOverrideByMonth(slug, data, clienteNomesFilter){
  const clientesCols = (data.clientes || []).filter(c => c.nome.toLowerCase() !== 'interno' && (!clienteNomesFilter || clienteNomesFilter.has(c.nome)));

  if(slug === 'contas-finalizadas'){
    const clientNames = ['Einstein SP','Einstein GO','Sírio SP','Sírio BSB','HCOR','HAOC','AC Camargo']
      .filter(c => !clienteNomesFilter || clienteNomesFilter.has(c));
    const yearData = (data.financeiro && data.financeiro.contasFinalizadasBudget && data.financeiro.contasFinalizadasBudget[CURRENT_YEAR]) || {};
    const out = {};
    MONTHS.forEach(m => {
      const has = clientNames.some(c => (yearData[c]||{})[m.n] !== undefined && (yearData[c]||{})[m.n] !== null && (yearData[c]||{})[m.n] !== '');
      out[m.n] = has ? clientNames.reduce((sum, c) => sum + (Number((yearData[c]||{})[m.n]) || 0), 0) : null;
    });
    return out;
  }

  if(slug === 'penetracao-regras' || slug === 'efetividade-regras'){
    const dataKey = slug === 'penetracao-regras' ? 'penetracaoRegrasBudget' : 'efetividadeRegrasBudget';
    const yearData = (data[dataKey] && data[dataKey][CURRENT_YEAR]) || {};
    const out = {};
    MONTHS.forEach(m => {
      const vals = clientesCols
        .map(c => (yearData[c.id]||{})[m.n])
        .filter(v => v !== undefined && v !== null && v !== '')
        .map(Number);
      out[m.n] = vals.length ? vals.reduce((a,b)=>a+b,0) / vals.length : null;
    });
    return out;
  }

  return null;
}

// Indicadores para os quais existe granularidade por cliente (Realizado, e às vezes Budget).
// Os demais (ex.: Margem Bruta, que é uma razão do P&L da empresa como um todo) não têm quebra
// por cliente e por isso não exibem a tabela Clientes x Meses.
const META_GRANULAR_CLIENTE_SLUGS = [
  'upsell-score','contas-finalizadas','penetracao-regras','efetividade-regras',
  'cobertura-dados','entregas-prazo','csat-tech','csat-atendimento','csat-produto',
  'dias-ticket-aberto','nps',
];

// Realizado de um indicador, para um cliente e mês específicos. Retorna null se não aplicável.
function getMetaRealizadoPorClienteMes(slug, data, clienteId, clienteNome, mesN){
  if(slug === 'upsell-score'){
    const monthData = ((data.upsellScore||{})[CURRENT_YEAR]||{})[mesN] || {};
    return computeUpsellScore(monthData[clienteId]);
  }
  if(slug === 'contas-finalizadas'){
    const yearData = (data.financeiro && data.financeiro.contasFinalizadas && data.financeiro.contasFinalizadas[CURRENT_YEAR]) || {};
    const v = (yearData[clienteNome]||{})[mesN];
    return (v === undefined || v === null || v === '') ? null : Number(v);
  }
  if(slug === 'penetracao-regras' || slug === 'efetividade-regras'){
    const dataKey = slug === 'penetracao-regras' ? 'penetracaoRegras' : 'efetividadeRegras';
    const yearData = (data[dataKey] && data[dataKey][CURRENT_YEAR]) || {};
    const v = (yearData[clienteId]||{})[mesN];
    return (v === undefined || v === null || v === '') ? null : Number(v);
  }
  if(slug === 'cobertura-dados'){
    const coberturaYear = (data.coberturaDados && data.coberturaDados[CURRENT_YEAR]) || {};
    const monthData = coberturaYear[mesN];
    const totalCampos = COBERTURA_BASES.length * COBERTURA_ITENS.length;
    if(!monthData || !totalCampos) return null;
    let checked = 0;
    COBERTURA_BASES.forEach(base => COBERTURA_ITENS.forEach(item => {
      const rowKey = coberturaRowKey(base.key, item);
      if(monthData[rowKey] && monthData[rowKey][clienteId]) checked++;
    }));
    return checked / totalCampos * 100;
  }
  if(slug === 'entregas-prazo'){
    const merged = buildDemandasMerged(data.demandasCustom, data.demandasBase);
    const subset = merged.filter(x => x.classificacao && x.classificacao.startsWith('Desenvolvimento') && String(x.mesPlanning) === String(mesN) && x.cliente === clienteNome);
    return subset.length ? (subset.filter(x => x.concluidaNoPrazo).length / subset.length * 100) : null;
  }
  if(slug === 'csat-tech' || slug === 'csat-atendimento' || slug === 'csat-produto'){
    const matchFn = slug === 'csat-tech' ? (c => c.startsWith('Desenvolvimento'))
      : slug === 'csat-produto' ? (c => c === 'Desenvolvimento Produto')
      : (c => c.startsWith('Atendimento'));
    const merged = buildDemandasMerged(data.demandasCustom, data.demandasBase);
    const subset = merged.filter(x => x.classificacao && matchFn(x.classificacao) && String(x.mesPlanning) === String(mesN) && x.cliente === clienteNome);
    return avgCsat(subset.map(x => x.csat));
  }
  if(slug === 'dias-ticket-aberto'){
    const merged = buildDemandasMerged(data.demandasCustom, data.demandasBase);
    const subset = merged.filter(x => !!x.mesPlanning && x.diasEmAberto !== null && x.diasEmAberto !== undefined && String(x.mesPlanning) === String(mesN) && x.cliente === clienteNome);
    return avgOf(subset.map(x => x.diasEmAberto));
  }
  if(slug === 'nps'){
    const yearData = (data.nps && data.nps[CURRENT_YEAR]) || {};
    const v = (yearData[clienteId]||{})[mesN];
    return (v === undefined || v === null || v === '') ? null : Number(v);
  }
  return null;
}

// Budget de um indicador, por cliente e mês, apenas para os 3 indicadores cujo budget já é
// nativamente detalhado por cliente (definido na própria tela do indicador). Para os demais,
// retorna null — nesse caso a tabela usa o budget mensal único do indicador (mesmo valor em todas as linhas).
function getMetaBudgetPorClienteMes(slug, data, clienteId, clienteNome, mesN){
  if(slug === 'contas-finalizadas'){
    const yearData = (data.financeiro && data.financeiro.contasFinalizadasBudget && data.financeiro.contasFinalizadasBudget[CURRENT_YEAR]) || {};
    const v = (yearData[clienteNome]||{})[mesN];
    return (v === undefined || v === null || v === '') ? null : Number(v);
  }
  if(slug === 'penetracao-regras' || slug === 'efetividade-regras'){
    const dataKey = slug === 'penetracao-regras' ? 'penetracaoRegrasBudget' : 'efetividadeRegrasBudget';
    const yearData = (data[dataKey] && data[dataKey][CURRENT_YEAR]) || {};
    const v = (yearData[clienteId]||{})[mesN];
    return (v === undefined || v === null || v === '') ? null : Number(v);
  }
  return null;
}

// Tabela Clientes (linhas) x Meses (colunas) com Real / Budget em cada célula, exibida embaixo
// do gráfico de cada meta em Gestão de Metas.
function GoalClienteMesTable({goal, data, clienteNomesFilter}){
  if(!goal.slug || !META_GRANULAR_CLIENTE_SLUGS.includes(goal.slug)) return null;
  const clientesCols = (data.clientes || []).filter(c => c.nome.toLowerCase() !== 'interno' && (!clienteNomesFilter || clienteNomesFilter.has(c.nome)));
  if(!clientesCols.length) return null;

  const isExterno = META_BUDGET_EXTERNO_SLUGS.includes(goal.slug);
  const flatBudgetByMonth = isExterno ? getMetaBudgetOverrideByMonth(goal.slug, data, clienteNomesFilter) : (goal.budgets[CURRENT_YEAR] || {});
  const budgetIsPerCliente = ['contas-finalizadas','penetracao-regras','efetividade-regras'].includes(goal.slug);

  return (
    <div style={{marginTop:14}}>
      <div className="section-block-title" style={{fontSize:12.5, marginBottom:6}}>Clientes × Meses · Real / Budget</div>
      <div className="table-wrap">
        <table className="upsell-tbl">
          <thead>
            <tr><th>Cliente</th>{MONTHS.map(m => <th key={m.n}>{m.label}</th>)}</tr>
          </thead>
          <tbody>
            {clientesCols.map(c => (
              <tr key={c.id}>
                <td style={{textAlign:'left', paddingLeft:12, fontWeight:600}}>{c.nome}</td>
                {MONTHS.map(m => {
                  const real = getMetaRealizadoPorClienteMes(goal.slug, data, c.id, c.nome, m.n);
                  const budgetPerCliente = getMetaBudgetPorClienteMes(goal.slug, data, c.id, c.nome, m.n);
                  const budgetRaw = budgetPerCliente !== null ? budgetPerCliente : (flatBudgetByMonth ? flatBudgetByMonth[m.n] : undefined);
                  const hasReal = real !== null && real !== undefined;
                  const hasBudget = budgetRaw !== undefined && budgetRaw !== null && budgetRaw !== '';
                  if(!hasReal && !hasBudget) return <td key={m.n} style={{color:'#B7BACB'}}>—</td>;
                  return (
                    <td key={m.n} style={{fontFamily:'IBM Plex Mono, monospace', fontSize:11.5, lineHeight:1.55, padding:'6px 10px'}}>
                      <div>{hasReal ? fmtChartValue(real, goal.unidadeMedida) : '—'}</div>
                      <div style={{color:'var(--ink-soft)'}}>{hasBudget ? fmtChartValue(Number(budgetRaw), goal.unidadeMedida) : '—'}</div>
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="budget-note">
        Em cada célula: <strong style={{fontWeight:600, fontStyle:'normal'}}>Real</strong> em cima, <em>Budget</em> embaixo
        {!budgetIsPerCliente ? ' (budget mensal do indicador, o mesmo valor aplicado a cada cliente, pois este indicador não tem budget detalhado por cliente)' : ''}.
      </div>
    </div>
  );
}

// Tabela-resumo no topo de Gestão de Metas: metas nas linhas, meses nas colunas,
// variação percentual Realizado vs. Budget = (Realizado / Budget - 1) x 100.
function GoalsSummaryTable({goals, data, clienteNomesFilter}){
  if(!goals.length) return null;
  return (
    <div className="card" style={{marginBottom:20}}>
      <div className="section-block-head" style={{padding:'18px 22px 0'}}>
        <div>
          <div className="section-block-title">Realizado vs. Budget · % por mês</div>
          <div className="section-block-desc">(Realizado / Budget - 1) × 100, mês a mês, para cada meta. Ex.: budget 100 e realizado 50 mostra -50%.</div>
        </div>
      </div>
      <div className="table-wrap">
        <table className="upsell-tbl">
          <thead>
            <tr><th></th>{MONTHS.map(m => <th key={m.n}>{m.label}</th>)}</tr>
          </thead>
          <tbody>
            {goals.map(g => {
              const isExterno = g.slug && META_BUDGET_EXTERNO_SLUGS.includes(g.slug);
              const budgetByMonth = isExterno ? getMetaBudgetOverrideByMonth(g.slug, data, clienteNomesFilter) : (g.budgets[CURRENT_YEAR] || {});
              const realizadoByMonth = g.slug ? getMetaRealizadoByMonth(g.slug, data, clienteNomesFilter) : null;
              return (
                <tr key={g.id}>
                  <td style={{textAlign:'left', paddingLeft:12, fontWeight:600}}>{g.titulo}</td>
                  {MONTHS.map(m => {
                    const rawBudget = budgetByMonth ? budgetByMonth[m.n] : undefined;
                    const hasBudget = rawBudget !== undefined && rawBudget !== null && rawBudget !== '' && Number(rawBudget) !== 0;
                    const rawRealizado = realizadoByMonth ? realizadoByMonth[m.n] : null;
                    const hasRealizado = rawRealizado !== undefined && rawRealizado !== null;
                    if(!hasBudget || !hasRealizado){
                      return <td key={m.n} style={{color:'#B7BACB'}}>—</td>;
                    }
                    const pct = (Number(rawRealizado) / Number(rawBudget) - 1) * 100;
                    const color = pct >= 0 ? 'var(--positive)' : 'var(--negative)';
                    return (
                      <td key={m.n} style={{fontWeight:600, color, fontFamily:'IBM Plex Mono, monospace'}}>
                        {pct >= 0 ? '+' : ''}{pct.toLocaleString('pt-BR', {maximumFractionDigits:0})}%
                      </td>
                    );
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// Bloco completo de uma meta (antigo GoalCard + GoalDetail combinados), exibido diretamente
// na listagem de Gestão de Metas — sem precisar clicar para ver o gráfico e os detalhes.
function GoalFullCard({goal, pessoas, data, clienteNomesFilter, onEdit, onDelete}){
  const pessoaById = Object.fromEntries(pessoas.map(p=>[p.id,p]));
  const isExterno = goal.slug && META_BUDGET_EXTERNO_SLUGS.includes(goal.slug);
  const year = isExterno ? getMetaBudgetOverrideByMonth(goal.slug, data, clienteNomesFilter) : (goal.budgets[CURRENT_YEAR] || {});
  const total = Object.values(year).reduce((a,b) => a + (Number(b)||0), 0);
  const assoc = (goal.pessoaIds||[]).map(id => pessoaById[id]).filter(Boolean);
  const realizedByMonth = goal.slug ? getMetaRealizadoByMonth(goal.slug, data, clienteNomesFilter) : null;

  return (
    <div style={{borderBottom:'1px solid var(--line)', paddingBottom:24, marginBottom:24}}>
      <div className="detail-header">
        <div>
          <div className="topbar-eyebrow">{goal.unidadeMedida}</div>
          <div className="placeholder-title" style={{fontSize:20}}>{goal.titulo}</div>
        </div>
        <div className="row-actions">
          <button className="btn btn-ghost btn-sm" onClick={onEdit}><IconEdit width="13" height="13"/>Editar</button>
          <button className="btn btn-danger btn-sm" onClick={onDelete}><IconTrash width="13" height="13"/>Excluir</button>
        </div>
      </div>

      <div className="detail-grid">
        <div className="card card-pad">
          <BudgetChart budgetsByMonth={year} realizedByMonth={realizedByMonth} unidade={goal.unidadeMedida}/>
          {isExterno && <div className="budget-note">Budget definido na tela do indicador, dentro de Acompanhamento de Metas.</div>}
          <GoalClienteMesTable goal={goal} data={data} clienteNomesFilter={clienteNomesFilter}/>
        </div>

        <div className="card card-pad">
          <div className="section-block-title" style={{marginBottom:6}}>Detalhes</div>
          <div className="kv-row"><span className="kv-label">Descrição</span><span className="kv-value">{goal.descricao || '—'}</span></div>
          <div className="kv-row"><span className="kv-label">Fonte</span><span className="kv-value" style={{wordBreak:'break-all'}}>
            {goal.fonte ? (isUrlLike(goal.fonte) ? <a href={goal.fonte} target="_blank" rel="noopener noreferrer">{goal.fonte}</a> : goal.fonte) : '—'}
          </span></div>
          <div className="kv-row"><span className="kv-label">Unidade de medida</span><span className="kv-value">{goal.unidadeMedida}</span></div>
          <div className="kv-row"><span className="kv-label">Budget anual {CURRENT_YEAR}</span><span className="kv-value">{fmtNumber(total)}</span></div>
          <div className="kv-row"><span className="kv-label">Pessoas responsáveis</span>
            <span className="kv-value">
              {assoc.length === 0 ? '—' : (
                <div className="chip-row" style={{justifyContent:'flex-end'}}>
                  {assoc.map(p => <span className="tag" key={p.id}>{p.nome}</span>)}
                </div>
              )}
            </span>
          </div>
        </div>
      </div>
    </div>
  );
}

    return data.metas.filter(g => (g.pessoaIds||[]).includes(fPessoa));

        onCancel={()=>setConfirmDel(null)}
        onConfirm={()=>{ actions.deleteGoal(confirmDel.id); setConfirmDel(null); }} />
    </div>
  );
}

function HoursSummary({rotinas, pessoas}){
  const rows = useMemo(() => {
    return pessoas.map(p => {
      const count = rotinas.filter(r => (r.participanteIds||[]).includes(p.id)).length;
      return {pessoa: p, count, horas: count * 0.5};
    }).filter(r => r.count > 0).sort((a,b) => b.horas - a.horas);
  }, [rotinas, pessoas]);

  return (
    <div className="card card-pad">
      <div className="section-block-title" style={{marginBottom:4}}>Horas em reunião</div>
      <div className="section-block-desc" style={{marginBottom:14}}>Estimativa com base na quantidade de reuniões associadas a cada pessoa (30 min por reunião).</div>
      {rows.length === 0 ? (
        <EmptyState icon={IconClock} title="Nenhum participante associado"
          sub="Associe pessoas às reuniões para ver a consolidação de horas por participante."/>
      ) : (
        <div className="hours-summary-grid">
          {rows.map(r => (
            <div className="hours-summary-item" key={r.pessoa.id}>
              <div className="orgchart-avatar" style={{background: colorForArea(r.pessoa.area), width:28, height:28, fontSize:11}}>{initials(r.pessoa.nome)}</div>
              <div style={{minWidth:0}}>
                <div className="hours-summary-name">{r.pessoa.nome}</div>
                <div className="hours-summary-meta">{r.count} {r.count===1 ? 'reunião' : 'reuniões'}</div>
              </div>
              <div className="hours-summary-value">{fmtNumber(r.horas)}h</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function RotinasPage({data, actions}){

      <div className="card">
        <div className="rotinas-table-wrap">
          <table className="rotinas-tbl">
            <thead>
              <tr>
                <th></th>
                {columns.map(c => <th key={c.id} className={c.nome.toLowerCase()==='interno' ? 'internal-col' : undefined}>{c.nome}</th>)}
              </tr>
            </thead>
            <tbody>
              {DIAS_SEMANA.map(dia => {

                    {isOpen && (
                      <tr className="drilldown-row">
                        <td colSpan={columns.length + 1}>
                          <div className="drilldown-wrap">
                            <table className="drilldown-tbl">
                              <thead>
                                <tr>
                                  <th></th>
                                  {columns.map(c => <th key={c.id} className={c.nome.toLowerCase()==='interno' ? 'internal-col' : undefined}>{c.nome}</th>)}
                                </tr>
                              </thead>
                              <tbody>
                                {TIME_SLOTS.map(slot => (
                                  <tr key={slot}>
                                    <td className="drilldown-time-cell">{slot}</td>
                                    {columns.map(col => {
                                      const meetings = meetingsFor(dia, col.id, slot);
                                      return (
                                        <td key={col.id} className={meetings.length===0 ? 'slot-cell' : undefined}
                                          onClick={() => { if(meetings.length===0) setModal({prefill:{dia, horario:slot, clienteId:col.id}}); }}>
                                          {meetings.length === 0 ? (
                                            <span className="slot-add-btn"><IconPlus width="12" height="12"/></span>
                                          ) : meetings.map(m => (
                                            <div className={"meeting-pill-sm" + (col.nome.toLowerCase()==='interno' ? ' internal' : '')} key={m.id}
                                              onClick={(e)=>{ e.stopPropagation(); setModal({edit:m}); }}>
                                              {m.titulo}
                                            </div>
                                          ))}
                                        </td>
                                      );
                                    })}
                                  </tr>

                              </tbody>

                          </div>
                        </td>

                );
              })}

          </table>

      </div>

      <div style={{height:22}}></div>
      <HoursSummary rotinas={data.rotinas} pessoas={data.pessoas}/>

      {modal && (
        <RotinaModal
          initial={modal.edit || null}
          prefill={modal.prefill || null}
          pessoas={data.pessoas}
          clientes={columns}
          onClose={()=>setModal(null)}
          onDelete={()=>{ setConfirmDel(modal.edit); setModal(null); }}
          onSave={(vals)=>{
            if(modal.edit) actions.editRotina(modal.edit.id, vals);
            else actions.addRotina(vals);
            setModal(null);
          }}
        />

      <ConfirmDialog open={!!confirmDel} title="Excluir reunião"
        text={confirmDel ? 'Tem certeza que deseja excluir "' + confirmDel.titulo + '"?' : ''}
        onCancel={()=>setConfirmDel(null)} onConfirm={()=>{ actions.deleteRotina(confirmDel.id); setConfirmDel(null); }} />
    </div>
  );
}

function MargemBrutaPage({financeiro}){
  const pnlYear = (financeiro && financeiro.pnl && financeiro.pnl[CURRENT_YEAR]) || {};
  const filledMonths = MONTHS.filter(m => pnlYear[m.n]);
  const lastMonth = filledMonths.length ? filledMonths[filledMonths.length - 1] : null;
  const lastData = lastMonth ? pnlYear[lastMonth.n] : null;
  const kpi = lastData ? (lastData.grossProfit / lastData.receitaTotal) * 100 : null;

  const clientNames = ['Einstein SP','Einstein GO','Sírio SP','Sírio BSB','HCOR','HAOC','AC Camargo'];

  const rows = [
    {key:'receitaTotal', label:'Total revenues', type:'main'},
    ...clientNames.map(c => ({key:'cliente:'+c, label:c, type:'sub'})),
    {key:'taxasReceita', label:'(-) Taxes on revenues', type:'main'},
    {key:'cogs', label:'(-) COGS', type:'main'},
    {key:'payroll', label:'(-) Payroll', type:'main'},
    {key:'grossProfit', label:'(=) Gross profit', type:'total'},
    {key:'gea', label:'(-) G&A', type:'main'},
    {key:'sem', label:'(-) S&M', type:'main'},
    {key:'ebitda', label:'(=) EBITDA / burn', type:'total'},
  ];

  const cellValue = (row, month) => {
    const data = pnlYear[month.n];
    if(!data) return null;
    if(row.key.startsWith('cliente:')){
      const nome = row.key.slice(8);
      return data.receitaPorCliente ? data.receitaPorCliente[nome] : null;
    }
    return data[row.key];
  };

  return (
    <div>
      <div className="section-block">
        <div className="kpi-hero">
          {lastMonth && <div className="kpi-hero-period">Fechamento · {lastMonth.label}/{CURRENT_YEAR}</div>}
          <div className="kpi-hero-label">Margem Bruta</div>
          {kpi !== null ? (
            <div className={"kpi-hero-value" + (kpi < 0 ? ' negative' : ' positive')}>{fmtPercent(kpi)}</div>
          ) : (
            <div className="kpi-hero-value" style={{fontSize:22, color:'#9BA0B8'}}>Sem dados de fechamento</div>
          )}
          <div className="kpi-hero-formula">Gross Profit / Receita Líquida</div>
          {lastData && (
            <div className="kpi-hero-detail">
              <div className="kpi-hero-detail-item">
                <div className="kpi-hero-detail-label">Receita Líquida</div>
                <div className="kpi-hero-detail-value">{fmtCurrency(lastData.receitaTotal)}</div>
              </div>
              <div className="kpi-hero-detail-item">
                <div className="kpi-hero-detail-label">Gross Profit</div>
                <div className="kpi-hero-detail-value">{fmtCurrency(lastData.grossProfit)}</div>
              </div>
              <div className="kpi-hero-detail-item">
                <div className="kpi-hero-detail-label">EBITDA / burn</div>
                <div className="kpi-hero-detail-value">{fmtCurrency(lastData.ebitda)}</div>
              </div>
            </div>
          )}
        </div>
      </div>

      <div className="card">
        <div className="section-block-head" style={{padding:'18px 22px 0'}}>
          <div>
            <div className="section-block-title">P&amp;L · {CURRENT_YEAR}</div>
            <div className="section-block-desc">Dados carregados da aba Finance da planilha de metas.</div>
          </div>
        </div>
        <div className="table-wrap">
          <table className="pnl-tbl">
            <thead>
              <tr>
                <th></th>
                {MONTHS.map(m => <th key={m.n}>{m.label}</th>)}
              </tr>
            </thead>
            <tbody>
              {rows.map(row => (
                <tr key={row.key} className={"pnl-row-" + row.type}>
                  <td>{row.label}</td>
                  {MONTHS.map(m => {
                    const val = cellValue(row, m);
                    const formatted = fmtCurrency(val);
                    return (
                      <td key={m.n} className={formatted === null ? 'empty-val' : (val < 0 ? 'negative' : '')}>

                  })}

              ))}
            </tbody>
          </table>
        </div>

function scoreBadgeClass(v){
  if(v === null || v === undefined) return '';
  if(v >= 7) return '';
  if(v >= 4) return 'mid';
  return 'low';
}

function MonthUpsellTable({mes, monthData, clientesCols, actions, expanded, onToggle}){
  const monthLabel = MONTHS.find(m => m.n === mes.n).label;
  const totalOverall = avgOf(clientesCols.map(c => computeUpsellScore((monthData||{})[c.id])));

  const setVal = (clienteId, kpiKey, raw) => actions.setUpsellValue(mes.n, clienteId, kpiKey, raw === '' ? null : raw);
  const setSub = (clienteId, kpiKey, subKey, raw) => actions.setUpsellSubValue(mes.n, clienteId, kpiKey, subKey, raw);

  return (
    <div className="card" style={{marginBottom:14}}>
      <div className="group-card-head" style={{cursor:'pointer'}} onClick={onToggle}>
        <IconChevron className={"nav-caret" + (expanded ? ' open' : '')} width="14" height="14" style={{color:'var(--ink-soft)'}}/>
        {monthLabel} · {CURRENT_YEAR}
        <span className="group-card-count" style={totalOverall !== null ? {background:'var(--accent-soft)', color:'var(--accent-ink)'} : undefined}>
          {totalOverall !== null ? 'Total ' + fmtScore(totalOverall) : 'Sem dados'}
        </span>
      </div>
      {expanded && (
        <div className="table-wrap">
          <table className="upsell-tbl">
            <thead>
              <tr>
                <th>Pilar / KPI</th>
                {clientesCols.map(c => <th key={c.id}>{c.nome}</th>)}
                <th>Total</th>
              </tr>
            </thead>
            <tbody>
              {UPSELL_PILLARS.map(pillar => (
                <React.Fragment key={pillar.n}>
                  <tr className="upsell-pillar-row">
                    <td>{pillar.n}. {pillar.nome}</td>
                    {clientesCols.map(c => {
                      const score = computePillarScore(pillar, (monthData||{})[c.id]);
                      return <td key={c.id} className="upsell-pillar-score">{fmtScore(score)}</td>;
                    })}
                    <td className="upsell-pillar-score">
                      {fmtScore(avgOf(clientesCols.map(c => computePillarScore(pillar, (monthData||{})[c.id]))))}
                    </td>
                  </tr>

                  {pillar.kpis.map(kpi => {
                    if(kpi.tipo === 'termometro' || kpi.tipo === 'ritos'){
                      return (
                        <React.Fragment key={kpi.key}>
                          {kpi.subitens.map(sub => (
                            <tr className="upsell-sub-row" key={sub}>
                              <td>{sub}</td>
                              {clientesCols.map(c => {
                                const clienteData = (monthData||{})[c.id] || {};
                                const subData = clienteData[kpi.key] || {};
                                if(kpi.tipo === 'termometro'){
                                  return (
                                    <td key={c.id}>
                                      <select className="upsell-select" value={subData[sub] || ''}
                                        onChange={e => setSub(c.id, kpi.key, sub, e.target.value || null)}>
                                        <option value="">—</option>
                                        <option value="quente">Quente</option>
                                        <option value="morno">Morno</option>
                                        <option value="frio">Frio</option>
                                      </select>
                                    </td>
                                  );
                                }
                                return (
                                  <td key={c.id}>
                                    <input type="checkbox" className="upsell-check" checked={!!subData[sub]}
                                      onChange={e => setSub(c.id, kpi.key, sub, e.target.checked)}/>
                                  </td>
                                );
                              })}
                              <td>—</td>
                            </tr>
                          ))}
                          <tr className="upsell-kpi-computed-row">
                            <td>{kpi.nome}</td>
                            {clientesCols.map(c => {
                              const score = computeKpiScore(kpi, (monthData||{})[c.id]);
                              return <td key={c.id}>{fmtScore(score)}</td>;
                            })}
                            <td>{fmtScore(avgOf(clientesCols.map(c => computeKpiScore(kpi, (monthData||{})[c.id]))))}</td>
                          </tr>
                        </React.Fragment>
                      );
                    }
                    return (
                      <tr className="upsell-kpi-row" key={kpi.key}>
                        <td>{kpi.nome}{kpi.sufixo ? ' (' + kpi.sufixo + ')' : ''}</td>
                        {clientesCols.map(c => {
                          const clienteData = (monthData||{})[c.id] || {};
                          const raw = clienteData[kpi.key];
                          const score = computeKpiScore(kpi, clienteData);
                          return (
                            <td key={c.id}>
                              <input
                                type="number"
                                className="upsell-input"
                                defaultValue={isEmptyVal(raw) ? '' : raw}
                                key={c.id + '-' + (raw ?? '')}
                                placeholder="—"
                                onBlur={e => setVal(c.id, kpi.key, e.target.value)}
                              />
                              <div><span className={"upsell-score-badge " + scoreBadgeClass(score)}>{fmtScore(score)}</span></div>
                            </td>
                          );
                        })}
                        <td>
                          {fmtScore(avgOf(clientesCols.map(c => computeKpiScore(kpi, ((monthData||{})[c.id]||{})))))}
                        </td>
                      </tr>
                    );
                  })}
                </React.Fragment>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function UpsellScorePage({upsellScore, clientes, actions}){
  const yearData = (upsellScore && upsellScore[CURRENT_YEAR]) || {};
  const clientesCols = useMemo(() => clientes.filter(c => c.nome.toLowerCase() !== 'interno'), [clientes]);

  const [expandedMonths, setExpandedMonths] = useState(() => new Set());
  const toggleMonth = (n) => setExpandedMonths(prev => {
    const next = new Set(prev);
    if(next.has(n)) next.delete(n); else next.add(n);
    return next;
  });

  const filledMonths = MONTHS.filter(m => yearData[m.n] && avgOf(clientesCols.map(c => computeUpsellScore((yearData[m.n]||{})[c.id]))) !== null);
  const lastMonth = filledMonths.length ? filledMonths[filledMonths.length - 1] : null;
  const lastTotal = lastMonth ? avgOf(clientesCols.map(c => computeUpsellScore((yearData[lastMonth.n]||{})[c.id]))) : null;

  return (
    <div>
      <div className="section-block">
        <div className="kpi-hero">
          {lastMonth && <div className="kpi-hero-period">Última leitura · {lastMonth.label}/{CURRENT_YEAR}</div>}
          <div className="kpi-hero-label">Upsell Score</div>
          {lastTotal !== null ? (
            <div className={"kpi-hero-value" + (lastTotal >= 7 ? ' positive' : (lastTotal < 4 ? ' negative' : ''))} style={lastTotal>=4 && lastTotal<7 ? {color:'#F2CB8A'} : undefined}>
              {fmtScore(lastTotal)}<span style={{fontSize:20, opacity:0.6}}> / 10</span>
            </div>
          ) : (
            <div className="kpi-hero-value" style={{fontSize:22, color:'#9BA0B8'}}>Sem dados preenchidos</div>
          )}
          <div className="kpi-hero-formula">Média simples dos 5 pilares, por cliente — total é a média das médias entre clientes</div>
        </div>
      </div>

      <div className="section-block-head">
        <div>
          <div className="section-block-title">Pilares &amp; KPIs por cliente</div>
          <div className="section-block-desc">Uma tabela por mês. Preencha os valores brutos de cada KPI por cliente — os scores e o total são calculados automaticamente.</div>
        </div>
      </div>

      {MONTHS.map(m => (
        <MonthUpsellTable
          key={m.n}
          mes={m}
          monthData={yearData[m.n]}

          actions={actions}
          expanded={expandedMonths.has(m.n)}

        />
      ))}
    </div>
  );
}

function MonthCoberturaTable({mes, monthData, clientesCols, actions, expanded, onToggle}){
  const monthLabel = MONTHS.find(m => m.n === mes.n).label;
  const totalCampos = COBERTURA_BASES.length * COBERTURA_ITENS.length;

  const isChecked = (rowKey, clienteId) => !!((monthData||{})[rowKey] && (monthData||{})[rowKey][clienteId]);

  const baseProgressForClient = (baseKey, clienteId) => {
    let checked = 0;
    COBERTURA_ITENS.forEach(item => { if(isChecked(coberturaRowKey(baseKey, item), clienteId)) checked++; });
    return checked;
  };

  const clienteProgress = (clienteId) => {
    let checked = 0;
    COBERTURA_BASES.forEach(base => COBERTURA_ITENS.forEach(item => {
      if(isChecked(coberturaRowKey(base.key, item), clienteId)) checked++;
    }));
    return checked / totalCampos * 100;
  };

  let checkedAll = 0;
  clientesCols.forEach(c => {
    COBERTURA_BASES.forEach(base => COBERTURA_ITENS.forEach(item => {
      if(isChecked(coberturaRowKey(base.key, item), c.id)) checkedAll++;
    }));
  });
  const totalFields = totalCampos * clientesCols.length;
  const pctAll = (monthData && totalFields) ? (checkedAll / totalFields * 100) : null;

  return (
    <div className="card" style={{marginBottom:14}}>
      <div className="group-card-head" style={{cursor:'pointer'}} onClick={onToggle}>
        <IconChevron className={"nav-caret" + (expanded ? ' open' : '')} width="14" height="14" style={{color:'var(--ink-soft)'}}/>
        {monthLabel} · {CURRENT_YEAR}
        <span className="group-card-count" style={pctAll !== null ? {background:'var(--accent-soft)', color:'var(--accent-ink)'} : undefined}>
          {pctAll !== null ? fmtNumber(pctAll.toFixed(1)) + '%' : 'Sem dados'}
        </span>
      </div>
      {expanded && (
        <div className="table-wrap">
          <table className="cobertura-tbl">
            <thead>
              <tr>
                <th>Base / Item</th>
                {clientesCols.map(c => <th key={c.id}>{c.nome}</th>)}
              </tr>
            </thead>
            <tbody>
              {COBERTURA_BASES.map((base, i) => (
                <React.Fragment key={base.key}>
                  <tr className="cobertura-base-row">
                    <td>{i+1}. {base.nome}</td>
                    {clientesCols.map(c => (
                      <td key={c.id}>{baseProgressForClient(base.key, c.id)}/{COBERTURA_ITENS.length}</td>
                    ))}
                  </tr>
                  {COBERTURA_ITENS.map(item => {
                    const rowKey = coberturaRowKey(base.key, item);
                    return (
                      <tr className="cobertura-item-row" key={rowKey}>
                        <td>{item}</td>
                        {clientesCols.map(c => (
                          <td key={c.id}>
                            <span
                              className={"cobertura-check" + (isChecked(rowKey, c.id) ? ' checked' : '')}
                              onClick={() => actions.toggleCoberturaDados(mes.n, rowKey, c.id)}
                              title={isChecked(rowKey, c.id) ? 'Check' : 'Não Check'}
                            >
                              <IconCheck width="14" height="14"/>
                            </span>
                          </td>
                        ))}
                      </tr>
                    );
                  })}
                </React.Fragment>
              ))}
              <tr className="cobertura-total-row">
                <td>Total</td>
                {clientesCols.map(c => (
                  <td key={c.id}>{fmtNumber(clienteProgress(c.id).toFixed(1))}%</td>
                ))}
              </tr>

          </table>
        </div>
      )}
    </div>
  );
}

function CoberturaDadosPage({data, actions}){
  const clientesCols = useMemo(() => data.clientes.filter(c => c.nome.toLowerCase() !== 'interno'), [data.clientes]);
  const coberturaYear = (data.coberturaDados && data.coberturaDados[CURRENT_YEAR]) || {};
  const totalCampos = COBERTURA_BASES.length * COBERTURA_ITENS.length;

  const [expandedMonths, setExpandedMonths] = useState(() => new Set());
  const toggleMonth = (n) => setExpandedMonths(prev => {
    const next = new Set(prev);
    if(next.has(n)) next.delete(n); else next.add(n);
    return next;
  });

  const monthPct = (mesN) => {
    const monthData = coberturaYear[mesN];
    if(!monthData) return null;
    let checked = 0;
    clientesCols.forEach(c => {
      COBERTURA_BASES.forEach(base => COBERTURA_ITENS.forEach(item => {
        const rowKey = coberturaRowKey(base.key, item);
        if(monthData[rowKey] && monthData[rowKey][c.id]) checked++;
      }));
    });
    const totalFields = totalCampos * clientesCols.length;
    return totalFields ? (checked / totalFields * 100) : null;
  };

  const filledMonths = MONTHS.filter(m => !!coberturaYear[m.n]);
  const lastMonth = filledMonths.length ? filledMonths[filledMonths.length - 1] : null;
  const lastPct = lastMonth ? monthPct(lastMonth.n) : null;

  return (
    <div>
      <div className="section-block">
        <div className="kpi-hero">
          {lastMonth && <div className="kpi-hero-period">Último mês · {lastMonth.label}/{CURRENT_YEAR}</div>}
          <div className="kpi-hero-label">Cobertura de Dados</div>
          {lastPct !== null ? (
            <div className={"kpi-hero-value" + (lastPct >= 70 ? ' positive' : (lastPct < 40 ? ' negative' : ''))} style={lastPct>=40 && lastPct<70 ? {color:'#F2CB8A'} : undefined}>
              {fmtNumber(lastPct.toFixed(1))}%
            </div>
          ) : (
            <div className="kpi-hero-value" style={{fontSize:22, color:'#9BA0B8'}}>Sem dados preenchidos</div>
          )}
          <div className="kpi-hero-formula">Campos cobertos / campos totais (todos os clientes), apurado mês a mês</div>
        </div>
      </div>

      <div className="section-block-head">
        <div>
          <div className="section-block-title">Cobertura de Dados por cliente</div>
          <div className="section-block-desc">Uma tabela por mês — marque Check quando o item estiver disponível para o cliente naquele mês. O total é calculado automaticamente.</div>
        </div>
      </div>

      {MONTHS.map(m => (
        <MonthCoberturaTable
          key={m.n}
          mes={m}
          monthData={coberturaYear[m.n]}
          clientesCols={clientesCols}
          actions={actions}
          expanded={expandedMonths.has(m.n)}
          onToggle={() => toggleMonth(m.n)}
        />
      ))}
    </div>
  );
}

function EntregasPrazoPage({data}){
  const merged = useMemo(() => buildDemandasMerged(data.demandasCustom, data.demandasBase), [data.demandasCustom, data.demandasBase]);
  const devTeam = useMemo(() => (data.pessoas||[]).filter(p => p.area === 'Desenvolvimento'), [data.pessoas]);
  const devNameById = useMemo(() => { const m={}; devTeam.forEach(p=>{ m[p.id]=p.nome; }); return m; }, [devTeam]);

  const base = useMemo(() => merged.filter(m => m.classificacao && m.classificacao.startsWith('Desenvolvimento')), [merged]);
  const classifOptions = useMemo(() => DEMANDA_CLASSIFICACAO_OPTIONS.filter(o => o.startsWith('Desenvolvimento')), []);

  const [mesFilter, setMesFilter] = useState('');
  const [respFilter, setRespFilter] = useState('');
  const [classifFilter, setClassifFilter] = useState('');
  const [tipoFilter, setTipoFilter] = useState('');

  const filtered = useMemo(() => base.filter(m => {
    if(mesFilter && String(m.mesPlanning) !== String(mesFilter)) return false;
    if(respFilter && m.responsavelDesenvolvimentoId !== respFilter) return false;
    if(classifFilter && m.classificacao !== classifFilter) return false;
    if(tipoFilter && m.tipo !== tipoFilter) return false;
    return true;
  }), [base, mesFilter, respFilter, classifFilter, tipoFilter]);

  const planningScope = useMemo(() => filtered.filter(m => m.mesPlanning), [filtered]);
  const concluidasNoPrazo = planningScope.filter(m => m.concluidaNoPrazo).length;
  const totalPlanning = planningScope.length;
  const kpiPct = totalPlanning > 0 ? (concluidasNoPrazo / totalPlanning * 100) : null;

  // matriz (meses x responsáveis) — respeita os filtros de responsável/classificação/tipo, mas não o de mês,
  // para mostrar a evolução completa ao longo do ano.
  const matrixBase = useMemo(() => base.filter(m => {
    if(respFilter && m.responsavelDesenvolvimentoId !== respFilter) return false;
    if(classifFilter && m.classificacao !== classifFilter) return false;
    if(tipoFilter && m.tipo !== tipoFilter) return false;
    return !!m.mesPlanning;
  }), [base, respFilter, classifFilter, tipoFilter]);

  const respRows = useMemo(() => {
    const idsComDados = new Set(matrixBase.map(m => m.responsavelDesenvolvimentoId).filter(Boolean));
    const rows = devTeam.filter(p => idsComDados.has(p.id)).map(p => ({key:p.id, label:p.nome}));
    if(matrixBase.some(m => !m.responsavelDesenvolvimentoId)) rows.push({key:'', label:'Sem responsável'});
    return rows;
  }, [matrixBase, devTeam]);

  function pctForRowMes(rowKey, mesN){
    const subset = matrixBase.filter(m => (m.responsavelDesenvolvimentoId || '') === rowKey && String(m.mesPlanning) === String(mesN));
    if(subset.length === 0) return null;
    const ok = subset.filter(m => m.concluidaNoPrazo).length;
    return ok / subset.length * 100;
  }

  const byCliente = useMemo(() => {
    const map = {};
    filtered.forEach(m => { (map[m.cliente] = map[m.cliente] || []).push(m); });
    Object.keys(map).forEach(k => map[k].sort((a,b) => new Date(b.abertoEm) - new Date(a.abertoEm)));
    return map;
  }, [filtered]);
  const clientesComDados = useMemo(() => DEMANDAS_CLIENTES_ORDEM.filter(c => byCliente[c] && byCliente[c].length > 0), [byCliente]);

  return (
    <div>
      <div className="kpi-hero" style={{marginBottom:16}}>
        <div className="kpi-hero-label">% Entregas no Prazo{mesFilter ? (' · ' + mesPlanningNome(mesFilter)) : ''}</div>
        {kpiPct !== null ? (
          <div className={"kpi-hero-value" + (kpiPct >= 80 ? ' positive' : (kpiPct < 50 ? ' negative' : ''))} style={kpiPct>=50 && kpiPct<80 ? {color:'#F2CB8A'} : undefined}>
            {fmtPercent(kpiPct, 0)}
          </div>
        ) : (
          <div className="kpi-hero-value" style={{fontSize:20, color:'#9BA0B8'}}>Sem demandas na planning</div>
        )}
        <div className="kpi-hero-formula">Demandas concluídas no prazo / Demandas total — considerando apenas tickets de Desenvolvimento com Mês Planning definido ({concluidasNoPrazo} de {totalPlanning})</div>
      </div>

      <div className="card demandas-filters-card">
        <div className="demandas-filter-label">Filtros</div>
        <div className="filters-bar" style={{margin:0}}>
          <select className="filter-select" value={mesFilter} onChange={e=>setMesFilter(e.target.value)}>
            <option value="">Todos os meses (planning)</option>
            {MESES_PLANNING.map(m => <option value={m.n} key={m.n}>{m.nome}</option>)}
          </select>
          <select className="filter-select" value={respFilter} onChange={e=>setRespFilter(e.target.value)}>
            <option value="">Todos os responsáveis desenvolvimento</option>
            {devTeam.map(p => <option value={p.id} key={p.id}>{p.nome}</option>)}
          </select>
          <select className="filter-select" value={classifFilter} onChange={e=>setClassifFilter(e.target.value)}>
            <option value="">Todas as classificações</option>
            {classifOptions.map(o => <option value={o} key={o}>{o}</option>)}
          </select>
          <select className="filter-select" value={tipoFilter} onChange={e=>setTipoFilter(e.target.value)}>
            <option value="">Todos os tipos</option>
            {DEMANDA_TIPO_OPTIONS.map(o => <option value={o} key={o}>{o}</option>)}
          </select>
          {(mesFilter||respFilter||classifFilter||tipoFilter) && (

function CsatMatrixPage({data, personMode, matchFn, titulo, formulaHint}){
  const merged = useMemo(() => buildDemandasMerged(data.demandasCustom, data.demandasBase), [data.demandasCustom, data.demandasBase]);
  const devTeam = useMemo(() => (data.pessoas||[]).filter(p => p.area === 'Desenvolvimento'), [data.pessoas]);

  const scoped = useMemo(() =>
    merged.filter(m => m.classificacao && matchFn(m.classificacao) && !!m.mesPlanning),
  [merged]);

  const overallAvg = useMemo(() => avgCsat(scoped.map(m => m.csat)), [scoped]);

  const personRows = useMemo(() => {
    if(personMode === 'dev'){
      const idsComDados = new Set(scoped.map(m => m.responsavelDesenvolvimentoId).filter(Boolean));
      const rows = devTeam.filter(p => idsComDados.has(p.id)).map(p => ({key:p.id, label:p.nome, match:(m)=>m.responsavelDesenvolvimentoId===p.id}));
      if(scoped.some(m => !m.responsavelDesenvolvimentoId)) rows.push({key:'__none', label:'Sem responsável', match:(m)=>!m.responsavelDesenvolvimentoId});
      return rows;
    }
    const names = Array.from(new Set(scoped.map(m => m.responsavel).filter(Boolean))).sort();
    const rows = names.map(n => ({key:n, label:n, match:(m)=>m.responsavel===n}));
    if(scoped.some(m => !m.responsavel)) rows.push({key:'__none', label:'Sem responsável', match:(m)=>!m.responsavel});
    return rows;
  }, [scoped, devTeam, personMode]);

  const clienteRows = useMemo(() =>
    DEMANDAS_CLIENTES_ORDEM.filter(c => scoped.some(m => m.cliente === c)).map(c => ({key:c, label:c, match:(m)=>m.cliente===c})),
  [scoped]);

  function avgForRowMes(row, mesN){
    const subset = scoped.filter(m => row.match(m) && String(m.mesPlanning) === String(mesN));
    return avgCsat(subset.map(m => m.csat));
  }

  return (
    <div>
      <div className="kpi-hero" style={{marginBottom:16}}>
        <div className="kpi-hero-label">{titulo}</div>
        {overallAvg !== null ? (
          <div className="kpi-hero-value">{overallAvg.toLocaleString('pt-BR', {maximumFractionDigits:1})}</div>
        ) : (
          <div className="kpi-hero-value" style={{fontSize:20, color:'#9BA0B8'}}>Sem CSAT disponível ainda</div>
        )}
        <div className="kpi-hero-formula">{formulaHint}</div>
      </div>

      <CsatMatrixTable
        title="CSAT médio por pessoa e mês"
        desc="Colunas = Mês Planning do ticket. Linhas = Responsável Desenvolvimento (Tech/Produto) ou Responsável do Movidesk (Atendimento)."
        rows={personRows}
        avgFn={avgForRowMes}
      />
      <CsatMatrixTable
        title="CSAT médio por cliente e mês"
        desc="Colunas = Mês Planning do ticket. Linhas = clientes."
        rows={clienteRows}
        avgFn={avgForRowMes}
      />
    </div>
  );
}

/* ---------------------------------------------------------------
   DEMANDAS (tickets Movidesk)
--------------------------------------------------------------- */
function countBy(list, keyFn){
  const map = {};
  list.forEach(item => {
    const k = keyFn(item);
    map[k] = (map[k]||0) + 1;
  });
  return Object.entries(map).map(([nome, count]) => ({nome, count})).sort((a,b) => b.count - a.count);
}

function startOfWeekMonday(d){
  const date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const day = date.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  date.setDate(date.getDate() + diff);
  return date;
}

function weekLabel(mondayDate){
  const dd = String(mondayDate.getDate()).padStart(2,'0');
  const mm = String(mondayDate.getMonth()+1).padStart(2,'0');
  return dd + '/' + mm;
}

// Gráfico de barras (semana a semana) do nº de tickets abertos, com hover interativo.
function WeeklyTicketsChart({weeks}){
  const wrapRef = useRef(null);
  const [hoverIdx, setHoverIdx] = useState(null);
  const [tooltipLeftPct, setTooltipLeftPct] = useState(50);

  if(!weeks.length) return <div className="hint">Sem dados suficientes para o período filtrado.</div>;

  const barGroupW = 26;
  const W = Math.max(640, weeks.length * barGroupW + 52);
  const H = 220, padL = 40, padB = 28, padT = 12, padR = 12;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const maxVal = Math.max(1, ...weeks.map(w => w.count));
  const gW = chartW / weeks.length;
  const barW = Math.min(18, gW*0.6);
  const gridLines = 4;
  const labelEvery = Math.max(1, Math.ceil(weeks.length/16));

  const handleMove = (e) => {
    if(!wrapRef.current) return;
    const rect = wrapRef.current.getBoundingClientRect();
    if(rect.width === 0) return;
    const fracX = (e.clientX - rect.left) / rect.width;
    const svgX = fracX * W;
    const idx = Math.floor((svgX - padL) / gW);
    if(idx < 0 || idx >= weeks.length){ setHoverIdx(null); return; }
    setHoverIdx(idx);
    setTooltipLeftPct(Math.min(94, Math.max(6, fracX * 100)));
  };
  const handleLeave = () => setHoverIdx(null);
  const hovered = hoverIdx !== null ? weeks[hoverIdx] : null;

  return (
    <div style={{overflowX:'auto'}}>
      <div ref={wrapRef} onMouseMove={handleMove} onMouseLeave={handleLeave} style={{position:'relative', width:W}}>
        <svg viewBox={"0 0 " + W + " " + H} width={W} height={H} style={{overflow:'visible', display:'block'}}>
          {Array.from({length: gridLines+1}).map((_, i) => {
            const y = padT + (chartH / gridLines) * i;
            const val = maxVal - (maxVal / gridLines) * i;
            return (
              <g key={i}>
                <line x1={padL} x2={W-padR} y1={y} y2={y} stroke="#EEF0F4" strokeWidth="1"/>
                <text x={padL-8} y={y+3} fontSize="9.5" fill="#93970F" textAnchor="end" fontFamily="IBM Plex Mono, monospace" opacity="0.75">{Math.round(val)}</text>
              </g>
            );
          })}
          {hoverIdx !== null && (
            <rect x={padL + gW*hoverIdx} y={padT} width={gW} height={chartH} fill="rgba(30,62,112,0.06)"/>
          )}
          {weeks.map((w, i) => {
            const gx = padL + gW * i;
            const bH = (w.count / maxVal) * chartH;
            const bx = gx + gW/2 - barW/2;
            const bY = padT + chartH - bH;
            return (
              <g key={w.key}>
                <rect x={bx} y={bY} width={barW} height={bH} rx="2" fill="var(--accent)" opacity={hoverIdx===null || hoverIdx===i ? 0.92 : 0.45}/>
                {(i % labelEvery === 0) && <text x={gx+gW/2} y={H-8} fontSize="9.5" fill="#5D6274" textAnchor="middle" fontFamily="Inter, sans-serif">{w.label}</text>}
              </g>
            );
          })}
          <line x1={padL} x2={padL} y1={padT} y2={padT+chartH} stroke="#E6E8EE"/>
          <line x1={padL} x2={W-padR} y1={padT+chartH} y2={padT+chartH} stroke="#E6E8EE"/>
        </svg>
        {hovered && (
          <div className="chart-tooltip" style={{left: tooltipLeftPct + '%'}}>
            <div className="chart-tooltip-title">Semana de {hovered.label}</div>
            <div className="chart-tooltip-row"><span className="chart-tooltip-dot" style={{background:'var(--accent)'}}></span>Tickets abertos: <b>{hovered.count}</b></div>
          </div>
        )}
      </div>
    </div>
  );
}

// Quebra semana a semana (mesmas semanas do gráfico) para uma dimensão qualquer (pessoa, classificação, cliente...).
function buildWeeklyBreakdown(filtered, keyFn){
  const rowsMap = {};
  filtered.forEach(m => {
    if(!m.abertoEm) return;
    const d = new Date(m.abertoEm);
    if(isNaN(d.getTime())) return;
    const weekKey = startOfWeekMonday(d).getTime();
    const nome = keyFn(m);
    if(!rowsMap[nome]) rowsMap[nome] = {};
    rowsMap[nome][weekKey] = (rowsMap[nome][weekKey]||0) + 1;
  });
  const rows = Object.entries(rowsMap).map(([nome, counts]) => {
    const total = Object.values(counts).reduce((a,b)=>a+b,0);
    return {nome, counts, total};
  });
  rows.sort((a,b) => b.total - a.total);
  return rows;
}

// Tabela nome x semana (mesmas colunas do gráfico acima), com scroll horizontal quando não couber
// na largura padrão do card — mantém a moldura no tamanho normal da tela.
function WeeklyBreakdownTable({titulo, weeks, rows}){
  return (
    <div style={{marginTop:26}}>
      <div className="section-block-title" style={{fontSize:12.5, marginBottom:6}}>{titulo}</div>

        <div className="table-wrap">
          <table className="upsell-tbl weekly-breakdown-tbl">
            <thead>
              <tr>
                <th style={{textAlign:'left'}}>Nome</th>
                {weeks.map(w => <th key={w.key}>{w.label}</th>)}
                <th>Total</th>
              </tr>
            </thead>
            <tbody>
              {rows.map(r => (
                <tr key={r.nome}>
                  <td style={{textAlign:'left', paddingLeft:12, whiteSpace:'nowrap'}}>{r.nome}</td>
                  {weeks.map(w => {
                    const v = r.counts[w.key] || 0;
                    return <td key={w.key} style={{fontFamily:'IBM Plex Mono, monospace', color: v ? 'var(--ink)' : '#C7CAD6'}}>{v || '—'}</td>;
                  })}
                  <td style={{fontFamily:'IBM Plex Mono, monospace', fontWeight:700}}>{r.total}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// Resumo (gráfico semanal + tabelas de contagem) exibido entre os filtros e a listagem por cliente.
// Responde aos mesmos filtros da tela (recebe a lista já filtrada).
function DemandasResumoSection({filtered, devTeam}){
  const semanas = useMemo(() => {
    const buckets = {};
    filtered.forEach(m => {
      if(!m.abertoEm) return;
      const d = new Date(m.abertoEm);
      if(isNaN(d.getTime())) return;
      const monday = startOfWeekMonday(d);
      const key = monday.getTime();
      buckets[key] = (buckets[key]||0) + 1;
    });
    const keys = Object.keys(buckets).map(Number);
    if(!keys.length) return [];
    const minKey = Math.min(...keys), maxKey = Math.max(...keys);
    const weekMs = 7*24*60*60*1000;
    const out = [];
    for(let t = minKey; t <= maxKey; t += weekMs){
      out.push({ key: t, label: weekLabel(new Date(t)), count: buckets[t] || 0 });
    }
    return out;
  }, [filtered]);

  const porSuporte = useMemo(() => buildWeeklyBreakdown(filtered, m => m.responsavel || 'Sem responsável'), [filtered]);
  const porDev = useMemo(() => {
    const devById = Object.fromEntries(devTeam.map(p => [p.id, p.nome]));
    return buildWeeklyBreakdown(filtered, m => m.responsavelDesenvolvimentoId ? (devById[m.responsavelDesenvolvimentoId] || 'Não atribuído') : 'Não atribuído');
  }, [filtered, devTeam]);
  const porClassificacao = useMemo(() => buildWeeklyBreakdown(filtered, m => m.classificacao || 'Sem classificação'), [filtered]);
  const porCliente = useMemo(() => buildWeeklyBreakdown(filtered, m => m.cliente || 'Sem cliente'), [filtered]);

  const mediaDiasAberto = useMemo(() => avgOf(filtered.map(m => m.diasEmAberto)), [filtered]);

  if(!filtered.length) return null;

  return (
    <div className="card card-pad" style={{marginBottom:20}}>
      <div style={{display:'flex', gap:14, marginBottom:18}}>
        <div style={{flex:1, background:'var(--accent-soft)', borderRadius:'var(--radius-md)', padding:'14px 18px'}}>
          <div style={{fontFamily:'var(--font-mono)', fontSize:11, color:'var(--accent-ink)', textTransform:'uppercase', letterSpacing:'0.6px', marginBottom:4}}>Total Tickets</div>
          <div style={{fontFamily:'var(--font-display)', fontSize:26, fontWeight:600, color:'var(--ink)'}}>{filtered.length}</div>
        </div>
        <div style={{flex:1, background:'var(--accent-soft)', borderRadius:'var(--radius-md)', padding:'14px 18px'}}>
          <div style={{fontFamily:'var(--font-mono)', fontSize:11, color:'var(--accent-ink)', textTransform:'uppercase', letterSpacing:'0.6px', marginBottom:4}}>Média dias aberto</div>
          <div style={{fontFamily:'var(--font-display)', fontSize:26, fontWeight:600, color:'var(--ink)'}}>{mediaDiasAberto === null ? '—' : mediaDiasAberto.toFixed(1)}</div>
        </div>
      </div>

      <div className="section-block-desc" style={{marginBottom:12}}>Considera os tickets que respeitam os filtros acima, pela data de abertura (nº {filtered.length}).</div>

      <WeeklyBreakdownTable titulo="Por pessoa de suporte" weeks={semanas} rows={porSuporte}/>
      <WeeklyBreakdownTable titulo="Por pessoa de desenvolvimento" weeks={semanas} rows={porDev}/>
      <WeeklyBreakdownTable titulo="Por classificação" weeks={semanas} rows={porClassificacao}/>
      <WeeklyBreakdownTable titulo="Por cliente" weeks={semanas} rows={porCliente}/>

}

function DemandasPage({data, actions}){
  const merged = useMemo(() => buildDemandasMerged(data.demandasCustom, data.demandasBase), [data.demandasCustom, data.demandasBase]);
  const devTeam = useMemo(() => (data.pessoas||[]).filter(p => p.area === 'Desenvolvimento'), [data.pessoas]);

  const [syncing, setSyncing] = useState(false);
  const [syncError, setSyncError] = useState(null);

  const handleSyncMovidesk = async () => {
    setSyncing(true);
    setSyncError(null);
    try{
      const fb = await waitForFirebase();
      const provider = new fb.GoogleAuthProvider();
      provider.addScope('https://www.googleapis.com/auth/drive.readonly');
      const result = await fb.signInWithPopup(fb.auth, provider);
      const credential = fb.credentialFromResult ? fb.credentialFromResult(result) : null;
      const accessToken = credential && credential.accessToken;
      if(!accessToken) throw new Error('Não foi possível obter permissão de acesso ao Google Drive.');
      const res = await fetch('https://www.googleapis.com/drive/v3/files/' + MOVIDESK_DRIVE_FILE_ID + '?alt=media', {
        headers: { Authorization: 'Bearer ' + accessToken },
      });
      if(!res.ok) throw new Error('Não foi possível baixar a planilha do Drive (HTTP ' + res.status + ').');
      const buf = await res.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array', cellDates: true });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: null });
      const parsedRows = transformMovideskRows(rows);
      if(!parsedRows.length) throw new Error('A planilha foi baixada, mas nenhum ticket reconhecido foi encontrado.');
      actions.importDemandasBase(parsedRows);
    }catch(e){
      console.error('Movidesk sync error', e);
      setSyncError(e.message || 'Erro ao atualizar a base do Movidesk.');
    }finally{
      setSyncing(false);
    }
  };

  const statusOptions = useMemo(() => {
    const set = new Set(merged.map(m => m.status));
    return Array.from(set).sort();
  }, [merged]);
  const responsavelOptions = useMemo(() => {
    const set = new Set(merged.map(m => m.responsavel).filter(Boolean));
    return Array.from(set).sort();
  }, [merged]);

  // por padrão, oculta os status concluídos (Fechado, Resolvido, Cancelado)
  const [statusFilter, setStatusFilter] = useState(() =>
    new Set(statusOptions.filter(s => !DEMANDA_STATUS_TERMINAL.includes(s)))
  );
  const [respFilter, setRespFilter] = useState('');
  const [mesFinalizacaoFilter, setMesFinalizacaoFilter] = useState('');
  const [mesPlanningFilter, setMesPlanningFilter] = useState('');
  const [tipoFilter, setTipoFilter] = useState('');
  const [classificacaoFilter, setClassificacaoFilter] = useState('');
  const [respDevFilter, setRespDevFilter] = useState('');
  const [prioridadeFilter, setPrioridadeFilter] = useState('');

  const toggleStatus = (s) => {
    setStatusFilter(prev => {
      const next = new Set(prev);
      if(next.has(s)) next.delete(s); else next.add(s);
      return next;
    });
  };

  const defaultStatusSet = useMemo(() =>
    new Set(statusOptions.filter(s => !DEMANDA_STATUS_TERMINAL.includes(s))),
  [statusOptions]);

  const filtered = useMemo(() => merged.filter(m => {
    if(!statusFilter.has(m.status)) return false;
    if(respFilter && m.responsavel !== respFilter) return false;
    if(mesFinalizacaoFilter){
      if(!m.concluidoEm) return false;
      const mesConclusao = Number(m.concluidoEm.split('-')[1]);
      if(mesConclusao !== Number(mesFinalizacaoFilter)) return false;
    }
    if(mesPlanningFilter && String(m.mesPlanning) !== String(mesPlanningFilter)) return false;
    if(tipoFilter && m.tipo !== tipoFilter) return false;
    if(classificacaoFilter && m.classificacao !== classificacaoFilter) return false;
    if(respDevFilter && m.responsavelDesenvolvimentoId !== respDevFilter) return false;
    if(prioridadeFilter && m.prioridade !== prioridadeFilter) return false;
    return true;
  }), [merged, statusFilter, respFilter, mesFinalizacaoFilter, mesPlanningFilter, tipoFilter, classificacaoFilter, respDevFilter, prioridadeFilter]);

  const anyExtraFilterActive = mesFinalizacaoFilter || mesPlanningFilter || tipoFilter || classificacaoFilter || respDevFilter || prioridadeFilter;
  const clearExtraFilters = () => {
    setMesFinalizacaoFilter(''); setMesPlanningFilter(''); setTipoFilter(''); setClassificacaoFilter(''); setRespDevFilter(''); setPrioridadeFilter('');
  };

  const byCliente = useMemo(() => {
    const map = {};
    filtered.forEach(m => {
      if(!map[m.cliente]) map[m.cliente] = [];
      map[m.cliente].push(m);
    });
    Object.keys(map).forEach(k => {
      map[k].sort((a,b) => new Date(b.abertoEm) - new Date(a.abertoEm));
    });
    return map;
  }, [filtered]);

  const clientesComDados = DEMANDAS_CLIENTES_ORDEM.filter(c => byCliente[c] && byCliente[c].length > 0);
  const totalFiltrado = filtered.length;

  return (
    <div>
      <div className="section-block-head">
        <div>
          <div className="section-block-title">Demandas</div>
          <div className="section-block-desc">Tickets do Movidesk organizados por cliente. Classificação, Tipo, Prazo, Concluído em, Mês Planning e Responsável Desenvolvimento são editáveis aqui e ficam preservados (por nº de ticket) quando a base for atualizada. CSAT ainda não está disponível na exportação do Movidesk — a coluna fica com placeholder até a base trazer essa informação.</div>
          <div style={{marginTop:6, fontSize:12.5, fontStyle:'italic', color:'#8a8fa3'}}>
            {data.demandasBaseSync
              ? `Última atualização: ${data.demandasBaseSync.by} em ${fmtDataAbertura(data.demandasBaseSync.at)} · ${data.demandasBaseSync.count} tickets`
              : 'Base ainda não atualizada a partir do Drive — exibindo dados estáticos.'}
          </div>
        </div>
        <div style={{display:'flex', flexDirection:'column', alignItems:'flex-end', gap:6}}>
          <button
            type="button"
            className="btn btn-primary btn-sm"
            disabled={syncing}
            onClick={handleSyncMovidesk}
            style={{whiteSpace:'nowrap', opacity: syncing ? 0.6 : 1, cursor: syncing ? 'not-allowed' : 'pointer'}}
          >
            {syncing ? 'Atualizando…' : 'Atualizar base do Movidesk'}
          </button>
          {syncError && (
            <div style={{fontSize:12.5, color:'#c0392b', maxWidth:320, textAlign:'right'}}>{syncError}</div>
          )}
        </div>
      </div>

      <div className="card demandas-filters-card">
        <div className="demandas-filter-label">Status <span className="group-card-count">{totalFiltrado} ticket{totalFiltrado===1?'':'s'}</span></div>
        <div className="chip-row" style={{marginBottom:14}}>
          {statusOptions.map(s => {
            const active = statusFilter.has(s);
            const col = demandaStatusColor(s);
            return (
              <button
                key={s}
                type="button"
                className={"status-filter-chip" + (active ? ' active' : '')}
                style={active ? {background: col.fg, color:'#fff', borderColor: col.fg} : {color: col.fg, borderColor: col.bg, background: col.bg}}
                onClick={() => toggleStatus(s)}
              >{s}</button>
            );
          })}
          {statusFilter.size < statusOptions.length && (
            <button className="btn btn-ghost btn-sm" onClick={()=>setStatusFilter(new Set(statusOptions))}>Selecionar todos</button>
          )}
          {statusFilter.size > 0 && (
            <button className="btn btn-ghost btn-sm" onClick={()=>setStatusFilter(new Set())}>Limpar seleção</button>
          )}
          {(statusFilter.size !== defaultStatusSet.size || [...statusFilter].some(s => !defaultStatusSet.has(s))) && (
            <button className="btn btn-ghost btn-sm" onClick={()=>setStatusFilter(new Set(defaultStatusSet))}>Padrão (ocultar concluídos)</button>
          )}
        </div>
        <div className="demandas-filter-label">Responsável</div>
        <div className="filters-bar" style={{margin:'0 0 14px'}}>
          <select className="filter-select" value={respFilter} onChange={e=>setRespFilter(e.target.value)}>
            <option value="">Todos os responsáveis</option>
            {responsavelOptions.map(r => <option value={r} key={r}>{r}</option>)}
          </select>
          {respFilter && <button className="btn btn-ghost btn-sm" onClick={()=>setRespFilter('')}>Limpar</button>}
        </div>

        <div className="demandas-filter-label">Mês Finalização, Mês Planning, Tipo, Classificação, Prioridade e Responsável Desenvolvimento</div>
        <div className="filters-bar" style={{margin:0}}>
          <select className="filter-select" value={mesFinalizacaoFilter} onChange={e=>setMesFinalizacaoFilter(e.target.value)}>
            <option value="">Mês de finalização</option>
            {MESES_PLANNING.map(m => <option value={m.n} key={m.n}>{m.nome}</option>)}
          </select>
          <select className="filter-select" value={mesPlanningFilter} onChange={e=>setMesPlanningFilter(e.target.value)}>
            <option value="">Mês Planning</option>
            {MESES_PLANNING.map(m => <option value={m.n} key={m.n}>{m.nome}</option>)}
          </select>
          <select className="filter-select" value={tipoFilter} onChange={e=>setTipoFilter(e.target.value)}>
            <option value="">Tipo</option>
            {DEMANDA_TIPO_OPTIONS.map(o => <option value={o} key={o}>{o}</option>)}
          </select>
          <select className="filter-select" value={classificacaoFilter} onChange={e=>setClassificacaoFilter(e.target.value)}>
            <option value="">Classificação</option>
            {DEMANDA_CLASSIFICACAO_OPTIONS.map(o => <option value={o} key={o}>{o}</option>)}
          </select>
          <select className="filter-select" value={prioridadeFilter} onChange={e=>setPrioridadeFilter(e.target.value)}>
            <option value="">Prioridade</option>
            {DEMANDA_PRIORIDADE_OPTIONS.map(o => <option value={o} key={o}>{o}</option>)}
          </select>
          <select className="filter-select" value={respDevFilter} onChange={e=>setRespDevFilter(e.target.value)}>
            <option value="">Responsável Desenvolvimento</option>
            {devTeam.map(p => <option value={p.id} key={p.id}>{p.nome}</option>)}
          </select>
          {anyExtraFilterActive && <button className="btn btn-ghost btn-sm" onClick={clearExtraFilters}>Limpar</button>}
        </div>
      </div>

      <DemandasResumoSection filtered={filtered} devTeam={devTeam}/>

      {clientesComDados.length === 0 ? (
        <div className="card"><EmptyState icon={IconClipboard} title="Nenhuma demanda encontrada"
          sub="Ajuste os filtros de status ou responsável para ver os tickets."/></div>
      ) : clientesComDados.map(cliente => (
        <DemandasClienteTable
          key={cliente}
          cliente={cliente}
          rows={byCliente[cliente]}
          devTeam={devTeam}
          actions={actions}
        />
      ))}
    </div>
  );
}
