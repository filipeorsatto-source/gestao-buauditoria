            sub={emptyText || "Nenhum ticket com Prazo definido para esse recorte, ou a coluna CSAT ainda não foi preenchida na base do Movidesk."}/>
        </div>
      ) : (
        <div className="table-wrap">
          <table className="upsell-tbl">
            <thead>
              <tr><th></th>{MESES_PLANNING.map(m => <th key={m.n}>{m.nome.slice(0,3)}</th>)}</tr>
            </thead>
            <tbody>
              {rows.map(r => (
                <tr key={r.key}>
                  <td style={{textAlign:'left', paddingLeft:12, fontWeight:600}}>{r.label}</td>
                  {MESES_PLANNING.map(m => {
                    const v = avgFn(r, m.n);
                    return <td key={m.n}>{v === null ? '—' : v.toLocaleString('pt-BR', {maximumFractionDigits:1})}</td>;
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// extraDevTable: quando true (só CSAT Atendimento), mostra uma segunda tabela "por desenvolvedor" além
// da tabela "por pessoa" (Responsável do Movidesk) — alguns tickets de Atendimento também requerem um
// desenvolvedor alocado (campo Responsável Desenvolvimento), e o CSAT desses tickets deve poder ser
// acompanhado por quem os atendeu do lado de desenvolvimento também.
function CsatMatrixPage({data, personMode, matchFn, titulo, formulaHint, extraDevTable}){
  const merged = useMemo(() => buildDemandasMerged(data.demandasCustom, data.demandasBase, data.demandasManuais), [data.demandasCustom, data.demandasBase, data.demandasManuais]);
  const devTeam = useMemo(() => (data.pessoas||[]).filter(p => p.area === 'Desenvolvimento' || p.area === 'Atendimento'), [data.pessoas]);

  // Agrupa pelo mês de CONCLUSÃO do ticket (m.mesConclusao), não pelo mês do Prazo (m.mesPlanning) —
  // ajuste pedido em 27/08/2026: a meta de CSAT deve refletir o mês em que o ticket foi de fato
  // concluído/avaliado, não o mês do prazo original combinado com o cliente.
  const scoped = useMemo(() =>
    merged.filter(m => m.classificacao && matchFn(m.classificacao) && !!m.mesConclusao),
  [merged]);

  const overallAvg = useMemo(() => avgCsat(scoped.map(m => m.csat)), [scoped]);

  const devRowsFromScoped = (scopedList) => {
    const idsComDados = new Set(scopedList.map(m => m.responsavelDesenvolvimentoId).filter(Boolean));
    const rows = devTeam.filter(p => idsComDados.has(p.id)).map(p => ({key:p.id, label:p.nome, match:(m)=>m.responsavelDesenvolvimentoId===p.id}));
    return rows;
  };

  const personRows = useMemo(() => {
    if(personMode === 'dev'){
      const rows = devRowsFromScoped(scoped);
      if(scoped.some(m => !m.responsavelDesenvolvimentoId)) rows.push({key:'__none', label:'Sem responsável', match:(m)=>!m.responsavelDesenvolvimentoId});
      return rows;
    }
    const names = Array.from(new Set(scoped.map(m => m.responsavel).filter(Boolean))).sort();
    const rows = names.map(n => ({key:n, label:n, match:(m)=>m.responsavel===n}));
    if(scoped.some(m => !m.responsavel)) rows.push({key:'__none', label:'Sem responsável', match:(m)=>!m.responsavel});
    return rows;
  }, [scoped, devTeam, personMode]);

  // Só relevante quando extraDevTable (CSAT Atendimento): tickets de Atendimento que também tiveram um
  // desenvolvedor alocado, agrupados por esse desenvolvedor — igual à lógica "por pessoa" de CSAT Tech.
  const devRows = useMemo(() => extraDevTable ? devRowsFromScoped(scoped) : [], [scoped, devTeam, extraDevTable]);

  const clienteRows = useMemo(() =>
    DEMANDAS_CLIENTES_ORDEM.filter(c => scoped.some(m => m.cliente === c)).map(c => ({key:c, label:c, match:(m)=>m.cliente===c})),
  [scoped]);

  function avgForRowMes(row, mesN){
    const subset = scoped.filter(m => row.match(m) && String(m.mesConclusao) === String(mesN));
    return avgCsat(subset.map(m => m.csat));
  }

  return (
    <div>
      <div className="kpi-hero" style={{marginBottom:16}}>
        <div className="kpi-hero-label">{titulo}</div>
        {overallAvg !== null ? (
          <div className="kpi-hero-value">{overallAvg.toLocaleString('pt-BR', {maximumFractionDigits:1})}</div>
        ) : (
          <div className="kpi-hero-value" style={{fontSize:20, color:'#9BA0B8'}}>Sem CSAT disponível ainda</div>
        )}
        <div className="kpi-hero-formula">{formulaHint}</div>
      </div>

      <CsatMatrixTable
        title="CSAT médio por pessoa e mês"
        desc="Colunas = mês de Conclusão do ticket. Linhas = Responsável Desenvolvimento (Tech/Produto) ou Responsável do Movidesk (Atendimento)."
        rows={personRows}
        avgFn={avgForRowMes}
      />
      {extraDevTable && (
        <CsatMatrixTable
          title="CSAT médio por desenvolvedor e mês"
          desc="Tickets de Atendimento que também tiveram um desenvolvedor alocado (Responsável Desenvolvimento). Colunas = mês de Conclusão do ticket."
          rows={devRows}
          avgFn={avgForRowMes}
          emptyText="Nenhum ticket de Atendimento com Responsável Desenvolvimento alocado ainda."
        />
      )}
      <CsatMatrixTable
        title="CSAT médio por cliente e mês"
        desc="Colunas = mês de Conclusão do ticket. Linhas = clientes."
        rows={clienteRows}
        avgFn={avgForRowMes}
      />
    </div>
  );
}

/* ---------------------------------------------------------------
   MÉDIA DIAS TICKET EM ABERTO
--------------------------------------------------------------- */
function DiasTicketAbertoPage({data}){
  // Exclui tickets com Prioridade "Despriorizado" (mesma regra usada no cálculo da meta em Gestão de
  // Metas — ver getMetaRealizadoByMonth/getMetaRealizadoPorClienteMes), pra essa tela bater com o
  // número mostrado lá.
  const merged = useMemo(() => buildDemandasMerged(data.demandasCustom, data.demandasBase, data.demandasManuais)
    .filter(m => m.prioridade !== 'Despriorizado'), [data.demandasCustom, data.demandasBase, data.demandasManuais]);

  // Para cada mês civil, a média considera os tickets que — no fim daquele mês — já tinham sido
  // abertos e ainda não tinham sido finalizados (ou nunca chegaram a ser). Isso "congela" o cenário de
  // como o mês terminou, então o histórico de meses passados não muda depois que um ticket é concluído.
  const mesAvg = useMemo(() => {
    const out = {};
    MONTHS.forEach(m => {
      const dias = merged
        .map(x => diasAbertoNoFimDoMes(x.abertoEm, x.concluidoEm, x.statusEfetivo, CURRENT_YEAR, m.n))
        .filter(v => v !== null);
      out[m.n] = dias.length ? avgOf(dias) : null;
    });
    return out;
  }, [merged]);

  const filledMonths = MONTHS.filter(m => mesAvg[m.n] !== null);
  const lastMonth = filledMonths.length ? filledMonths[filledMonths.length - 1] : null;
  const overallAvg = lastMonth ? mesAvg[lastMonth.n] : null;

  // Só mostra na quebra por pessoa quem está cadastrado na aba Organograma — evita nomes soltos vindos
  // do Movidesk (ex-funcionário, typo, contato de cliente) que não correspondem a ninguém do time.
  // Comparação insensível a acento/caixa/espaços, e por conteúdo (ex.: "Amélio" cadastrado casa com
  // "Amélio Junior" vindo do Movidesk), via normalizeClientName.
  const personRows = useMemo(() => {
    const pessoasNormalizadas = (data.pessoas || []).map(p => normalizeClientName(p.nome)).filter(Boolean);
    const isFuncionarioCadastrado = (nome) => {
      const n = normalizeClientName(nome);
      return pessoasNormalizadas.some(pn => n === pn || n.includes(pn) || pn.includes(n));
    };
    const names = Array.from(new Set(merged.map(m => m.responsavel).filter(Boolean).filter(isFuncionarioCadastrado))).sort();
    return names.map(n => ({key:n, label:n, match:(m)=>m.responsavel===n}));
  }, [merged, data.pessoas]);

  const clienteRows = useMemo(() =>
    DEMANDAS_CLIENTES_ORDEM.filter(c => merged.some(m => m.cliente === c)).map(c => ({key:c, label:c, match:(m)=>m.cliente===c})),
  [merged]);

  function avgForRowMes(row, mesN){
    const dias = merged
      .filter(row.match)
      .map(m => diasAbertoNoFimDoMes(m.abertoEm, m.concluidoEm, m.statusEfetivo, CURRENT_YEAR, mesN))
      .filter(v => v !== null);
    return dias.length ? avgOf(dias) : null;
  }

  return (
    <div>
      <div className="kpi-hero" style={{marginBottom:16}}>
        {lastMonth && <div className="kpi-hero-period">Fechamento · {mesPlanningNome(lastMonth.n)}/{CURRENT_YEAR}</div>}
        <div className="kpi-hero-label">Média Dias Ticket em Aberto</div>
        {overallAvg !== null ? (
          <div className="kpi-hero-value">{overallAvg.toLocaleString('pt-BR', {maximumFractionDigits:1})}</div>
        ) : (
          <div className="kpi-hero-value" style={{fontSize:20, color:'#9BA0B8'}}>Sem dados ainda</div>
        )}
        <div className="kpi-hero-formula">
          Para cada mês, considera os tickets abertos até o fim daquele mês e finalizados só depois dele (ou
          ainda em aberto) — a contribuição de cada ticket é (fim do mês) − (Aberto em). "Concluído em" vem
          direto da coluna "Resolvido Em" do Movidesk.
        </div>
      </div>

      <CsatMatrixTable
        title="Média de dias em aberto por pessoa e mês"
        desc="Colunas = mês civil (situação no fim de cada mês). Linhas = Responsável (Movidesk)."
        rows={personRows}
        avgFn={avgForRowMes}
        emptyText="Nenhum ticket aplicável a esse recorte ainda."
      />
      <CsatMatrixTable
        title="Média de dias em aberto por cliente e mês"
        desc="Colunas = mês civil (situação no fim de cada mês). Linhas = clientes."
        rows={clienteRows}
        avgFn={avgForRowMes}
        emptyText="Nenhum ticket aplicável a esse recorte ainda."
      />
    </div>
  );
}

  // Agrupado pela Data de Abertura do ticket (mês civil em que ele foi aberto) — diferente de "Média
  // dias ticket em aberto", que agrupa pelo cenário de fim de mês. Aqui cada ticket contribui só para
  // o mês em que foi aberto, com o tempo (em minutos) até a primeira resposta.
  const scoped = useMemo(() => merged.filter(m => m.tempoPrimeiraResposta !== null), [merged]);

  const mesAvg = useMemo(() => {
    const out = {};
    MONTHS.forEach(m => {
      const subset = scoped.filter(x => mesAnoAbertura(x.abertoEm, m.n));
      out[m.n] = subset.length ? avgOf(subset.map(x => x.tempoPrimeiraResposta)) : null;
    });

  }, [scoped]);

  const filledMonths = MONTHS.filter(m => mesAvg[m.n] !== null);

  // de cliente). Comparação insensível a acento/caixa/espaços e por conteúdo, via normalizeClientName.
  const personRows = useMemo(() => {

    return names.map(n => ({key:n, label:n, match:(m)=>m.responsavel===n}));
  }, [scoped, data.pessoas]);

  const clienteRows = useMemo(() =>

  [scoped]);

  function avgForRowMes(row, mesN){

    return subset.length ? avgOf(subset.map(m => m.tempoPrimeiraResposta)) : null;

  return (

          <div className="kpi-hero-value" style={{fontSize:20, color:'#9BA0B8'}}>Sem dados ainda</div>
        )}
        <div className="kpi-hero-formula">
          Tempo médio (em minutos) até a primeira resposta do ticket, agrupado pelo mês da Data de Abertura.
          Vem direto da coluna "Tempo 1º Resposta" do Movidesk.
        </div>
      </div>

      <CsatMatrixTable
        title="SLA 1ª Resposta por pessoa e mês"
        desc="Colunas = mês da Data de Abertura. Linhas = Responsável (Movidesk). Valores em minutos."

/* ---------------------------------------------------------------
   DEMANDAS (tickets Movidesk)
--------------------------------------------------------------- */
function countBy(list, keyFn){
  const map = {};
  list.forEach(item => {
    const k = keyFn(item);
    map[k] = (map[k]||0) + 1;
  });
  return Object.entries(map).map(([nome, count]) => ({nome, count})).sort((a,b) => b.count - a.count);
}

function startOfWeekMonday(d){
  const date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const day = date.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  date.setDate(date.getDate() + diff);
  return date;
}

function weekLabel(mondayDate){
  const dd = String(mondayDate.getDate()).padStart(2,'0');
  const mm = String(mondayDate.getMonth()+1).padStart(2,'0');
  return dd + '/' + mm;
}

// Gráfico de barras (semana a semana, ou mês a mês para "Média dias aberto") da métrica escolhida,
// com hover interativo. `unitLabel` prefixa o título do tooltip (ex.: "Semana de " ou "Mês: ").
function WeeklyTicketsChart({weeks, metricaLabel, unitLabel}){
  const label = metricaLabel || 'Tickets';
  const prefix = unitLabel === undefined ? 'Semana de ' : unitLabel;
  const wrapRef = useRef(null);
  const [hoverIdx, setHoverIdx] = useState(null);
  const [tooltipLeftPct, setTooltipLeftPct] = useState(50);

  if(!weeks.length) return <div className="hint">Sem dados suficientes para o período filtrado.</div>;

  const barGroupW = 26;
  const W = Math.max(640, weeks.length * barGroupW + 52);
  const H = 220, padL = 40, padB = 28, padT = 12, padR = 12;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const maxVal = Math.max(1, ...weeks.map(w => w.count));
  const gW = chartW / weeks.length;
  const barW = Math.min(18, gW*0.6);
  const gridLines = 4;
  const labelEvery = Math.max(1, Math.ceil(weeks.length/16));

  const handleMove = (e) => {
    if(!wrapRef.current) return;
    const rect = wrapRef.current.getBoundingClientRect();
    if(rect.width === 0) return;
    const fracX = (e.clientX - rect.left) / rect.width;
    const svgX = fracX * W;
    const idx = Math.floor((svgX - padL) / gW);
    if(idx < 0 || idx >= weeks.length){ setHoverIdx(null); return; }
    setHoverIdx(idx);
    setTooltipLeftPct(Math.min(94, Math.max(6, fracX * 100)));
  };
  const handleLeave = () => setHoverIdx(null);
  const hovered = hoverIdx !== null ? weeks[hoverIdx] : null;

  return (
    <div style={{overflowX:'auto'}}>
      <div ref={wrapRef} onMouseMove={handleMove} onMouseLeave={handleLeave} style={{position:'relative', width:W}}>
        <svg viewBox={"0 0 " + W + " " + H} width={W} height={H} style={{overflow:'visible', display:'block'}}>
          {Array.from({length: gridLines+1}).map((_, i) => {
            const y = padT + (chartH / gridLines) * i;
            const val = maxVal - (maxVal / gridLines) * i;
            return (
              <g key={i}>
                <line x1={padL} x2={W-padR} y1={y} y2={y} stroke="#EEF0F4" strokeWidth="1"/>
                <text x={padL-8} y={y+3} fontSize="9.5" fill="#93970F" textAnchor="end" fontFamily="IBM Plex Mono, monospace" opacity="0.75">{Math.round(val)}</text>
              </g>
            );
          })}
          {hoverIdx !== null && (
            <rect x={padL + gW*hoverIdx} y={padT} width={gW} height={chartH} fill="rgba(30,62,112,0.06)"/>
          )}
          {weeks.map((w, i) => {
            const gx = padL + gW * i;
            const bH = (w.count / maxVal) * chartH;
            const bx = gx + gW/2 - barW/2;
            const bY = padT + chartH - bH;
            return (
              <g key={w.key}>
                <rect x={bx} y={bY} width={barW} height={bH} rx="2" fill="var(--accent)" opacity={hoverIdx===null || hoverIdx===i ? 0.92 : 0.45}/>
                {(i % labelEvery === 0) && <text x={gx+gW/2} y={H-8} fontSize="9.5" fill="#5D6274" textAnchor="middle" fontFamily="Inter, sans-serif">{w.label}</text>}
              </g>
            );
          })}
          <line x1={padL} x2={padL} y1={padT} y2={padT+chartH} stroke="#E6E8EE"/>
          <line x1={padL} x2={W-padR} y1={padT+chartH} y2={padT+chartH} stroke="#E6E8EE"/>
        </svg>
        {hovered && (
          <div className="chart-tooltip" style={{left: tooltipLeftPct + '%'}}>
            <div className="chart-tooltip-title">{prefix}{hovered.label}</div>
            <div className="chart-tooltip-row"><span className="chart-tooltip-dot" style={{background:'var(--accent)'}}></span>{label}: <b>{fmtNumber(hovered.count)}</b></div>
          </div>
        )}
      </div>
    </div>
  );
}

// Quebra semana a semana (mesmas semanas do gráfico) para uma dimensão qualquer (pessoa, classificação, cliente...).
// dateField define qual data usar para o bucket semanal ('abertoEm', 'concluidoEm' ou 'prazo').
// valueFn (opcional) define o valor somado por ticket; sem ele, cada ticket conta como 1 (contagem de tickets).
function buildWeeklyBreakdown(filtered, keyFn, dateField, valueFn){
  const campo = dateField || 'abertoEm';
  const rowsMap = {};
  filtered.forEach(m => {
    if(!m[campo]) return;
    const d = new Date(m[campo]);
    if(isNaN(d.getTime())) return;
    const weekKey = startOfWeekMonday(d).getTime();
    const nome = keyFn(m);
    if(!rowsMap[nome]) rowsMap[nome] = {};
    const inc = valueFn ? valueFn(m) : 1;
    rowsMap[nome][weekKey] = (rowsMap[nome][weekKey]||0) + inc;
  });
  const rows = Object.entries(rowsMap).map(([nome, counts]) => {
    const total = Object.values(counts).reduce((a,b)=>a+b,0);
    return {nome, counts, total};
  });
  rows.sort((a,b) => b.total - a.total);
  return rows;
}

// Quebra mensal (mesmos meses do gráfico) da "Média dias aberto" para uma dimensão qualquer (pessoa,
// classificação, cliente...) — segue a MESMA lógica de agrupamento da KPI "Média dias ticket em
// aberto" (fim de cada mês civil, via diasAbertoNoFimDoMes), em vez de contar/somar por semana.
function buildMonthlyDiasAbertoBreakdown(filtered, keyFn){
  const rowsMap = {};
  filtered.forEach(m => {
    const nome = keyFn(m);
    if(!rowsMap[nome]) rowsMap[nome] = [];
    rowsMap[nome].push(m);
  });
  const rows = Object.entries(rowsMap).map(([nome, tickets]) => {
    const counts = {};
    MONTHS.forEach(mo => {
      const dias = tickets
        .map(t => diasAbertoNoFimDoMes(t.abertoEm, t.concluidoEm, t.statusEfetivo, CURRENT_YEAR, mo.n))
        .filter(v => v !== null);
      counts[mo.n] = dias.length ? avgOf(dias) : null;
    });
    const filledVals = Object.values(counts).filter(v => v !== null);
    const total = filledVals.length ? avgOf(filledVals) : 0;
    return {nome, counts, total};
  });
  rows.sort((a,b) => b.total - a.total);
  return rows;
}

// Tabela nome x semana (mesmas colunas do gráfico acima), com scroll horizontal quando não couber
// na largura padrão do card — mantém a moldura no tamanho normal da tela.
function WeeklyBreakdownTable({titulo, weeks, rows}){

}

// Campos de data disponíveis para os cálculos do resumo (bucket semanal).
const DEMANDAS_RESUMO_CAMPOS_DATA = [
  {key:'abertoEm', label:'Data Abertura', descLabel:'data de abertura'},
  {key:'concluidoEm', label:'Data Conclusão', descLabel:'data de conclusão'},
  {key:'prazo', label:'Data Prazo', descLabel:'data de prazo'},
];

// Resumo (gráfico + tabelas de contagem) exibido entre os filtros e a listagem por cliente.
// Responde aos mesmos filtros da tela (recebe a lista já filtrada), além de dois seletores próprios:
// a métrica exibida (Tickets = contagem, Esforço = soma do campo esforço, ou Média dias aberto) e,
// para Tickets/Esforço, o campo de data usado para agrupar os tickets em semanas (Data Abertura,
// Data Conclusão ou Data Prazo). Quando a métrica é "Média dias aberto", o seletor de data não se
// aplica — o agrupamento segue sempre a mesma lógica de fim de mês civil da KPI "Média dias ticket
// em aberto" (diasAbertoNoFimDoMes), por isso os pontos do gráfico passam a ser meses, não semanas.
function DemandasResumoSection({filtered, devTeam}){
  const [metrica, setMetrica] = useState('tickets'); // 'tickets' | 'esforco' | 'dias-aberto'
  const [campoData, setCampoData] = useState('abertoEm'); // 'abertoEm' | 'concluidoEm' | 'prazo'

  const isDiasAberto = metrica === 'dias-aberto';
  const valueFn = metrica === 'esforco' ? (m => Number(m.esforco) || 0) : null;
  const metricaLabel = metrica === 'esforco' ? 'Esforço' : isDiasAberto ? 'Média dias aberto' : 'Tickets';

  const semanas = useMemo(() => {
    if(isDiasAberto){
      return MONTHS.map(m => {
        const dias = filtered
          .map(x => diasAbertoNoFimDoMes(x.abertoEm, x.concluidoEm, x.statusEfetivo, CURRENT_YEAR, m.n))
          .filter(v => v !== null);
        return { key: m.n, label: m.label, count: dias.length ? avgOf(dias) : 0, semDados: !dias.length };
      });
    }
    const buckets = {};
    filtered.forEach(m => {
      if(!m[campoData]) return;
      const d = new Date(m[campoData]);
      if(isNaN(d.getTime())) return;
      const monday = startOfWeekMonday(d);
      const key = monday.getTime();
      const inc = valueFn ? valueFn(m) : 1;
      buckets[key] = (buckets[key]||0) + inc;
    });
    const keys = Object.keys(buckets).map(Number);
    if(!keys.length) return [];
    const minKey = Math.min(...keys), maxKey = Math.max(...keys);
    const weekMs = 7*24*60*60*1000;
    const out = [];
    for(let t = minKey; t <= maxKey; t += weekMs){
      out.push({ key: t, label: weekLabel(new Date(t)), count: buckets[t] || 0 });
    }
    return out;
  }, [filtered, campoData, metrica]);

  const porSuporte = useMemo(() => {
    const keyFn = m => m.responsavel || 'Sem responsável';
    return isDiasAberto ? buildMonthlyDiasAbertoBreakdown(filtered, keyFn) : buildWeeklyBreakdown(filtered, keyFn, campoData, valueFn);
  }, [filtered, campoData, metrica]);
  const porDev = useMemo(() => {
    const devById = Object.fromEntries(devTeam.map(p => [p.id, p.nome]));
    const keyFn = m => m.responsavelDesenvolvimentoId ? (devById[m.responsavelDesenvolvimentoId] || 'Não atribuído') : 'Não atribuído';
    return isDiasAberto ? buildMonthlyDiasAbertoBreakdown(filtered, keyFn) : buildWeeklyBreakdown(filtered, keyFn, campoData, valueFn);
  }, [filtered, devTeam, campoData, metrica]);
  const porClassificacao = useMemo(() => {
    const keyFn = m => m.classificacao || 'Sem classificação';
    return isDiasAberto ? buildMonthlyDiasAbertoBreakdown(filtered, keyFn) : buildWeeklyBreakdown(filtered, keyFn, campoData, valueFn);
  }, [filtered, campoData, metrica]);
  const porCliente = useMemo(() => {
    const keyFn = m => m.cliente || 'Sem cliente';
    return isDiasAberto ? buildMonthlyDiasAbertoBreakdown(filtered, keyFn) : buildWeeklyBreakdown(filtered, keyFn, campoData, valueFn);
  }, [filtered, campoData, metrica]);

  const mediaDiasAberto = useMemo(() => avgOf(filtered.map(m => m.diasEmAberto)), [filtered]);
  const diasAbertoUltimoMes = useMemo(() => {
    if(!isDiasAberto) return null;
    const filledMonths = semanas.filter(s => !s.semDados);
    return filledMonths.length ? filledMonths[filledMonths.length - 1].count : null;
  }, [semanas, isDiasAberto]);
  const totalMetrica = useMemo(() => metrica === 'esforco'
    ? filtered.reduce((acc, m) => acc + (Number(m.esforco) || 0), 0)
    : filtered.length, [filtered, metrica]);

  if(!filtered.length) return null;

  return (
    <div className="card card-pad" style={{marginBottom:20}}>
      <div style={{display:'flex', flexWrap:'wrap', alignItems:'center', gap:10, marginBottom:16}}>
        <div className="demandas-filter-label" style={{marginBottom:0}}>Variável:</div>
        <div className="chip-row" style={{marginBottom:0}}>
          <button type="button" className={"status-filter-chip" + (metrica==='tickets' ? ' active' : '')}
            style={metrica==='tickets' ? {background:'var(--accent)', color:'#fff', borderColor:'var(--accent)'} : undefined}
            onClick={()=>setMetrica('tickets')}>Tickets</button>
          <button type="button" className={"status-filter-chip" + (metrica==='esforco' ? ' active' : '')}
            style={metrica==='esforco' ? {background:'var(--accent)', color:'#fff', borderColor:'var(--accent)'} : undefined}
            onClick={()=>setMetrica('esforco')}>Esforço</button>
          <button type="button" className={"status-filter-chip" + (isDiasAberto ? ' active' : '')}
            style={isDiasAberto ? {background:'var(--accent)', color:'#fff', borderColor:'var(--accent)'} : undefined}
            onClick={()=>setMetrica('dias-aberto')}>Média dias aberto</button>
        </div>
        {!isDiasAberto && (
          <>
            <div className="demandas-filter-label" style={{marginBottom:0, marginLeft:10}}>Data considerada:</div>
            <div className="chip-row" style={{marginBottom:0}}>
              {DEMANDAS_RESUMO_CAMPOS_DATA.map(c => (
                <button key={c.key} type="button" className={"status-filter-chip" + (campoData===c.key ? ' active' : '')}
                  style={campoData===c.key ? {background:'var(--accent)', color:'#fff', borderColor:'var(--accent)'} : undefined}
                  onClick={()=>setCampoData(c.key)}>{c.label}</button>
              ))}
            </div>
          </>
        )}
      </div>
      <div style={{display:'flex', gap:14, marginBottom:18}}>
        <div style={{flex:1, background:'var(--accent-soft)', borderRadius:'var(--radius-md)', padding:'14px 18px'}}>
          <div style={{fontFamily:'var(--font-mono)', fontSize:11, color:'var(--accent-ink)', textTransform:'uppercase', letterSpacing:'0.6px', marginBottom:4}}>{isDiasAberto ? 'Média dias aberto (mês mais recente)' : ('Total ' + metricaLabel)}</div>
          <div style={{fontFamily:'var(--font-display)', fontSize:26, fontWeight:600, color:'var(--ink)'}}>{isDiasAberto ? (diasAbertoUltimoMes === null ? '—' : diasAbertoUltimoMes.toLocaleString('pt-BR', {maximumFractionDigits:1})) : fmtNumber(totalMetrica)}</div>
        </div>
        <div style={{flex:1, background:'var(--accent-soft)', borderRadius:'var(--radius-md)', padding:'14px 18px'}}>
          <div style={{fontFamily:'var(--font-mono)', fontSize:11, color:'var(--accent-ink)', textTransform:'uppercase', letterSpacing:'0.6px', marginBottom:4}}>{isDiasAberto ? 'Média geral (todos os tickets filtrados)' : 'Média dias aberto'}</div>
          <div style={{fontFamily:'var(--font-display)', fontSize:26, fontWeight:600, color:'var(--ink)'}}>{mediaDiasAberto === null ? '—' : mediaDiasAberto.toFixed(1)}</div>
        </div>
      </div>
      <div className="section-block-title" style={{marginBottom:4}}>{metricaLabel} por {isDiasAberto ? 'mês' : 'semana'}</div>
      <div className="section-block-desc" style={{marginBottom:12}}>
        {isDiasAberto
          ? 'Segue a mesma lógica de agrupamento da meta "Média dias ticket em aberto": para cada mês civil, considera os tickets (dentre os filtrados acima) abertos até o fim daquele mês e finalizados só depois dele (ou ainda em aberto), e só tickets abertos em ' + CURRENT_YEAR + '.'
          : <>Considera os tickets que respeitam os filtros acima, pela {(DEMANDAS_RESUMO_CAMPOS_DATA.find(c => c.key === campoData) || DEMANDAS_RESUMO_CAMPOS_DATA[0]).descLabel} (nº {filtered.length}).</>}
      </div>
      <WeeklyTicketsChart weeks={semanas} metricaLabel={metricaLabel} unitLabel={isDiasAberto ? 'Mês: ' : undefined}/>

      <WeeklyBreakdownTable titulo="Por pessoa de suporte" weeks={semanas} rows={porSuporte}/>
      <WeeklyBreakdownTable titulo="Por pessoa de desenvolvimento" weeks={semanas} rows={porDev}/>
      <WeeklyBreakdownTable titulo="Por classificação" weeks={semanas} rows={porClassificacao}/>
      <WeeklyBreakdownTable titulo="Por cliente" weeks={semanas} rows={porCliente}/>
    </div>
  );
}

// Modal de criação de um ticket 100% manual (fora do Movidesk) — todos os campos ficam abertos aqui,
// diferente de um ticket sincronizado (onde só as colunas "overlay" via updateDemandaCustom são
// editáveis). No submit, cria a linha base (assunto/status/urgência/cliente/responsável/data de
// abertura/CSAT/tempo 1ª resposta) via addDemandaManual, e — se algum dos campos "overlay" tiver sido
// preenchido aqui também — grava eles de uma vez via updateDemandaCustom, reaproveitando toda a lógica
// já existente de KPI/edit-meta para essas colunas.
function NovaDemandaManualModal({data, devTeam, actions, onClose}){
  const [assunto, setAssunto] = useState('');
  const [cliente, setCliente] = useState(DEMANDAS_CLIENTES_ORDEM[0]);
  const [status, setStatus] = useState('Em aberto');
  const [urgencia, setUrgencia] = useState('');
  const [responsavel, setResponsavel] = useState('');
  const [abertoEm, setAbertoEm] = useState(() => new Date().toISOString().split('T')[0]);
  const [csat, setCsat] = useState('');
  const [tempoPrimeiraResposta, setTempoPrimeiraResposta] = useState('');
  const [prazo, setPrazo] = useState('');
  const [concluidoEm, setConcluidoEm] = useState('');
  const [classificacao, setClassificacao] = useState('');
  const [tipo, setTipo] = useState('');
  const [prioridade, setPrioridade] = useState('');
  const [esforco, setEsforco] = useState('');
  const [respDevId, setRespDevId] = useState('');

  const canSave = assunto.trim().length > 0 && !!cliente && !!abertoEm;

  const handleSave = () => {
    if(!canSave) return;
    const numero = nextManualDemandaNumero(data.demandasManuais);
    actions.addDemandaManual({
      n: numero,
      a: assunto.trim(),
      s: status,
      u: urgencia,
      c: cliente,
      r: responsavel.trim(),
      d: abertoEm + 'T00:00:00',
      re: '',
      tr: tempoPrimeiraResposta === '' ? null : Number(tempoPrimeiraResposta),
      csat: csat === '' ? '' : Number(csat),
    });
    const overlayPatch = {};
    if(prazo) overlayPatch.prazo = prazo;
    if(concluidoEm) overlayPatch.concluidoEmManual = concluidoEm;
    if(classificacao) overlayPatch.classificacao = classificacao;
    if(tipo) overlayPatch.tipo = tipo;
    if(prioridade) overlayPatch.prioridade = prioridade;
    if(esforco !== '') overlayPatch.esforco = esforco;
    if(respDevId) overlayPatch.responsavelDesenvolvimentoId = respDevId;
    if(Object.keys(overlayPatch).length) actions.updateDemandaCustom(numero, overlayPatch);
    onClose();
  };

  return (
    <Modal title="Nova Demanda Manual" onClose={onClose} width="640px" footer={
      <>
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" disabled={!canSave} style={!canSave?{opacity:0.5}:undefined} onClick={handleSave}>
          Criar ticket
        </button>
      </>
    }>
      <div className="hint" style={{marginBottom:14}}>
        Cria um ticket fora do Movidesk, com todos os campos preenchidos aqui — útil para demandas que
        não passam pelo Movidesk mas precisam entrar nos mesmos KPIs. O número do ticket é gerado
        automaticamente (prefixo "M"). Todos os campos continuam editáveis depois de criado.
      </div>
      <div className="field">
        <label>Assunto<span className="required-mark">*</span></label>
        <input className="input" value={assunto} onChange={e=>setAssunto(e.target.value)} autoFocus placeholder="Descrição do ticket"/>
      </div>
      <div className="field-row">
        <div className="field">
          <label>Cliente<span className="required-mark">*</span></label>
          <select className="select" value={cliente} onChange={e=>setCliente(e.target.value)}>
            {DEMANDAS_CLIENTES_ORDEM.map(c => <option value={c} key={c}>{c}</option>)}
          </select>
        </div>
        <div className="field">
          <label>Responsável</label>
          <input className="input" value={responsavel} onChange={e=>setResponsavel(e.target.value)} placeholder="Nome de quem está atendendo"/>
        </div>
      </div>
      <div className="field-row">
        <div className="field">
          <label>Status</label>
          <select className="select" value={status} onChange={e=>setStatus(e.target.value)}>
            {DEMANDA_STATUS_MANUAL_OPTIONS.map(o => <option value={o} key={o}>{o}</option>)}
          </select>
        </div>
        <div className="field">

            {DEMANDA_URGENCIA_OPTIONS.map(o => <option value={o} key={o}>{o}</option>)}
          </select>
        </div>
      </div>
      <div className="field-row">

          <label>Data de Abertura<span className="required-mark">*</span></label>
          <input className="input" type="date" value={abertoEm} onChange={e=>setAbertoEm(e.target.value)}/>

        <div className="field">
          <label>Classificação</label>
          <select className="select" value={classificacao} onChange={e=>setClassificacao(e.target.value)}>

          <label>Tipo</label>

            {DEMANDA_TIPO_OPTIONS.map(o => <option value={o} key={o}>{o}</option>)}
          </select>
        </div>
      </div>
      <div className="field-row">

  );

// Uma linha de ticket dentro de "Entregas por Data" (compartilhada pelos dois segmentos, Em Aberto e
// Entregue) — inclui a tag de Classificação ao lado do Cliente quando o ticket tiver uma vinculada
// (pedido em 28/08/2026), deixando em branco (sem tag) quando não tiver.
function EntregaPorDataLinha({m, devNameById}){
  const devNome = m.responsavelDesenvolvimentoId ? devNameById[m.responsavelDesenvolvimentoId] : null;
  return (
    <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', gap:12, flexWrap:'wrap'}}>
      <div style={{display:'flex', alignItems:'center', gap:8, flexWrap:'wrap'}}>
        <span className="tag tag-client">{m.cliente}</span>
        {m.classificacao && <span className="tag">{m.classificacao}</span>}
        <span>{m.assunto || '(sem assunto)'}</span>
        <span style={{color:'var(--ink-soft)', fontSize:12}}>#{m.numero}</span>
      </div>
      <div style={{display:'flex', alignItems:'center', gap:10, flexWrap:'wrap', fontSize:12, color:'var(--ink-soft)'}}>
        {m.responsavel && <span title="Responsável Atendimento">Atend.: <strong style={{color:'var(--ink)', fontWeight:600}}>{m.responsavel}</strong></span>}
        {devNome && <span title="Desenvolvedor Alocado">Dev.: <strong style={{color:'var(--ink)', fontWeight:600}}>{devNome}</strong></span>}
        {!isEmptyVal(m.csat) && <span title="CSAT">CSAT: <strong style={{color:'var(--ink)', fontWeight:600}}>{m.csat}</strong></span>}
        {m.atrasado && <span className="status-pill atrasado-tag">Atrasado</span>}
      </div>
    </div>
  );
}

// Visão de "Entregas por Data": tickets com Prazo definido, agrupados por mês e depois por dia exato —
// facilita enxergar rapidamente quais entregas estão próximas. Dentro de cada mês, os tickets ficam
// segmentados em duas quebras (pedido em 28/08/2026): "Em Aberto" (tickets ainda não concluídos, pela
// data do Prazo — mesma lógica de sempre) e "Entregue" (tickets já concluídos com status Resolvido ou
// Fechado, organizados pela data de entrega — campo "Concluído em" — em vez do Prazo). Isso deixa
// visível o que o time já entregou naquele mês sempre que o filtro de Status na página permitir ver
// tickets concluídos (por padrão todos os status entram). Respeita os filtros já aplicados na página
// (recebe `filtered`, não `merged`).
function EntregasPorDataSection({filtered, devNameById}){
  const agruparPorMesEDia = (rows, campoData) => {
    const meses = {};
    rows.forEach(m => {
      const valor = m[campoData];
      if(!valor) return;
      const mesKey = valor.slice(0, 7); // "YYYY-MM"
      const diaKey = valor.slice(0, 10); // "YYYY-MM-DD"
      meses[mesKey] = meses[mesKey] || {};
      meses[mesKey][diaKey] = meses[mesKey][diaKey] || [];
      meses[mesKey][diaKey].push(m);
    });
    return meses;
  };

  const porMesAberto = useMemo(
    () => agruparPorMesEDia(filtered.filter(m => m.prazo && !m.concluidoEm), 'prazo'),
    [filtered]
  );
  const porMesEntregue = useMemo(
    () => agruparPorMesEDia(filtered.filter(m => m.concluidoEm && (m.statusEfetivo === 'Resolvido' || m.statusEfetivo === 'Fechado')), 'concluidoEm'),
    [filtered]
  );

  const mesKeys = useMemo(() => {
    const keys = new Set([...Object.keys(porMesAberto), ...Object.keys(porMesEntregue)]);
    return Array.from(keys).sort();
  }, [porMesAberto, porMesEntregue]);

  const fmtMesAno = (mesKey) => {
    const [ano, mes] = mesKey.split('-').map(Number);
    return mesPlanningNome(mes) + '/' + ano;
  };

  return (
    <div style={{marginTop:28}}>
      <div className="section-block-head">
        <div>
          <div className="section-block-title">Entregas por Data</div>
          <div className="section-block-desc">
            Tickets agrupados por mês e segmentados em <strong>Em Aberto</strong> (ainda não concluídos,
            pela data do Prazo) e <strong>Entregue</strong> (já concluídos com status Resolvido ou Fechado,
            pela data de entrega). Respeita os filtros de Status e demais filtros acima.
          </div>
        </div>
      </div>
      {mesKeys.length === 0 ? (
        <div className="card"><EmptyState icon={IconClock} title="Nenhuma entrega com prazo pendente ou já concluída"
          sub="Tickets com o campo Prazo preenchido (em aberto) ou já concluídos (Resolvido/Fechado) aparecem aqui, organizados por data."/></div>
      ) : mesKeys.map(mesKey => {
        const diasAberto = porMesAberto[mesKey];
        const diasEntregue = porMesEntregue[mesKey];
        return (
          <div className="card" key={mesKey} style={{marginBottom:16}}>
            <div className="section-block-head" style={{padding:'18px 22px 0'}}>
              <div className="section-block-title" style={{fontSize:15}}>{fmtMesAno(mesKey)}</div>
            </div>
            {diasAberto && (
              <>
                <div style={{padding:'14px 22px 0', fontFamily:'var(--font-mono)', fontSize:11, textTransform:'uppercase', letterSpacing:'0.6px', color:'var(--ink-soft)'}}>Em Aberto</div>
                <div className="table-wrap">
                  <EntregaPorDataTabela porDia={diasAberto} devNameById={devNameById}/>
                </div>
              </>
            )}
            {diasEntregue && (
              <>
                <div style={{padding:'14px 22px 0', fontFamily:'var(--font-mono)', fontSize:11, textTransform:'uppercase', letterSpacing:'0.6px', color:'var(--positive)'}}>Entregue</div>
                <div className="table-wrap">
                  <EntregaPorDataTabela porDia={diasEntregue} devNameById={devNameById}/>
                </div>
              </>
            )}
          </div>
        );
      })}
    </div>
  );
}

function DemandasPage({data, actions}){
  const merged = useMemo(() => buildDemandasMerged(data.demandasCustom, data.demandasBase, data.demandasManuais), [data.demandasCustom, data.demandasBase, data.demandasManuais]);
  const devTeam = useMemo(() => (data.pessoas||[]).filter(p => p.area === 'Desenvolvimento' || p.area === 'Atendimento'), [data.pessoas]);
  const devNameById = useMemo(() => { const m={}; devTeam.forEach(p=>{ m[p.id]=p.nome; }); return m; }, [devTeam]);

  const [syncing, setSyncing] = useState(false);
  const [syncError, setSyncError] = useState(null);
  const [syncWarning, setSyncWarning] = useState(null);
  const [novoManualOpen, setNovoManualOpen] = useState(false);
  const [confirmDelManual, setConfirmDelManual] = useState(null); // numero do ticket manual a excluir
  // Diagnóstico da última sincronização de CSAT (não persistido — só dura enquanto a página estiver
  // aberta) — guarda o resultado bruto (nota por ticket lida da planilha) para permitir conferir, ticket
  // a ticket, em qual etapa um CSAT específico eventualmente se perde: (1) não foi lido da planilha,
  // (2) foi lido mas não gravado em demandasCustom, ou (3) foi gravado mas não aparece na tabela.
  const [lastCsatSync, setLastCsatSync] = useState(null);
  const [csatDebugTicket, setCsatDebugTicket] = useState('');

  // Sincroniza o CSAT a partir da planilha separada de Avaliação (aba "Resultado da pesquisa de
  // satisf...", colunas "Ticket" e "Avaliação", convertidas numa nota de 1 a 5). Essa planilha é um
  // arquivo Excel (.xlsx) hospedado no Drive, não uma planilha nativa do Google Sheets — a API do
  // Sheets (usada pelas outras sincronizações, que leem abas de dentro de "Gestão Metas") não consegue
  // ler esse tipo de arquivo (erro "This operation is not supported... must not be an Office file").
  // Por isso aqui baixa o arquivo binário direto do Drive e processa com XLSX.read, no mesmo padrão já
  // usado pela sincronização do Movidesk (outro .xlsx no Drive) — ver handleSyncMovidesk mais abaixo.
  const handleSyncCsat = async () => {
    const token = await getGoogleDriveAccessToken();
    const metaRes = await fetch(
      'https://www.googleapis.com/drive/v3/files/' + CSAT_AVALIACAO_SHEET_ID
      + '?fields=' + encodeURIComponent('id,name,mimeType') + '&supportsAllDrives=true',
      { headers: { Authorization: 'Bearer ' + token } }
    );
    if(!metaRes.ok) throw new Error('Não foi possível localizar a planilha de CSAT no Drive (HTTP ' + metaRes.status + '). Confirme se o link ainda dá acesso ao mesmo arquivo.');
    const meta = await metaRes.json();
    // Mesma lógica do Movidesk: pode ser um .xlsx binário de verdade, ou ter sido convertido
    // automaticamente pelo Drive para uma planilha nativa do Google Sheets no upload.
    const isGoogleSheet = meta.mimeType === 'application/vnd.google-apps.spreadsheet';
    const downloadUrl = isGoogleSheet
      ? 'https://www.googleapis.com/drive/v3/files/' + CSAT_AVALIACAO_SHEET_ID + '/export?mimeType=' + encodeURIComponent('application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')
      : 'https://www.googleapis.com/drive/v3/files/' + CSAT_AVALIACAO_SHEET_ID + '?alt=media&supportsAllDrives=true';
    const res = await fetch(downloadUrl, { headers: { Authorization: 'Bearer ' + token } });
    if(!res.ok) throw new Error('Não foi possível baixar a planilha de CSAT do Drive (HTTP ' + res.status + ').');
    const buf = await res.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    const rows = findCsatSheetRows(wb);
    const { porTicket, total, ignoradas, amostrasIgnoradas } = parseCsatAvaliacaoSheet(rows);
    if(!total) throw new Error('Nenhuma avaliação reconhecida na planilha — confirme se as colunas "Ticket" e "Avaliação" estão preenchidas na aba "' + CSAT_AVALIACAO_SHEET_TAB + '".');
    // Aviso (não bloqueante) quando os números de ticket da planilha não batem com nenhum ticket
    // conhecido (Movidesk + manuais) — nesse caso a sincronização "funciona" (grava tudo em
    // demandasCustom) mas o CSAT nunca aparece na tabela de Demandas, porque nenhuma linha existente
    // tem esse número. Cenário mais comum: a coluna Ticket da planilha ficou formatada de um jeito que
    // não bate mais com o número puro (ex.: texto com espaço/prefixo), ou os tickets avaliados ainda
    // não foram sincronizados da base do Movidesk.
    const numerosConhecidos = new Set(merged.map(m => m.numero));
    const semCorrespondencia = Object.keys(porTicket).filter(n => !numerosConhecidos.has(n));
    // Espera o resultado REAL da gravação (em vez de só disparar e seguir em frente) — se o Firestore
    // recusar a escrita (ex.: uma regra de segurança bloqueando, sem conexão, etc.), isso normalmente só
    // aparecia como um toast passageiro que era fácil de não notar no meio do aviso de "tickets sem
    // correspondência" já mostrado na tela. Agora, se a gravação falhar, isso vira parte do próprio aviso
    // PERSISTENTE desta sincronização — impossível de passar despercebido.
    const saveResult = await actions.importCsatAvaliacao(porTicket);
    // Guarda o resultado bruto desta sincronização (nota lida por ticket, direto da planilha, antes de
    // qualquer gravação) para o painel de diagnóstico abaixo — permite checar ticket a ticket sem
    // depender de acesso aos dados reais da planilha/Firestore.
    setLastCsatSync({ porTicket, total, ignoradas, amostrasIgnoradas, semCorrespondencia, at: new Date().toISOString() });
    const avisos = [];
    if(saveResult && saveResult.ok === false){
      avisos.push(`ERRO AO SALVAR: as notas foram lidas corretamente da planilha, mas NÃO foram salvas no banco de dados (motivo: "${saveResult.error}"). Tente sincronizar de novo — se o erro persistir, envie esta mensagem exata para o suporte.`);
    }
    if(ignoradas){
      // Mostra alguns exemplos concretos (ticket + valor bruto da célula Avaliação) — sem isso, "19
      // linhas ignoradas" não dá pra investigar; com a amostra dá pra ver na hora se é um problema de
      // texto (ex.: "Otimo!" com pontuação) ou um formato totalmente diferente do esperado.
      const amostraIgnoradas = amostrasIgnoradas.slice(0, 6).map(a => `#${a.numero || '(sem número)'}="${a.avaliacaoBruta}"`).join(', ');
      avisos.push(`${ignoradas} linha${ignoradas===1?'':'s'} ignorada${ignoradas===1?'':'s'} por ter uma Avaliação não reconhecida (esperado: Péssimo, Ruim, Neutro, Bom, Ótimo, ou uma nota de 1 a 5). Exemplos: ${amostraIgnoradas}${ignoradas > amostrasIgnoradas.length ? '...' : ''}.`);
    }
    if(semCorrespondencia.length){
      const amostra = semCorrespondencia.slice(0, 8).join(', ') + (semCorrespondencia.length > 8 ? '...' : '');
      avisos.push(`${semCorrespondencia.length} de ${total} ticket(s) da planilha de CSAT não têm nenhuma demanda correspondente na base atual (números: ${amostra}) — pode ser um ticket ainda não sincronizado do Movidesk, ou um número de ticket em formato diferente na planilha.`);
    }
    return avisos.length ? avisos.join(' ') : null;
  };

  const handleSyncMovidesk = async () => {
    setSyncing(true);
    setSyncError(null);
    setSyncWarning(null);
    try{
      const fb = await waitForFirebase();
      const provider = new fb.GoogleAuthProvider();
      provider.addScope('https://www.googleapis.com/auth/drive.readonly');
      const result = await fb.signInWithPopup(fb.auth, provider);
      const credential = fb.credentialFromResult ? fb.credentialFromResult(result) : null;
      const accessToken = credential && credential.accessToken;
      if(!accessToken) throw new Error('Não foi possível obter permissão de acesso ao Google Drive.');

      // Busca o arquivo pelo NOME (em vez de um ID fixo): o Orsatto atualiza a base excluindo o
      // arquivo antigo e subindo um novo com o mesmo nome, e isso gera um ID novo no Drive a cada vez
      // — um ID fixo no código ficaria desatualizado no próximo replace.
      const driveFilesQuery = async (query) => {
        // supportsAllDrives/includeItemsFromAllDrives/corpora=allDrives: sem isso, a busca da API do
        // Drive por padrão só enxerga "Meu Drive" + itens compartilhados diretamente — arquivos que
        // vivem dentro de um Drive Compartilhado (Shared Drive) da organização (comum em contas
        // Workspace como a da Rivio) ficam de fora da busca mesmo aparecendo normalmente na interface.
        const listRes = await fetch(
          'https://www.googleapis.com/drive/v3/files?q=' + encodeURIComponent(query)
          + '&fields=' + encodeURIComponent('files(id,name,mimeType,modifiedTime)')
          + '&orderBy=' + encodeURIComponent('modifiedTime desc')
          + '&pageSize=5'
          + '&supportsAllDrives=true&includeItemsFromAllDrives=true&corpora=allDrives',
          { headers: { Authorization: 'Bearer ' + accessToken } }
        );
        if(!listRes.ok) throw new Error('Não foi possível localizar o arquivo "' + MOVIDESK_DRIVE_FILENAME + '" no Drive (HTTP ' + listRes.status + ').');
        const listData = await listRes.json();
        return (listData.files && listData.files[0]) || null;
      };
      // 1ª tentativa: restrita à pasta configurada (mais específica). 2ª tentativa (fallback): busca
      // pelo nome em todo o Drive do usuário, sem restrição de pasta — cobre o caso comum de a pasta
      // ter sido acessada via "Compartilhados comigo" como um ATALHO, cujo ID não é o mesmo ID real
      // usado internamente pela API como "parent" do arquivo.
      let file = await driveFilesQuery(`'${MOVIDESK_DRIVE_FOLDER_ID}' in parents and name = '${MOVIDESK_DRIVE_FILENAME}' and trashed = false`);
      if(!file) file = await driveFilesQuery(`name = '${MOVIDESK_DRIVE_FILENAME}' and trashed = false`);
      if(!file) throw new Error('Nenhum arquivo chamado "' + MOVIDESK_DRIVE_FILENAME + '" foi encontrado no Drive (nem na pasta configurada, nem em uma busca geral). Confirme se o nome do arquivo continua exatamente "' + MOVIDESK_DRIVE_FILENAME + '".');

      // O arquivo pode ser um .xlsx binário de verdade (mimeType do Office) ou ter sido convertido
      // automaticamente pelo Drive para uma planilha nativa do Google Sheets no upload — cada um exige
      // um jeito diferente de baixar o conteúdo.
      const isGoogleSheet = file.mimeType === 'application/vnd.google-apps.spreadsheet';
      // supportsAllDrives=true é necessário no download binário (?alt=media) quando o arquivo vive
      // dentro de um Drive Compartilhado; o endpoint de export não usa/aceita esse parâmetro.
      const downloadUrl = isGoogleSheet
        ? 'https://www.googleapis.com/drive/v3/files/' + file.id + '/export?mimeType=' + encodeURIComponent('application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')
        : 'https://www.googleapis.com/drive/v3/files/' + file.id + '?alt=media&supportsAllDrives=true';
      const res = await fetch(downloadUrl, { headers: { Authorization: 'Bearer ' + accessToken } });
      if(!res.ok) throw new Error('Não foi possível baixar a planilha do Drive (HTTP ' + res.status + ').');
      const buf = await res.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array', cellDates: true });
      const rows = findMovideskSheetRows(wb);
      const {rows: parsedRows, stats} = transformMovideskRows(rows);
      if(!parsedRows.length){
        // Nenhum ticket reconhecido — quase sempre porque a coluna de Cliente na planilha tem nomes
        // de organização que não batem com nenhuma entrada de MOVIDESK_CLIENT_MAP (ex.: a organização
        // foi renomeada no Movidesk, ou é uma organização nova). Lista os nomes encontrados para facilitar o ajuste.
        const clientesNaoMapeados = stats.unmappedClients.map(c => `"${c.nome}" (${c.count})`).join(', ');
        throw new Error(
          'A planilha foi baixada (' + stats.totalDataRows + ' linhas), mas nenhum ticket reconhecido foi encontrado. '
          + (clientesNaoMapeados
            ? 'Nomes de cliente na planilha sem correspondência cadastrada: ' + clientesNaoMapeados + '.'
            : 'Verifique se as colunas da planilha (Número, Status, Cliente, Aberto em) continuam na mesma ordem.')
        );
      }
      actions.importDemandasBase(parsedRows);
      // Aviso (não bloqueante): parte da planilha foi ignorada. Isso é o cenário mais comum de
      // "sincronizei e os dados não mudaram" — esses tickets nunca chegam a entrar na base, mesmo a
      // sincronização "dando certo". Lista TODOS os nomes de cliente não reconhecidos (sem cortar em
      // top-5) e também os outros motivos de descarte (linha com campo essencial vazio, ou data de
      // abertura ilegível), já que um ticket específico pode estar caindo em qualquer uma dessas
      // categorias — não só na de cliente não mapeado.
      const avisos = [];
      if(stats.unmappedClients.length){
        const lista = stats.unmappedClients.map(c => `"${c.nome}" (${c.count} ticket${c.count===1?'':'s'})`).join(', ');
        avisos.push(`Cliente não reconhecido: ${lista}.`);
      }
      if(stats.skippedMissingFields){
        avisos.push(`${stats.skippedMissingFields} linha(s) ignorada(s) por Número/Status/Cliente/Data de Abertura vazio.`);
      }
      if(stats.skippedInvalidDate){
        avisos.push(`${stats.skippedInvalidDate} linha(s) ignorada(s) por Data de Abertura ilegível.`);
      }
      if(avisos.length){
        setSyncWarning(
          `${stats.imported} de ${stats.totalDataRows} linhas importadas. ${avisos.join(' ')} `
          + 'Se algum desses for um cliente válido da BU, peça para adicionar o mapeamento em MOVIDESK_CLIENT_MAP.'
        );
      }
    }catch(e){
      console.error('Movidesk sync error', e);
      setSyncError(e.message || 'Erro ao atualizar a base do Movidesk.');
    }finally{
      setSyncing(false);
    }
  };

  const statusOptions = useMemo(() => {
    const set = new Set(merged.map(m => m.status));
    return Array.from(set).sort();
  }, [merged]);
  const responsavelOptions = useMemo(() => {
    const set = new Set(merged.map(m => m.responsavel).filter(Boolean));
    return Array.from(set).sort();
  }, [merged]);

  // por padrão, oculta os status concluídos (Fechado, Resolvido, Cancelado)
  const [statusFilter, setStatusFilter] = useState(() =>
    new Set(statusOptions.filter(s => !DEMANDA_STATUS_TERMINAL.includes(s)))
  );
  // Todos os filtros abaixo (exceto Status, que já era multi-seleção via chips) agora aceitam múltiplos
  // valores simultâneos — cada um guarda um array de valores selecionados; array vazio = sem filtro
  // (mostra tudo), igual ao comportamento anterior de "".
  const [respFilter, setRespFilter] = useState([]);
  const [mesFinalizacaoFilter, setMesFinalizacaoFilter] = useState([]);
  const [mesPlanningFilter, setMesPlanningFilter] = useState([]);
  const [tipoFilter, setTipoFilter] = useState([]);
  const [classificacaoFilter, setClassificacaoFilter] = useState([]);
  const [respDevFilter, setRespDevFilter] = useState([]);
  const [prioridadeFilter, setPrioridadeFilter] = useState([]);

  const toggleStatus = (s) => {
    setStatusFilter(prev => {
      const next = new Set(prev);
      if(next.has(s)) next.delete(s); else next.add(s);
      return next;
    });
  };

  const defaultStatusSet = useMemo(() =>
    new Set(statusOptions.filter(s => !DEMANDA_STATUS_TERMINAL.includes(s))),
  [statusOptions]);

  const filtered = useMemo(() => merged.filter(m => {
    if(!statusFilter.has(m.status)) return false;
    if(respFilter.length && !respFilter.includes(m.responsavel)) return false;
    if(mesFinalizacaoFilter.length){
      if(!m.concluidoEm) return false;
      const mesConclusao = Number(m.concluidoEm.split('-')[1]);
      if(!mesFinalizacaoFilter.map(Number).includes(mesConclusao)) return false;
    }
    if(mesPlanningFilter.length && !mesPlanningFilter.map(String).includes(String(m.mesPlanning))) return false;
    if(tipoFilter.length && !tipoFilter.includes(m.tipo)) return false;
    if(classificacaoFilter.length && !classificacaoFilter.includes(m.classificacao)) return false;
    if(respDevFilter.length && !respDevFilter.includes(m.responsavelDesenvolvimentoId)) return false;
    if(prioridadeFilter.length && !prioridadeFilter.includes(m.prioridade)) return false;
    return true;
  }), [merged, statusFilter, respFilter, mesFinalizacaoFilter, mesPlanningFilter, tipoFilter, classificacaoFilter, respDevFilter, prioridadeFilter]);

  const anyExtraFilterActive = mesFinalizacaoFilter.length || mesPlanningFilter.length || tipoFilter.length || classificacaoFilter.length || respDevFilter.length || prioridadeFilter.length;
  const clearExtraFilters = () => {
    setMesFinalizacaoFilter([]); setMesPlanningFilter([]); setTipoFilter([]); setClassificacaoFilter([]); setRespDevFilter([]); setPrioridadeFilter([]);
  };

  const byCliente = useMemo(() => {
    const map = {};
    filtered.forEach(m => {
      if(!map[m.cliente]) map[m.cliente] = [];
      map[m.cliente].push(m);
    });
    Object.keys(map).forEach(k => {
      map[k].sort((a,b) => new Date(b.abertoEm) - new Date(a.abertoEm));
    });
    return map;
  }, [filtered]);

  const clientesComDados = DEMANDAS_CLIENTES_ORDEM.filter(c => byCliente[c] && byCliente[c].length > 0);
  const totalFiltrado = filtered.length;

  return (
    <div>
      <div className="section-block-head">
        <div>
          <div className="section-block-title">Demandas</div>
          <div className="section-block-desc">Tickets do Movidesk organizados por cliente. Classificação, Tipo, Prazo e Responsável Desenvolvimento são editáveis aqui e ficam preservados (por nº de ticket) quando a base for atualizada. "Concluído em" vem direto da coluna "Resolvido Em" do Movidesk — dê duplo clique na célula (ou use o ícone de lápis) para inserir manualmente quando o ticket for mantido em aberto no Movidesk aguardando o cliente; uma vez preenchido manualmente, o ticket passa a contar como concluído nos KPIs e deixa de considerar o dado do Movidesk até ser revertido. CSAT vem da planilha de Avaliação (coluna "Avaliação" convertida numa nota de 1 a 5), linkado pelo número do ticket — use "Atualizar CSAT" para sincronizar. Tickets criados manualmente (fora do Movidesk) têm todos os campos editáveis, inclusive Assunto, Status, Cliente, Responsável e Data de Abertura, e podem ser excluídos.</div>

            {data.csatAvaliacaoSync && (
              <> · CSAT: {data.csatAvaliacaoSync.by} em {fmtDataAbertura(data.csatAvaliacaoSync.at)} ({data.csatAvaliacaoSync.count} ticket{data.csatAvaliacaoSync.count===1?'':'s'})</>

        </div>
        <div style={{display:'flex', flexDirection:'column', alignItems:'flex-end', gap:6}}>
          <div style={{display:'flex', gap:8}}>

              style={{whiteSpace:'nowrap'}}

            <button

              className="btn btn-primary btn-sm"

              style={{whiteSpace:'nowrap', opacity: syncing ? 0.6 : 1, cursor: syncing ? 'not-allowed' : 'pointer'}}

          )}
          {syncWarning && (
            <div style={{fontSize:12.5, color:'#9a6b00', maxWidth:520, textAlign:'right'}}>{syncWarning}</div>
          )}
        </div>
      </div>

      {lastCsatSync && (
        <div className="card" style={{fontSize:12.5, padding:'12px 16px'}}>
          <div style={{fontWeight:600, marginBottom:4}}>Diagnóstico da última sincronização de CSAT</div>

            {lastCsatSync.total} nota{lastCsatSync.total===1?'':'s'} lida{lastCsatSync.total===1?'':'s'} da planilha em {fmtDataAbertura(lastCsatSync.at)}

            {lastCsatSync.semCorrespondencia.length ? ` · ${lastCsatSync.semCorrespondencia.length} ticket(s) sem correspondência` : ''}.

          <input
            type="text"
            className="upsell-input"
            style={{maxWidth:180}}

            value={csatDebugTicket}

          />
          {csatDebugTicket && (() => {
            const notaPlanilha = lastCsatSync.porTicket[csatDebugTicket];
            const foiLida = notaPlanilha !== undefined;
            const custom = (data.demandasCustom || {})[csatDebugTicket];
            const csatSalvo = custom && custom.csatSheet;
            const rowFinal = merged.find(m => m.numero === csatDebugTicket);
            const ocorrencias = merged.filter(m => m.numero === csatDebugTicket).length;
            return (
              <ul style={{margin:'10px 0 0', paddingLeft:18, lineHeight:1.7}}>
                <li>
                  <strong>1. Nota lida da planilha nesta sincronização:</strong>{' '}
                  {foiLida ? notaPlanilha : 'nenhuma — o ticket não apareceu com uma Avaliação reconhecida nesta última sincronização (confira se o número/linha existe na planilha e se a Avaliação está preenchida com um valor esperado).'}
                </li>
                <li>
                  <strong>2. Valor gravado em demandasCustom (csatSheet):</strong>{' '}
                  {csatSalvo !== undefined && csatSalvo !== '' && csatSalvo !== null

                </li>
                <li>
                  <strong>3. Quantas vezes esse número aparece na base de Demandas:</strong> {ocorrencias}
                  {ocorrencias > 1 ? ' — atenção: esse número está DUPLICADO na base (mais de um ticket com o mesmo número), o que pode causar comportamento inesperado na tabela.' : ''}
                </li>
                <li>
                  <strong>4. Valor final que deveria aparecer na coluna CSAT:</strong>{' '}
                  {rowFinal ? (rowFinal.csat || '(vazio — confira os passos 1 e 2 acima)') : 'ticket não encontrado na base atual de Demandas.'}
                </li>
              </ul>
            );
          })()}
        </div>
      )}

      <div className="card demandas-filters-card">
        <div className="demandas-filter-label">Status <span className="group-card-count">{totalFiltrado} ticket{totalFiltrado===1?'':'s'}</span></div>
        <div className="chip-row" style={{marginBottom:14}}>
          {statusOptions.map(s => {
            const active = statusFilter.has(s);

            return (

                key={s}
                type="button"

                style={active ? {background: col.fg, color:'#fff', borderColor: col.fg} : {color: col.fg, borderColor: col.bg, background: col.bg}}

          })}

          )}

        </div>
        <div className="demandas-filter-label">Responsável</div>
        <div className="filters-bar" style={{margin:'0 0 14px'}}>
          <div className="filters-bar-ms">

            />
          </div>
          {respFilter.length > 0 && <button className="btn btn-ghost btn-sm" onClick={()=>setRespFilter([])}>Limpar</button>}
        </div>

        <div className="demandas-filter-label">Mês Finalização, Mês do Prazo, Tipo, Classificação, Prioridade e Responsável Desenvolvimento</div>
        <div className="filters-bar" style={{margin:0}}>
          <div className="filters-bar-ms">
            <MultiSelect
              options={MESES_PLANNING.map(m => ({id:String(m.n), label:m.nome}))}
              value={mesFinalizacaoFilter}
              onChange={setMesFinalizacaoFilter}
              placeholder="Mês de finalização"
            />
          </div>
          <div className="filters-bar-ms">
            <MultiSelect
              options={MESES_PLANNING.map(m => ({id:String(m.n), label:m.nome}))}
              value={mesPlanningFilter}
              onChange={setMesPlanningFilter}
              placeholder="Mês do Prazo"
            />
          </div>
          <div className="filters-bar-ms">
            <MultiSelect
              options={DEMANDA_TIPO_OPTIONS.map(o => ({id:o, label:o}))}
              value={tipoFilter}
              onChange={setTipoFilter}
              placeholder="Tipo"
            />
          </div>
          <div className="filters-bar-ms">
            <MultiSelect
              options={DEMANDA_CLASSIFICACAO_OPTIONS.map(o => ({id:o, label:o}))}
              value={classificacaoFilter}
              onChange={setClassificacaoFilter}
              placeholder="Classificação"
            />
          </div>
          <div className="filters-bar-ms">
            <MultiSelect
              options={DEMANDA_PRIORIDADE_OPTIONS.map(o => ({id:o, label:o}))}

              onChange={setPrioridadeFilter}
              placeholder="Prioridade"
            />
          </div>
          <div className="filters-bar-ms">
            <MultiSelect
              options={devTeam.map(p => ({id:p.id, label:p.nome}))}

          {anyExtraFilterActive > 0 && <button className="btn btn-ghost btn-sm" onClick={clearExtraFilters}>Limpar</button>}

      </div>

      {clientesComDados.length === 0 ? (
        <div className="card"><EmptyState icon={IconClipboard} title="Nenhuma demanda encontrada"

      <EntregasPorDataSection filtered={filtered} devNameById={devNameById}/>

      <ConfirmDialog
        open={!!confirmDelManual}
        title="Excluir ticket manual"

        onCancel={()=>setConfirmDelManual(null)}
        onConfirm={()=>{ actions.deleteDemandaManual(confirmDelManual); setConfirmDelManual(null); }}
      />
    </div>
  );
}

  return (
    <div className="card demandas-client-card" style={expanded ? {width:'fit-content', minWidth:'100%'} : undefined}>
      <div className="group-card-head demandas-client-head" onClick={()=>setExpanded(e=>!e)}>
        <button
          type="button"
          className="demandas-expand-btn"
          onClick={(e)=>{ e.stopPropagation(); setExpanded(x=>!x); }}
          aria-label={expanded ? 'Recolher' : 'Expandir'}
        >{expanded ? '−' : '+'}</button>
        <span>{cliente}</span>
        <span className="group-card-count" style={{marginLeft:'auto'}}>{rows.length} ticket{rows.length===1?'':'s'}</span>
        <span className="group-card-count" style={{marginLeft:0}} title="Média de dias em aberto dos tickets exibidos neste cliente">
          Média {mediaDiasAberto === null ? '—' : mediaDiasAberto.toFixed(1) + 'd'} em aberto
        </span>
      </div>

      {expanded && (
        <div style={{overflow:'visible'}}>
          <table className="demandas-tbl">
            <thead>
              <tr>
                <th>Nº Ticket</th>
                <th>Assunto</th>
                <th>Status</th>
                <th>Urgência</th>
                <th>Prioridade</th>
                <th>Esforço</th>
                <th>Prazo</th>
                <th>Concluído em</th>
                <th>CSAT</th>
                <th>Responsável</th>
                <th>Data de Abertura</th>
                <th>Tempo 1ª Resposta</th>
                <th>Dias em Aberto</th>
                <th>Classificação</th>
                <th>Tipo</th>
                <th>Responsável Desenvolvimento</th>
              </tr>
            </thead>
            <tbody>
              {rows.map(r => <DemandaRow key={r.numero} row={r} devTeam={devTeam} actions={actions} onRequestDeleteManual={onRequestDeleteManual}/>)}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// Célula "Concluído em": duplo clique (ou o ícone de lápis) abre um campo de data manual, para os
// casos em que o ticket é mantido em aberto no Movidesk aguardando retorno do cliente e isso não deve
// impactar os KPIs do time. Uma vez preenchido manualmente, o valor sobrescreve o dado do Movidesk até
// ser revertido (botão "x"), ver buildDemandasMerged.
function ConcluidoEmCell({row, actions}){
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState('');

  const startEdit = () => {
    setDraft(row.concluidoEmManual || (row.concluidoEm ? row.concluidoEm.split('T')[0] : ''));
    setEditing(true);
  };
  const commit = () => {
    const patch = {concluidoEmManual: draft};
    // Salvar vazio limpa TUDO que for manual para este ticket — inclusive o campo antigo (c.concluidoEm,
    // de antes de existir a sincronização com o Movidesk), que senão continuaria "grudado" mostrando o
    // valor antigo mesmo depois do campo novo ser esvaziado.
    if(!draft) patch.concluidoEm = '';
    actions.updateDemandaCustom(row.numero, patch);
    setEditing(false);
  };
  const cancel = () => setEditing(false);
  const revert = (e) => {
    e.stopPropagation();
    // Limpa tanto o campo novo (concluidoEmManual) quanto o antigo (concluidoEm, usado antes de existir
    // a sincronização com o Movidesk) — sem isso, um valor manual antigo "reaparecia" depois de reverter.
    actions.updateDemandaCustom(row.numero, {concluidoEmManual: '', concluidoEm: ''});
  };

  if(editing){
    return (
      <td className="demanda-dias demanda-concluido-edit">
        <div className="demanda-concluido-edit-inner">
          <input
            type="date"
            className="demanda-date-input"
            value={draft}
            autoFocus
            onChange={e => setDraft(e.target.value)}
            onKeyDown={e => { if(e.key === 'Enter') commit(); if(e.key === 'Escape') cancel(); }}
          />
          <button type="button" className="btn-icon" onClick={commit} title="Salvar" aria-label="Salvar">
            <IconCheck width="11" height="11"/>
          </button>
          <button type="button" className="btn-icon" onClick={cancel} title="Cancelar" aria-label="Cancelar">
            <IconX width="11" height="11"/>
          </button>
        </div>
      </td>
    );
  }

  const manualTooltip = fmtEditMetaTooltip(row.editMeta && row.editMeta.concluidoEmManual)
    || 'Definido manualmente — não é mais atualizado pela sincronização do Movidesk.';
  const tooltip = row.concluidoManualmente
    ? manualTooltip
    : 'Duplo clique para inserir manualmente (ex.: ticket mantido em aberto no Movidesk aguardando o cliente).';

  return (
    <td className="demanda-dias demanda-concluido-cell" onDoubleClick={startEdit} title={tooltip}>
      <div className="demanda-concluido-cell-inner">
        <span>{row.concluidoEm ? fmtDataAbertura(row.concluidoEm) : '—'}</span>
        {row.concluidoManualmente && <span className="manual-tag">manual</span>}
        <button type="button" className="btn-icon" onClick={startEdit} title="Editar manualmente" aria-label="Editar manualmente">
          <IconEdit width="11" height="11"/>
        </button>
        {row.concluidoManualmente && (
          <button type="button" className="btn-icon" onClick={revert} title="Reverter para o valor do Movidesk" aria-label="Reverter para o valor do Movidesk">
            <IconX width="11" height="11"/>
          </button>
        )}
      </div>
    </td>
  );
}

function DemandaRow({row, devTeam, actions, onRequestDeleteManual}){
  const statusCol = demandaStatusColor(row.status);
  const urgCol = demandaUrgenciaColor(row.urgencia);
  const isManual = row.isManual;
  return (
    <tr>
      <td className="demanda-num">
        {row.numero}
        {isManual && <span className="manual-tag" title="Ticket criado manualmente, fora do Movidesk">manual</span>}
        {isManual && (
          <button
            type="button"
            className="btn-icon danger"
            onClick={() => onRequestDeleteManual && onRequestDeleteManual(row.numero)}
            title="Excluir ticket manual"
            aria-label="Excluir ticket manual"
            style={{marginLeft:4}}
          >
            <IconTrash width="11" height="11"/>
          </button>
        )}
      </td>
      <td className="demanda-assunto" title={row.assunto}>
        {isManual ? (
          <input
            type="text"
            className="demanda-assunto-input"
            defaultValue={row.assunto}
            key={row.numero + '-assunto-' + row.assunto}
            placeholder="Assunto"
            onBlur={e => actions.updateDemandaManual(row.numero, {a: e.target.value})}
          />
        ) : row.assunto}
      </td>
      <td>
        {isManual ? (
          <select
            className="demanda-select"
            value={row.status}
            onChange={e => actions.updateDemandaManual(row.numero, {s: e.target.value})}
          >
            {DEMANDA_STATUS_MANUAL_OPTIONS.map(o => <option value={o} key={o}>{o}</option>)}
          </select>
        ) : (
          <span className="status-pill" style={{background:statusCol.bg, color:statusCol.fg}}>{row.status}</span>
        )}
      </td>
      <td>
        {isManual ? (
          <select
            className={"demanda-select" + (row.urgencia ? '' : ' empty')}
            value={row.urgencia}
            onChange={e => actions.updateDemandaManual(row.numero, {u: e.target.value})}
          >
            <option value="">—</option>
            {DEMANDA_URGENCIA_OPTIONS.map(o => <option value={o} key={o}>{o}</option>)}
          </select>
        ) : (
          <span className="status-pill" style={{background:urgCol.bg, color:urgCol.fg}}>{row.urgencia || '—'}</span>
        )}
      </td>
      <td title={fmtEditMetaTooltip(row.editMeta && row.editMeta.prioridade) || undefined}>
        <select
          className={"demanda-select" + (row.prioridade ? '' : ' empty')}
          value={row.prioridade}
          onChange={e => actions.updateDemandaCustom(row.numero, {prioridade: e.target.value})}
        >
          <option value="">—</option>
          {DEMANDA_PRIORIDADE_OPTIONS.map(o => <option value={o} key={o}>{o}</option>)}
        </select>
      </td>
      <td title={fmtEditMetaTooltip(row.editMeta && row.editMeta.esforco) || undefined}>
        <input
          type="number"
          className="upsell-input"
          defaultValue={row.esforco === null ? '' : row.esforco}
          key={row.numero + '-esforco-' + (row.esforco ?? '')}
          placeholder="—"
          step="0.5"
          min="0"
          onBlur={e => actions.updateDemandaCustom(row.numero, {esforco: e.target.value === '' ? null : e.target.value})}
        />
      </td>
      <td className="demanda-prazo-cell">
        <input
          type="date"
          className={"demanda-date-input" + (row.atrasado ? ' atrasado' : '')}
          value={row.prazo}
          onChange={e => actions.updateDemandaCustom(row.numero, {prazo: e.target.value})}
        />
        {row.atrasado && <span className="status-pill atrasado-tag">Atrasado</span>}
      </td>
      <ConcluidoEmCell row={row} actions={actions}/>
      <td className="demanda-csat" title={isManual ? undefined : (fmtEditMetaTooltip(row.editMeta && row.editMeta.csatSheet) || 'CSAT ainda não sincronizado para este ticket — use "Atualizar CSAT".')}>
        {isManual ? (
          <input
            type="number"
            className="upsell-input"
            defaultValue={row.csat || ''}
            key={row.numero + '-csat-' + row.csat}
            placeholder="—"
            step="1"
            min="1"
            max="5"
            onBlur={e => actions.updateDemandaManual(row.numero, {csat: e.target.value === '' ? '' : Number(e.target.value)})}
          />
        ) : (row.csat || '—')}
      </td>
      <td className="demanda-resp">
        {isManual ? (
          <input
            type="text"
            className="upsell-input"
            defaultValue={row.responsavel}
            key={row.numero + '-responsavel-' + row.responsavel}
            placeholder="Responsável"
            onBlur={e => actions.updateDemandaManual(row.numero, {r: e.target.value})}
          />
        ) : (row.responsavel || '—')}
      </td>
      <td className="demanda-dias">
        {isManual ? (
          <input
            type="date"
            className="demanda-date-input"
            value={row.abertoEm ? row.abertoEm.split('T')[0] : ''}
            onChange={e => actions.updateDemandaManual(row.numero, {d: e.target.value ? e.target.value + 'T00:00:00' : ''})}
          />
        ) : fmtDataAbertura(row.abertoEm)}
      </td>
      <td className="demanda-dias">
        {isManual ? (
          <input
            type="number"
            className="upsell-input"
            defaultValue={row.tempoPrimeiraResposta === null ? '' : row.tempoPrimeiraResposta}
            key={row.numero + '-tr-' + row.tempoPrimeiraResposta}
            placeholder="min"
            step="1"
            min="0"
            onBlur={e => actions.updateDemandaManual(row.numero, {tr: e.target.value === '' ? null : Number(e.target.value)})}
          />
        ) : fmtDuracaoMinutos(row.tempoPrimeiraResposta)}
      </td>
      <td className="demanda-dias">{row.diasEmAberto === null ? '—' : row.diasEmAberto}</td>
      <td title={fmtEditMetaTooltip(row.editMeta && row.editMeta.classificacao) || undefined}>
        <select
          className={"demanda-select" + (row.classificacao ? '' : ' empty')}
          value={row.classificacao}
          onChange={e => actions.updateDemandaCustom(row.numero, {classificacao: e.target.value})}
        >
          <option value="">—</option>
          {DEMANDA_CLASSIFICACAO_OPTIONS.map(o => <option value={o} key={o}>{o}</option>)}
        </select>
      </td>
      <td title={fmtEditMetaTooltip(row.editMeta && row.editMeta.tipo) || undefined}>
        <select
          className={"demanda-select" + (row.tipo ? '' : ' empty')}
          value={row.tipo}
          onChange={e => actions.updateDemandaCustom(row.numero, {tipo: e.target.value})}
        >
          <option value="">—</option>
          {DEMANDA_TIPO_OPTIONS.map(o => <option value={o} key={o}>{o}</option>)}
        </select>
      </td>
      <td title={fmtEditMetaTooltip(row.editMeta && row.editMeta.responsavelDesenvolvimentoId) || undefined}>
        <select
          className={"demanda-select" + (row.responsavelDesenvolvimentoId ? '' : ' empty')}
          value={row.responsavelDesenvolvimentoId}
          onChange={e => actions.updateDemandaCustom(row.numero, {responsavelDesenvolvimentoId: e.target.value})}
        >
          <option value="">—</option>
          {devTeam.map(p => <option value={p.id} key={p.id}>{p.nome}</option>)}
        </select>
      </td>
    </tr>
  );
}
