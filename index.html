/* ---------------------------------------------------------------
   GOALS — Gestão de Metas
--------------------------------------------------------------- */

// Dado o id de uma pessoa, retorna o Set de nomes de clientes que ela atende, com base nas
// funções cadastradas em "Papéis e Responsabilidades" (data.tarefas[].responsaveis: {clienteId: pessoaId}).
// Retorna null quando não há pessoa selecionada (= sem filtro, considera todos os clientes).
function getPessoaClienteNomes(pessoaId, data){
  if(!pessoaId) return null;
  const clienteById = Object.fromEntries((data.clientes || []).map(c => [c.id, c.nome]));
  const nomes = new Set();
  (data.tarefas || []).forEach(t => {
    Object.entries(t.responsaveis || {}).forEach(([cid, pid]) => {
      if(pid === pessoaId && clienteById[cid]) nomes.add(clienteById[cid]);
    });
  });
  return nomes;
}

// Metas calculadas em cima da aba "Demandas" (tickets do Movidesk) — diferente das demais metas
// (ex.: Contas Finalizadas), em que cada cliente tem um "dono" fixo no organograma, aqui uma pessoa
// pode ajudar em tickets de qualquer cliente, mesmo sem estar alocada nele em Papéis e
// Responsabilidades. Por isso, ao filtrar por pessoa em Gestão de Metas, essas metas usam
// ticketPertenceAPessoa (quem de fato assumiu o ticket) em vez de getPessoaClienteNomes (organograma).
const DEMANDA_BASED_SLUGS = ['entregas-prazo', 'csat-tech', 'csat-atendimento', 'csat-produto', 'dias-ticket-aberto', 'sla-primeira-resposta'];

// Filtro de classificação usado por cada meta de Demandas baseada em CSAT/prazo — null = sem restrição
// de classificação (dias-ticket-aberto e sla-primeira-resposta consideram qualquer ticket).
const DEMANDA_SLUG_MATCH_FN = {
  'entregas-prazo': c => c.startsWith('Desenvolvimento'),
  'csat-tech': c => c.startsWith('Desenvolvimento'),
  'csat-produto': c => c === 'Desenvolvimento Produto',
  'csat-atendimento': c => c.startsWith('Atendimento'),
};

// Um ticket "pertence" a uma pessoa quando ela é a responsável pelo atendimento no Movidesk
// (row.responsavel, comparado por conteúdo via normalizeClientName — mesma lógica usada em outras
// quebras por pessoa) OU quando ela foi alocada como Responsável Desenvolvimento naquele ticket
// (row.responsavelDesenvolvimentoId) — cobre o caso de um ticket de Atendimento que também precisou de
// um desenvolvedor alocado. Retorna false quando não há pessoa (chamador deve tratar null antes).
function ticketPertenceAPessoa(row, pessoa){
  if(!pessoa) return false;
  if(row.responsavelDesenvolvimentoId && row.responsavelDesenvolvimentoId === pessoa.id) return true;
  if(row.responsavel){
    const rn = normalizeClientName(row.responsavel);
    const pn = normalizeClientName(pessoa.nome);
    if(rn && pn && (rn === pn || rn.includes(pn) || pn.includes(rn))) return true;
  }
  return false;
}

// Conecta cada meta (pelo slug do indicador) ao "Realizado" já calculado nas telas de
// Acompanhamento de Metas, mês a mês, para alimentar o gráfico de Budget x Realizado.
// clienteNomesFilter (opcional): Set de nomes de clientes — quando presente, restringe o cálculo
// apenas aos clientes daquele conjunto, para as metas cujo número é apurado por cliente.
// pessoaId (opcional): id da pessoa filtrada em Gestão de Metas — para as metas de DEMANDA_BASED_SLUGS,
// tem prioridade sobre clienteNomesFilter (ver DEMANDA_BASED_SLUGS acima).
function getMetaRealizadoByMonth(slug, data, clienteNomesFilter, pessoaId){
  const clientesCols = (data.clientes || []).filter(c => c.nome.toLowerCase() !== 'interno' && (!clienteNomesFilter || clienteNomesFilter.has(c.nome)));
  const pessoaFiltro = (pessoaId && DEMANDA_BASED_SLUGS.includes(slug)) ? (data.pessoas || []).find(p => p.id === pessoaId) : null;

  if(slug === 'margem-bruta'){
    const pnlYear = (data.financeiro && data.financeiro.pnl && data.financeiro.pnl[CURRENT_YEAR]) || {};
    const out = {};
    MONTHS.forEach(m => {
      const d = pnlYear[m.n];
      out[m.n] = d ? (d.grossProfit / d.receitaTotal * 100) : null;
    });
    return out;
  }

  if(slug === 'ticket-medio'){
    // Mesma fonte de dados de "margem-bruta" (P&L do ano vigente) — Ticket Médio é uma meta própria
    // em Gestão de Metas, mas não tem tela/sincronização separada em Acompanhamento de Metas (o
    // detalhamento e o budget por cliente ficam na aba Margem Bruta). Soma a Receita Líquida SÓ dos
    // clientes considerados (todos, ou apenas os do responsável filtrado via clienteNomesFilter) e
    // divide pela quantidade desses clientes — em vez de sempre dividir pelo total da empresa por um
    // divisor fixo (TICKET_MEDIO_CLIENTES), que só é correto quando não há filtro de pessoa.
    const pnlYear = (data.financeiro && data.financeiro.pnl && data.financeiro.pnl[CURRENT_YEAR]) || {};
    const out = {};
    MONTHS.forEach(m => {
      const monthData = pnlYear[m.n];
      if(!monthData || !monthData.receitaPorCliente || !clientesCols.length){ out[m.n] = null; return; }
      const vals = clientesCols
        .map(c => monthData.receitaPorCliente[c.nome])
        .filter(v => v !== undefined && v !== null)
        .map(Number);
      out[m.n] = vals.length ? Math.round(vals.reduce((a,b)=>a+b,0) / vals.length) : null;
    });
    return out;
  }

  if(slug === 'upsell-score'){
    const yearData = (data.upsellScore && data.upsellScore[CURRENT_YEAR]) || {};
    const out = {};
    MONTHS.forEach(m => {
      out[m.n] = avgOf(clientesCols.map(c => computeUpsellScore((yearData[m.n]||{})[c.id])));
    });
    return out;
  }

  if(slug === 'contas-finalizadas'){
    const clientNames = ['Einstein SP','Einstein GO','Sírio SP','Sírio BSB','HCOR','HAOC','AC Camargo']
      .filter(c => !clienteNomesFilter || clienteNomesFilter.has(c));
    const yearData = (data.financeiro && data.financeiro.contasFinalizadas && data.financeiro.contasFinalizadas[CURRENT_YEAR]) || {};
    const out = {};
    MONTHS.forEach(m => {
      const has = clientNames.some(c => (yearData[c]||{})[m.n] !== undefined);
      out[m.n] = has ? clientNames.reduce((sum, c) => sum + (((yearData[c]||{})[m.n]) || 0), 0) : null;
    });
    return out;
  }

  if(slug === 'subfaturamento' || slug === 'contas-automatico'){
    const dataKey = slug === 'subfaturamento' ? 'subfaturamento' : 'contasAutomatico';
    const clientNames = ['Einstein SP','Einstein GO','Sírio SP','Sírio BSB','HCOR','HAOC','AC Camargo']
      .filter(c => !clienteNomesFilter || clienteNomesFilter.has(c));
    const yearData = (data.financeiro && data.financeiro[dataKey] && data.financeiro[dataKey][CURRENT_YEAR]) || {};
    // % Contas Automático agora guarda valores absolutos (quantidade de contas) — o totalizador deve
    // ser a SOMA entre clientes, não a média. Subfaturamento continua sendo percentual, então mantém a
    // média entre clientes.
    const isSoma = slug === 'contas-automatico';
    const out = {};
    MONTHS.forEach(m => {
      const vals = clientNames.map(c => (yearData[c]||{})[m.n]).filter(v => v !== undefined && v !== null && v !== '').map(Number);
      if(!vals.length){ out[m.n] = null; return; }
      const soma = vals.reduce((a,b)=>a+b,0);
      out[m.n] = isSoma ? soma : soma / vals.length;
    });
    return out;
  }

  if(slug === 'nps'){
    const yearData = (data.nps && data.nps[CURRENT_YEAR]) || {};
    const totalRow = yearData['_total'] || {};
    const out = {};
    MONTHS.forEach(m => {
      const v = totalRow[m.n];
      out[m.n] = (v === undefined || v === null || v === '') ? null : Number(v);
    });
    return out;
  }

  if(slug === 'penetracao-regras' || slug === 'efetividade-regras'){
    const dataKey = slug === 'penetracao-regras' ? 'penetracaoRegras' : 'efetividadeRegras';
    const yearData = (data[dataKey] && data[dataKey][CURRENT_YEAR]) || {};
    const out = {};
    MONTHS.forEach(m => {
      const vals = clientesCols
        .map(c => (yearData[c.id]||{})[m.n])
        .filter(v => v !== undefined && v !== null && v !== '')
        .map(Number);
      out[m.n] = vals.length ? vals.reduce((a,b)=>a+b,0) / vals.length : null;
    });
    return out;
  }

  if(slug === 'cobertura-dados'){
    const coberturaYear = (data.coberturaDados && data.coberturaDados[CURRENT_YEAR]) || {};
    const totalCampos = COBERTURA_BASES.length * COBERTURA_ITENS.length;
    const totalFields = totalCampos * clientesCols.length;
    const out = {};
    MONTHS.forEach(m => {
      const monthData = coberturaYear[m.n];
      if(!monthData || !totalFields){ out[m.n] = null; return; }
      let checked = 0;
      clientesCols.forEach(c => {
        COBERTURA_BASES.forEach(base => COBERTURA_ITENS.forEach(item => {
          const rowKey = coberturaRowKey(base.key, item);
          if(monthData[rowKey] && monthData[rowKey][c.id]) checked++;
        }));
      });
      out[m.n] = checked / totalFields * 100;
    });
    return out;
  }

  if(slug === 'entregas-prazo'){
    const merged = buildDemandasMerged(data.demandasCustom, data.demandasBase, data.demandasManuais);
    const base = merged.filter(m => m.classificacao && m.classificacao.startsWith('Desenvolvimento') && m.mesPlanning
      && (pessoaId ? ticketPertenceAPessoa(m, pessoaFiltro) : (!clienteNomesFilter || clienteNomesFilter.has(m.cliente))));
    const out = {};
    MONTHS.forEach(m => {
      const subset = base.filter(x => String(x.mesPlanning) === String(m.n));
      out[m.n] = subset.length ? (subset.filter(x => x.concluidaNoPrazo).length / subset.length * 100) : null;
    });
    return out;
  }

  if(slug === 'csat-tech' || slug === 'csat-atendimento' || slug === 'csat-produto'){
    // Agrupa pelo mês de CONCLUSÃO do ticket (mesConclusao), não pelo mês do Prazo (mesPlanning) — ajuste
    // pedido em 27/08/2026: ver comentário em CsatMatrixPage / no campo mesConclusao.
    const matchFn = DEMANDA_SLUG_MATCH_FN[slug];
    const merged = buildDemandasMerged(data.demandasCustom, data.demandasBase, data.demandasManuais);
    const scoped = merged.filter(m => m.classificacao && matchFn(m.classificacao) && m.mesConclusao
      && (pessoaId ? ticketPertenceAPessoa(m, pessoaFiltro) : (!clienteNomesFilter || clienteNomesFilter.has(m.cliente))));
    const out = {};
    MONTHS.forEach(m => {
      const subset = scoped.filter(x => String(x.mesConclusao) === String(m.n));
      out[m.n] = avgCsat(subset.map(x => x.csat));
    });
    return out;
  }

  if(slug === 'dias-ticket-aberto'){
    // Tickets com Prioridade "Despriorizado" ficam de fora dessa meta — normalmente estão em aberto há
    // muito tempo de propósito (fila de baixa prioridade), o que distorceria a média pra cima sem
    // refletir um problema real de atendimento.
    const merged = buildDemandasMerged(data.demandasCustom, data.demandasBase, data.demandasManuais)
      .filter(m => m.prioridade !== 'Despriorizado');
    const scoped = merged.filter(m => pessoaId ? ticketPertenceAPessoa(m, pessoaFiltro) : (!clienteNomesFilter || clienteNomesFilter.has(m.cliente)));
    const out = {};
    MONTHS.forEach(m => {
      const dias = scoped
        .map(x => diasAbertoNoFimDoMes(x.abertoEm, x.concluidoEm, x.statusEfetivo, CURRENT_YEAR, m.n))
        .filter(v => v !== null);
      out[m.n] = dias.length ? avgOf(dias) : null;
    });
    return out;
  }

  if(slug === 'sla-primeira-resposta'){
    const merged = buildDemandasMerged(data.demandasCustom, data.demandasBase, data.demandasManuais);
    const scoped = merged.filter(m => m.tempoPrimeiraResposta !== null
      && (pessoaId ? ticketPertenceAPessoa(m, pessoaFiltro) : (!clienteNomesFilter || clienteNomesFilter.has(m.cliente))));
    const out = {};
    MONTHS.forEach(m => {
      const subset = scoped.filter(x => mesAnoAbertura(x.abertoEm, m.n));
      out[m.n] = subset.length ? avgOf(subset.map(x => x.tempoPrimeiraResposta)) : null;
    });
    return out;
  }

  if(slug === 'tempo-processamento'){
    // Média entre as 3 categorias (Importação, Recálculo, LLM), mês a mês — "quanto menor, melhor" (ver
    // META_MENOR_MELHOR_SLUGS). Comparar Real vs Budget usa essa média já consolidada de cada lado, não
    // a média das razões individuais por categoria.
    const yearData = (data.financeiro && data.financeiro.tempoProcessamento && data.financeiro.tempoProcessamento[CURRENT_YEAR]) || {};
    const out = {};
    MONTHS.forEach(m => {
      const vals = TEMPO_PROCESSAMENTO_CATEGORIAS.map(cat => (yearData[cat]||{})[m.n]).filter(v => v !== undefined && v !== null && v !== '').map(Number);
      out[m.n] = vals.length ? vals.reduce((a,b)=>a+b,0) / vals.length : null;
    });
    return out;
  }

  if(slug === 'cobertura-produto'){
    // Valor de fechamento do mês, registrado manualmente na tabela "Fechamento mensal · Real" da aba
    // Cobertura Produto — diferente do valor calculado ao vivo (checks / (funções × clientes)) mostrado
    // no topo daquela tabela, que reflete o estado ATUAL da grade, não o snapshot de um mês fechado.
    const yearData = (data.produtoFuncoesRealizado && data.produtoFuncoesRealizado[CURRENT_YEAR] && data.produtoFuncoesRealizado[CURRENT_YEAR].cobertura) || {};
    const out = {};
    MONTHS.forEach(m => {
      const v = yearData[m.n];
      out[m.n] = (v === undefined || v === null || v === '') ? null : Number(v);
    });
    return out;
  }

  return null;
}

// Para as 3 metas cujo Budget agora é definido direto na tela do indicador (não em Gestão de Metas),
// retorna os valores mensais equivalentes ao goal.budgets. Para as demais, retorna null (usa goal.budgets normalmente).
function getMetaBudgetOverrideByMonth(slug, data, clienteNomesFilter){
  const clientesCols = (data.clientes || []).filter(c => c.nome.toLowerCase() !== 'interno' && (!clienteNomesFilter || clienteNomesFilter.has(c.nome)));

  if(slug === 'contas-finalizadas'){
    const clientNames = ['Einstein SP','Einstein GO','Sírio SP','Sírio BSB','HCOR','HAOC','AC Camargo']
      .filter(c => !clienteNomesFilter || clienteNomesFilter.has(c));
    const yearData = (data.financeiro && data.financeiro.contasFinalizadasBudget && data.financeiro.contasFinalizadasBudget[CURRENT_YEAR]) || {};
    const out = {};
    MONTHS.forEach(m => {
      const has = clientNames.some(c => (yearData[c]||{})[m.n] !== undefined && (yearData[c]||{})[m.n] !== null && (yearData[c]||{})[m.n] !== '');
      out[m.n] = has ? clientNames.reduce((sum, c) => sum + (Number((yearData[c]||{})[m.n]) || 0), 0) : null;
    });
    return out;
  }

  if(slug === 'penetracao-regras' || slug === 'efetividade-regras'){
    const dataKey = slug === 'penetracao-regras' ? 'penetracaoRegrasBudget' : 'efetividadeRegrasBudget';
    const yearData = (data[dataKey] && data[dataKey][CURRENT_YEAR]) || {};
    const out = {};
    MONTHS.forEach(m => {
      const vals = clientesCols
        .map(c => (yearData[c.id]||{})[m.n])
        .filter(v => v !== undefined && v !== null && v !== '')
        .map(Number);
      out[m.n] = vals.length ? vals.reduce((a,b)=>a+b,0) / vals.length : null;
    });
    return out;
  }

  if(slug === 'subfaturamento' || slug === 'contas-automatico'){
    const budgetKey = slug === 'subfaturamento' ? 'subfaturamentoBudget' : 'contasAutomaticoBudget';
    const clientNames = ['Einstein SP','Einstein GO','Sírio SP','Sírio BSB','HCOR','HAOC','AC Camargo']
      .filter(c => !clienteNomesFilter || clienteNomesFilter.has(c));
    const yearData = (data.financeiro && data.financeiro[budgetKey] && data.financeiro[budgetKey][CURRENT_YEAR]) || {};
    // Mesma lógica do Realizado acima: Budget de % Contas Automático também soma entre clientes (é uma
    // meta de quantidade absoluta), Budget de Subfaturamento continua sendo a média (percentual).
    const isSoma = slug === 'contas-automatico';
    const out = {};
    MONTHS.forEach(m => {
      const vals = clientNames.map(c => (yearData[c]||{})[m.n]).filter(v => v !== undefined && v !== null && v !== '').map(Number);
      if(!vals.length){ out[m.n] = null; return; }
      const soma = vals.reduce((a,b)=>a+b,0);
      out[m.n] = isSoma ? soma : soma / vals.length;
    });
    return out;
  }

  if(slug === 'ticket-medio'){
    // Budget de receita definido manualmente por cliente e mês (tela de Margem Bruta) — a meta de
    // Ticket Médio vira a MÉDIA desse budget entre os clientes considerados (todos, ou só os do
    // responsável filtrado), do mesmo jeito que o Realizado acima usa a receita real por cliente.
    const yearData = (data.financeiro && data.financeiro.ticketMedioReceitaBudget && data.financeiro.ticketMedioReceitaBudget[CURRENT_YEAR]) || {};
    const out = {};
    MONTHS.forEach(m => {
      const vals = clientesCols.map(c => (yearData[c.nome]||{})[m.n]).filter(v => v !== undefined && v !== null && v !== '').map(Number);
      out[m.n] = vals.length ? Math.round(vals.reduce((a,b)=>a+b,0) / vals.length) : null;
    });
    return out;
  }

  if(slug === 'tempo-processamento'){
    const yearData = (data.financeiro && data.financeiro.tempoProcessamentoBudget && data.financeiro.tempoProcessamentoBudget[CURRENT_YEAR]) || {};
    const out = {};
    MONTHS.forEach(m => {
      const vals = TEMPO_PROCESSAMENTO_CATEGORIAS.map(cat => (yearData[cat]||{})[m.n]).filter(v => v !== undefined && v !== null && v !== '').map(Number);
      out[m.n] = vals.length ? vals.reduce((a,b)=>a+b,0) / vals.length : null;
    });
    return out;
  }

  if(slug === 'cobertura-produto'){
    const yearData = (data.produtoFuncoesBudget && data.produtoFuncoesBudget[CURRENT_YEAR] && data.produtoFuncoesBudget[CURRENT_YEAR].cobertura) || {};
    const out = {};
    MONTHS.forEach(m => {
      const v = yearData[m.n];
      out[m.n] = (v === undefined || v === null || v === '') ? null : Number(v);
    });
    return out;
  }

  return null;
}

// Indicadores para os quais existe granularidade por cliente (Realizado, e às vezes Budget).
// Os demais (ex.: Margem Bruta, que é uma razão do P&L da empresa como um todo) não têm quebra por
// cliente e por isso não exibem a tabela Clientes x Meses. "ticket-medio" tem granularidade por
// cliente (Receita Líquida real por cliente, e o budget de receita definido por cliente na aba Margem
// Bruta) — é o que permite filtrar a meta por responsável (ex.: só os clientes do Henrique).
const META_GRANULAR_CLIENTE_SLUGS = [
  'upsell-score','contas-finalizadas','penetracao-regras','efetividade-regras',
  'cobertura-dados','entregas-prazo','csat-tech','csat-atendimento','csat-produto',
  'dias-ticket-aberto','nps','subfaturamento','contas-automatico','sla-primeira-resposta','ticket-medio',
];

// Realizado de um indicador, para um cliente e mês específicos. Retorna null se não aplicável.
function getMetaRealizadoPorClienteMes(slug, data, clienteId, clienteNome, mesN, pessoaId){
  const pessoaFiltro = (pessoaId && DEMANDA_BASED_SLUGS.includes(slug)) ? (data.pessoas || []).find(p => p.id === pessoaId) : null;
  if(slug === 'upsell-score'){
    const monthData = ((data.upsellScore||{})[CURRENT_YEAR]||{})[mesN] || {};
    return computeUpsellScore(monthData[clienteId]);
  }
  if(slug === 'contas-finalizadas'){
    const yearData = (data.financeiro && data.financeiro.contasFinalizadas && data.financeiro.contasFinalizadas[CURRENT_YEAR]) || {};
    const v = (yearData[clienteNome]||{})[mesN];
    return (v === undefined || v === null || v === '') ? null : Number(v);
  }
  if(slug === 'subfaturamento' || slug === 'contas-automatico'){
    const dataKey = slug === 'subfaturamento' ? 'subfaturamento' : 'contasAutomatico';
    const yearData = (data.financeiro && data.financeiro[dataKey] && data.financeiro[dataKey][CURRENT_YEAR]) || {};
    const v = (yearData[clienteNome]||{})[mesN];
    return (v === undefined || v === null || v === '') ? null : Number(v);
  }
  if(slug === 'penetracao-regras' || slug === 'efetividade-regras'){
    const dataKey = slug === 'penetracao-regras' ? 'penetracaoRegras' : 'efetividadeRegras';
    const yearData = (data[dataKey] && data[dataKey][CURRENT_YEAR]) || {};
    const v = (yearData[clienteId]||{})[mesN];
    return (v === undefined || v === null || v === '') ? null : Number(v);
  }
  if(slug === 'cobertura-dados'){
    const coberturaYear = (data.coberturaDados && data.coberturaDados[CURRENT_YEAR]) || {};
    const monthData = coberturaYear[mesN];
    const totalCampos = COBERTURA_BASES.length * COBERTURA_ITENS.length;
    if(!monthData || !totalCampos) return null;
    let checked = 0;
    COBERTURA_BASES.forEach(base => COBERTURA_ITENS.forEach(item => {
      const rowKey = coberturaRowKey(base.key, item);
      if(monthData[rowKey] && monthData[rowKey][clienteId]) checked++;
    }));
    return checked / totalCampos * 100;
  }
  if(slug === 'entregas-prazo'){
    const merged = buildDemandasMerged(data.demandasCustom, data.demandasBase, data.demandasManuais);
    const subset = merged.filter(x => x.classificacao && x.classificacao.startsWith('Desenvolvimento') && String(x.mesPlanning) === String(mesN) && x.cliente === clienteNome
      && (!pessoaId || ticketPertenceAPessoa(x, pessoaFiltro)));
    return subset.length ? (subset.filter(x => x.concluidaNoPrazo).length / subset.length * 100) : null;
  }
  if(slug === 'csat-tech' || slug === 'csat-atendimento' || slug === 'csat-produto'){
    // Agrupa pelo mês de CONCLUSÃO do ticket (mesConclusao), não pelo mês do Prazo (mesPlanning) — ajuste
    // pedido em 27/08/2026: ver comentário em CsatMatrixPage / no campo mesConclusao.
    const matchFn = DEMANDA_SLUG_MATCH_FN[slug];
    const merged = buildDemandasMerged(data.demandasCustom, data.demandasBase, data.demandasManuais);
    const subset = merged.filter(x => x.classificacao && matchFn(x.classificacao) && String(x.mesConclusao) === String(mesN) && x.cliente === clienteNome
      && (!pessoaId || ticketPertenceAPessoa(x, pessoaFiltro)));
    return avgCsat(subset.map(x => x.csat));
  }
  if(slug === 'dias-ticket-aberto'){
    const merged = buildDemandasMerged(data.demandasCustom, data.demandasBase, data.demandasManuais)
      .filter(m => m.prioridade !== 'Despriorizado');
    const subset = merged.filter(x => x.cliente === clienteNome && (!pessoaId || ticketPertenceAPessoa(x, pessoaFiltro)));
    const dias = subset
      .map(x => diasAbertoNoFimDoMes(x.abertoEm, x.concluidoEm, x.statusEfetivo, CURRENT_YEAR, mesN))
      .filter(v => v !== null);
    return dias.length ? avgOf(dias) : null;
  }
  if(slug === 'nps'){
    const yearData = (data.nps && data.nps[CURRENT_YEAR]) || {};
    const v = (yearData[clienteId]||{})[mesN];
    return (v === undefined || v === null || v === '') ? null : Number(v);
  }
  if(slug === 'sla-primeira-resposta'){
    const merged = buildDemandasMerged(data.demandasCustom, data.demandasBase, data.demandasManuais);
    const subset = merged.filter(x => x.cliente === clienteNome && x.tempoPrimeiraResposta !== null && mesAnoAbertura(x.abertoEm, mesN)
      && (!pessoaId || ticketPertenceAPessoa(x, pessoaFiltro)));
    return subset.length ? avgOf(subset.map(x => x.tempoPrimeiraResposta)) : null;
  }
  if(slug === 'ticket-medio'){
    const pnlYear = (data.financeiro && data.financeiro.pnl && data.financeiro.pnl[CURRENT_YEAR]) || {};
    const monthData = pnlYear[mesN];
    const v = monthData && monthData.receitaPorCliente ? monthData.receitaPorCliente[clienteNome] : undefined;
    return (v === undefined || v === null) ? null : Number(v);
  }
  return null;
}

// Budget de um indicador, por cliente e mês, apenas para os 3 indicadores cujo budget já é
// nativamente detalhado por cliente (definido na própria tela do indicador). Para os demais,
// retorna null — nesse caso a tabela usa o budget mensal único do indicador (mesmo valor em todas as linhas).
function getMetaBudgetPorClienteMes(slug, data, clienteId, clienteNome, mesN){
  if(slug === 'contas-finalizadas'){
    const yearData = (data.financeiro && data.financeiro.contasFinalizadasBudget && data.financeiro.contasFinalizadasBudget[CURRENT_YEAR]) || {};
    const v = (yearData[clienteNome]||{})[mesN];
    return (v === undefined || v === null || v === '') ? null : Number(v);
  }
  if(slug === 'subfaturamento' || slug === 'contas-automatico'){
    const budgetKey = slug === 'subfaturamento' ? 'subfaturamentoBudget' : 'contasAutomaticoBudget';
    const yearData = (data.financeiro && data.financeiro[budgetKey] && data.financeiro[budgetKey][CURRENT_YEAR]) || {};
    const v = (yearData[clienteNome]||{})[mesN];
    return (v === undefined || v === null || v === '') ? null : Number(v);
  }
  if(slug === 'penetracao-regras' || slug === 'efetividade-regras'){
    const dataKey = slug === 'penetracao-regras' ? 'penetracaoRegrasBudget' : 'efetividadeRegrasBudget';
    const yearData = (data[dataKey] && data[dataKey][CURRENT_YEAR]) || {};
    const v = (yearData[clienteId]||{})[mesN];
    return (v === undefined || v === null || v === '') ? null : Number(v);
  }
  if(slug === 'ticket-medio'){
    const yearData = (data.financeiro && data.financeiro.ticketMedioReceitaBudget && data.financeiro.ticketMedioReceitaBudget[CURRENT_YEAR]) || {};
    const v = (yearData[clienteNome]||{})[mesN];
    return (v === undefined || v === null || v === '') ? null : Number(v);
  }
  return null;
}

// Tabela Clientes (linhas) x Meses (colunas) com Real / Budget em cada célula, exibida embaixo
// do gráfico de cada meta em Gestão de Metas.
function GoalClienteMesTable({goal, data, clienteNomesFilter, pessoaId}){
  if(!goal.slug || !META_GRANULAR_CLIENTE_SLUGS.includes(goal.slug)) return null;
  const isDemandaBased = DEMANDA_BASED_SLUGS.includes(goal.slug);
  let clientesCols;
  if(isDemandaBased && pessoaId){
    // Para metas de Demandas, filtrar por pessoa não é "os clientes dela no organograma" (ela pode
    // ajudar em tickets de qualquer cliente) — as linhas mostradas são os clientes onde essa pessoa
    // efetivamente tem tickets que se aplicam a essa meta (ver ticketPertenceAPessoa).
    const pessoa = (data.pessoas || []).find(p => p.id === pessoaId);
    const merged = buildDemandasMerged(data.demandasCustom, data.demandasBase, data.demandasManuais);
    const matchFn = DEMANDA_SLUG_MATCH_FN[goal.slug];
    const relevantes = merged.filter(m => (!matchFn || (m.classificacao && matchFn(m.classificacao))) && ticketPertenceAPessoa(m, pessoa));
    const nomesComDados = new Set(relevantes.map(m => m.cliente).filter(Boolean));
    clientesCols = (data.clientes || []).filter(c => c.nome.toLowerCase() !== 'interno' && nomesComDados.has(c.nome));
  } else {
    clientesCols = (data.clientes || []).filter(c => c.nome.toLowerCase() !== 'interno' && (!clienteNomesFilter || clienteNomesFilter.has(c.nome)));
  }
  if(!clientesCols.length) return null;

  const isExterno = META_BUDGET_EXTERNO_SLUGS.includes(goal.slug);
  const flatBudgetByMonth = isExterno ? getMetaBudgetOverrideByMonth(goal.slug, data, clienteNomesFilter) : (goal.budgets[CURRENT_YEAR] || {});
  const budgetIsPerCliente = ['contas-finalizadas','penetracao-regras','efetividade-regras','subfaturamento','contas-automatico','ticket-medio'].includes(goal.slug);

  return (
    <div style={{marginTop:14}}>
      <div className="section-block-title" style={{fontSize:12.5, marginBottom:6}}>Clientes × Meses · Real / Budget</div>
      <div className="table-wrap">
        <table className="upsell-tbl">
          <thead>
            <tr><th>Cliente</th>{MONTHS.map(m => <th key={m.n}>{m.label}</th>)}</tr>
          </thead>
          <tbody>
            {clientesCols.map(c => (
              <tr key={c.id}>
                <td style={{textAlign:'left', paddingLeft:12, fontWeight:600}}>{c.nome}</td>
                {MONTHS.map(m => {
                  const real = getMetaRealizadoPorClienteMes(goal.slug, data, c.id, c.nome, m.n, pessoaId);
                  const budgetPerCliente = getMetaBudgetPorClienteMes(goal.slug, data, c.id, c.nome, m.n);
                  const budgetRaw = budgetPerCliente !== null ? budgetPerCliente : (flatBudgetByMonth ? flatBudgetByMonth[m.n] : undefined);
                  const hasReal = real !== null && real !== undefined;
                  const hasBudget = budgetRaw !== undefined && budgetRaw !== null && budgetRaw !== '';
                  if(!hasReal && !hasBudget) return <td key={m.n} style={{color:'#B7BACB'}}>—</td>;
                  return (
                    <td key={m.n} style={{fontFamily:'IBM Plex Mono, monospace', fontSize:11.5, lineHeight:1.55, padding:'6px 10px'}}>
                      <div>{hasReal ? fmtChartValue(real, goal.unidadeMedida) : '—'}</div>
                      <div style={{color:'var(--ink-soft)'}}>{hasBudget ? fmtChartValue(Number(budgetRaw), goal.unidadeMedida) : '—'}</div>
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="budget-note">
        Em cada célula: <strong style={{fontWeight:600, fontStyle:'normal'}}>Real</strong> em cima, <em>Budget</em> embaixo
        {!budgetIsPerCliente ? ' (budget mensal do indicador, o mesmo valor aplicado a cada cliente, pois este indicador não tem budget detalhado por cliente)' : ''}.
      </div>
    </div>
  );
}

function GoalModal({initial, pessoas, onSave, onClose}){
  const [titulo, setTitulo] = useState(initial ? initial.titulo : '');
  // Campo Descrição removido do modal (27/08/2026) — mesmo depois do fix de comparação por conteúdo em
  // persistFieldsMerge, editar a descrição de uma meta continuava revertendo (só esse campo, não os
  // demais), aparentemente por causa da migração de sincronização com INDICADORES em runMigrations que
  // ainda concorre com a edição em cenários não totalmente isolados. Pra não deixar essa tela quebrada
  // pro usuário, a descrição deixa de ser editável por aqui — o valor existente continua sendo exibido
  // no card da meta, só não é mais alterável nem enviado no payload de editGoal/addGoal.
  const [fonte, setFonte] = useState(initial ? initial.fonte : '');
  const [pessoaIds, setPessoaIds] = useState(initial ? initial.pessoaIds : []);
  const [unidadeMedida, setUnidadeMedida] = useState(initial ? initial.unidadeMedida : '%');
  const [budgets, setBudgets] = useState(initial ? (initial.budgets[CURRENT_YEAR] || {}) : {});

  const canSave = titulo.trim().length > 0;
  const setMonthVal = (n, v) => setBudgets(b => ({...b, [n]: v === '' ? '' : Number(v)}));
  const budgetIsExterno = !!(initial && initial.slug && META_BUDGET_EXTERNO_SLUGS.includes(initial.slug));

  return (
    <Modal title={initial ? 'Editar meta' : 'Adicionar meta'} onClose={onClose} width="620px" footer={
      <>
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" disabled={!canSave} style={!canSave?{opacity:0.5}:undefined}
          onClick={()=> canSave && onSave({
            titulo: titulo.trim(), fonte: fonte.trim(),
            pessoaIds, unidadeMedida,
            ...(initial && initial.slug ? {slug: initial.slug} : {}),
            budgets: {...(initial ? initial.budgets : {}), [CURRENT_YEAR]: budgets}
          })}>
          Salvar
        </button>
      </>
    }>
      <div className="field">
        <label>Título da Meta<span className="required-mark">*</span></label>
        <input className="input" value={titulo} onChange={e=>setTitulo(e.target.value)} autoFocus/>
      </div>
      <div className="field-row">
        <div className="field">
          <label>Fonte</label>
          <input className="input" value={fonte} onChange={e=>setFonte(e.target.value)} placeholder="Ex.: Movidesk, Input Manual..."/>
        </div>
        <div className="field">
          <label>Unidade de Medida</label>
          <select className="select" value={unidadeMedida} onChange={e=>setUnidadeMedida(e.target.value)}>
            <option value="%">%</option>
            <option value="Absoluto">Absoluto</option>
            <option value="R$">R$</option>
          </select>
        </div>
      </div>
      <div className="field">
        <label>Pessoas Associadas</label>
        <MultiSelect options={pessoas.map(p=>({id:p.id, label:p.nome}))} value={pessoaIds} onChange={setPessoaIds} placeholder="Selecionar pessoas..."/>
      </div>
      {budgetIsExterno ? (
        <div className="field">
          <label>Budget mensal · {CURRENT_YEAR}</label>
          <div className="hint">
            {initial && initial.slug === 'ticket-medio'
              ? 'Essa meta tem o budget definido por cliente na aba Margem Bruta (dentro de Acompanhamento de Metas) — não é mais editado por aqui.'
              : 'Essa meta tem o budget definido diretamente na tela do indicador, dentro de Acompanhamento de Metas — não é mais editado por aqui.'}
          </div>
        </div>
      ) : (
        <div className="field">
          <label>Budget mensal · {CURRENT_YEAR}</label>
          <div className="month-budget-grid">
            {MONTHS.map(m => (
              <div className="month-budget-cell" key={m.n}>
                <label>{m.label}</label>
                <input className="input" type="number" placeholder="0" value={budgets[m.n] ?? ''} onChange={e=>setMonthVal(m.n, e.target.value)}/>
              </div>
            ))}
          </div>
          <div className="hint">Valores armazenados individualmente por mês e por ano — prontos para anos futuros.</div>
        </div>
      )}
    </Modal>
  );
}

// Tabela-resumo no topo de Gestão de Metas: metas nas linhas, meses nas colunas,
// variação percentual Realizado vs. Budget = (Realizado / Budget - 1) x 100.
function GoalsSummaryTable({goals, data, clienteNomesFilter, pessoaId}){
  if(!goals.length) return null;
  return (
    <div className="card" style={{marginBottom:20}}>
      <div className="section-block-head" style={{padding:'18px 22px 0'}}>
        <div>
          <div className="section-block-title">Realizado vs. Budget · % por mês</div>
          <div className="section-block-desc">(Realizado / Budget - 1) × 100, mês a mês, para cada meta. Ex.: budget 100 e realizado 50 mostra -50%.</div>
        </div>
      </div>
      <div className="table-wrap">
        <table className="upsell-tbl">
          <thead>
            <tr><th style={{textAlign:'left'}}>Área</th><th style={{textAlign:'left'}}>Meta</th>{MONTHS.map(m => <th key={m.n}>{m.label}</th>)}</tr>
          </thead>
          <tbody>
            {goals.map(g => {
              const isExterno = g.slug && META_BUDGET_EXTERNO_SLUGS.includes(g.slug);
              const menorMelhor = g.slug && META_MENOR_MELHOR_SLUGS.includes(g.slug);
              const budgetByMonth = isExterno ? getMetaBudgetOverrideByMonth(g.slug, data, clienteNomesFilter) : (g.budgets[CURRENT_YEAR] || {});
              const realizadoByMonth = g.slug ? getMetaRealizadoByMonth(g.slug, data, clienteNomesFilter, pessoaId) : null;
              return (
                <tr key={g.id}>
                  <td style={{textAlign:'left', paddingLeft:12, color:'var(--ink-soft)', whiteSpace:'nowrap'}}>{metaArea(g)}</td>
                  <td style={{textAlign:'left', paddingLeft:12, fontWeight:600, whiteSpace:'nowrap'}}>{g.titulo}</td>
                  {MONTHS.map(m => {
                    const rawBudget = budgetByMonth ? budgetByMonth[m.n] : undefined;
                    const hasBudget = rawBudget !== undefined && rawBudget !== null && rawBudget !== '' && Number(rawBudget) !== 0;
                    const rawRealizado = realizadoByMonth ? realizadoByMonth[m.n] : null;
                    const hasRealizado = rawRealizado !== undefined && rawRealizado !== null;
                    if(!hasBudget || !hasRealizado){
                      return <td key={m.n} style={{color:'#B7BACB'}}>—</td>;
                    }
                    const pct = (Number(rawRealizado) / Number(rawBudget) - 1) * 100;
                    // Para metas "quanto menor, melhor" (ex.: dias em aberto, SLA 1ª resposta), realizado
                    // abaixo do budget (pct negativo) é o resultado bom — por isso a cor é invertida em
                    // relação às demais metas, onde pct positivo (acima do budget) é que é bom.
                    const isGood = menorMelhor ? pct <= 0 : pct >= 0;
                    const color = isGood ? 'var(--positive)' : 'var(--negative)';
                    return (
                      <td key={m.n} style={{fontWeight:600, color, fontFamily:'IBM Plex Mono, monospace'}}>
                        {pct >= 0 ? '+' : ''}{pct.toLocaleString('pt-BR', {maximumFractionDigits:0})}%
                      </td>
                    );
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

                    return (
                      <td key={m.n} style={has ? {fontFamily:'IBM Plex Mono, monospace'} : {color:'#B7BACB'}}>
                        {has ? fmtChartValue(raw, g.unidadeMedida) : '—'}
                      </td>
                    );
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// Tabela-resumo com o valor de Budget de cada meta, mês a mês (mesmo formato de GoalsSummaryTable,
// sem o cálculo de variação percentual).
function GoalsBudgetTable({goals, data, clienteNomesFilter}){
  if(!goals.length) return null;
  return (
    <div className="card" style={{marginBottom:20}}>
      <div className="section-block-head" style={{padding:'18px 22px 0'}}>
        <div>
          <div className="section-block-title">Budget · por mês</div>
          <div className="section-block-desc">Valor de budget de cada meta, mês a mês.</div>
        </div>
      </div>
      <div className="table-wrap">
        <table className="upsell-tbl">
          <thead>
            <tr><th style={{textAlign:'left'}}>Área</th><th style={{textAlign:'left'}}>Meta</th>{MONTHS.map(m => <th key={m.n}>{m.label}</th>)}</tr>
          </thead>
          <tbody>
            {goals.map(g => {
              const isExterno = g.slug && META_BUDGET_EXTERNO_SLUGS.includes(g.slug);
              const budgetByMonth = isExterno ? getMetaBudgetOverrideByMonth(g.slug, data, clienteNomesFilter) : (g.budgets[CURRENT_YEAR] || {});
              return (
                <tr key={g.id}>
                  <td style={{textAlign:'left', paddingLeft:12, color:'var(--ink-soft)', whiteSpace:'nowrap'}}>{metaArea(g)}</td>
                  <td style={{textAlign:'left', paddingLeft:12, fontWeight:600, whiteSpace:'nowrap'}}>{g.titulo}</td>
                  {MONTHS.map(m => {
                    const raw = budgetByMonth ? budgetByMonth[m.n] : undefined;
                    const has = raw !== undefined && raw !== null && raw !== '';
                    return (
                      <td key={m.n} style={has ? {fontFamily:'IBM Plex Mono, monospace'} : {color:'#B7BACB'}}>
                        {has ? fmtChartValue(Number(raw), g.unidadeMedida) : '—'}
                      </td>
                    );
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// Bloco completo de uma meta (antigo GoalCard + GoalDetail combinados), exibido diretamente
// na listagem de Gestão de Metas — sem precisar clicar para ver o gráfico e os detalhes.
function GoalFullCard({goal, pessoas, data, clienteNomesFilter, pessoaId, onEdit, onDelete}){
  const pessoaById = Object.fromEntries(pessoas.map(p=>[p.id,p]));
  const isExterno = goal.slug && META_BUDGET_EXTERNO_SLUGS.includes(goal.slug);
  const year = isExterno ? getMetaBudgetOverrideByMonth(goal.slug, data, clienteNomesFilter) : (goal.budgets[CURRENT_YEAR] || {});
  const assoc = (goal.pessoaIds||[]).map(id => pessoaById[id]).filter(Boolean);
  const realizedByMonth = goal.slug ? getMetaRealizadoByMonth(goal.slug, data, clienteNomesFilter, pessoaId) : null;

  return (
    <div style={{borderBottom:'1px solid var(--line)', paddingBottom:24, marginBottom:24}}>
      <div className="detail-header">
        <div>
          <div className="topbar-eyebrow">{goal.unidadeMedida}</div>
          <div className="placeholder-title" style={{fontSize:20}}>{goal.titulo}</div>
        </div>
        <div className="row-actions">
          <button className="btn btn-ghost btn-sm" onClick={onEdit}><IconEdit width="13" height="13"/>Editar</button>
          <button className="btn btn-danger btn-sm" onClick={onDelete}><IconTrash width="13" height="13"/>Excluir</button>
        </div>
      </div>

      <div className="card">
        <div className="detail-grid">
          <div className="detail-grid-chart">
            <BudgetChart budgetsByMonth={year} realizedByMonth={realizedByMonth} unidade={goal.unidadeMedida}/>
            {isExterno && <div className="budget-note">Budget definido na tela do indicador, dentro de Acompanhamento de Metas.</div>}
          </div>

          <div className="detail-grid-side">
            <div className="section-block-title" style={{marginBottom:6}}>Detalhes</div>
            <div className="kv-row"><span className="kv-label">Descrição</span><span className="kv-value">{goal.descricao || '—'}</span></div>
            <div className="kv-row"><span className="kv-label">Fonte</span><span className="kv-value" style={{wordBreak:'break-all'}}>
              {goal.fonte ? (isUrlLike(goal.fonte) ? <a href={goal.fonte} target="_blank" rel="noopener noreferrer">{goal.fonte}</a> : goal.fonte) : '—'}
            </span></div>
            <div className="kv-row"><span className="kv-label">Unidade de medida</span><span className="kv-value">{goal.unidadeMedida}</span></div>
            <div className="kv-row"><span className="kv-label">Pessoas responsáveis</span>
              <span className="kv-value">
                {assoc.length === 0 ? '—' : (
                  <div className="chip-row" style={{justifyContent:'flex-end'}}>
                    {assoc.map(p => <span className="tag" key={p.id}>{p.nome}</span>)}
                  </div>
                )}
              </span>
            </div>
          </div>
        </div>

        {/* Tabela Clientes x Meses usa a largura TOTAL do card (não fica presa à coluna do gráfico) —
            evita precisar de scroll horizontal pra ver os 12 meses, já que ela tem muito mais colunas
            do que cabem na coluna de 1.3fr do grid acima. Só existe pra metas com detalhamento por
            cliente (ver META_GRANULAR_CLIENTE_SLUGS) — o wrapper só aparece nesse caso, senão sobraria
            uma faixa vazia com a linha divisória em toda meta sem essa tabela. */}
        {goal.slug && META_GRANULAR_CLIENTE_SLUGS.includes(goal.slug) && (
          <div className="detail-grid-table-full">
            <GoalClienteMesTable goal={goal} data={data} clienteNomesFilter={clienteNomesFilter} pessoaId={pessoaId}/>
          </div>
        )}
      </div>
    </div>
  );
}

function GoalsPage({data, actions}){
  const [modal, setModal] = useState(null); // null | 'new' | goal
  const [confirmDel, setConfirmDel] = useState(null);
  const [fPessoa, setFPessoa] = useState('');

  const clienteNomesFilter = useMemo(() => getPessoaClienteNomes(fPessoa, data), [fPessoa, data]);

  const visibleGoals = useMemo(() => {
    const base = !fPessoa ? data.metas : data.metas.filter(g => (g.pessoaIds||[]).includes(fPessoa));
    return ordenarMetasGestao(base);
  }, [data.metas, fPessoa]);

  return (
    <div>
      <div className="section-block-head">
        <div>
          <div className="section-block-title">Gestão de Metas</div>
          <div className="section-block-desc">Cadastro, budget e realizado de todas as metas do time.</div>
        </div>
        <button className="btn btn-primary" onClick={()=>setModal('new')}><IconPlus width="14" height="14"/>Adicionar Meta</button>
      </div>

      <div className="goals-mission-banner">
        Estabelecer a unidade de negócio como uma frente sustentável, entregando valor consistente e se
        tornando referência de confiança para os hospitais clientes
      </div>

      <div className="filters-bar" style={{marginBottom:18}}>
        <select className="filter-select" value={fPessoa} onChange={e=>setFPessoa(e.target.value)}>
          <option value="">Todas as pessoas</option>
          {data.pessoas.map(p => <option value={p.id} key={p.id}>{p.nome}</option>)}
        </select>
        {fPessoa && <button className="btn btn-ghost btn-sm" onClick={()=>setFPessoa('')}>Limpar filtro</button>}
        {fPessoa && (
          <div className="hint" style={{margin:0}}>
            Metas com número por cliente consideram apenas os clientes atendidos por essa pessoa em Papéis e Responsabilidades.
            Já as metas calculadas via Demandas (% Entregas Prazo, CSAT, Média dias ticket em aberto, SLA 1ª Resposta) consideram
            todos os tickets que essa pessoa assumiu, mesmo em clientes fora do organograma dela.
          </div>
        )}
      </div>

      {data.metas.length === 0 ? (
        <div className="card"><EmptyState icon={IconTarget} title="Nenhuma meta cadastrada"
          sub="Cadastre metas para acompanhar budget e realizado de cada indicador."
          action={<button className="btn btn-primary btn-sm" onClick={()=>setModal('new')}><IconPlus width="14" height="14"/>Adicionar Meta</button>}/>
        </div>
      ) : visibleGoals.length === 0 ? (
        <div className="card"><EmptyState icon={IconTarget} title="Nenhuma meta encontrada"
          sub="Essa pessoa não está associada a nenhuma meta cadastrada."/>
        </div>
      ) : (
        <>
          <GoalsSummaryTable goals={visibleGoals} data={data} clienteNomesFilter={clienteNomesFilter} pessoaId={fPessoa}/>
          <GoalsRealizadoTable goals={visibleGoals} data={data} clienteNomesFilter={clienteNomesFilter} pessoaId={fPessoa}/>
          <GoalsBudgetTable goals={visibleGoals} data={data} clienteNomesFilter={clienteNomesFilter}/>
          <div>
            {visibleGoals.map(g => (
              <GoalFullCard key={g.id} goal={g} pessoas={data.pessoas} data={data} clienteNomesFilter={clienteNomesFilter} pessoaId={fPessoa}
                onEdit={()=>setModal(g)} onDelete={()=>setConfirmDel(g)}/>
            ))}
          </div>
        </>
      )}

      {modal && (
        <GoalModal initial={modal==='new'?null:modal} pessoas={data.pessoas} onClose={()=>setModal(null)}
          onSave={(vals)=>{ modal==='new' ? actions.addGoal(vals) : actions.editGoal(modal.id, vals); setModal(null); }} />
      )}
      <ConfirmDialog open={!!confirmDel} title="Excluir meta"
        text={confirmDel ? 'Tem certeza que deseja excluir "' + confirmDel.titulo + '"? Essa ação não pode ser desfeita.' : ''}
        onCancel={()=>setConfirmDel(null)}
        onConfirm={()=>{ actions.deleteGoal(confirmDel.id); setConfirmDel(null); }} />
    </div>
  );
}

/* ---------------------------------------------------------------
   ROTINAS — Agenda semanal
--------------------------------------------------------------- */
function RotinaModal({initial, prefill, pessoas, clientes, onSave, onClose, onDelete}){
  const base = initial || prefill || {};
  const [titulo, setTitulo] = useState(base.titulo || '');
  const [dia, setDia] = useState(base.dia || DIAS_SEMANA[0]);
  const [horario, setHorario] = useState(base.horario || TIME_SLOTS[0]);
  const [clienteId, setClienteId] = useState(base.clienteId || (clientes[0] && clientes[0].id) || '');
  const [participanteIds, setParticipanteIds] = useState(base.participanteIds || []);
  const canSave = titulo.trim().length > 0 && clienteId;

  return (
    <Modal title={initial ? 'Editar reunião' : 'Adicionar reunião'} onClose={onClose} footer={
      <>
        {initial && <button className="btn btn-danger" style={{marginRight:'auto'}} onClick={onDelete}><IconTrash width="13" height="13"/>Excluir</button>}
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" disabled={!canSave} style={!canSave?{opacity:0.5}:undefined}
          onClick={()=> canSave && onSave({titulo: titulo.trim(), dia, horario, clienteId, participanteIds})}>
          Salvar
        </button>
      </>
    }>
      <div className="field">
        <label>Título<span className="required-mark">*</span></label>
        <input className="input" value={titulo} onChange={e=>setTitulo(e.target.value)} placeholder="Ex.: Reunião Atendimento" autoFocus/>
      </div>
      <div className="field-row">
        <div className="field">
          <label>Dia da semana</label>
          <select className="select" value={dia} onChange={e=>setDia(e.target.value)}>
            {DIAS_SEMANA.map(d => <option value={d} key={d}>{d}</option>)}
          </select>
        </div>
        <div className="field">
          <label>Horário</label>
          <select className="select" value={horario} onChange={e=>setHorario(e.target.value)}>
            {TIME_SLOTS.map(t => <option value={t} key={t}>{t}</option>)}
          </select>
        </div>
      </div>
      <div className="field">
        <label>Cliente</label>
        <select className="select" value={clienteId} onChange={e=>setClienteId(e.target.value)}>
          {clientes.map(c => <option value={c.id} key={c.id}>{c.nome}</option>)}
        </select>
      </div>
      <div className="field">
        <label>Participantes</label>
        <MultiSelect options={pessoas.map(p=>({id:p.id, label:p.nome}))} value={participanteIds} onChange={setParticipanteIds} placeholder="Selecionar participantes..."/>
      </div>
    </Modal>
  );
}

function HoursSummary({rotinas, pessoas}){
  const rows = useMemo(() => {
    return pessoas.map(p => {
      const count = rotinas.filter(r => (r.participanteIds||[]).includes(p.id)).length;
      return {pessoa: p, count, horas: count * 0.5};
    }).filter(r => r.count > 0).sort((a,b) => b.horas - a.horas);
  }, [rotinas, pessoas]);

  return (
    <div className="card card-pad">
      <div className="section-block-title" style={{marginBottom:4}}>Horas em reunião</div>
      <div className="section-block-desc" style={{marginBottom:14}}>Estimativa com base na quantidade de reuniões associadas a cada pessoa (30 min por reunião).</div>
      {rows.length === 0 ? (
        <EmptyState icon={IconClock} title="Nenhum participante associado"
          sub="Associe pessoas às reuniões para ver a consolidação de horas por participante."/>
      ) : (
        <div className="hours-summary-grid">
          {rows.map(r => (
            <div className="hours-summary-item" key={r.pessoa.id}>
              <div className="orgchart-avatar" style={{background: colorForArea(r.pessoa.area), width:28, height:28, fontSize:11}}>{initials(r.pessoa.nome)}</div>
              <div style={{minWidth:0}}>
                <div className="hours-summary-name">{r.pessoa.nome}</div>
                <div className="hours-summary-meta">{r.count} {r.count===1 ? 'reunião' : 'reuniões'}</div>
              </div>
              <div className="hours-summary-value">{fmtNumber(r.horas)}h</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function RotinasPage({data, actions}){
  const [expandedDay, setExpandedDay] = useState(null);
  const [modal, setModal] = useState(null); // null | 'new' | {edit: rotina} | {prefill:{...}}
  const [confirmDel, setConfirmDel] = useState(null);

  const columns = useMemo(() => {
    const interno = data.clientes.filter(c => c.nome.toLowerCase() === 'interno');
    const rest = data.clientes.filter(c => c.nome.toLowerCase() !== 'interno');
    return [...interno, ...rest];
  }, [data.clientes]);

  const meetingsFor = (dia, clienteId, horario) => data.rotinas.filter(r =>
    r.dia === dia && r.clienteId === clienteId && (horario === undefined || r.horario === horario)
  );

  return (
    <div>
      <div className="section-block-head">
        <div>
          <div className="section-block-title">Rotinas</div>
          <div className="section-block-desc">Agenda semanal do time, por cliente. Clique no dia para ver o detalhamento por horário.</div>
        </div>
        <button className="btn btn-primary" onClick={()=>setModal('new')}><IconPlus width="14" height="14"/>Adicionar reunião</button>
      </div>

      <div className="card">
        <div className="rotinas-table-wrap">
          <table className="rotinas-tbl">
            <thead>
              <tr>
                <th></th>
                {columns.map(c => <th key={c.id} className={c.nome.toLowerCase()==='interno' ? 'internal-col' : undefined}>{c.nome}</th>)}
              </tr>
            </thead>
            <tbody>
              {DIAS_SEMANA.map(dia => {
                const isOpen = expandedDay === dia;
                return (
                  <React.Fragment key={dia}>
                    <tr>
                      <td className="dia-cell" onClick={()=>setExpandedDay(isOpen ? null : dia)}>
                        <div className="dia-cell-inner">
                          <IconChevron className={"nav-caret"+(isOpen?' open':'')} width="13" height="13"/>
                          {dia}
                        </div>
                      </td>
                      {columns.map(col => {
                        const meetings = meetingsFor(dia, col.id);
                        return (
                          <td key={col.id}>
                            {meetings.length === 0 ? (
                              <span className="empty-cell-hint">—</span>
                            ) : meetings.map(m => (
                              <div className={"meeting-pill" + (col.nome.toLowerCase()==='interno' ? ' internal' : '')} key={m.id} onClick={()=>setModal({edit:m})}>
                                <span className="meeting-time">{m.horario}</span>{m.titulo}
                              </div>
                            ))}
                          </td>
                        );
                      })}
                    </tr>
                    {isOpen && (
                      <tr className="drilldown-row">
                        <td colSpan={columns.length + 1}>
                          <div className="drilldown-wrap">
                            <table className="drilldown-tbl">
                              <thead>
                                <tr>
                                  <th></th>
                                  {columns.map(c => <th key={c.id} className={c.nome.toLowerCase()==='interno' ? 'internal-col' : undefined}>{c.nome}</th>)}
                                </tr>
                              </thead>
                              <tbody>
                                {TIME_SLOTS.map(slot => (
                                  <tr key={slot}>
                                    <td className="drilldown-time-cell">{slot}</td>
                                    {columns.map(col => {
                                      const meetings = meetingsFor(dia, col.id, slot);
                                      return (
                                        <td key={col.id} className={meetings.length===0 ? 'slot-cell' : undefined}
                                          onClick={() => { if(meetings.length===0) setModal({prefill:{dia, horario:slot, clienteId:col.id}}); }}>
                                          {meetings.length === 0 ? (
                                            <span className="slot-add-btn"><IconPlus width="12" height="12"/></span>
                                          ) : meetings.map(m => (
                                            <div className={"meeting-pill-sm" + (col.nome.toLowerCase()==='interno' ? ' internal' : '')} key={m.id}
                                              onClick={(e)=>{ e.stopPropagation(); setModal({edit:m}); }}>
                                              {m.titulo}
                                            </div>
                                          ))}
                                        </td>
                                      );
                                    })}
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      <div style={{height:22}}></div>
      <HoursSummary rotinas={data.rotinas} pessoas={data.pessoas}/>

      {modal && (
        <RotinaModal
          initial={modal.edit || null}
          prefill={modal.prefill || null}
          pessoas={data.pessoas}
          clientes={columns}
          onClose={()=>setModal(null)}
          onDelete={()=>{ setConfirmDel(modal.edit); setModal(null); }}
          onSave={(vals)=>{
            if(modal.edit) actions.editRotina(modal.edit.id, vals);
            else actions.addRotina(vals);
            setModal(null);
          }}
        />
      )}
      <ConfirmDialog open={!!confirmDel} title="Excluir reunião"
        text={confirmDel ? 'Tem certeza que deseja excluir "' + confirmDel.titulo + '"?' : ''}
        onCancel={()=>setConfirmDel(null)} onConfirm={()=>{ actions.deleteRotina(confirmDel.id); setConfirmDel(null); }} />
    </div>
  );
}
