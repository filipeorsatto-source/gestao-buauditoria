--------------------------------------------------------------- */
const SECTION_META = {
  overview: {title:'Organograma', eyebrow:'Visão geral do time'},
  roles: {title:'Papéis e Responsabilidades', eyebrow:'Organização de funções'},
  goals: {title:'Gestão de Metas', eyebrow:'Metas & budget'},
  tracking: {title:'Acompanhamento de Metas', eyebrow:'Realizado vs. budget'},
  rotinas: {title:'Rotinas', eyebrow:'Agenda semanal do time'},
  demandas: {title:'Demandas', eyebrow:'Tickets Movidesk por cliente'},
};

const ALLOWED_EMAIL_DOMAIN = '@rivio.com.br';

// Trava GLOBAL (não presa a um único useEffect/inscrição) contra a auto-escrita de correção de
// migração disparar mais de uma vez na vida desta aba. Ver comentário detalhado onde é usada, dentro
// de App() — o essencial é: mesmo que o efeito de sincronização com o Firestore seja recriado por
// qualquer motivo (troca de usuário logado, etc.), essa trava não reseta, então a auto-correção nunca
// dispara uma segunda vez nesta aba.
let migratedOnceGlobal = false;

function App(){
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [route, setRoute] = useState({section:'overview'});
  const [authUser, setAuthUser] = useState(undefined); // undefined = resolvendo, null = deslogado, obj = logado
  const [authError, setAuthError] = useState(null);
  const [signingIn, setSigningIn] = useState(false);
  const {toasts, push} = useToasts();

  // Autenticação (Google, restrito ao domínio da empresa)
  useEffect(() => {
    let unsub = () => {};
    waitForFirebase().then(fb => {
      unsub = fb.onAuthStateChanged(fb.auth, user => {
        if(user && !(user.email || '').toLowerCase().endsWith(ALLOWED_EMAIL_DOMAIN)){
          setAuthError(`Acesso restrito a e-mails ${ALLOWED_EMAIL_DOMAIN}.`);
          fb.signOut(fb.auth);
          setAuthUser(null);
          return;
        }
        setAuthUser(user);
      });
    });
    return () => unsub();
  }, []);

  const handleSignIn = useCallback(async () => {
    setSigningIn(true);
    setAuthError(null);
    try{
      const fb = await waitForFirebase();
      const provider = new fb.GoogleAuthProvider();
      provider.setCustomParameters({ hd: ALLOWED_EMAIL_DOMAIN.replace('@','') });
      await fb.signInWithPopup(fb.auth, provider);
    }catch(e){
      console.error('Sign-in error', e);
      setAuthError('Não foi possível entrar com Google. Tente novamente.');
    }finally{
      setSigningIn(false);
    }
  }, []);

  const handleSignOut = useCallback(async () => {
    const fb = await waitForFirebase();
    fb.signOut(fb.auth);
  }, []);

  // Sincronização em tempo real com o Firestore (somente após login válido)
  useEffect(() => {
    if(!authUser) return;
    let unsub = () => {};
    let cancelled = false;
    // Só tenta persistir uma correção de migração UMA VEZ NESTA ABA (trava global, ver
    // migratedOnceGlobal acima — não reseta nem se este efeito for recriado). Antes disso não existia
    // trava nenhuma: se alguma migração (ex.: a que sincroniza título/descrição de cada meta com a
    // definição atual de INDICADORES) nunca convergisse — por exemplo porque o texto persistido antigo
    // nunca bate 100% com o texto atual, depois de reescrever a descrição de uma meta em uma rodada
    // posterior — "changed" ficava true para SEMPRE, disparando persistPatch(migrated) a CADA snapshot
    // recebido (inclusive o snapshot gerado pelo eco da própria escrita). Isso criava um loop de escrita
    // automática que corria contra as edições reais do usuário: bastava a escrita da migração (calculada
    // a partir de um snapshot um instante mais antigo, sem a edição do usuário) ser ENVIADA depois da
    // escrita da edição do usuário para o servidor aplicar por último e reverter o responsável recém
    // associado — exatamente o padrão relatado (nome aparece e some, repetidamente).
    (async () => {
      await ensureFirestoreSeeded();
      if(cancelled) return;
      // Semeadura seura do catálogo de Cobertura Produto — à parte do bundle genérico de migração
      // abaixo, de propósito (ver ensureProdutoFuncoesSeededOnce e o comentário em runMigrations sobre
      // o achado ao vivo de 29/08/2026: excluir/editar uma função do catálogo padrão "voltava sozinha").
      ensureProdutoFuncoesSeededOnce();
      const fb = await waitForFirebase();
      const ref = await getAppDataDocRef();
      unsub = fb.onSnapshot(ref, snap => {
        if(!snap.exists()) return;
        const raw = snap.data();
        const {data: migrated, changed} = runMigrations(raw);
        setData(migrated);
        setLoading(false);
        if(changed && !migratedOnceGlobal){
          migratedOnceGlobal = true;
          // Escreve só as chaves de topo que a migração de fato alterou (mesma lógica de diff do
          // mutate()) — nunca o objeto inteiro — para não arriscar sobrescrever, com dados potencialmente
          // desatualizados, campos que o usuário possa estar editando ao mesmo tempo em outra parte do app.
          // produtoFuncoes/produtoFuncoesSeeded ficam de FORA de propósito — sua persistência é feita à
          // parte por ensureProdutoFuncoesSeededOnce, com leitura fresca do servidor no momento exato da
          // escrita (ver comentário acima); incluir esses 2 campos aqui reintroduziria a escrita CEGA
          // (baseada num snapshot que pode já estar desatualizado) que causava o bug de excluir/editar
          // uma função do catálogo padrão e ela "voltar sozinha".
          const patch = {};
          Object.keys(migrated).forEach(k => {
            if(k === 'produtoFuncoes' || k === 'produtoFuncoesSeeded') return;
            if(migrated[k] !== raw[k]) patch[k] = migrated[k];
          });
          if(Object.keys(patch).length) persistPatch(patch);
        }
      }, err => {
        console.error('Firestore sync error', err);
        push('Erro de sincronização com a base compartilhada.', 'error');
      });
    })();
    return () => { cancelled = true; unsub(); };
  }, [authUser, push]);

  const mutate = useCallback((updater, successMsg) => {
    setData(prev => {
      const next = updater(prev);
      const patch = {};
      Object.keys(next).forEach(k => { if(next[k] !== prev[k]) patch[k] = next[k]; });
      if(Object.keys(patch).length){
        persistPatch(patch).then(ok => {
          if(!ok) push('Não foi possível salvar. Tente novamente.', 'error');
          else if(successMsg) push(successMsg);
        });
      }
      return next;
    });
  }, [push]);

  // Como `mutate`, mas para escritas em lote que tocam MUITOS tickets de demandasCustom de uma vez (ex.:
  // sincronização de CSAT, que pode atualizar dezenas de tickets numa única ação). `mutate` grava o campo
  // demandasCustom INTEIRO via updateDoc — o Firestore substitui o valor do campo por completo, não faz
  // merge do conteúdo do mapa. Numa ferramenta com múltiplos usuários/abas simultâneas, se outro usuário
  // editar um ticket diferente (ex.: mudar a Prioridade do ticket X) entre o momento em que esta aba leu
  // o estado local e o momento em que grava, essa escrita em lote sobrescreveria demandasCustom inteiro
  // com a versão local (mais antiga) e o outro usuário perderia a edição — mesmo sem nenhum conflito real
  // no MESMO ticket. Aqui a atualização local do React continua otimista e imediata (via `updater`, igual
  // a `mutate`), mas a gravação no Firestore é feita por `persistDemandasCustomMerge`, que roda dentro de
  // uma transação: lê o demandasCustom mais recente do SERVIDOR no momento da escrita (não o estado local
  // desta aba, que pode estar desatualizado) e aplica `mergeFn` em cima dele — elimina o risco de "perda
  // de atualização" em lote.
  // Retorna a PROMISE da gravação (diferente de `mutate`, que é "fire and forget") — quem chama pode
  // esperar o resultado real e mostrar o erro de forma persistente na tela, em vez de depender só do
  // toast genérico (que pode passar despercebido, especialmente quando a mesma ação já mostra outro
  // aviso na tela — ver handleSyncCsat).
  const mutateDemandasCustomGranular = useCallback((updater, mergeFn, extraTopLevelKeys, successMsg) => {
    let resultPromise;
    setData(prev => {
      const next = updater(prev);
      const extraTopLevelPatch = {};
      (extraTopLevelKeys || []).forEach(k => { extraTopLevelPatch[k] = next[k]; });
      resultPromise = persistDemandasCustomMerge(mergeFn, extraTopLevelPatch).then(result => {
        if(!result.ok) push('Não foi possível salvar. Tente novamente.', 'error');
        else if(successMsg) push(successMsg);
        return result;
      });
      return next;
    });
    return resultPromise;
  }, [push]);

  // Versão genérica de mutateDemandasCustomGranular pra qualquer campo de topo (ver
  // persistTopLevelFieldMerge acima) — usada por editGoal/addGoal/deleteGoal pra proteger `metas` do
  // mesmo jeito que `demandasCustom` já é protegido.
  const mutateTopLevelFieldGranular = useCallback((fieldName, updater, mergeFn, successMsg) => {
    let resultPromise;
    setData(prev => {
      const next = updater(prev);
      resultPromise = persistTopLevelFieldMerge(fieldName, mergeFn).then(result => {
        if(!result.ok) push('Não foi possível salvar. Tente novamente.', 'error');
        else if(successMsg) push(successMsg);
        return result;
      });
      return next;
    });
    return resultPromise;
  }, [push]);

  // Versão geral de mutateTopLevelFieldGranular pra ações que precisam gravar MAIS DE UM campo de topo
  // atomicamente (ex.: excluir uma pessoa mexe em pessoas + responsabilidades + metas ao mesmo tempo) —
  // ver persistFieldsMerge acima. `mergeFns` é {nomeDoCampo: (valorAtualNoServidor) => novoValor}.
  //
  // ACHADO AO VIVO (27/08/2026): usado pra migrar TODAS as ações da aplicação que ainda usavam mutate()
  // (substituição de campo inteiro a partir do estado local desta aba) pro mesmo mecanismo seguro já
  // comprovado no CSAT e em Gestão de Metas — qualquer uma dessas ações podia, em teoria, ter uma edição
  // revertida se outra aba/pessoa gravasse algo enquanto esta aba estava aberta com dados desatualizados.
  const mutateFieldsGranular = useCallback((updater, mergeFns, successMsg) => {
    let resultPromise;
    setData(prev => {
      const next = updater(prev);
      resultPromise = persistFieldsMerge(mergeFns).then(result => {
        if(!result.ok) push('Não foi possível salvar. Tente novamente.', 'error');
        else if(successMsg) push(successMsg);
        return result;
      });
      return next;
    });
    return resultPromise;
  }, [push]);

  const actions = useMemo(() => ({
    // pessoas
    //
    // ACHADO AO VIVO (27/08/2026, mesma causa raiz do CSAT/metas): todas as ações abaixo usavam mutate()
    // — substituição do campo inteiro a partir do estado local desta aba. Convertidas pra
    // mutateTopLevelFieldGranular/mutateFieldsGranular (lê o valor mais recente do SERVIDOR antes de
    // gravar) pra eliminar o mesmo risco de "perda de atualização" já confirmado em produção.
    addPessoa: (p) => {
      const aplicar = (base) => [...(base||[]), {id:uid(), ...p}];
      return mutateTopLevelFieldGranular('pessoas', d => ({...d, pessoas: aplicar(d.pessoas)}), aplicar, 'Pessoa adicionada');
    },
    editPessoa: (id, p) => {
      const aplicar = (base) => (base||[]).map(x => x.id===id ? {...x, ...p} : x);
      return mutateTopLevelFieldGranular('pessoas', d => ({...d, pessoas: aplicar(d.pessoas)}), aplicar, 'Pessoa atualizada');
    },
    deletePessoa: (id) => {
      const aplicarPessoas = (base) => (base||[]).filter(x => x.id !== id).map(x => x.reportsToId === id ? {...x, reportsToId: null} : x);
      const aplicarResponsabilidades = (base) => (base||[]).filter(r => r.responsavelId !== id);
      const aplicarMetas = (base) => (base||[]).map(m => ({...m, pessoaIds: (m.pessoaIds||[]).filter(pid => pid !== id)}));
      return mutateFieldsGranular(
        d => ({...d, pessoas: aplicarPessoas(d.pessoas), responsabilidades: aplicarResponsabilidades(d.responsabilidades), metas: aplicarMetas(d.metas)}),
        { pessoas: aplicarPessoas, responsabilidades: aplicarResponsabilidades, metas: aplicarMetas },
        'Pessoa excluída'
      );
    },

    // links
    addLink: (l) => {
      const aplicar = (base) => [...(base||[]), {id:uid(), ...l}];
      return mutateTopLevelFieldGranular('links', d => ({...d, links: aplicar(d.links)}), aplicar, 'Link adicionado');
    },
    editLink: (id, l) => {
      const aplicar = (base) => (base||[]).map(x => x.id===id ? {...x, ...l} : x);
      return mutateTopLevelFieldGranular('links', d => ({...d, links: aplicar(d.links)}), aplicar, 'Link atualizado');
    },
    deleteLink: (id) => {
      const aplicar = (base) => (base||[]).filter(x => x.id !== id);
      return mutateTopLevelFieldGranular('links', d => ({...d, links: aplicar(d.links)}), aplicar, 'Link excluído');
    },

    // responsabilidades
    addRole: (r) => {
      const aplicar = (base) => [...(base||[]), {id:uid(), ...r}];
      return mutateTopLevelFieldGranular('responsabilidades', d => ({...d, responsabilidades: aplicar(d.responsabilidades)}), aplicar, 'Função adicionada');
    },
    editRole: (id, r) => {
      const aplicar = (base) => (base||[]).map(x => x.id===id ? {...x, ...r} : x);
      return mutateTopLevelFieldGranular('responsabilidades', d => ({...d, responsabilidades: aplicar(d.responsabilidades)}), aplicar, 'Função atualizada');
    },
    deleteRole: (id) => {
      const aplicar = (base) => (base||[]).filter(x => x.id !== id);
      return mutateTopLevelFieldGranular('responsabilidades', d => ({...d, responsabilidades: aplicar(d.responsabilidades)}), aplicar, 'Função excluída');
    },

    // metas
    //
    // ACHADO AO VIVO (27/08/2026, mesma causa raiz do bug do CSAT): editar/adicionar/excluir uma meta
    // usava mutate() — substituição da lista `metas` INTEIRA a partir do estado local desta aba. Se
    // qualquer outra aba/sessão (sua ou de outra pessoa) tivesse uma cópia mais antiga de `metas` na
    // memória e disparasse qualquer gravação, ela reescrevia a lista inteira por cima, revertendo a
    // edição em segundos — reproduzido ao vivo editando a descrição de "Margem Bruta" (aparecia na tela,
    // sumia ~2s depois, inclusive no servidor). Agora usa o mesmo mecanismo seguro do CSAT
    // (mutateTopLevelFieldGranular / persistTopLevelFieldMerge): lê `metas` mais recente do SERVIDOR no
    // momento da gravação e aplica só esta mudança em cima dele.
    addGoal: (g) => {
      const aplicarAdd = (metasBase) => [...(metasBase||[]), {id:uid(), ...g}];
      return mutateTopLevelFieldGranular('metas', d => ({...d, metas: aplicarAdd(d.metas)}), aplicarAdd, 'Meta adicionada');
    },
    // Casa por slug quando disponível (mais estável que id — ver comentário na migração de dedupe em
    // runMigrations), com fallback pra id (metas customizadas, sem slug, só têm id mesmo).
    // `defsCustomizadas: true` marca que Título/Descrição/Fonte/Unidade foram editados manualmente pelo
    // usuário (só o GoalModal grava esses 4 campos juntos) — a migração de sincronização com INDICADORES
    // (ver runMigrations) passa a respeitar essa edição e não sobrescrever mais esses campos nessa meta.
    editGoal: (id, g) => {
      const aplicarEdit = (metasBase) => (metasBase||[]).map(x => (g.slug && x.slug===g.slug) || x.id===id ? {...x, ...g, defsCustomizadas: true} : x);
      return mutateTopLevelFieldGranular('metas', d => ({...d, metas: aplicarEdit(d.metas)}), aplicarEdit, 'Meta atualizada');
    },
    deleteGoal: (id) => {
      const aplicarDelete = (metasBase) => (metasBase||[]).filter(x => x.id !== id);
      return mutateTopLevelFieldGranular('metas', d => ({...d, metas: aplicarDelete(d.metas)}), aplicarDelete, 'Meta excluída');
    },

    // rotinas
    addRotina: (r) => {
      const aplicar = (base) => [...(base||[]), {id:uid(), ...r}];
      return mutateTopLevelFieldGranular('rotinas', d => ({...d, rotinas: aplicar(d.rotinas)}), aplicar, 'Reunião adicionada');
    },
    editRotina: (id, r) => {
      const aplicar = (base) => (base||[]).map(x => x.id===id ? {...x, ...r} : x);
      return mutateTopLevelFieldGranular('rotinas', d => ({...d, rotinas: aplicar(d.rotinas)}), aplicar, 'Reunião atualizada');
    },
    deleteRotina: (id) => {
      const aplicar = (base) => (base||[]).filter(x => x.id !== id);
      return mutateTopLevelFieldGranular('rotinas', d => ({...d, rotinas: aplicar(d.rotinas)}), aplicar, 'Reunião excluída');
    },

    // tarefas
    addTarefa: (t) => {
      const aplicar = (base) => [...(base||[]), {id:uid(), responsaveis:{}, ...t}];
      return mutateTopLevelFieldGranular('tarefas', d => ({...d, tarefas: aplicar(d.tarefas)}), aplicar, 'Tarefa adicionada');
    },
    editTarefa: (id, t) => {
      const aplicar = (base) => (base||[]).map(x => x.id===id ? {...x, ...t} : x);
      return mutateTopLevelFieldGranular('tarefas', d => ({...d, tarefas: aplicar(d.tarefas)}), aplicar, 'Tarefa atualizada');
    },
    setTarefaResponsavel: (id, clienteId, pessoaId) => {
      const aplicar = (base) => (base||[]).map(x => {
        if(x.id !== id) return x;
        const responsaveis = {...(x.responsaveis||{})};
        if(pessoaId) responsaveis[clienteId] = pessoaId; else delete responsaveis[clienteId];
        return {...x, responsaveis};
      });
      return mutateTopLevelFieldGranular('tarefas', d => ({...d, tarefas: aplicar(d.tarefas)}), aplicar, 'Responsável atualizado');
    },
    deleteTarefa: (id) => {
      const aplicar = (base) => (base||[]).filter(x => x.id !== id);
      return mutateTopLevelFieldGranular('tarefas', d => ({...d, tarefas: aplicar(d.tarefas)}), aplicar, 'Tarefa excluída');
    },

    // upsell score (per client)
    setUpsellValue: (mesN, clienteId, kpiKey, value) => {
      const aplicar = (base) => {
        const upsellScore = {...(base||{})};
        const yearData = {...(upsellScore[CURRENT_YEAR]||{})};
        const monthData = {...(yearData[mesN]||{})};
        const clienteData = {...(monthData[clienteId]||{})};
        if(value === null || value === undefined || value === ''){
          delete clienteData[kpiKey];
        } else {
          clienteData[kpiKey] = value;
        }
        monthData[clienteId] = clienteData;
        yearData[mesN] = monthData;
        upsellScore[CURRENT_YEAR] = yearData;
        return upsellScore;
      };
      return mutateTopLevelFieldGranular('upsellScore', d => ({...d, upsellScore: aplicar(d.upsellScore)}), aplicar, null);
    },
    setUpsellSubValue: (mesN, clienteId, kpiKey, subKey, value) => {
      const aplicar = (base) => {
        const upsellScore = {...(base||{})};
        const yearData = {...(upsellScore[CURRENT_YEAR]||{})};
        const monthData = {...(yearData[mesN]||{})};
        const clienteData = {...(monthData[clienteId]||{})};
        const subData = {...(clienteData[kpiKey]||{})};
        if(value === null || value === undefined || value === false){
          delete subData[subKey];
        } else {
          subData[subKey] = value;
        }
        clienteData[kpiKey] = subData;
        monthData[clienteId] = clienteData;
        yearData[mesN] = monthData;
        upsellScore[CURRENT_YEAR] = yearData;
        return upsellScore;
      };
      return mutateTopLevelFieldGranular('upsellScore', d => ({...d, upsellScore: aplicar(d.upsellScore)}), aplicar, null);
    },

    // efetividade de regras (manual, por cliente/mês)
    setEfetividadeRegras: (mesN, clienteId, value) => {
      const aplicar = (base) => {
        const efetividadeRegras = {...(base||{})};
        const yearData = {...(efetividadeRegras[CURRENT_YEAR]||{})};
        const clienteData = {...(yearData[clienteId]||{})};
        if(value === null || value === undefined || value === ''){
          delete clienteData[mesN];
        } else {
          clienteData[mesN] = value;
        }
        yearData[clienteId] = clienteData;
        efetividadeRegras[CURRENT_YEAR] = yearData;
        return efetividadeRegras;
      };
      return mutateTopLevelFieldGranular('efetividadeRegras', d => ({...d, efetividadeRegras: aplicar(d.efetividadeRegras)}), aplicar, null);
    },

    // penetração de regras (manual, por cliente/mês)
    setPenetracaoRegras: (mesN, clienteId, value) => {
      const aplicar = (base) => {
        const penetracaoRegras = {...(base||{})};
        const yearData = {...(penetracaoRegras[CURRENT_YEAR]||{})};
        const clienteData = {...(yearData[clienteId]||{})};
        if(value === null || value === undefined || value === ''){
          delete clienteData[mesN];
        } else {
          clienteData[mesN] = value;
        }
        yearData[clienteId] = clienteData;
        penetracaoRegras[CURRENT_YEAR] = yearData;
        return penetracaoRegras;
      };
      return mutateTopLevelFieldGranular('penetracaoRegras', d => ({...d, penetracaoRegras: aplicar(d.penetracaoRegras)}), aplicar, null);
    },

    // budgets definidos direto na tela do indicador (Efetividade/Penetração Regras, Contas Finalizadas)
    setEfetividadeRegrasBudget: (mesN, clienteId, value) => {
      const aplicar = (base) => {
        const efetividadeRegrasBudget = {...(base||{})};
        const yearData = {...(efetividadeRegrasBudget[CURRENT_YEAR]||{})};
        const clienteData = {...(yearData[clienteId]||{})};
        if(value === null || value === undefined || value === ''){
          delete clienteData[mesN];
        } else {
          clienteData[mesN] = value;
        }
        yearData[clienteId] = clienteData;
        efetividadeRegrasBudget[CURRENT_YEAR] = yearData;
        return efetividadeRegrasBudget;
      };
      return mutateTopLevelFieldGranular('efetividadeRegrasBudget', d => ({...d, efetividadeRegrasBudget: aplicar(d.efetividadeRegrasBudget)}), aplicar, null);
    },
    setPenetracaoRegrasBudget: (mesN, clienteId, value) => {
      const aplicar = (base) => {
        const penetracaoRegrasBudget = {...(base||{})};
        const yearData = {...(penetracaoRegrasBudget[CURRENT_YEAR]||{})};
        const clienteData = {...(yearData[clienteId]||{})};
        if(value === null || value === undefined || value === ''){
          delete clienteData[mesN];
        } else {
          clienteData[mesN] = value;
        }
        yearData[clienteId] = clienteData;
        penetracaoRegrasBudget[CURRENT_YEAR] = yearData;
        return penetracaoRegrasBudget;
      };
      return mutateTopLevelFieldGranular('penetracaoRegrasBudget', d => ({...d, penetracaoRegrasBudget: aplicar(d.penetracaoRegrasBudget)}), aplicar, null);
    },
    setContasFinalizadasBudget: (mesN, clienteNome, value) => {
      const aplicar = (base) => {
        const financeiro = {...(base||{})};
        const contasFinalizadasBudget = {...(financeiro.contasFinalizadasBudget||{})};
        const yearData = {...(contasFinalizadasBudget[CURRENT_YEAR]||{})};
        const clienteData = {...(yearData[clienteNome]||{})};

    // demandas (campos personalizados por nº de ticket, preservados ao atualizar a base)
    //
    // ACHADO IMPORTANTE (causa raiz real do CSAT "sincronizado mas nunca aparecendo na tabela"): esta
    // ação roda toda vez que ALGUÉM edita qualquer campo de QUALQUER ticket na tabela de Demandas
    // (Prioridade, Esforço, Prazo, Classificação, Tipo, Responsável Desenvolvimento, Concluído em
    // manual) — ou seja, é a ação mais usada do dia a dia da ferramenta, em uso constante por várias
    // pessoas do time ao mesmo tempo. Antes desta correção, ela usava `mutate()` (substituição do campo
    // demandasCustom INTEIRO, calculada a partir do estado local desta aba). Isso significa que, sempre
    // que alguém editasse UM campo de UM ticket qualquer, a gravação sobrescrevia demandasCustom inteiro
    // — inclusive quaisquer notas de CSAT que a sincronização em lote (ver importCsatAvaliacao) tivesse
    // acabado de gravar em outro ticket segundos antes, se o estado local desta aba ainda não tivesse
    // recebido a atualização via onSnapshot. Confirmado ao vivo: depois de "Atualizar CSAT" reportar 19
    // tickets sincronizados, o documento no Firestore não tinha NENHUM campo csatSheet gravado em NENHUM
    // dos 40 tickets com dados customizados — batendo exatamente com esse padrão (uma edição normal de
    // ticket, feita por qualquer pessoa, apagando o lote inteiro de CSAT). Agora usa o mesmo mecanismo
    // seguro do CSAT (mutateDemandasCustomGranular): lê o demandasCustom mais recente do SERVIDOR no
    // momento da gravação e aplica só esta edição em cima dele.
    updateDemandaCustom: (numero, patch) => {
      const who = (authUser && (authUser.displayName || authUser.email)) || 'Desconhecido';
      const nowIso = new Date().toISOString();
      const aplicarPatch = (demandasCustomBase) => {
        const demandasCustom = {...(demandasCustomBase || {})};
        const prev = demandasCustom[numero] || {};
        const editMeta = {...(prev._editMeta||{})};
        Object.keys(patch).forEach(k => { editMeta[k] = {by: who, at: nowIso}; });
        demandasCustom[numero] = {...prev, ...patch, _editMeta: editMeta};
        return demandasCustom;
      };
      return mutateDemandasCustomGranular(
        d => ({...d, demandasCustom: aplicarPatch(d.demandasCustom)}),
        aplicarPatch,
        [],
        null
      );
    },

    // Cria um ticket 100% manual (fora do Movidesk) — usado pelo botão "+ Nova Demanda Manual" na aba
    // Demandas. `fields` é o "o" de um ticket (n/a/s/u/c/r/d/re/tr/csat), já com o número gerado via
    // nextManualDemandaNumero. Fica em d.demandasManuais, separado da base sincronizada — ver
    // buildDemandasMerged (que concatena os dois antes de aplicar as colunas editáveis via demandasCustom).
    addDemandaManual: (fields) => {
      const aplicar = (base) => [...(base||[]), fields];
      return mutateTopLevelFieldGranular('demandasManuais', d => ({...d, demandasManuais: aplicar(d.demandasManuais)}), aplicar, `Ticket manual criado (${fields.n})`);
    },

    // Edita os campos "base" (assunto, status, urgência, cliente, responsável, data de abertura, CSAT,
    // tempo 1ª resposta) de um ticket manual já criado — diferente de updateDemandaCustom, que edita as
    // colunas "overlay" (classificação, tipo, prazo, etc.) compartilhadas com tickets do Movidesk.
    updateDemandaManual: (numero, patch) => {
      const aplicar = (base) => (base||[]).map(o => o.n === numero ? {...o, ...patch} : o);
      return mutateTopLevelFieldGranular('demandasManuais', d => ({...d, demandasManuais: aplicar(d.demandasManuais)}), aplicar, null);
    },

    // Exclui um ticket manual por completo (base + qualquer dado em demandasCustom) — só faz sentido
    // para tickets manuais, já que um ticket sincronizado do Movidesk reapareceria na próxima atualização.
    // Usa o mesmo mecanismo seguro de gravação de demandasCustom (ver updateDemandaCustom acima) — a
    // parte de demandasManuais continua vindo do estado local, já que essa lista é editada com bem menos
    // frequência/concorrência do que demandasCustom.
    deleteDemandaManual: (numero) => {
      const aplicarDelete = (demandasCustomBase) => {
        const demandasCustom = {...(demandasCustomBase || {})};
        delete demandasCustom[numero];
        return demandasCustom;
      };
      return mutateDemandasCustomGranular(
        d => ({
          ...d,
          demandasManuais: (d.demandasManuais||[]).filter(o => o.n !== numero),
          demandasCustom: aplicarDelete(d.demandasCustom),
        }),
        aplicarDelete,
        ['demandasManuais'],
        `Ticket manual excluído (${numero})`
      );
    },

    // Sincroniza as notas de CSAT (1-5) da planilha separada de Avaliação, indexadas por número de
    // ticket. Grava em demandasCustom[numero].csatSheet — buildDemandasMerged prioriza esse valor sobre
    // o.csat (placeholder do Movidesk). Tickets sem avaliação na planilha simplesmente não são tocados
    // (mantém o valor anterior, se houver).
    importCsatAvaliacao: (porTicket) => {
      const who = (authUser && (authUser.displayName || authUser.email)) || 'Desconhecido';
      const nowIso = new Date().toISOString();
      // Função pura, aplicada tanto ao estado LOCAL (atualização otimista imediata na tela) quanto ao
      // demandasCustom mais recente do SERVIDOR (dentro da transação de gravação) — garante que os dois
      // caminhos calculem exatamente o mesmo resultado por ticket, só a partir de bases diferentes.
      const aplicarCsat = (demandasCustomBase) => {
        const demandasCustom = {...(demandasCustomBase || {})};
        Object.keys(porTicket).forEach(numero => {
          const prev = demandasCustom[numero] || {};
          const editMeta = {...(prev._editMeta||{}), csatSheet: {by: who, at: nowIso}};
          demandasCustom[numero] = {...prev, csatSheet: porTicket[numero], _editMeta: editMeta};
        });
        return demandasCustom;
      };
      return mutateDemandasCustomGranular(
        d => ({
          ...d,
          demandasCustom: aplicarCsat(d.demandasCustom),
          csatAvaliacaoSync: { by: who, at: nowIso, count: Object.keys(porTicket).length },
        }),
        aplicarCsat,
        ['csatAvaliacaoSync'],
        `CSAT atualizado (${Object.keys(porTicket).length} ticket${Object.keys(porTicket).length===1?'':'s'})`
      );
    },

    // substitui a base de tickets do Movidesk (puxada do Drive) — compartilhada em tempo real
    //
    // ACHADO AO VIVO (27/08/2026): as ações de sincronização/importação abaixo também usavam mutate() —
    // convertidas pro mesmo mecanismo seguro (mutateFieldsGranular/mutateTopLevelFieldGranular) usado
    // pelo CSAT e por Gestão de Metas. Cada uma grava seu(s) campo(s) de topo lendo o valor mais recente
    // do SERVIDOR antes de gravar, em vez de substituir a partir do estado local desta aba.
    importDemandasBase: (rows) => {
      const aplicarBase = () => rows;
      const aplicarSync = () => ({
        by: (authUser && (authUser.displayName || authUser.email)) || 'Desconhecido',
        at: new Date().toISOString(),
        count: rows.length,
      });
      return mutateFieldsGranular(
        d => ({...d, demandasBase: rows, demandasBaseSync: aplicarSync()}),
        { demandasBase: aplicarBase, demandasBaseSync: aplicarSync },
        `Base do Movidesk atualizada (${rows.length} tickets)`
      );
    },

        d => ({...d, financeiro: aplicarFinanceiro(d.financeiro), contasAutomaticoSync: aplicarSync()}),
        { financeiro: aplicarFinanceiro, contasAutomaticoSync: aplicarSync },
        `Base de % Contas Automático atualizada (${Object.keys(porCliente).length} cliente${Object.keys(porCliente).length===1?'':'s'})`
      );
    },

    // Realizado sincronizado da aba "Tempo Processamento" da planilha Gestão Metas (por categoria, nome como chave).
    importTempoProcessamentoRealizado: (porCategoria) => {
      const aplicarFinanceiro = (base) => {
        const financeiro = {...(base||{})};
        const tempoProcessamento = {...(financeiro.tempoProcessamento||{})};
        tempoProcessamento[CURRENT_YEAR] = porCategoria;
        financeiro.tempoProcessamento = tempoProcessamento;
        return financeiro;
      };
      const aplicarSync = () => ({
        by: (authUser && (authUser.displayName || authUser.email)) || 'Desconhecido',
        at: new Date().toISOString(),
        count: Object.keys(porCategoria).length,
      });
      return mutateFieldsGranular(
        d => ({...d, financeiro: aplicarFinanceiro(d.financeiro), tempoProcessamentoSync: aplicarSync()}),
        { financeiro: aplicarFinanceiro, tempoProcessamentoSync: aplicarSync },
        `Base de Tempo Processamento atualizada (${Object.keys(porCategoria).length} categoria${Object.keys(porCategoria).length===1?'':'s'})`
      );
    },

    // Realizado sincronizado da aba "Penetração Regras" (por cliente, já convertido para clienteId
    // antes de chegar aqui — ver mapClienteNomeParaId).
    importPenetracaoRegrasRealizado: (porClienteId) => {
      const aplicarRegras = (base) => ({...(base||{}), [CURRENT_YEAR]: porClienteId});
      const aplicarSync = () => ({
        by: (authUser && (authUser.displayName || authUser.email)) || 'Desconhecido',
        at: new Date().toISOString(),
        count: Object.keys(porClienteId).length,
      });
      return mutateFieldsGranular(
        d => ({...d, penetracaoRegras: aplicarRegras(d.penetracaoRegras), penetracaoRegrasSync: aplicarSync()}),
        { penetracaoRegras: aplicarRegras, penetracaoRegrasSync: aplicarSync },
        `Base de Penetração Regras atualizada (${Object.keys(porClienteId).length} cliente${Object.keys(porClienteId).length===1?'':'s'})`
      );
    },

    // Realizado sincronizado da aba "Efetividade Regras" (por cliente, já convertido para clienteId
    // antes de chegar aqui — ver mapClienteNomeParaId).
    importEfetividadeRegrasRealizado: (porClienteId) => {
      const aplicarRegras = (base) => ({...(base||{}), [CURRENT_YEAR]: porClienteId});
      const aplicarSync = () => ({
        by: (authUser && (authUser.displayName || authUser.email)) || 'Desconhecido',
        at: new Date().toISOString(),
        count: Object.keys(porClienteId).length,
      });
      return mutateFieldsGranular(
        d => ({...d, efetividadeRegras: aplicarRegras(d.efetividadeRegras), efetividadeRegrasSync: aplicarSync()}),
        { efetividadeRegras: aplicarRegras, efetividadeRegrasSync: aplicarSync },
        `Base de Efetividade Regras atualizada (${Object.keys(porClienteId).length} cliente${Object.keys(porClienteId).length===1?'':'s'})`
      );
    },
  }), [mutateTopLevelFieldGranular, mutateFieldsGranular, mutateDemandasCustomGranular, authUser]);

  if(authUser === undefined){
    return <div className="loading-screen"><span className="spinner"></span>Verificando login...</div>;
  }

  if(authUser === null){
    return (
      <div className="auth-screen">
        <div className="auth-card">
          <div className="auth-mark">BA</div>
          <div className="auth-title">BU Auditoria</div>
          <div className="auth-sub">Entre com sua conta Google da Rivio para acessar o painel.</div>
          <button className="auth-google-btn" onClick={handleSignIn} disabled={signingIn}>
            {signingIn ? 'Entrando...' : 'Entrar com Google'}
          </button>
          {authError && <div className="auth-error">{authError}</div>}
        </div>
      </div>
    );
  }

  if(loading || !data){
    return <div className="loading-screen"><span className="spinner"></span>Carregando dados do time...</div>;
  }

  const meta = SECTION_META[route.section] || SECTION_META.overview;
  let pageTitle = meta.title;
  if(route.section === 'tracking' && route.indicator){
    const ind = INDICADORES.find(i => i.slug === route.indicator);
    if(ind) pageTitle = ind.titulo;
  }
  if(route.section === 'goals' && route.goalId){
    const g = data.metas.find(m => m.id === route.goalId);
    if(g) pageTitle = g.titulo;
  }

  return (
    <div className="app-shell">
      <Sidebar route={route} setRoute={setRoute}/>
      <div className="main">
        <div className="topbar">
          <div>
            <div className="topbar-eyebrow">{meta.eyebrow}</div>
            <div className="topbar-title">{pageTitle}</div>
          </div>
          <div className="topbar-user">
            <div className="sync-indicator"><span className="sync-dot"></span>Tempo real</div>
            {authUser.photoURL
              ? <img className="topbar-user-avatar" src={authUser.photoURL} referrerPolicy="no-referrer" alt=""/>
              : <div className="topbar-user-avatar-fallback">{(authUser.email||'?')[0].toUpperCase()}</div>}
            <span className="topbar-user-email">{authUser.email}</span>
            <button className="topbar-signout-btn" onClick={handleSignOut}>Sair</button>
          </div>
        </div>
        <div className={"content" + (route.section === 'demandas' ? ' content-demandas' : '') + ((route.section === 'overview' || route.section === 'roles') ? ' content-wide' : '')}>
          {route.section === 'overview' && <OverviewPage data={data} actions={actions}/>}
          {route.section === 'roles' && <RolesPage data={data} actions={actions}/>}
          {route.section === 'goals' && <GoalsPage data={data} actions={actions}/>}
          {route.section === 'tracking' && (route.indicator ? <TrackingPage slug={route.indicator} financeiro={data.financeiro} upsellScore={data.upsellScore} clientes={data.clientes} actions={actions} data={data}/> : <TrackingIndexPage data={data}/>)}
          {route.section === 'rotinas' && <RotinasPage data={data} actions={actions}/>}
          {route.section === 'demandas' && <DemandasPage data={data} actions={actions}/>}
        </div>
      </div>
      <ToastStack toasts={toasts}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
