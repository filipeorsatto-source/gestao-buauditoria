const SECTION_META = {
  overview: {title:'Organograma', eyebrow:'Visão geral do time'},
  roles: {title:'Papéis e Responsabilidades', eyebrow:'Organização de funções'},
  goals: {title:'Gestão de Metas', eyebrow:'Metas & budget'},
  tracking: {title:'Acompanhamento de Metas', eyebrow:'Realizado vs. budget'},
  rotinas: {title:'Rotinas', eyebrow:'Agenda semanal do time'},
  demandas: {title:'Demandas', eyebrow:'Tickets Movidesk por cliente'},
};

const ALLOWED_EMAIL_DOMAIN = '@rivio.com.br';

function App(){
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [route, setRoute] = useState({section:'overview'});
  const [authUser, setAuthUser] = useState(undefined); // undefined = resolvendo, null = deslogado, obj = logado
  const [authError, setAuthError] = useState(null);
  const [signingIn, setSigningIn] = useState(false);
  const {toasts, push} = useToasts();

  // Autenticação (Google, restrito ao domínio da empresa)
  useEffect(() => {
    let unsub = () => {};
    waitForFirebase().then(fb => {
      unsub = fb.onAuthStateChanged(fb.auth, user => {
        if(user && !(user.email || '').toLowerCase().endsWith(ALLOWED_EMAIL_DOMAIN)){
          setAuthError(`Acesso restrito a e-mails ${ALLOWED_EMAIL_DOMAIN}.`);
          fb.signOut(fb.auth);
          setAuthUser(null);
          return;
        }
        setAuthUser(user);
      });
    });
    return () => unsub();
  }, []);

  const handleSignIn = useCallback(async () => {
    setSigningIn(true);
    setAuthError(null);
    try{
      const fb = await waitForFirebase();
      const provider = new fb.GoogleAuthProvider();
      provider.setCustomParameters({ hd: ALLOWED_EMAIL_DOMAIN.replace('@','') });
      await fb.signInWithPopup(fb.auth, provider);
    }catch(e){
      console.error('Sign-in error', e);
      setAuthError('Não foi possível entrar com Google. Tente novamente.');
    }finally{
      setSigningIn(false);
    }
  }, []);

  const handleSignOut = useCallback(async () => {
    const fb = await waitForFirebase();
    fb.signOut(fb.auth);
  }, []);

  // Sincronização em tempo real com o Firestore (somente após login válido)
  useEffect(() => {
    if(!authUser) return;
    let unsub = () => {};
    let cancelled = false;
    (async () => {
      await ensureFirestoreSeeded();
      if(cancelled) return;
      const fb = await waitForFirebase();
      const ref = await getAppDataDocRef();
      unsub = fb.onSnapshot(ref, snap => {
        if(!snap.exists()) return;
        const raw = snap.data();
        const {data: migrated, changed} = runMigrations(raw);
        setData(migrated);
        setLoading(false);
        if(changed) persistPatch(migrated);
      }, err => {
        console.error('Firestore sync error', err);
        push('Erro de sincronização com a base compartilhada.', 'error');
      });
    })();
    return () => { cancelled = true; unsub(); };
  }, [authUser, push]);

  const mutate = useCallback((updater, successMsg) => {
    setData(prev => {
      const next = updater(prev);
      const patch = {};
      Object.keys(next).forEach(k => { if(next[k] !== prev[k]) patch[k] = next[k]; });
      if(Object.keys(patch).length){
        persistPatch(patch).then(ok => {
          if(!ok) push('Não foi possível salvar. Tente novamente.', 'error');
          else if(successMsg) push(successMsg);
        });
      }
      return next;
    });
  }, [push]);

  const actions = useMemo(() => ({
    // pessoas
    addPessoa: (p) => mutate(d => ({...d, pessoas:[...d.pessoas, {id:uid(), ...p}]}), 'Pessoa adicionada'),
    editPessoa: (id, p) => mutate(d => ({...d, pessoas: d.pessoas.map(x => x.id===id ? {...x, ...p} : x)}), 'Pessoa atualizada'),
    deletePessoa: (id) => mutate(d => ({
      ...d,
      pessoas: d.pessoas
        .filter(x => x.id !== id)
        .map(x => x.reportsToId === id ? {...x, reportsToId: null} : x),
      responsabilidades: d.responsabilidades.filter(r => r.responsavelId !== id),
      metas: d.metas.map(m => ({...m, pessoaIds: (m.pessoaIds||[]).filter(pid => pid !== id)}))
    }), 'Pessoa excluída'),

    // links
    addLink: (l) => mutate(d => ({...d, links:[...d.links, {id:uid(), ...l}]}), 'Link adicionado'),
    editLink: (id, l) => mutate(d => ({...d, links: d.links.map(x => x.id===id ? {...x, ...l} : x)}), 'Link atualizado'),
    deleteLink: (id) => mutate(d => ({...d, links: d.links.filter(x => x.id !== id)}), 'Link excluído'),

    // responsabilidades
    addRole: (r) => mutate(d => ({...d, responsabilidades:[...d.responsabilidades, {id:uid(), ...r}]}), 'Função adicionada'),
    editRole: (id, r) => mutate(d => ({...d, responsabilidades: d.responsabilidades.map(x => x.id===id ? {...x, ...r} : x)}), 'Função atualizada'),
    deleteRole: (id) => mutate(d => ({...d, responsabilidades: d.responsabilidades.filter(x => x.id !== id)}), 'Função excluída'),

    // metas
    addGoal: (g) => mutate(d => ({...d, metas:[...d.metas, {id:uid(), ...g}]}), 'Meta adicionada'),
    editGoal: (id, g) => mutate(d => ({...d, metas: d.metas.map(x => x.id===id ? {...x, ...g} : x)}), 'Meta atualizada'),
    deleteGoal: (id) => mutate(d => ({...d, metas: d.metas.filter(x => x.id !== id)}), 'Meta excluída'),

    // rotinas
    addRotina: (r) => mutate(d => ({...d, rotinas:[...(d.rotinas||[]), {id:uid(), ...r}]}), 'Reunião adicionada'),
    editRotina: (id, r) => mutate(d => ({...d, rotinas: (d.rotinas||[]).map(x => x.id===id ? {...x, ...r} : x)}), 'Reunião atualizada'),
    deleteRotina: (id) => mutate(d => ({...d, rotinas: (d.rotinas||[]).filter(x => x.id !== id)}), 'Reunião excluída'),

    // tarefas
    addTarefa: (t) => mutate(d => ({...d, tarefas:[...(d.tarefas||[]), {id:uid(), responsaveis:{}, ...t}]}), 'Tarefa adicionada'),
    editTarefa: (id, t) => mutate(d => ({...d, tarefas: (d.tarefas||[]).map(x => x.id===id ? {...x, ...t} : x)}), 'Tarefa atualizada'),
    setTarefaResponsavel: (id, clienteId, pessoaId) => mutate(d => ({
      ...d,
      tarefas: (d.tarefas||[]).map(x => {
        if(x.id !== id) return x;
        const responsaveis = {...(x.responsaveis||{})};
        if(pessoaId) responsaveis[clienteId] = pessoaId; else delete responsaveis[clienteId];
        return {...x, responsaveis};
      })
    }), 'Responsável atualizado'),
    deleteTarefa: (id) => mutate(d => ({...d, tarefas: (d.tarefas||[]).filter(x => x.id !== id)}), 'Tarefa excluída'),

    // upsell score (per client)
    setUpsellValue: (mesN, clienteId, kpiKey, value) => mutate(d => {
      const upsellScore = {...(d.upsellScore||{})};
      const yearData = {...(upsellScore[CURRENT_YEAR]||{})};
      const monthData = {...(yearData[mesN]||{})};
      const clienteData = {...(monthData[clienteId]||{})};
      if(value === null || value === undefined || value === ''){
        delete clienteData[kpiKey];
      } else {
        clienteData[kpiKey] = value;
      }
      monthData[clienteId] = clienteData;
      yearData[mesN] = monthData;
      upsellScore[CURRENT_YEAR] = yearData;
      return {...d, upsellScore};
    }, null),
    setUpsellSubValue: (mesN, clienteId, kpiKey, subKey, value) => mutate(d => {
      const upsellScore = {...(d.upsellScore||{})};
      const yearData = {...(upsellScore[CURRENT_YEAR]||{})};
      const monthData = {...(yearData[mesN]||{})};
      const clienteData = {...(monthData[clienteId]||{})};
      const subData = {...(clienteData[kpiKey]||{})};
      if(value === null || value === undefined || value === false){
        delete subData[subKey];
      } else {
        subData[subKey] = value;
      }
      clienteData[kpiKey] = subData;
      monthData[clienteId] = clienteData;
      yearData[mesN] = monthData;
      upsellScore[CURRENT_YEAR] = yearData;
      return {...d, upsellScore};
    }, null),

    // efetividade de regras (manual, por cliente/mês)
    setEfetividadeRegras: (mesN, clienteId, value) => mutate(d => {
      const efetividadeRegras = {...(d.efetividadeRegras||{})};
      const yearData = {...(efetividadeRegras[CURRENT_YEAR]||{})};
      const clienteData = {...(yearData[clienteId]||{})};
      if(value === null || value === undefined || value === ''){
        delete clienteData[mesN];
      } else {
        clienteData[mesN] = value;
      }
      yearData[clienteId] = clienteData;
      efetividadeRegras[CURRENT_YEAR] = yearData;
      return {...d, efetividadeRegras};
    }, null),

    // penetração de regras (manual, por cliente/mês)
    setPenetracaoRegras: (mesN, clienteId, value) => mutate(d => {
      const penetracaoRegras = {...(d.penetracaoRegras||{})};
      const yearData = {...(penetracaoRegras[CURRENT_YEAR]||{})};
      const clienteData = {...(yearData[clienteId]||{})};
      if(value === null || value === undefined || value === ''){
        delete clienteData[mesN];
      } else {
        clienteData[mesN] = value;
      }
      yearData[clienteId] = clienteData;
      penetracaoRegras[CURRENT_YEAR] = yearData;
      return {...d, penetracaoRegras};
    }, null),

    // budgets definidos direto na tela do indicador (Efetividade/Penetração Regras, Contas Finalizadas)
    setEfetividadeRegrasBudget: (mesN, clienteId, value) => mutate(d => {
      const efetividadeRegrasBudget = {...(d.efetividadeRegrasBudget||{})};
      const yearData = {...(efetividadeRegrasBudget[CURRENT_YEAR]||{})};
      const clienteData = {...(yearData[clienteId]||{})};
      if(value === null || value === undefined || value === ''){
        delete clienteData[mesN];
      } else {
        clienteData[mesN] = value;
      }
      yearData[clienteId] = clienteData;
      efetividadeRegrasBudget[CURRENT_YEAR] = yearData;
      return {...d, efetividadeRegrasBudget};
    }, null),
    setPenetracaoRegrasBudget: (mesN, clienteId, value) => mutate(d => {
      const penetracaoRegrasBudget = {...(d.penetracaoRegrasBudget||{})};
      const yearData = {...(penetracaoRegrasBudget[CURRENT_YEAR]||{})};
      const clienteData = {...(yearData[clienteId]||{})};
      if(value === null || value === undefined || value === ''){
        delete clienteData[mesN];
      } else {
        clienteData[mesN] = value;
      }
      yearData[clienteId] = clienteData;
      penetracaoRegrasBudget[CURRENT_YEAR] = yearData;
      return {...d, penetracaoRegrasBudget};
    }, null),
    setContasFinalizadasBudget: (mesN, clienteNome, value) => mutate(d => {
      const financeiro = {...d.financeiro};
      const contasFinalizadasBudget = {...(financeiro.contasFinalizadasBudget||{})};
      const yearData = {...(contasFinalizadasBudget[CURRENT_YEAR]||{})};
      const clienteData = {...(yearData[clienteNome]||{})};
      if(value === null || value === undefined || value === ''){
        delete clienteData[mesN];
      } else {
        clienteData[mesN] = value;
      }
      yearData[clienteNome] = clienteData;
      contasFinalizadasBudget[CURRENT_YEAR] = yearData;
      financeiro.contasFinalizadasBudget = contasFinalizadasBudget;
      return {...d, financeiro};
    }, null),

    // NPS (manual, por cliente/mês, com total também editável)
    setNPS: (mesN, clienteId, value) => mutate(d => {
      const nps = {...(d.nps||{})};
      const yearData = {...(nps[CURRENT_YEAR]||{})};
      const clienteData = {...(yearData[clienteId]||{})};
      if(value === null || value === undefined || value === ''){
        delete clienteData[mesN];
      } else {
        clienteData[mesN] = value;
      }
      yearData[clienteId] = clienteData;
      nps[CURRENT_YEAR] = yearData;
      return {...d, nps};
    }, null),
    setNPSTotal: (mesN, value) => mutate(d => {
      const nps = {...(d.nps||{})};
      const yearData = {...(nps[CURRENT_YEAR]||{})};
      const totalData = {...(yearData['_total']||{})};
      if(value === null || value === undefined || value === ''){
        delete totalData[mesN];
      } else {
        totalData[mesN] = value;
      }
      yearData['_total'] = totalData;
      nps[CURRENT_YEAR] = yearData;
      return {...d, nps};
    }, null),

    // cobertura de dados (checklist por base/item/cliente, agora com uma tabela por mês)
    toggleCoberturaDados: (mesN, rowKey, clienteId) => mutate(d => {
      const coberturaDados = {...(d.coberturaDados||{})};
      const yearData = {...(coberturaDados[CURRENT_YEAR]||{})};
      const monthData = {...(yearData[mesN]||{})};
      const rowData = {...(monthData[rowKey]||{})};
      if(rowData[clienteId]){
        delete rowData[clienteId];
      } else {
        rowData[clienteId] = true;
      }
      monthData[rowKey] = rowData;
      yearData[mesN] = monthData;
      coberturaDados[CURRENT_YEAR] = yearData;
      return {...d, coberturaDados};
    }, null),

    // demandas (campos personalizados por nº de ticket, preservados ao atualizar a base)
    updateDemandaCustom: (numero, patch) => mutate(d => {
      const demandasCustom = {...(d.demandasCustom||{})};
      const prev = demandasCustom[numero] || {};
      const who = (authUser && (authUser.displayName || authUser.email)) || 'Desconhecido';
      const nowIso = new Date().toISOString();
      const editMeta = {...(prev._editMeta||{})};
      Object.keys(patch).forEach(k => { editMeta[k] = {by: who, at: nowIso}; });
      demandasCustom[numero] = {...prev, ...patch, _editMeta: editMeta};
      return {...d, demandasCustom};
    }, null),

    // substitui a base de tickets do Movidesk (puxada do Drive) — compartilhada em tempo real
    importDemandasBase: (rows) => mutate(d => ({
      ...d,
      demandasBase: rows,
      demandasBaseSync: {
        by: (authUser && (authUser.displayName || authUser.email)) || 'Desconhecido',
        at: new Date().toISOString(),
        count: rows.length,
      },
    }), `Base do Movidesk atualizada (${rows.length} tickets)`),
  }), [mutate, authUser]);

  if(authUser === undefined){
    return <div className="loading-screen"><span className="spinner"></span>Verificando login...</div>;
  }

  if(authUser === null){
    return (
      <div className="auth-screen">
        <div className="auth-card">
          <div className="auth-mark">BA</div>
          <div className="auth-title">BU Auditoria</div>
          <div className="auth-sub">Entre com sua conta Google da Rivio para acessar o painel.</div>
          <button className="auth-google-btn" onClick={handleSignIn} disabled={signingIn}>
            {signingIn ? 'Entrando...' : 'Entrar com Google'}
          </button>
          {authError && <div className="auth-error">{authError}</div>}
        </div>
      </div>
    );
  }

  if(loading || !data){
    return <div className="loading-screen"><span className="spinner"></span>Carregando dados do time...</div>;
  }

  const meta = SECTION_META[route.section] || SECTION_META.overview;
  let pageTitle = meta.title;
  if(route.section === 'tracking' && route.indicator){
    const ind = INDICADORES.find(i => i.slug === route.indicator);
    if(ind) pageTitle = ind.titulo;
  }
  if(route.section === 'goals' && route.goalId){
    const g = data.metas.find(m => m.id === route.goalId);
    if(g) pageTitle = g.titulo;
  }

  return (
    <div className="app-shell">
      <Sidebar route={route} setRoute={setRoute}/>
      <div className="main">
        <div className="topbar">
          <div>
            <div className="topbar-eyebrow">{meta.eyebrow}</div>
            <div className="topbar-title">{pageTitle}</div>
          </div>
          <div className="topbar-user">
            <div className="sync-indicator"><span className="sync-dot"></span>Tempo real</div>
            {authUser.photoURL
              ? <img className="topbar-user-avatar" src={authUser.photoURL} referrerPolicy="no-referrer" alt=""/>
              : <div className="topbar-user-avatar-fallback">{(authUser.email||'?')[0].toUpperCase()}</div>}
            <span className="topbar-user-email">{authUser.email}</span>
            <button className="topbar-signout-btn" onClick={handleSignOut}>Sair</button>
          </div>
        </div>
        <div className={"content" + (route.section === 'demandas' ? ' content-demandas' : '')}>
          {route.section === 'overview' && <OverviewPage data={data} actions={actions}/>}
          {route.section === 'roles' && <RolesPage data={data} actions={actions}/>}
          {route.section === 'goals' && <GoalsPage data={data} actions={actions}/>}
          {route.section === 'tracking' && (route.indicator ? <TrackingPage slug={route.indicator} financeiro={data.financeiro} upsellScore={data.upsellScore} clientes={data.clientes} actions={actions} data={data}/> : <TrackingIndexPage/>)}
          {route.section === 'rotinas' && <RotinasPage data={data} actions={actions}/>}
          {route.section === 'demandas' && <DemandasPage data={data} actions={actions}/>}
        </div>
      </div>
      <ToastStack toasts={toasts}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
