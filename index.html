function daysBetween(iso, now){
  const start = new Date(iso);
  if(isNaN(start.getTime())) return null;
  const a = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  const b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((b - a) / 86400000);
}

// Último dia do mês `mesN` (1-12) do ano `ano`.
function endOfMonth(ano, mesN){
  return new Date(ano, mesN, 0);
}

// "Dias em aberto" de um ticket avaliados como se o mês `mesN`/`ano` tivesse acabado de terminar —
// ou seja, o ticket só entra na média daquele mês se, no fim daquele mês, ele ainda estivesse aberto
// (nunca finalizado, ou finalizado só depois do fim daquele mês). A contribuição é sempre
// (fim do mês) - (Aberto em), em dias — mesmo para meses já passados, "congelando" o cenário de como
// o mês terminou (por isso o histórico de meses anteriores não muda depois que um ticket é concluído).
// Retorna null quando o ticket não se aplica a esse mês (ainda não tinha sido aberto até o fim dele,
// já tinha sido finalizado até o fim dele, ou — ver `status` abaixo — o ticket já está num status
// terminal mas sem data de conclusão confiável, então não dá pra afirmar que ele "ainda está aberto").
function diasAbertoNoFimDoMes(abertoEmIso, concluidoEmIso, status, ano, mesN){
  const abertoDate = new Date(abertoEmIso);
  if(isNaN(abertoDate.getTime())) return null;
  // Considera apenas tickets abertos dentro do próprio ano `ano` — tickets abertos em anos anteriores
  // não entram nessa média (a partir do pedido do usuário de restringir a métrica aos tickets de 2026).
  if(abertoDate.getFullYear() !== ano) return null;
  // Ticket com status terminal (Resolvido/Cancelado/Fechado) mas sem "Concluído em" preenchido é uma
  // lacuna de dados (comum em cancelamentos, que às vezes não passam pelo mesmo fluxo de resolução no
  // Movidesk) — nesse caso não sabemos a data real de conclusão, então excluímos o ticket da média em
  // vez de contá-lo como "ainda aberto" indefinidamente (o que inflaria todo mês desde a abertura dele,
  // inclusive o mês corrente). Isso é diferente de um ticket genuinamente em aberto.
  if(DEMANDA_STATUS_TERMINAL.includes(status) && !concluidoEmIso) return null;
  // Nunca projeta para o futuro: um mês que ainda nem começou não entra na média, e o mês em curso usa
  // "hoje" como corte em vez do fim do mês (que ainda não aconteceu) — a partir do pedido do usuário de
  // não deixar o cálculo "prever" quantos dias um ticket ainda em aberto teria no fim de um mês futuro.
  const hoje = new Date();
  const inicioDoMes = new Date(ano, mesN - 1, 1);
  if(inicioDoMes > hoje) return null;
  const fimDoMes = endOfMonth(ano, mesN);
  const corteEfetivo = fimDoMes > hoje ? hoje : fimDoMes;
  if(abertoDate > corteEfetivo) return null;
  if(concluidoEmIso){
    const concluidoDate = new Date(concluidoEmIso.includes('T') ? concluidoEmIso : concluidoEmIso + 'T00:00:00');
    if(!isNaN(concluidoDate.getTime()) && concluidoDate <= corteEfetivo) return null;
  }
  return daysBetween(abertoEmIso, corteEfetivo);
}

// Formata um valor em minutos como "Xh Ymin" (ou só "Ymin" quando < 1h) — usado para exibir o Tempo
// 1ª Resposta de um ticket na tabela de Demandas.
function fmtDuracaoMinutos(min){
  if(min === null || min === undefined || isNaN(min)) return '—';
  const totalMin = Math.round(min);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return h > 0 ? `${h}h ${m}min` : `${m}min`;
}

// Retorna true se abertoEmIso caiu no mês `mesN` do ano corrente (CURRENT_YEAR) — usado para agrupar
// métricas pela data de abertura do ticket (diferente de diasAbertoNoFimDoMes, que agrupa pelo
// cenário de fim de mês; aqui o agrupamento é simplesmente "em que mês civil o ticket foi aberto").
function mesAnoAbertura(abertoEmIso, mesN){
  const d = new Date(abertoEmIso);
  if(isNaN(d.getTime())) return false;
  return d.getFullYear() === CURRENT_YEAR && (d.getMonth()+1) === mesN;
}

// Mês (1-12) extraído da coluna "Prazo" (data pura "YYYY-MM-DD") de um ticket — usado no lugar da
// antiga coluna manual "Mês Planning", removida: como todo ticket já tem um Prazo, o mês de
// planejamento passa a ser derivado diretamente dele, em vez de exigir preenchimento manual duplicado.
function mesDoPrazo(prazo){
  if(!prazo) return '';
  const mes = Number(String(prazo).split('-')[1]);
  return mes >= 1 && mes <= 12 ? mes : '';
}

function fmtDataAbertura(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '—';
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return dd + '/' + mm + '/' + d.getFullYear();
}

// "Concluído em" pode vir como data pura "YYYY-MM-DD" (preenchimento manual antigo) ou como
// timestamp ISO completo "YYYY-MM-DDTHH:MM:SS" (sincronizado da coluna "Resolvido Em" do Movidesk) —
// só completa com hora zero quando ainda não tem um "T", em vez de sempre concatenar.
function parseConcluidoEmDate(concluidoEm){
  if(!concluidoEm) return null;
  return new Date(concluidoEm.includes('T') ? concluidoEm : concluidoEm + 'T00:00:00');
}

// Atrasado: se o ticket ainda está aberto, compara o prazo com hoje;
// se já foi concluído (Fechado/Resolvido), compara a data de conclusão informada com o prazo.
// Cancelado nunca é considerado atrasado.
function isDemandaAtrasado(prazo, status, concluidoEm){
  if(!prazo) return false;
  if(status === 'Cancelado') return false;
  const prazoDate = new Date(prazo + 'T00:00:00');
  if(isNaN(prazoDate.getTime())) return false;
  if(DEMANDA_STATUS_TERMINAL.includes(status)){
    if(!concluidoEm) return false;
    const concluidoDate = parseConcluidoEmDate(concluidoEm);
    if(!concluidoDate || isNaN(concluidoDate.getTime())) return false;
    return concluidoDate > prazoDate;
  }
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return prazoDate < today;
}

// Concluída dentro do prazo: só é possível afirmar quando temos prazo E data de conclusão preenchidos.
function isDemandaConcluidaNoPrazo(prazo, status, concluidoEm){
  if(status !== 'Resolvido' && status !== 'Fechado') return false;
  if(!prazo || !concluidoEm) return false;
  return !isDemandaAtrasado(prazo, status, concluidoEm);
}

function parseCsat(v){
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}
function avgCsat(list){
  const nums = list.map(parseCsat).filter(n => n !== null);
  if(nums.length === 0) return null;
  return nums.reduce((a,b)=>a+b,0) / nums.length;
}

// manualRows (opcional): tickets criados diretamente no painel (fora do Movidesk), via o botão "+ Nova
// Demanda Manual" na aba Demandas — ver DEMANDA_STATUS_MANUAL_OPTIONS/actions.addDemandaManual. Cada
// item tem o mesmo formato "o" de uma linha vinda do Movidesk (n/a/s/u/c/r/d/re/tr/csat), então passa
// pelo mesmo `.map` abaixo e ganha as mesmas colunas editáveis (classificação, tipo, prazo, etc.) via
// customMap — só marcado com isManual:true para a UI saber quando liberar edição dos campos "base"
// (assunto, status, urgência, cliente, responsável, data de abertura, CSAT, tempo 1ª resposta) e o
// botão de excluir, que só fazem sentido para um ticket que não vem de uma sincronização externa.
// Cache de 1 posição (memoização por igualdade de referência dos 3 argumentos) — ver
// buildDemandasMerged logo abaixo para o motivo (achado ao vivo em 29/08/2026: travada ao abrir
// Gestão de Metas).
let _buildDemandasMergedCache = null;

function buildDemandasMerged(customMap, baseRows, manualRows){
  // ACHADO AO VIVO (29/08/2026): "Gestão de Metas" travava por um instante ao abrir a aba. Causa: essa
  // função faz um .map() sobre TODOS os tickets de demandas (pode ser milhares, vindos da sincronização
  // do Movidesk), com parsing de datas e vários cálculos por linha — nada absurdo isoladamente, mas
  // getMetaRealizadoByMonth (usada pelas metas baseadas em Demandas: % Entregas Prazo, CSAT, Média dias
  // em aberto, SLA 1ª Resposta) chama buildDemandasMerged de novo do zero em CADA uma das ~4 tabelas de
  // Gestão de Metas (Resumo %, Realizado, Budget, e o card completo de cada meta) — diferente de outras
  // páginas do app, que já memoizam o resultado com useMemo. Pra ~6 metas baseadas em Demandas × ~4
  // chamadas cada, isso repetia o mesmo merge caro 20+ vezes, de forma síncrona, só pra abrir a aba.
  // Em vez de caçar e envolver cada chamada em useMemo (arriscado de esquecer alguma), memoizamos aqui
  // dentro: como os 3 argumentos são sempre as MESMAS referências de objeto dentro do mesmo ciclo de
  // render (só mudam de fato quando o Firestore emite um snapshot novo), um cache de 1 posição por
  // igualdade de referência já elimina o recálculo redundante sem mudar nenhum call site.
  if(_buildDemandasMergedCache
    && _buildDemandasMergedCache.customMap === customMap
    && _buildDemandasMergedCache.baseRows === baseRows
    && _buildDemandasMergedCache.manualRows === manualRows){
    return _buildDemandasMergedCache.result;
  }
  const result = buildDemandasMergedUncached(customMap, baseRows, manualRows);
  _buildDemandasMergedCache = {customMap, baseRows, manualRows, result};
  return result;
}

function buildDemandasMergedUncached(customMap, baseRows, manualRows){
  const custom = customMap || {};
  const now = new Date();
  const synced = (baseRows && baseRows.length) ? baseRows : DEMANDAS_SEED;
  const manual = (manualRows || []).map(o => ({...o, isManual: true}));
  const base = synced.concat(manual);
  return base.map(o => {
    const c = custom[o.n] || {};
    const prazo = c.prazo || '';
    // "Concluído em" vem, em ordem de prioridade: (1) valor MANUAL inserido aqui no painel (via
    // duplo clique na célula) — usado quando o ticket é mantido em aberto no Movidesk aguardando o
    // cliente, e não deve mais impactar os KPIs do time; (2) a coluna "Resolvido Em" sincronizada do
    // Movidesk (campo `re`); (3) o valor manual antigo de antes dessa mudança (c.concluidoEm), como
    // fallback para não perder histórico de tickets preenchidos à mão e ainda não ressincronizados.
    // Uma vez preenchido manualmente, o dado do Movidesk deixa de ser considerado para esse ticket —
    // só volta a valer se o campo manual for limpo (revertido).
    const concluidoEmManual = c.concluidoEmManual || '';
    const concluidoEm = concluidoEmManual || o.re || c.concluidoEm || '';
    // Origem do valor exibido, para a UI saber quando mostrar a tag "manual" e o botão de limpar:
    // 'manual' = preenchido pelo duplo clique (depois da sincronização com Movidesk existir);
    // 'manual-legado' = preenchido à mão ANTES dessa sincronização existir (campo antigo c.concluidoEm,
    // de quando a coluna era 100% manual) — continua editável/limpável do mesmo jeito que o novo campo;
    // 'movidesk' = veio direto da coluna "Resolvido Em" sincronizada, sem edição manual; '' = vazio.
    const concluidoEmOrigem = concluidoEmManual ? 'manual' : (o.re ? 'movidesk' : (c.concluidoEm ? 'manual-legado' : ''));
    // Qualquer dado manual (novo ou legado, de antes desta sincronização existir) conta como "concluído
    // manualmente" para fins de KPI e de exibição da tag/botão de limpar.
    const concluidoManualmente = concluidoEmOrigem === 'manual' || concluidoEmOrigem === 'manual-legado';
    // Status "efetivo" para fins de cálculo de KPI: um ticket com Concluído Em manual (novo ou legado) é
    // tratado como Resolvido nos cálculos (dias em aberto, atraso, SLA), mesmo que o status real no
    // Movidesk ainda esteja "Em aberto" — o badge de Status exibido na tabela continua mostrando o valor
    // real do Movidesk, só o cálculo é que passa a considerar a conclusão manual.
    const statusEfetivo = concluidoManualmente ? 'Resolvido' : o.s;
    // Dias em Aberto: se o ticket já foi finalizado (Fechado/Resolvido/Cancelado, ou com conclusão
    // manual), usa o tempo até a data de conclusão informada (senão fica indefinido — não dá pra saber
    // quanto tempo ficou aberto). Se ainda está aberto, usa o tempo decorrido até hoje.
    let dias;
    if(DEMANDA_STATUS_TERMINAL.includes(statusEfetivo)){
      dias = concluidoEm ? daysBetween(o.d, parseConcluidoEmDate(concluidoEm)) : null;
    } else {
      dias = daysBetween(o.d, now);
    }
    return {
      numero: o.n,
      isManual: !!o.isManual,
      assunto: o.a,
      status: o.s,
      statusEfetivo: statusEfetivo,
      urgencia: o.u,
      cliente: o.c,
      responsavel: o.r,
      abertoEm: o.d,
      diasEmAberto: dias,
      tempoPrimeiraResposta: (o.tr === undefined || o.tr === null) ? null : o.tr, // minutos, vem direto do Movidesk
      csat: c.csatSheet || o.csat || '', // c.csatSheet vem da sincronização SEPARADA da planilha de CSAT (ver importCsatAvaliacao) e tem prioridade; o.csat vem direto da base do Movidesk quando a própria planilha do Movidesk tiver uma coluna "CSAT" (ex.: preenchida com VLOOKUP/PROCV na planilha) — ver transformMovideskRows. Esse segundo caminho evita depender de uma gravação separada em demandasCustom.
      classificacao: c.classificacao || '',
      tipo: c.tipo || '',
      responsavelDesenvolvimentoId: c.responsavelDesenvolvimentoId || '',
      prazo: prazo,
      concluidoEm: concluidoEm,
      concluidoEmManual: concluidoEmManual,
      concluidoManualmente: concluidoManualmente,
      concluidoEmOrigem: concluidoEmOrigem,
      // Antes era um campo 100% manual (c.mesPlanning); agora é derivado direto da coluna Prazo — a
      // coluna "Mês Planning" foi removida da tabela de Demandas, mas o campo `mesPlanning` continua
      // existindo aqui (com o mês do Prazo) para não precisar alterar todo indicador/filtro que já lia
      // esse campo (% Entregas Prazo, CSAT por mês, filtro "Mês Planning" etc.).
      mesPlanning: mesDoPrazo(prazo),
      // Mês de conclusão do ticket (data de "Concluído Em", não a data de Prazo) — usado especificamente
      // pelas metas de CSAT (CSAT Tech/Atendimento/Produto), que devem contar o CSAT no mês em que o
      // ticket foi de fato concluído/avaliado, não no mês do prazo original (ajuste pedido em 27/08/2026).
      // mesDoPrazo funciona igual para qualquer string de data "YYYY-MM-DD..." (extrai o 2º campo ao
      // dividir por "-"), então reaproveitada aqui em vez de duplicar a lógica.
      mesConclusao: mesDoPrazo(concluidoEm),
      prioridade: c.prioridade || '',
      esforco: (c.esforco === undefined || c.esforco === null || c.esforco === '') ? null : Number(c.esforco),
      atrasado: isDemandaAtrasado(prazo, statusEfetivo, concluidoEm),
      concluidaNoPrazo: isDemandaConcluidaNoPrazo(prazo, statusEfetivo, concluidoEm),
      editMeta: c._editMeta || {},
    };
  });
}

// Formata o metadado de última edição de um campo para exibir em tooltip.
// meta = { by: 'nome ou e-mail', at: 'ISO timestamp' }
function fmtEditMetaTooltip(meta){
  if(!meta || !meta.by || !meta.at) return null;
  const d = new Date(meta.at);
  if(isNaN(d.getTime())) return null;
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const mo = String(d.getMonth()+1).padStart(2,'0');
  return `Última edição feita por ${meta.by} às ${hh}:${mm} do dia ${dd}.${mo}`;
}

// em data.metas) quanto na tela de Gestão de Metas (para exibir "Área / Título" e ordenar as metas).

// Ordem de exibição das metas em Gestão de Metas (tabelas-resumo e cartões), agrupada por área —
// não é a mesma ordem/lista de INDICADORES_NAV (que define a barra lateral de Acompanhamento de
// Metas). Metas customizadas (sem slug, criadas manualmente pelo usuário) não entram aqui — elas são
// exibidas depois de todas as listadas, em ordem alfabética.
const GESTAO_METAS_ORDEM = [
  'nps', 'margem-bruta',
  'upsell-score', 'contas-finalizadas', 'ticket-medio',
  'penetracao-regras', 'efetividade-regras', 'subfaturamento', 'contas-automatico',

];
const GESTAO_METAS_ORDEM_INDEX = Object.fromEntries(GESTAO_METAS_ORDEM.map((slug, i) => [slug, i]));

// Ordena uma lista de metas (data.metas ou um subconjunto filtrado) na ordem definida acima; metas
// não listadas (customizadas, ou um indicador novo que ainda não foi adicionado a GESTAO_METAS_ORDEM)
// vão para o final, em ordem alfabética por título.
function ordenarMetasGestao(goals){
  return [...goals].sort((a, b) => {
    const ia = a.slug && GESTAO_METAS_ORDEM_INDEX[a.slug] !== undefined ? GESTAO_METAS_ORDEM_INDEX[a.slug] : Infinity;
    const ib = b.slug && GESTAO_METAS_ORDEM_INDEX[b.slug] !== undefined ? GESTAO_METAS_ORDEM_INDEX[b.slug] : Infinity;
    if(ia !== ib) return ia - ib;
    return (a.titulo || '').localeCompare(b.titulo || '', 'pt-BR');
  });
}

const AREA_PALETTE = ['#2C5AA0','#1F8A70','#B8862B','#8A4FBE','#C4432B','#2B8FA6','#6B5BD6','#A85A9E'];
function colorForArea(area){
  if(!area) return '#8A8FA6';
  let hash = 0;
  for(let i=0;i<area.length;i++){ hash = area.charCodeAt(i) + ((hash<<5)-hash); }
  return AREA_PALETTE[Math.abs(hash) % AREA_PALETTE.length];
}
function initials(name){
  if(!name) return '?';
  const parts = name.trim().split(/\s+/);
  if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
}
function uid(){ return 'id_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

// Id DETERMINÍSTICO a partir de um texto (categoria+descrição) — usado pra semear catálogos fixos (ex.:
// PRODUTO_FUNCOES_SEED) com o MESMO id sempre que essa mesma entrada for processada, ao contrário de
// uid() (aleatório). Ver comentário em runMigrations/produtoFuncoesSeeded (achado ao vivo em 29/08/2026)
// pro motivo: se o flag que marca "já semeei" nunca fica confirmado como persistido no servidor (uma
// aba fecha antes da escrita confirmar, um snapshot antigo do cache local do Firestore é processado
// antes do dado real chegar, etc.), a semeadura roda de novo — com uid() aleatório isso gera um NOVO
// lote de ids a cada execução, órfãos dos checks/edições já salvos sob os ids antigos (o check "pisca e
// volta" pro usuário, porque o id que ele marcou na tela não é mais o id que aparece depois do próximo
// snapshot). Com id determinístico, rodar a semeadura de novo por engano produz os MESMOS ids de sempre
// — os checks continuam batendo, e o filtro "já existe esse id" abaixo evita duplicar a linha.
function slugifyId(prefix, text){
  const norm = String(text||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-+|-+$)/g,'');
  return prefix + '_' + norm;
}
// Pedido em 30/08/2026: o "check" da grade de Cobertura Produto (funções x clientes) deixa de ser
// binário e passa a ter 4 estados possíveis, ciclados por clique (branco -> verde -> amarelo -> N/A ->
// branco). Valores legados gravados como boolean `true` (do check binário antigo) são interpretados como
// 'ativo' (verde) — mesmo peso que tinham antes — sem precisar de uma migração de dados.
const PRODUTO_FUNCAO_CHECK_STATES = [null, 'ativo', 'refinado', 'na'];
const PRODUTO_FUNCAO_CHECK_LABELS = { ativo: 'Ativo — conta 1 na cobertura', refinado: 'Refinado, ainda não ativo — conta 0,5 na cobertura', na: 'Não se aplica — não entra na conta (nem no numerador, nem no denominador)' };
function normalizeProdutoFuncaoCheckState(v){
  if(v === true) return 'ativo'; // dado legado do check binário antigo
  if(v === 'ativo' || v === 'refinado' || v === 'na') return v;
  return null;
}
function nextProdutoFuncaoCheckState(current){
  const idx = PRODUTO_FUNCAO_CHECK_STATES.indexOf(normalizeProdutoFuncaoCheckState(current));
  return PRODUTO_FUNCAO_CHECK_STATES[(idx + 1) % PRODUTO_FUNCAO_CHECK_STATES.length];
}
// Peso do estado na cobertura: 'na' não entra nem no numerador nem no denominador (retorna null pro
// denominador não contar essa célula); 'ativo' vale 1; 'refinado' vale 0,5; branco vale 0 (mas ainda
// entra no denominador).
function produtoFuncaoCheckWeight(state){
  if(state === 'na') return null;
  if(state === 'ativo') return 1;
  if(state === 'refinado') return 0.5;
  return 0;
}
function fmtNumber(v){
  const n = Number(v)||0;
  return n.toLocaleString('pt-BR', {maximumFractionDigits: 2});
}
function isUrlLike(str){
  return typeof str === 'string' && /^https?:\/\//i.test(str.trim());
}
function fmtCurrency(v){
  if(v === undefined || v === null || v === '') return null;
  const n = Number(v)||0;
  const sign = n < 0 ? '-' : '';
  return sign + 'R$ ' + Math.abs(n).toLocaleString('pt-BR');
}
function fmtPercent(v, digits){
  const n = Number(v)||0;
  return n.toLocaleString('pt-BR', {minimumFractionDigits: digits ?? 1, maximumFractionDigits: digits ?? 1}) + '%';
}

// reportando quaisquer nomes que não batam com nenhum cliente cadastrado (em vez de descartá-los
// silenciosamente — mesma lição aprendida na sincronização do Movidesk).
function mapClienteNomeParaId(porClienteNome, clientes){
  const porClienteId = {};
  const naoMapeados = [];
  Object.keys(porClienteNome).forEach(nome => {
    const id = findClienteId(clientes, nome);
    if(id) porClienteId[id] = porClienteNome[nome];
    else naoMapeados.push(nome);
  });
  return {porClienteId, naoMapeados};
}

// Re-applies the org-chart-based participant rules to already-persisted routines
// that match a known seed (same dia + título + cliente). Custom routines the
// person created themselves (no matching spec) are left untouched.
function reconcileRotinaParticipants(pessoas, clientes, rotinas){
  const cid = (nome) => findClienteId(clientes, nome);
  const specs = buildRotinaSpecs(pessoas);
  let changed = false;
  const next = (rotinas || []).map(r => {
    const match = specs.find(s => s.dia === r.dia && s.titulo === r.titulo && cid(s.cliente) === r.clienteId);
    if(!match) return r;
    const same = JSON.stringify([...match.participantes].sort()) === JSON.stringify([...(r.participanteIds||[])].sort());
    if(same) return r;
    changed = true;
    return {...r, participanteIds: match.participantes};
  });
  return {rotinas: next, changed};
}

const UPSELL_PILLARS = [
  {n:1, nome:'Relacionamento', kpis:[

function clampNum(v, min, max){ return Math.min(max, Math.max(min, v)); }
function isEmptyVal(v){ return v === null || v === undefined || v === ''; }

function scorePct100(v){ if(isEmptyVal(v)) return null; return clampNum(Number(v),0,100)/100*10; }
function scoreTempo(v){
  if(isEmptyVal(v)) return null;
  const t = Number(v);
  if(t<=30) return 10;
  return clampNum(10 - Math.ceil((t-30)/30), 0, 10);
}
function scoreCSAT(v){ if(isEmptyVal(v)) return null; return clampNum(Number(v)*2, 0, 10); }
function scoreDiasAberto(v){
  if(isEmptyVal(v)) return null;
  const d = Number(v);
  const table = [[5,10],[8,9],[10,8],[12,7],[14,6],[16,5],[18,4],[20,3],[22,2],[24,1]];
  for(const [max,score] of table){ if(d<=max) return score; }
  return 0;
}
const SUBFAT_TABLE = [[0,0],[0.1,1],[0.4,2],[0.7,3],[0.9,4],[1.2,5],[1.5,6],[2,7],[3,8],[4,9],[5,10]];
const CONTASAUTO_TABLE = [[0,0],[1,1],[4,2],[6,3],[8,4],[10,5],[15,6],[20,7],[30,8],[40,9],[50,10]];
function scoreBracketAsc(v, table){
  if(isEmptyVal(v)) return null;
  const n = Number(v);
  let result = table[0][1];
  for(const [min,score] of table){ if(n>=min) result = score; }
  return result;
}
const TERMOMETRO_MAP = {quente:2.5, morno:2, frio:0};
function scoreTermometro(sub){
  if(!sub) return null;
  let sum = 0, any = false;
  Object.keys(sub).forEach(k => { if(sub[k]){ sum += TERMOMETRO_MAP[sub[k]] || 0; any = true; } });
  return any ? clampNum(sum, 0, 10) : null;
}
function scoreRitos(sub){
  if(!sub) return null;
  let sum = 0, any = false;
  Object.keys(sub).forEach(k => { if(sub[k]){ sum += 2.5; any = true; } });
  return any ? clampNum(sum, 0, 10) : null;
}
function computeKpiScore(kpi, monthData){
  if(!monthData) return null;
  const raw = monthData[kpi.key];
  switch(kpi.tipo){
    case 'pct100': return scorePct100(raw);
    case 'tempo': return scoreTempo(raw);
    case 'csat': return scoreCSAT(raw);
    case 'diasAberto': return scoreDiasAberto(raw);
    case 'subfat': return scoreBracketAsc(raw, SUBFAT_TABLE);
    case 'contasAuto': return scoreBracketAsc(raw, CONTASAUTO_TABLE);
    case 'termometro': return scoreTermometro(raw);
    case 'ritos': return scoreRitos(raw);
    default: return null;
  }
}
function computePillarScore(pillar, monthData){
  const scores = pillar.kpis.map(k => computeKpiScore(k, monthData)).filter(s => s !== null && s !== undefined);
  if(scores.length === 0) return null;
  return scores.reduce((a,b)=>a+b,0) / scores.length;
}
function computeUpsellScore(monthData){
  const scores = UPSELL_PILLARS.map(p => computePillarScore(p, monthData)).filter(s => s !== null && s !== undefined);
  if(scores.length === 0) return null;
  return scores.reduce((a,b)=>a+b,0) / scores.length;
}
function fmtScore(v){
  if(v === null || v === undefined) return '—';
  return v.toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1});
}
function avgOf(values){
  const nums = values.filter(v => v !== null && v !== undefined && !isNaN(v));
  if(nums.length === 0) return null;
  return nums.reduce((a,b)=>a+b,0) / nums.length;
}

function reconcileTarefaTitles(tarefas){
  let changed = false;
  const next = (tarefas || []).map(t => {
    const novo = TASK_TITLE_UPDATES[t.titulo];
    if(novo && novo !== t.titulo){
      changed = true;
      return {...t, titulo: novo};
    }
    return t;
  });
  return {tarefas: next, changed};
}

function runMigrations(parsed){
      let changed = false;
      // migrate: seed the org chart if no one has been added yet
      if(!parsed.pessoas || parsed.pessoas.length === 0){
        parsed.pessoas = buildSeedPessoas();
        changed = true;
      }
      // migrate: rename "Client Lead" area label to "Deployment Lead"
      if(parsed.pessoas && parsed.pessoas.some(p => p.area === 'Client Lead')){
        parsed.pessoas = parsed.pessoas.map(p => p.area === 'Client Lead' ? {...p, area: 'Deployment Lead'} : p);
        changed = true;
      }
      // migrate: ensure the "Interno" client exists
      if(!parsed.clientes) parsed.clientes = [];
      if(!parsed.clientes.some(c => c.nome.toLowerCase() === 'interno')){
        parsed.clientes = [...parsed.clientes, {id: uid(), nome: 'Interno'}];
        changed = true;
      }
      // migrate: seed rotinas if none exist yet
      if(!parsed.rotinas || parsed.rotinas.length === 0){
        parsed.rotinas = buildSeedRotinas(parsed.pessoas, parsed.clientes);
        changed = true;
      } else {
        const {rotinas: fixed, changed: fixedChanged} = reconcileRotinaParticipants(parsed.pessoas, parsed.clientes, parsed.rotinas);
        if(fixedChanged){ parsed.rotinas = fixed; changed = true; }
      }
      // migrate: seed tarefas if none exist yet
      if(!parsed.tarefas || parsed.tarefas.length === 0){
        parsed.tarefas = buildSeedTarefas(parsed.pessoas, parsed.clientes);
        changed = true;
      } else {
        const {tarefas: fixedTitles, changed: titlesChanged} = reconcileTarefaTitles(parsed.tarefas);
        if(titlesChanged){ parsed.tarefas = fixedTitles; changed = true; }
      }
      // migrate: seed financeiro/P&L data if missing
      if(!parsed.financeiro || !parsed.financeiro.pnl || Object.keys(parsed.financeiro.pnl).length === 0){
        parsed.financeiro = buildSeedFinanceiro();
        changed = true;
      } else if(!parsed.financeiro.contasFinalizadas){
        parsed.financeiro.contasFinalizadas = buildSeedFinanceiro().contasFinalizadas;
        changed = true;
      }
      // migrate: ensure upsellScore field exists
      if(!parsed.upsellScore){
        parsed.upsellScore = {};
        changed = true;
      }
      // migrate: ensure efetividadeRegras field exists
      if(!parsed.efetividadeRegras){
        parsed.efetividadeRegras = {};
        changed = true;
      }
      // migrate: ensure penetracaoRegras field exists
      if(!parsed.penetracaoRegras){
        parsed.penetracaoRegras = {};
        changed = true;
      }
      // migrate: ensure budget fields (definidos direto na tela do indicador) existem
      if(!parsed.efetividadeRegrasBudget){
        parsed.efetividadeRegrasBudget = {};
        changed = true;
      }
      if(!parsed.penetracaoRegrasBudget){
        parsed.penetracaoRegrasBudget = {};
        changed = true;
      }
      if(parsed.financeiro && !parsed.financeiro.contasFinalizadasBudget){
        parsed.financeiro.contasFinalizadasBudget = {};
        changed = true;
      }
      // migrate: ensure Subfaturamento / % Contas Automático fields exist (metas criadas em Ago/2026)
      if(parsed.financeiro){
        ['subfaturamento','subfaturamentoBudget','contasAutomatico','contasAutomaticoBudget'].forEach(k => {
          if(!parsed.financeiro[k]){ parsed.financeiro[k] = {}; changed = true; }
        });
      }
      // migrate: seed/convert NPS data to the manual per-client editable format
      if(!parsed.nps || Object.keys(parsed.nps).length === 0){
        parsed.nps = buildSeedNPSManual(parsed.clientes);
        changed = true;
      } else {
        const yearData = parsed.nps[CURRENT_YEAR] || {};
        const validIds = new Set(parsed.clientes.map(c => c.id));
        const looksOld = Object.keys(yearData).some(k => k !== '_total' && !validIds.has(k));
        if(looksOld){
          parsed.nps = buildSeedNPSManual(parsed.clientes);
          changed = true;
        }
      }
      // migrate: ensure coberturaDados field exists
      if(!parsed.coberturaDados){
        parsed.coberturaDados = {};
        changed = true;
      } else {
        // migrate: coberturaDados passou a ter uma dimensão de mês (ano -> mês -> rowKey -> clienteId).
        // formato antigo era plano (rowKey -> clienteId -> true). Detecta pelo formato das chaves de topo.
        const topKeys = Object.keys(parsed.coberturaDados);
        const looksOldFlat = topKeys.some(k => k.includes('__'));
        if(looksOldFlat){
          const oldFlat = parsed.coberturaDados;
          const nowMonth = new Date().getMonth() + 1;
          parsed.coberturaDados = {[CURRENT_YEAR]: {[nowMonth]: oldFlat}};
          changed = true;
        } else if(!parsed.coberturaDados[CURRENT_YEAR]){
          parsed.coberturaDados[CURRENT_YEAR] = {};
          changed = true;
        }
      }
      // migrate: adiciona as novas funções de Papéis e Responsabilidades (Deployment/Produto) cadastradas em Ago/2026,
      // caso ainda não existam na base salva (checagem por título, idempotente)
      if(parsed.tarefas){
        const titulosExistentes = new Set(parsed.tarefas.map(t => t.titulo));
        const faltantes = NOVAS_FUNCOES_2026_08_TITULOS.filter(t => !titulosExistentes.has(t));
        if(faltantes.length){
          const todasNovas = buildSeedTarefas(parsed.pessoas, parsed.clientes)
            .filter(t => faltantes.includes(t.titulo));
          parsed.tarefas = [...parsed.tarefas, ...todasNovas];
          changed = true;
        }
      }
      // migrate: ensure demandasCustom field exists (campos editáveis por nº de ticket)
      if(!parsed.demandasCustom){
        parsed.demandasCustom = {};
        changed = true;
      }
      // migrate: associa cada meta ao slug do indicador correspondente, para conectar o Realizado automático
      if(parsed.metas && parsed.metas.some(m => !m.slug)){
        const byTitulo = {};
        INDICADORES.forEach(ind => { byTitulo[ind.titulo] = ind.slug; });
        const sameLength = parsed.metas.length === INDICADORES.length;
        parsed.metas = parsed.metas.map((m, i) => {
          if(m.slug) return m;
          const slugByTitulo = byTitulo[m.titulo];
          const slug = slugByTitulo || (sameLength ? INDICADORES[i].slug : undefined);
          return slug ? {...m, slug} : m;
        });
        changed = true;
      }
      // migrate: remove metas cujo slug não existe mais em INDICADORES (ex.: um indicador removido do
      // painel). Metas criadas manualmente pelo usuário (sem slug) nunca são afetadas por essa limpeza.
      if(parsed.metas){
        const slugsValidos = new Set(INDICADORES.map(i => i.slug));
        const antes = parsed.metas.length;
        parsed.metas = parsed.metas.filter(m => !m.slug || slugsValidos.has(m.slug));
        if(parsed.metas.length !== antes) changed = true;
      }
      // migrate: adiciona em "Gestão de Metas" as metas novas que passaram a existir em INDICADORES
      // (ex.: Relacionamento reaproveita o slug 'upsell-score' já existente; Subfaturamento e
      // % Contas Automático são metas novas de Ago/2026) — idempotente, por slug.
      // O id é determinístico ('ind_' + slug), não uid() aleatório: como essa migração roda em TODO
      // onSnapshot (não só uma vez), se dois eventos de snapshot chegassem em sequência rápida antes do
      // primeiro persistPatch confirmar no servidor, um id aleatório geraria uma SEGUNDA meta duplicada
      // com id diferente a cada corrida — e um "Editar" aberto na primeira renderização ficaria com um
      // id que não existe mais em d.metas por baixo dos panos, fazendo o editGoal virar no-op silencioso
      // (o toast "Meta atualizada" dispara, mas nada muda no card). Com id determinístico, mesmo que essa
      // migração rode mais de uma vez, ela sempre aponta pro mesmo id — sem duplicar.
      if(parsed.metas){
        const slugsExistentes = new Set(parsed.metas.map(m => m.slug).filter(Boolean));
        const faltantes = INDICADORES.filter(ind => !slugsExistentes.has(ind.slug));
        if(faltantes.length){
          parsed.metas = [...parsed.metas, ...faltantes.map(ind => ({
            id: 'ind_' + ind.slug, slug: ind.slug, titulo: ind.metaTitulo || ind.titulo, descricao: ind.descricao,
            fonte: ind.fonte, unidadeMedida: ind.unidade, pessoaIds: [], budgets: {},
          }))];
          changed = true;
        }
      }
      // migrate: corrige bases que já ficaram com metas DUPLICADAS pro mesmo slug (efeito colateral do
      // bug acima, antes do id determinístico) — mescla todas as duplicatas de um slug em uma só,
      // unindo pessoaIds e budgets, e remove as demais. Sem isso, editar a meta duplicada errada continua
      // parecendo "não salvar" mesmo depois dessa correção.
      if(parsed.metas){
        const bySlug = {};
        let temDuplicata = false;
        parsed.metas.forEach(m => {
          if(!m.slug) return;
          if(bySlug[m.slug]) temDuplicata = true;
          else bySlug[m.slug] = [];
          (bySlug[m.slug] = bySlug[m.slug] || []).push(m);
        });
        if(temDuplicata){
          const merged = [];
          const vistos = new Set();
          parsed.metas.forEach(m => {
            if(!m.slug){ merged.push(m); return; }
            if(vistos.has(m.slug)) return;
            vistos.add(m.slug);
            const dups = bySlug[m.slug];
            if(dups.length === 1){ merged.push(m); return; }
            const pessoaIds = Array.from(new Set(dups.flatMap(d => d.pessoaIds || [])));
            const budgetsMerged = Object.assign({}, ...dups.map(d => d.budgets || {}));
            const preferida = dups.find(d => d.id === ('ind_' + m.slug)) || dups[0];
            merged.push({...preferida, pessoaIds, budgets: budgetsMerged});
          });
          parsed.metas = merged;
          changed = true;
        }
      }
      // migrate: sincroniza título, descrição, unidade e fonte de cada meta com a definição mais
      // recente do indicador correspondente (por slug) — permite renomear/redefinir um indicador em
      // INDICADORES (ex.: "Upsell Score" -> "Relacionamento") e ter isso refletido em bases já salvas.
      // Usa ind.metaTitulo quando definido (ex.: 'margem-bruta' aparece só como "Margem Bruta" em
      // Gestão de Metas, apesar da aba combinada em Acompanhamento de Metas se chamar "Margem Bruta &
      // Ticket Médio") — ind.titulo continua sendo o nome usado na barra lateral e no cabeçalho da página.
      // Metas com `defsCustomizadas: true` (usuário editou Título/Descrição/Fonte/Unidade manualmente
      // pelo modal "Editar meta" — ver actions.editGoal) NÃO são mais sobrescritas aqui, senão a edição
      // "não salva de verdade": ela fica visível por um instante e volta pro texto padrão assim que essa
      // migração roda de novo (a cada carregamento/snapshot).
      if(parsed.metas){
        const indBySlug = {};
        INDICADORES.forEach(ind => { indBySlug[ind.slug] = ind; });
        let defsChanged = false;
        parsed.metas = parsed.metas.map(m => {
          if(m.defsCustomizadas) return m;
          const ind = m.slug && indBySlug[m.slug];
          if(!ind) return m;
          const tituloEsperado = ind.metaTitulo || ind.titulo;
          if(m.titulo === tituloEsperado && m.descricao === ind.descricao && m.fonte === ind.fonte && m.unidadeMedida === ind.unidade){
            return m;
          }
          defsChanged = true;
          return {...m, titulo: tituloEsperado, descricao: ind.descricao, fonte: ind.fonte, unidadeMedida: ind.unidade};
        });
        if(defsChanged) changed = true;
      }
      // migrate: semeia a lista inicial de funções do produto (Cobertura Produto) na primeira vez que a
      // base é migrada. Usa um flag dedicado (produtoFuncoesSeeded), não "lista vazia", pra não voltar a
      // inserir as funções padrão se o usuário apagar alguma delas de propósito depois.
      //
      // ACHADO AO VIVO (29/08/2026): usuário reportou checkbox de "Cobertura Produto" que "pisca e volta"
      // nas funções do catálogo padrão — corrigido com id determinístico (slugifyId) + checagem por
      // conteúdo (ver abaixo). Depois disso, apareceu um SEGUNDO sintoma: excluir ou editar uma função do
      // catálogo padrão "voltava sozinha" pra versão original. Causa: este bloco calcula a semeadura AQUI
      // só pra exibição LOCAL imediata (pra quem abre o app pela 1ª vez já ver o catálogo, antes mesmo da
      // escrita confirmar) — mas ele não é mais responsável por PERSISTIR isso. Antes, esse resultado
      // entrava no mesmo "patch" genérico de migração, gravado com uma escrita CEGA (persistPatch, sem
      // reler o servidor no momento exato da escrita); se essa escrita saísse computada a partir de um
      // snapshot antigo — por exemplo, de antes de o usuário excluir ou editar uma função — ela
      // sobrescrevia produtoFuncoes inteiro com a versão de antes da ação, desfazendo-a. A persistência
      // real e seed agora é feita por ensureProdutoFuncoesSeededOnce (ver acima, perto de persistPatch),
      // que lê o servidor bem no momento da escrita e nunca mexe em produtoFuncoes se já estiver semeado
      // — as chaves produtoFuncoes/produtoFuncoesSeeded são explicitamente excluídas do patch de migração
      // logo abaixo (ver onSnapshot), então elas não são gravadas às cegas nunca mais.
      if(!parsed.produtoFuncoesSeeded){
        const existentes = new Set((parsed.produtoFuncoes||[]).map(f => f.id));
        const faltando = PRODUTO_FUNCOES_SEED
          .map(f => ({id: slugifyId('pf', f.categoria + '|' + f.descricao), ...f}))
          .filter(f => !existentes.has(f.id));
        if(faltando.length){
          parsed.produtoFuncoes = [...(parsed.produtoFuncoes||[]), ...faltando];
        }
        parsed.produtoFuncoesSeeded = true;
        // (Não marca `changed=true` aqui de propósito — ver comentário acima. A persistência desses 2
        // campos é feita à parte, com leitura fresca no momento da escrita, por ensureProdutoFuncoesSeededOnce.)
      }
      return {data: parsed, changed};
}

// Fonte de dados legada (antes da migração para Firebase): usada apenas UMA VEZ,
// para semear a base compartilhada do Firestore com os dados já existentes localmente
// na primeira vez que este arquivo é aberto após a migração. Depois disso, o Firestore
// passa a ser a única fonte de verdade (tempo real, compartilhada entre usuários).
async function loadLegacyLocalData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      const {data} = runMigrations(parsed);
      return data;
    }
  }catch(e){ /* key not found or storage unavailable */ }
  return buildDefaultData();
}

/* ---------------------------------------------------------------
   FIRESTORE (base compartilhada em tempo real)
--------------------------------------------------------------- */
const FIRESTORE_COLLECTION = 'gestaoAuditoria';
const FIRESTORE_DOC_ID = 'appData';

function waitForFirebase(){
  return new Promise(resolve => {
    if(window.__firebaseReady) return resolve(window.__firebase);
    const iv = setInterval(() => {
      if(window.__firebaseReady){ clearInterval(iv); resolve(window.__firebase); }
    }, 30);
  });
}

async function getAppDataDocRef(){
  const fb = await waitForFirebase();
  return fb.doc(fb.db, FIRESTORE_COLLECTION, FIRESTORE_DOC_ID);
}

// Garante que o documento compartilhado existe no Firestore. Se ainda não existir
// (primeiro uso após a migração), semeia com os dados locais já existentes neste
// computador (ou com a base padrão, se não houver nada salvo localmente).
async function ensureFirestoreSeeded(){
  const fb = await waitForFirebase();
  const ref = await getAppDataDocRef();
  const snap = await fb.getDoc(ref);
  if(!snap.exists()){
    const seed = await loadLegacyLocalData();
    await fb.setDoc(ref, seed);
    return seed;
  }
  return null;
}

// Semeia produtoFuncoes/produtoFuncoesSeeded (catálogo padrão de Cobertura Produto) de forma SEGURA —
// ver achado ao vivo em 29/08/2026 acima (comentário perto de runMigrations) sobre o bug do checkbox
// "pisca e volta". Depois de corrigir isso com id determinístico, apareceu um segundo sintoma: excluir
// ou editar uma função do catálogo padrão "voltava sozinha" pra versão original. Causa: essa semeadura
// vivia dentro de runMigrations, que roda a CADA snapshot do Firestore (não só uma vez) e persistia via
// persistPatch — uma escrita CEGA (sem reler o servidor no momento exato da escrita), usando um "patch"
// calculado em cima de um snapshot que podia já estar desatualizado quando a escrita de fato saía (ex.:
// o usuário tinha acabado de editar ou excluir uma função havia poucos instantes). Se essa escrita cega
// saísse DEPOIS da edição/exclusão do usuário, ela sobrescrevia o campo produtoFuncoes inteiro com a
// versão antiga (de antes da edição/exclusão) — desfazendo a ação do usuário.
// Esta função, ao contrário, roda UMA VEZ por sessão desta aba (guardada por
// produtoFuncoesSeedAttemptedGlobal) e faz leitura-cálculo-escrita-confirmação num único ciclo curto,
// sempre a partir do estado MAIS FRESCO do servidor lido bem no momento da escrita — nunca a partir de
// um snapshot antigo guardado em memória. Além disso, se o servidor já tiver produtoFuncoesSeeded=true
// (achado logo na leitura fresca), ela NÃO MEXE em produtoFuncoes de jeito nenhum — respeitando pra
// sempre qualquer edição ou exclusão que o usuário já tenha feito no catálogo padrão.
let produtoFuncoesSeedAttemptedGlobal = false;
async function ensureProdutoFuncoesSeededOnce(){
  if(produtoFuncoesSeedAttemptedGlobal) return;
  produtoFuncoesSeedAttemptedGlobal = true;
  try{
    const fb = await waitForFirebase();
    const ref = await getAppDataDocRef();
    const snap = await fb.getDoc(ref);
    const current = snap.exists() ? snap.data() : {};
    // Já foi semeado de verdade alguma vez (mesmo que em outra sessão/dia) — não mexe em produtoFuncoes
    // nunca mais, pra não reverter exclusões/edições feitas pelo usuário desde então.
    if(current.produtoFuncoesSeeded) return;
    const existentes = new Set((current.produtoFuncoes || []).map(f => f.id));
    const faltando = PRODUTO_FUNCOES_SEED
      .map(f => ({id: slugifyId('pf', f.categoria + '|' + f.descricao), ...f}))
      .filter(f => !existentes.has(f.id));
    const patch = {
      produtoFuncoes: faltando.length ? [...(current.produtoFuncoes || []), ...faltando] : (current.produtoFuncoes || []),
      produtoFuncoesSeeded: true,
    };
    await fb.updateDoc(ref, patch);
    const verifySnap = await fb.getDoc(ref);
    const verifyData = verifySnap.exists() ? verifySnap.data() : {};
    const ok = verifyData.produtoFuncoesSeeded === true && deepEqual(verifyData.produtoFuncoes, patch.produtoFuncoes);
    if(!ok){
      console.error('Semeadura de funções de produto não confirmada pelo servidor — tentará de novo na próxima sessão.');
      produtoFuncoesSeedAttemptedGlobal = false;
    }
  }catch(e){
    console.error('Erro ao semear funções de produto', e);
    produtoFuncoesSeedAttemptedGlobal = false;
  }
}

async function persistPatch(patch){
  try{
    const fb = await waitForFirebase();
    const ref = await getAppDataDocRef();
    await fb.updateDoc(ref, patch);
    return true;
  }catch(e){
    console.error('Firestore write error', e);
    return false;
  }
}

// Escrita segura para ações em LOTE que tocam muitos tickets de demandasCustom de uma vez (ex.:
// sincronização de CSAT). Diferente de persistPatch (que grava um objeto local, possivelmente
// desatualizado, já calculado no cliente), esta função usa uma TRANSAÇÃO do Firestore: lê o documento
// mais recente do SERVIDOR no exato momento da escrita, aplica `mergeFn` sobre o demandasCustom recém-lido
// (não sobre o estado local do React, que pode estar minutos desatualizado se a aba ficou aberta), e
// grava o resultado — tudo atomicamente. Isso evita a "perda de atualização" que uma substituição direta
// do campo demandasCustom inteiro (baseada em estado local antigo) causaria se outro usuário/aba tivesse
// editado um ticket diferente entre o carregamento da página e o clique em "Atualizar CSAT".
// Generaliza o mesmo padrão seguro de persistDemandasCustomMerge (ler o valor mais recente do SERVIDOR,
// aplicar `mergeFn` em cima dele, gravar, e reler pra confirmar) para QUALQUER campo de topo que seja uma
// lista/objeto compartilhado por várias ações (ex.: `metas`) — não só `demandasCustom`. Achado ao vivo em
// produção (27/08/2026): o mesmo padrão de "substituir o campo inteiro a partir do estado local desta
// aba" que causava o bug do CSAT em `demandasCustom` também afeta `metas` (e, por extensão, qualquer outro
// campo editado por `mutate()`) — reproduzido ao editar a descrição da meta "Margem Bruta": a edição
// aparecia na tela por ~2s e depois revertia de verdade no servidor, porque outra gravação (de outra
// aba/sessão, com a lista de metas desatualizada) reescreveu `metas` inteiro por cima. `editGoal`/
// `addGoal`/`deleteGoal` foram migrados pra usar isto em vez de `mutate()` — os demais campos (pessoas,
// rotinas, tarefas etc.) continuam com o padrão antigo e podem sofrer do mesmo problema se dois usuários
// mexerem neles quase ao mesmo tempo.
// Versão geral de persistTopLevelFieldMerge: aceita UM OU MAIS campos de topo de uma vez, cada um com sua
// própria função de merge — `mergeFns` é um objeto {nomeDoCampo: (valorAtualNoServidor) => novoValor}.
// Lê o documento UMA vez, aplica cada mergeFn sobre o valor atual DAQUELE campo no servidor (não sobre o
// estado local desta aba), grava todos os campos resultantes numa única chamada, e confirma relendo.
// Extraído em 27/08/2026 depois de encontrar (e corrigir) o mesmo bug de "substituir o campo inteiro a
// partir do estado local" em `demandasCustom` (CSAT) e depois em `metas` (Gestão de Metas) — ambos casos
// de um campo específico sendo sobrescrito porque a ação usava mutate() (baseado em estado local,
// possivelmente desatualizado se outra aba/pessoa gravou algo enquanto esta aba estava aberta). Esta
// função generaliza a correção pra QUALQUER ação da aplicação, não só essas duas.
// Comparação profunda de valores, ignorando a ORDEM das chaves de objetos — ao contrário de comparar
// JSON.stringify(a) === JSON.stringify(b), que é sensível à ordem das chaves. Achado ao vivo em produção
// (27/08/2026): depois de publicar o build com o fix de persistFieldsMerge, edições em Gestão de Metas
// passaram a mostrar "Não foi possível salvar" mesmo quando a gravação tinha realmente funcionado no
// servidor. Causa: o Firestore NÃO garante preservar a ordem das chaves dentro de um campo do tipo mapa/
// objeto ao reler o documento — o valor gravado e o valor relido podem ter as mesmas chaves com os mesmos
// valores, só que em ordem diferente, o que faz JSON.stringify gerar strings diferentes mesmo sendo dados
// idênticos. Isso fazia a verificação pós-gravação (persistedOk) reportar falso negativo. `deepEqual`
// compara por conteúdo real (percorrendo objetos e arrays recursivamente), não por igualdade de string.
function deepEqual(a, b){
  if(a === b) return true;
  if(typeof a !== typeof b) return false;
  if(a === null || b === null) return a === b;
  if(typeof a !== 'object') return a === b;
  if(Array.isArray(a) !== Array.isArray(b)) return false;
  if(Array.isArray(a)){
    if(a.length !== b.length) return false;
    for(let i = 0; i < a.length; i++){ if(!deepEqual(a[i], b[i])) return false; }
    return true;
  }
  const keysA = Object.keys(a), keysB = Object.keys(b);
  if(keysA.length !== keysB.length) return false;
  return keysA.every(k => Object.prototype.hasOwnProperty.call(b, k) && deepEqual(a[k], b[k]));
}

async function persistFieldsMerge(mergeFns, extraTopLevelPatch){
  try{
    const fb = await waitForFirebase();
    const ref = await getAppDataDocRef();
    const snap = await fb.getDoc(ref);
    const current = snap.exists() ? snap.data() : {};
    const patch = { ...(extraTopLevelPatch || {}) };
    Object.keys(mergeFns).forEach(fieldName => { patch[fieldName] = mergeFns[fieldName](current[fieldName]); });
    await fb.updateDoc(ref, patch);
    const verifySnap = await fb.getDoc(ref);
    const verifyData = verifySnap.exists() ? verifySnap.data() : {};
    const persistedOk = Object.keys(patch).every(k => deepEqual(verifyData[k], patch[k]));
    if(!persistedOk){
      return { ok: false, error: 'A gravação não foi confirmada pelo servidor ao reler o documento logo em seguida — tente novamente.' };
    }
    return { ok: true };
  }catch(e){
    console.error('Firestore write error (persistFieldsMerge)', e);
    return { ok: false, error: (e && e.message) || String(e) };
  }
}

async function persistTopLevelFieldMerge(fieldName, mergeFn, extraTopLevelPatch){
  return persistFieldsMerge({ [fieldName]: mergeFn }, extraTopLevelPatch);
}

async function persistDemandasCustomMerge(mergeFn, extraTopLevelPatch){
  try{
    const fb = await waitForFirebase();
    const ref = await getAppDataDocRef();
    // IMPORTANTE — achado ao vivo em produção (27/08/2026): `fb.runTransaction` NÃO é confiável neste
    // ambiente. Testado diretamente no Firestore real: a transação resolve sem lançar nenhum erro, mas a
    // escrita simplesmente não chega a ser persistida no servidor (confirmado lendo de volta com
    // getDocFromServer — o dado nunca aparece, nem mesmo momentaneamente como "pending write" local). Um
    // `updateDoc` comum, feito logo em seguida com os mesmos dados, persiste normalmente. Por isso essa
    // função usa deliberadamente o padrão ler-mesclar-gravar em duas chamadas separadas (sem
    // runTransaction) como mecanismo PRINCIPAL, não como fallback — e confirma a gravação lendo de volta
    // antes de reportar sucesso, já que aqui já vimos escritas "resolverem" sem realmente acontecer.
    const snap = await fb.getDoc(ref);
    const current = snap.exists() ? snap.data() : {};
    const mergedDemandasCustom = mergeFn(current.demandasCustom || {});
    const patch = { demandasCustom: mergedDemandasCustom, ...(extraTopLevelPatch || {}) };
    await fb.updateDoc(ref, patch);
    // Confirma que a gravação realmente chegou ao servidor antes de reportar sucesso pro chamador — não
    // basta o updateDoc "resolver", já vimos gravações resolverem sem persistir de fato neste ambiente.
    const verifySnap = await fb.getDoc(ref);
    const verifyData = verifySnap.exists() ? verifySnap.data() : {};
    const persistedOk = Object.keys(mergedDemandasCustom).every(k => deepEqual((verifyData.demandasCustom||{})[k], mergedDemandasCustom[k]));
    if(!persistedOk){
      return { ok: false, error: 'A gravação não foi confirmada pelo servidor ao reler o documento logo em seguida — tente novamente.' };
    }
    return { ok: true };
  }catch(e){
    // Guarda a mensagem de erro real (ex.: "Missing or insufficient permissions" de uma regra de
    // segurança do Firestore) — sem isso, uma falha de gravação só aparecia como um toast genérico e
    // passageiro ("Não foi possível salvar"), fácil de não notar no meio de outros avisos da tela; quem
    // chama esta função (ver handleSyncCsat) usa esse texto pra colocar o erro real num aviso PERSISTENTE
    // na própria tela, em vez de depender de alguém ter visto o toast a tempo.
    console.error('Firestore transaction write error', e);
    return { ok: false, error: (e && e.message) || String(e) };
  }
}

function useToasts(){
  const [toasts, setToasts] = useState([]);
  const push = useCallback((msg, type='ok') => {
    const id = uid();
    setToasts(t => [...t, {id, msg, type}]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 2600);
  }, []);
  return {toasts, push};
}
function ToastStack({toasts}){
  return (
    <div className="toast-stack">
      {toasts.map(t => (
        <div key={t.id} className={"toast" + (t.type==='error' ? ' error' : '')}>
          <span className="toast-dot"></span>{t.msg}
        </div>
      ))}
    </div>
  );
}

/* ---------------------------------------------------------------
   GENERIC UI: MultiSelect
--------------------------------------------------------------- */
function MultiSelect({options, value, onChange, placeholder, colorFn}){
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    function onDoc(e){ if(ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, []);
  const toggle = (id) => {
    if(value.includes(id)) onChange(value.filter(v => v !== id));
    else onChange([...value, id]);
  };
  const selectedOpts = options.filter(o => value.includes(o.id));
  return (
    <div className="multiselect" ref={ref}>
      <div className="multiselect-control" onClick={() => setOpen(o => !o)}>
        {selectedOpts.length === 0 && <span className="multiselect-placeholder">{placeholder || 'Selecionar...'}</span>}
        {selectedOpts.map(o => (
          <span className="chip" key={o.id} style={colorFn ? {background: colorFn(o) + '22', color: colorFn(o)} : undefined}>
            {o.label}
            <button onClick={(e) => { e.stopPropagation(); toggle(o.id); }}><IconX width="10" height="10"/></button>
          </span>
        ))}
      </div>
      {open && (
        <div className="multiselect-dropdown">
          {options.length === 0 && <div className="multiselect-option" style={{color:'var(--ink-soft)'}}>Nenhuma opção cadastrada</div>}
          {options.map(o => {
            const checked = value.includes(o.id);
            return (
              <div className="multiselect-option" key={o.id} onClick={() => toggle(o.id)}>
                <span className={"checkbox" + (checked ? ' checked' : '')}>{checked && <IconCheck width="10" height="10" stroke="#fff"/>}</span>
                {o.label}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function fmtChartValue(v, unidade){
  if(v === null || v === undefined || isNaN(v)) return '—';
  if(unidade === '%') return fmtPercent(v);
  if(unidade === 'R$') return fmtCurrency(v);
  return fmtNumber(v);
}

function BudgetChart({budgetsByMonth, realizedByMonth, unidade}){
  const W = 640, H = 240, padL = 40, padB = 28, padT = 12, padR = 12;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const values = MONTHS.map(m => Number(budgetsByMonth[m.n]) || 0);
  const realized = realizedByMonth ? MONTHS.map(m => Number(realizedByMonth[m.n]) || 0) : null;
  const maxVal = Math.max(1, ...values, ...(realized || [0]));
  const minVal = Math.min(0, ...values, ...(realized || [0]));
  const range = (maxVal - minVal) || 1;
  const zeroY = padT + (maxVal / range) * chartH;
  const barGroupW = chartW / MONTHS.length;
  const barW = realized ? barGroupW * 0.28 : barGroupW * 0.46;
  const gridLines = 4;

  const wrapRef = useRef(null);
  const [hoverIdx, setHoverIdx] = useState(null);
  const [tooltipLeftPct, setTooltipLeftPct] = useState(50);

  const handleMove = (e) => {
    if(!wrapRef.current) return;
    const rect = wrapRef.current.getBoundingClientRect();
    if(rect.width === 0) return;
    const fracX = (e.clientX - rect.left) / rect.width;
    const svgX = fracX * W;
    const idx = Math.floor((svgX - padL) / barGroupW);
    if(idx < 0 || idx >= MONTHS.length){ setHoverIdx(null); return; }
    setHoverIdx(idx);
    setTooltipLeftPct(Math.min(92, Math.max(8, fracX * 100)));
  };
  const handleLeave = () => setHoverIdx(null);
  const hoveredMonth = hoverIdx !== null ? MONTHS[hoverIdx] : null;

  return (
    <div style={{position:'relative'}}>
      <div className="chart-legend">
        <div className="legend-item"><span className="legend-swatch" style={{background:'var(--accent)'}}></span>Budget</div>
        {realized && <div className="legend-item"><span className="legend-swatch" style={{background:'var(--positive)'}}></span>Realizado</div>}
      </div>
      <div ref={wrapRef} onMouseMove={handleMove} onMouseLeave={handleLeave} style={{position:'relative'}}>
        <svg viewBox={"0 0 " + W + " " + H} width="100%" height="240" style={{overflow:'visible'}}>
          {Array.from({length: gridLines+1}).map((_, i) => {
            const y = padT + (chartH / gridLines) * i;
            const val = maxVal - (range / gridLines) * i;
            return (
              <g key={i}>
                <line x1={padL} x2={W-padR} y1={y} y2={y} stroke="#EEF0F4" strokeWidth="1"/>
                <text x={padL-8} y={y+3} fontSize="9.5" fill="#93970F" textAnchor="end" fontFamily="IBM Plex Mono, monospace" opacity="0.75">
                  {val >= 1000 ? Math.round(val/1000)+'k' : Math.round(val)}
                </text>
              </g>
            );
          })}
          {hoverIdx !== null && (
            <rect x={padL + barGroupW*hoverIdx} y={padT} width={barGroupW} height={chartH} fill="rgba(30,62,112,0.06)"/>
          )}
          {MONTHS.map((m, i) => {
            const gx = padL + barGroupW * i;
            const bH = Math.abs(values[i] / range) * chartH;
            const bx = gx + barGroupW/2 - (realized ? barW + 2 : barW/2);
            const rH = realized ? Math.abs(realized[i] / range) * chartH : 0;
            const rx = gx + barGroupW/2 + 2;
            const bY = values[i] >= 0 ? zeroY - bH : zeroY;
            const rY = realized && realized[i] >= 0 ? zeroY - rH : zeroY;
            return (
              <g key={m.n}>
                <rect x={bx} y={bY} width={barW} height={bH} rx="2.5" fill="var(--accent)" opacity={hoverIdx===null || hoverIdx===i ? 0.92 : 0.45}/>
                {realized && <rect x={rx} y={rY} width={barW} height={rH} rx="2.5" fill="var(--positive)" opacity={hoverIdx===null || hoverIdx===i ? 0.92 : 0.45}/>}
                <text x={gx + barGroupW/2} y={H-8} fontSize="10.5" fill="#5D6274" textAnchor="middle" fontFamily="Inter, sans-serif">{m.label}</text>
              </g>
            );
          })}
          <line x1={padL} x2={padL} y1={padT} y2={padT+chartH} stroke="#E6E8EE"/>
          <line x1={padL} x2={W-padR} y1={zeroY} y2={zeroY} stroke="#E6E8EE"/>
        </svg>
        {hoveredMonth && (
          <div className="chart-tooltip" style={{left: tooltipLeftPct + '%'}}>
            <div className="chart-tooltip-title">{hoveredMonth.label} · {CURRENT_YEAR}</div>
            <div className="chart-tooltip-row"><span className="chart-tooltip-dot" style={{background:'var(--accent)'}}></span>Budget: <b>{fmtChartValue(values[hoverIdx], unidade)}</b></div>
            {realized && <div className="chart-tooltip-row"><span className="chart-tooltip-dot" style={{background:'var(--positive)'}}></span>Realizado: <b>{fmtChartValue(realized[hoverIdx], unidade)}</b></div>}
          </div>
        )}
      </div>
    </div>
  );
}

function OrgNode({person, childrenByManager, onEditPerson, onDeletePerson}){
  const children = childrenByManager[person.id] || [];
  const groups = useMemo(() => {
    const map = {};
    const order = [];
    children.forEach(c => {
      // Pedido em 29/08/2026: pessoas em liderança (lideranca:true) sempre viram sua própria coluna,
      // lado a lado — mesmo compartilhando a mesma área/cargo com outra liderança (ex.: Henrique e
      // Isabel, ambos "Deployment Lead", diretos do General Manager). Sem isso, elas caíam no mesmo
      // grupo por área e empilhavam verticalmente numa coluna só (orgchart-people-nested), escondendo
      // que são ramos paralelos e independentes do organograma, cada um com seu próprio time abaixo.
      const key = c.lideranca ? ('__lead__' + c.id) : (c.area || 'Sem área');
      if(!map[key]){ map[key] = []; order.push(key); }
      map[key].push(c);
    });
    return order.map(key => ({area: map[key][0].area || 'Sem área', people: map[key]}));
  }, [children]);

  return (
    <div className="orgnode">
      <div className="orgchart-node-item">
        <PersonCard person={person} onEdit={()=>onEditPerson(person)} onDelete={()=>onDeletePerson(person)}/>
      </div>
      {children.length > 0 && (
        <>
          <div className="orgchart-stem-small"></div>
          <div className={"orgchart-branches-inline" + (groups.length === 1 ? ' single' : '')}>
            {groups.map(g => (
              <div className="orgchart-area-col" key={g.area}>
                <div className="orgchart-area-col-stem"></div>
                {groups.length > 1 && (
                  <div className="orgchart-area-head">
                    <span className="orgchart-area-dot" style={{background: colorForArea(g.area)}}></span>
                    {g.area}
                  </div>
                )}
                <div className="orgchart-people-nested">
                  {g.people.map(p => (
                    <OrgNode key={p.id} person={p} childrenByManager={childrenByManager}
                      onEditPerson={onEditPerson} onDeletePerson={onDeletePerson}/>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

function OrgChart({pessoas, areaOptions, onAdd, onEdit, onDelete}){
  const [modal, setModal] = useState(null); // null | 'new' | person obj
  const [confirmDel, setConfirmDel] = useState(null);

  const childrenByManager = useMemo(() => {
    const map = {};
    pessoas.forEach(p => {
      const key = p.reportsToId || '__root__';
      if(!map[key]) map[key] = [];
      map[key].push(p);
    });
    return map;
  }, [pessoas]);

  const roots = useMemo(() => {
    const validIds = new Set(pessoas.map(p => p.id));
    return pessoas.filter(p => !p.reportsToId || !validIds.has(p.reportsToId));
  }, [pessoas]);

  // roots go in the __root__ bucket already via reportsToId falsy; orphaned managers also treated as roots
  const rootsForRender = useMemo(() => {
    const rootIds = new Set(roots.map(r => r.id));
    return pessoas.filter(p => rootIds.has(p.id));
  }, [roots, pessoas]);

  return (
    <div className="card">
      <div className="section-block-head" style={{padding:'18px 22px 0'}}>
        <div>
          <div className="section-block-title">Organograma</div>
          <div className="section-block-desc">Estrutura do time — cadastro central de pessoas.</div>
        </div>
        <button className="btn btn-primary btn-sm" onClick={()=>setModal('new')}><IconPlus width="14" height="14"/>Adicionar pessoa</button>
      </div>

      {pessoas.length === 0 ? (
        <EmptyState icon={IconUsers} title="Nenhuma pessoa cadastrada"
          sub="Adicione as pessoas do time para montar o organograma e liberar a seleção delas em Responsabilidades e Metas."
          action={<button className="btn btn-primary btn-sm" onClick={()=>setModal('new')}><IconPlus width="14" height="14"/>Adicionar pessoa</button>}
        />
      ) : (
        <div className="orgchart-wrap">
          <div className="orgchart" style={{flexDirection:'row', alignItems:'flex-start', justifyContent:'center', gap:32}}>
            {rootsForRender.map(root => (
              <OrgNode key={root.id} person={root} childrenByManager={childrenByManager}
                onEditPerson={(p)=>setModal(p)} onDeletePerson={(p)=>setConfirmDel(p)}/>
            ))}
          </div>
        </div>
      )}

      <datalist id="area-suggestions">
        {areaOptions.map(a => <option value={a} key={a}/>)}
      </datalist>

      {modal && (
        <PersonModal
          initial={modal === 'new' ? null : modal}
          allPessoas={pessoas}
          onClose={()=>setModal(null)}
          onSave={(data) => { modal === 'new' ? onAdd(data) : onEdit(modal.id, data); setModal(null); }}
        />
      )}
      <ConfirmDialog
        open={!!confirmDel}
        title="Excluir pessoa"
        text={confirmDel ? 'Tem certeza que deseja excluir "' + confirmDel.nome + '"? As pessoas que reportam para ela passam a ficar no topo do organograma, e ela será removida das responsabilidades e metas em que estiver associada.' : ''}
        onCancel={()=>setConfirmDel(null)}
        onConfirm={()=>{ onDelete(confirmDel.id); setConfirmDel(null); }}
      />
    </div>
  );
}

    <Modal title={initial ? 'Editar função' : 'Adicionar função'} onClose={onClose} footer={
      <>
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" disabled={!canSave} style={!canSave?{opacity:0.5}:undefined}
          onClick={()=> canSave && onSave({titulo: titulo.trim(), area: area.trim()})}>
          Salvar
        </button>
      </>
    }>
      <div className="field">
        <label>Área<span className="required-mark">*</span></label>
        <input className="input" value={area} onChange={e=>setArea(e.target.value)} placeholder="Ex.: Atendimento" list="area-suggestions-tarefas" autoFocus/>
        <datalist id="area-suggestions-tarefas">{areaOptions.map(a => <option value={a} key={a}/>)}</datalist>
      </div>
      <div className="field">
        <label>Descrição da função<span className="required-mark">*</span></label>
        <textarea className="input" value={titulo} onChange={e=>setTitulo(e.target.value)} placeholder="Descreva a função" style={{minHeight:88}}/>
        <div className="hint">O responsável por cada cliente é definido diretamente na tabela.</div>
      </div>
    </Modal>
  );
}
