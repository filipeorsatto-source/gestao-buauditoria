<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BU Auditoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut
  } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';
  import {
    initializeFirestore, persistentLocalCache, doc, getDoc, setDoc, updateDoc, onSnapshot
  } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyAHQaqtuw4twxmQ9uYfqmqGaLvlJJLY8A4",
    authDomain: "gestao-auditoria-21357.firebaseapp.com",
    databaseURL: "https://gestao-auditoria-21357-default-rtdb.firebaseio.com",
    projectId: "gestao-auditoria-21357",
    storageBucket: "gestao-auditoria-21357.firebasestorage.app",
    messagingSenderId: "755190959980",
    appId: "1:755190959980:web:467a0513e8c5524482ed49"
  };

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  let db;
  try{
    db = initializeFirestore(fbApp, { localCache: persistentLocalCache() });
  }catch(e){
    // Falls back if persistence can't init (e.g. multiple tabs) — Firestore still works without offline cache.
    const { getFirestore } = await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js');
    db = getFirestore(fbApp);
  }

  window.__firebase = {
    auth, db, doc, getDoc, setDoc, updateDoc, onSnapshot, signOut,
    GoogleAuthProvider, signInWithPopup, onAuthStateChanged,
    credentialFromResult: GoogleAuthProvider.credentialFromResult,
  };
  window.__firebaseReady = true;
</script>
<style>
  :root{
    --bg:#F4F5F8;
    --surface:#FFFFFF;
    --surface-2:#FBFBFD;
    --sidebar:#11131C;
    --sidebar-hover:#1B1E2B;
    --sidebar-active:#232740;
    --sidebar-text:#9297AA;
    --sidebar-text-active:#FFFFFF;
    --ink:#151725;
    --ink-soft:#5D6274;
    --ink-faint:#93970F;
    --line:#E6E8EE;
    --line-soft:#EEF0F4;
    --accent:#2C5AA0;
    --accent-ink:#1E3E70;
    --accent-soft:#E7EEF9;
    --accent-soft-2:#DCE6F5;
    --positive:#1F8A70;
    --positive-soft:#E4F4EF;
    --negative:#C4432B;
    --negative-soft:#FBEAE6;
    --warn:#B8862B;
    --warn-soft:#F8EFDF;
    --radius-sm:6px;
    --radius-md:10px;
    --radius-lg:16px;
    --shadow-sm:0 1px 2px rgba(20,22,35,0.06);
    --shadow-md:0 6px 20px rgba(20,22,35,0.08);
    --shadow-lg:0 20px 45px rgba(15,17,28,0.16);
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body,#root{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-soft-2);}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#D7DAE2;border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  .app-shell{display:flex;min-height:100vh;}

  /* SIDEBAR */
  .sidebar{
    width:264px;
    flex-shrink:0;
    background:var(--sidebar);
    color:var(--sidebar-text);
    display:flex;
    flex-direction:column;
    padding:22px 14px 18px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .sidebar-brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 10px 22px;
  }
  .sidebar-brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(135deg,var(--accent) 0%, #4776C4 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;color:#fff;font-size:15px;
    flex-shrink:0;
  }
  .sidebar-brand-text{display:flex;flex-direction:column;}
  .sidebar-brand-title{font-family:var(--font-display);font-weight:600;color:#fff;font-size:15px;letter-spacing:0.2px;}
  .sidebar-brand-sub{font-size:11px;color:#6D7290;font-family:var(--font-mono);letter-spacing:0.5px;text-transform:uppercase;margin-top:1px;}

  .nav-group{margin-bottom:4px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;
    border-radius:var(--radius-sm);
    cursor:pointer;
    font-size:13.5px;
    font-weight:500;
    color:var(--sidebar-text);
    transition:background 0.14s, color 0.14s;
    user-select:none;
    position:relative;
  }
  .nav-item:hover{background:var(--sidebar-hover);color:#E4E6F0;}
  .nav-item.active{background:var(--sidebar-active);color:var(--sidebar-text-active);}
  .nav-item.active::before{
    content:'';position:absolute;left:-14px;top:8px;bottom:8px;width:3px;
    background:var(--accent);border-radius:0 3px 3px 0;
  }
  .nav-icon{width:16px;height:16px;flex-shrink:0;opacity:0.9;}
  .nav-caret{margin-left:auto;width:14px;height:14px;transition:transform 0.16s;opacity:0.7;}
  .nav-caret.open{transform:rotate(90deg);}
  .nav-sub{overflow:hidden;transition:max-height 0.18s ease;}
  .nav-subitem{
    display:flex;align-items:center;gap:9px;
    padding:8px 12px 8px 34px;
    border-radius:var(--radius-sm);
    cursor:pointer;font-size:12.8px;color:#8A8FA6;
    transition:background 0.14s,color 0.14s;
  }
  .nav-subitem:hover{background:var(--sidebar-hover);color:#E4E6F0;}
  .nav-subitem.active{background:var(--sidebar-active);color:#fff;}
  .nav-subitem-dot{width:5px;height:5px;border-radius:50%;background:#565A72;flex-shrink:0;}
  .nav-subitem.active .nav-subitem-dot{background:var(--accent);}

  .sidebar-footer{
    margin-top:auto;padding:14px 12px 4px;
    border-top:1px solid #23263A;
    font-size:11px;color:#5D6180;
    font-family:var(--font-mono);
  }

  /* MAIN */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 32px;
    border-bottom:1px solid var(--line);
    background:var(--surface);
    position:sticky;top:0;z-index:20;
  }
  .topbar-title{font-family:var(--font-display);font-size:19px;font-weight:600;color:var(--ink);}
  .topbar-eyebrow{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:3px;}
  .content{flex:1;padding:28px 32px 60px;max-width:1320px;width:100%;margin:0 auto;}
  .content-demandas{max-width:none;margin:0;}

  .section-block{margin-bottom:34px;}
  .section-block-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
  .section-block-title{font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--ink);}
  .section-block-desc{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

  .btn{
    display:inline-flex;align-items:center;gap:7px;
    padding:9px 15px;border-radius:var(--radius-sm);
    font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;
    transition:transform 0.08s, box-shadow 0.14s, background 0.14s;
    white-space:nowrap;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm);}
  .btn-primary:hover{background:var(--accent-ink);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border-color:var(--line);}
  .btn-ghost:hover{background:var(--surface-2);color:var(--ink);}
  .btn-danger{background:var(--negative-soft);color:var(--negative);}
  .btn-danger:hover{background:#F6D9D2;}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .btn-icon{padding:7px;border-radius:var(--radius-sm);background:transparent;border:1px solid var(--line);color:var(--ink-soft);cursor:pointer;display:flex;}
  .btn-icon:hover{background:var(--surface-2);color:var(--ink);}
  .btn-icon.danger:hover{background:var(--negative-soft);color:var(--negative);border-color:transparent;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);}
  .card-pad{padding:20px 22px;}

  /* ORG CHART */
  .orgchart-wrap{overflow-x:auto;padding:10px 4px 20px;}
  .orgchart{display:flex;flex-direction:column;align-items:center;min-width:fit-content;}
  .orgchart-root{
    background:var(--sidebar);color:#fff;font-family:var(--font-display);font-weight:600;font-size:13.5px;
    padding:11px 22px;border-radius:var(--radius-md);box-shadow:var(--shadow-md);letter-spacing:0.2px;
  }
  .orgchart-trunk{width:2px;height:22px;background:var(--line);}
  .orgchart-branches{display:flex;gap:6px;position:relative;padding-top:22px;}
  .orgchart-branches::before{
    content:'';position:absolute;top:0;left:calc(50% - 0px);height:1px;background:var(--line);
    right:0;left:0;
  }
  .orgchart-area{display:flex;flex-direction:column;align-items:center;padding:0 16px;min-width:190px;}
  .orgchart-area-stem{width:1px;height:22px;background:var(--line);margin-top:-1px;}
  .orgchart-area-head{
    display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11px;
    text-transform:uppercase;letter-spacing:0.6px;color:var(--ink-soft);margin-bottom:10px;
  }
  .orgchart-area-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .orgchart-people{display:flex;flex-direction:column;gap:8px;width:100%;}
  .orgchart-person{
    display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius-md);padding:9px 11px;box-shadow:var(--shadow-sm);position:relative;
  }
  .orgchart-person:hover .orgchart-person-actions{opacity:1;}
  .orgchart-avatar{
    width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:600;font-size:12px;color:#fff;
  }
  .orgchart-person-info{min-width:0;flex:1;}
  .orgchart-person-name{font-size:12.8px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .orgchart-person-role{font-size:11.3px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .orgchart-person-actions{display:flex;gap:3px;opacity:0;transition:opacity 0.14s;}
  .orgchart-person-name.lideranca{color:var(--accent-ink);font-weight:700;}
  .orgnode{display:flex;flex-direction:column;align-items:center;}
  .orgchart-stem-small{width:1px;height:18px;background:var(--line);}
  .orgchart-branches-inline{display:flex;gap:22px;position:relative;padding-top:18px;align-items:flex-start;}
  .orgchart-branches-inline::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--line);}
  .orgchart-branches-inline.single::before{display:none;}
  .orgchart-area-col{display:flex;flex-direction:column;align-items:center;min-width:168px;padding:0 4px;}
  .orgchart-area-col-stem{width:1px;height:18px;background:var(--line);margin-top:-1px;}
  .orgchart-people-nested{display:flex;flex-direction:column;gap:8px;width:100%;}
  .orgchart-node-item{display:flex;flex-direction:column;align-items:center;width:100%;}

  /* TABLE */
  .table-wrap{overflow-x:auto;}
  table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
  table.tbl th{
    text-align:left;padding:9px 14px;font-size:11px;font-family:var(--font-mono);text-transform:uppercase;
    letter-spacing:0.5px;color:var(--ink-soft);border-bottom:1px solid var(--line);white-space:nowrap;
  }
  table.tbl td{padding:12px 14px;border-bottom:1px solid var(--line-soft);color:var(--ink);vertical-align:middle;}
  table.tbl tr:last-child td{border-bottom:none;}
  table.tbl tr:hover td{background:var(--surface-2);}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}

  .link-title{font-weight:600;font-size:13px;}
  .link-desc{color:var(--ink-soft);font-size:12.3px;margin-top:1px;}
  .link-url{
    display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-size:12.5px;font-weight:600;
    text-decoration:none;
  }
  .link-url:hover{text-decoration:underline;}

  /* EMPTY STATE */
  .empty{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:52px 24px;text-align:center;color:var(--ink-soft);
  }
  .empty-icon{width:38px;height:38px;color:#C7CBD8;margin-bottom:12px;}
  .empty-title{font-family:var(--font-display);font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:4px;}
  .empty-sub{font-size:12.8px;max-width:340px;line-height:1.5;}

  /* LOADING */
  .loading-screen{display:flex;align-items:center;justify-content:center;height:100vh;width:100%;color:var(--ink-soft);gap:10px;font-size:13px;}
  .spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin 0.7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* AUTH / LOGIN */
  .auth-screen{display:flex;align-items:center;justify-content:center;height:100vh;width:100%;background:var(--bg);}
  .auth-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:40px 44px;width:380px;max-width:90vw;text-align:center;}
  .auth-mark{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--accent) 0%, #4776C4 100%);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;color:#fff;font-size:19px;margin:0 auto 18px;}
  .auth-title{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--ink);margin-bottom:6px;}
  .auth-sub{font-size:13px;color:var(--ink-soft);margin-bottom:24px;line-height:1.5;}
  .auth-google-btn{
    display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    padding:11px 16px;border-radius:var(--radius-md);border:1px solid var(--line);
    background:#fff;color:var(--ink);font-size:13.5px;font-weight:600;cursor:pointer;
    transition:background 0.14s,box-shadow 0.14s;
  }
  .auth-google-btn:hover{background:var(--surface-2);box-shadow:var(--shadow-sm);}
  .auth-google-btn:disabled{opacity:0.6;cursor:default;}
  .auth-error{margin-top:16px;font-size:12.5px;color:var(--negative);background:var(--negative-soft);border-radius:var(--radius-sm);padding:10px 12px;line-height:1.5;}
  .topbar-user{display:flex;align-items:center;gap:10px;}
  .topbar-user-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--accent-soft);flex-shrink:0;}
  .topbar-user-avatar-fallback{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .topbar-user-email{font-size:12.5px;color:var(--ink-soft);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .topbar-signout-btn{font-size:12px;color:var(--ink-soft);background:none;border:1px solid var(--line);border-radius:var(--radius-sm);padding:5px 10px;cursor:pointer;transition:background 0.14s;}
  .topbar-signout-btn:hover{background:var(--surface-2);color:var(--ink);}
  .sync-indicator{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft);font-family:var(--font-mono);}
  .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--positive);}
  .sync-dot.offline{background:var(--warn);}

  /* MODAL */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(14,16,26,0.48);backdrop-filter:blur(2px);
    display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:5vh 20px;overflow-y:auto;
    animation:fadeIn 0.14s ease;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal{
    background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
    width:100%;max-width:560px;animation:modalIn 0.16s ease;
  }
  @keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(0.99);}to{opacity:1;transform:none;}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--line);}
  .modal-title{font-family:var(--font-display);font-size:16px;font-weight:600;}
  .modal-body{padding:22px 24px;max-height:64vh;overflow-y:auto;}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--line);}
  .modal-close{background:transparent;border:none;color:var(--ink-soft);cursor:pointer;padding:4px;border-radius:6px;display:flex;}
  .modal-close:hover{background:var(--surface-2);color:var(--ink);}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin-bottom:6px;}
  .field .hint{font-size:11px;color:var(--ink-soft);margin-top:4px;}
  .budget-note{font-size:11px;font-weight:400;font-style:italic;color:var(--ink-soft);margin-top:8px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .input, .select, textarea.input{
    width:100%;padding:9px 11px;border-radius:var(--radius-sm);border:1px solid var(--line);
    background:var(--surface-2);font-size:13px;color:var(--ink);outline:none;transition:border-color 0.14s, background 0.14s;
  }
  .input:focus, .select:focus, textarea.input:focus{border-color:var(--accent);background:var(--surface);}
  textarea.input{resize:vertical;min-height:64px;line-height:1.5;}

  .chip{
    display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent-ink);
    font-size:11.5px;font-weight:600;padding:4px 8px 4px 9px;border-radius:20px;
  }
  .chip button{background:none;border:none;color:var(--accent-ink);cursor:pointer;display:flex;padding:0;opacity:0.6;}
  .chip button:hover{opacity:1;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}

  .multiselect{position:relative;}
  .multiselect-control{
    min-height:38px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);
    padding:6px 8px;display:flex;flex-wrap:wrap;gap:5px;cursor:pointer;align-items:center;
  }
  .multiselect-control:hover{border-color:#C6CBDB;}
  .multiselect-placeholder{color:var(--ink-soft);font-size:12.8px;padding:2px 4px;}
  .multiselect-dropdown{
    position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius-sm);box-shadow:var(--shadow-md);z-index:40;max-height:220px;overflow-y:auto;padding:5px;
  }
  .multiselect-option{
    display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:6px;cursor:pointer;font-size:12.8px;
  }
  .multiselect-option:hover{background:var(--surface-2);}
  .checkbox{width:15px;height:15px;border-radius:4px;border:1.5px solid #C6CBDB;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .checkbox.checked{background:var(--accent);border-color:var(--accent);}

  /* TABS / FILTERS */
  .tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:var(--radius-md);width:fit-content;}
  .tab{padding:7px 14px;border-radius:8px;font-size:12.6px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .tab.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);}
  .filters-bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0;}
  .filter-select{
    padding:8px 11px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface);
    font-size:12.6px;color:var(--ink);min-width:150px;
  }

  /* GROUP CARDS (roles) */
  .group-card{margin-bottom:16px;}
  .group-card-head{
    display:flex;align-items:center;gap:9px;padding:13px 18px;font-family:var(--font-display);
    font-weight:600;font-size:13.5px;border-bottom:1px solid var(--line);
  }
  .group-card-count{
    margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);font-weight:400;
    background:var(--surface-2);padding:2px 8px;border-radius:20px;
  }
  .role-item{padding:12px 18px;border-bottom:1px solid var(--line-soft);display:flex;gap:12px;align-items:flex-start;}
  .role-item:last-child{border-bottom:none;}
  .role-item-title{font-weight:600;font-size:13px;}
  .role-item-desc{font-size:12.3px;color:var(--ink-soft);margin-top:2px;line-height:1.5;}
  .role-item-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
  .tag{
    font-size:10.8px;font-weight:600;padding:3px 8px;border-radius:20px;background:var(--surface-2);
    color:var(--ink-soft);border:1px solid var(--line);
  }
  .tag-client{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent;}
  .tag-area{background:var(--positive-soft);color:var(--positive);border-color:transparent;}

  /* GOALS GRID */
  .goals-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(272px,1fr));gap:14px;}
  .goal-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px 18px 16px;
    cursor:pointer;transition:box-shadow 0.14s, transform 0.1s;box-shadow:var(--shadow-sm);position:relative;
  }
  .goal-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
  .goal-card-unit{
    position:absolute;top:16px;right:16px;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft);
    background:var(--surface-2);padding:3px 8px;border-radius:20px;
  }
  .goal-card-title{font-family:var(--font-display);font-weight:600;font-size:14.5px;margin-bottom:6px;padding-right:56px;}
  .goal-card-desc{font-size:12.2px;color:var(--ink-soft);line-height:1.5;margin-bottom:14px;min-height:34px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .goal-card-foot{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);
    border-top:1px solid var(--line-soft);padding-top:11px;}
  .goal-card-budget{font-family:var(--font-mono);font-weight:600;color:var(--ink);font-size:12.5px;}
  .avatars-stack{display:flex;}
  .avatars-stack .mini-avatar{margin-left:-6px;}
  .avatars-stack .mini-avatar:first-child{margin-left:0;}
  .mini-avatar{
    width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);display:flex;align-items:center;
    justify-content:center;font-size:9px;font-weight:700;color:#fff;font-family:var(--font-display);
  }

  /* GOAL DETAIL */
  .detail-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;}
  .back-link{
    display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);font-size:12.5px;font-weight:600;
    cursor:pointer;margin-bottom:10px;
  }
  .back-link:hover{color:var(--ink);}
  .detail-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start;}
  @media(max-width:900px){.detail-grid{grid-template-columns:1fr;}}
  .kv-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:12.8px;}
  .kv-row:last-child{border-bottom:none;}
  .kv-label{color:var(--ink-soft);}
  .kv-value{font-weight:600;text-align:right;max-width:60%;}

  .chart-legend{display:flex;gap:16px;margin-bottom:6px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);}
  .legend-swatch{width:10px;height:10px;border-radius:3px;}
  .chart-tooltip{
    position:absolute;top:6px;transform:translateX(-50%);background:#1E2233;color:#fff;
    padding:9px 12px;border-radius:9px;font-size:11.5px;line-height:1.6;pointer-events:none;
    white-space:nowrap;z-index:5;box-shadow:var(--shadow-md);
  }
  .chart-tooltip-title{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.4px;opacity:0.7;margin-bottom:3px;}
  .chart-tooltip-row{display:flex;align-items:center;gap:6px;}
  .chart-tooltip-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

  .month-budget-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .month-budget-cell label{font-size:10.6px;color:var(--ink-soft);font-family:var(--font-mono);text-transform:uppercase;}

  /* PLACEHOLDER (tracking) */
  .placeholder-card{
    display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:40px 34px;
  }
  .placeholder-badge{
    font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.6px;
    color:var(--warn);background:var(--warn-soft);padding:4px 10px;border-radius:20px;
  }
  .placeholder-title{font-family:var(--font-display);font-size:20px;font-weight:600;}
  .placeholder-text{font-size:13.3px;color:var(--ink-soft);max-width:520px;line-height:1.6;}

  /* TOAST */
  .toast-stack{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:200;}
  .toast{
    background:var(--sidebar);color:#fff;padding:11px 16px;border-radius:var(--radius-sm);font-size:12.8px;
    box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;animation:toastIn 0.18s ease;min-width:200px;
  }
  @keyframes toastIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .toast-dot{width:7px;height:7px;border-radius:50%;background:var(--positive);flex-shrink:0;}
  .toast.error .toast-dot{background:var(--negative);}

  /* CONFIRM */
  .confirm-modal{max-width:400px;}
  .confirm-text{font-size:13px;color:var(--ink-soft);line-height:1.55;}

  .stat-row{display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap;}
  .stat-box{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:15px 17px;}
  .stat-box-label{font-size:11px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);margin-bottom:6px;}
  .stat-box-value{font-family:var(--font-display);font-size:22px;font-weight:600;}

  .required-mark{color:var(--negative);margin-left:2px;}

  /* ROTINAS */
  .rotinas-table-wrap{overflow-x:auto;}
  table.rotinas-tbl{width:100%;border-collapse:collapse;font-size:12.6px;min-width:900px;}
  table.rotinas-tbl th{
    padding:11px 12px;font-size:11px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.4px;
    color:#fff;background:var(--sidebar);text-align:center;white-space:nowrap;
  }
  table.rotinas-tbl th.internal-col{background:var(--warn);}
  table.drilldown-tbl th.internal-col{background:var(--warn-soft);color:var(--warn);}
  table.rotinas-tbl th:first-child{text-align:left;border-radius:0;}
  table.rotinas-tbl td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;background:var(--surface);}
  .dia-cell{
    background:var(--sidebar) !important;color:#fff;font-family:var(--font-display);font-weight:600;font-size:13px;
    cursor:pointer;white-space:nowrap;min-width:110px;
  }
  .dia-cell-inner{display:flex;align-items:center;gap:8px;}
  .dia-cell .nav-caret{color:#fff;opacity:0.85;}
  .meeting-pill{
    display:block;background:var(--accent-soft);color:var(--accent-ink);border-radius:7px;padding:5px 8px;
    font-size:11.3px;font-weight:600;margin-bottom:5px;cursor:pointer;line-height:1.35;
  }
  .meeting-pill:hover{background:var(--accent-soft-2);}
  .meeting-pill .meeting-time{font-family:var(--font-mono);font-weight:500;opacity:0.75;margin-right:4px;}
  .empty-cell-hint{color:#C7CBD8;font-size:15px;text-align:center;display:block;}
  .drilldown-row td{padding:0;border:none;background:var(--surface-2);}
  .drilldown-wrap{padding:14px;}
  table.drilldown-tbl{width:100%;border-collapse:collapse;font-size:11.8px;}
  table.drilldown-tbl th{
    padding:7px 8px;font-size:10.2px;font-family:var(--font-mono);text-transform:uppercase;color:var(--ink-soft);
    background:var(--surface);border:1px solid var(--line);text-align:center;white-space:nowrap;
  }
  table.drilldown-tbl td{
    border:1px solid var(--line-soft);padding:4px 6px;height:30px;vertical-align:top;background:var(--surface);
    position:relative;min-width:110px;
  }
  .drilldown-time-cell{
    background:var(--surface-2) !important;font-family:var(--font-mono);color:var(--ink-soft);font-size:10.8px;
    text-align:right;white-space:nowrap;width:56px;
  }
  .slot-cell{cursor:pointer;}
  .slot-cell:hover{background:var(--accent-soft);}
  .slot-add-btn{opacity:0;display:flex;align-items:center;justify-content:center;color:var(--accent);width:100%;height:100%;min-height:18px;}
  .slot-cell:hover .slot-add-btn{opacity:1;}
  .meeting-pill-sm{
    background:var(--accent);color:#fff;border-radius:6px;padding:3px 6px;font-size:10.6px;font-weight:600;
    cursor:pointer;line-height:1.3;display:block;
  }
  .meeting-pill-sm:hover{background:var(--accent-ink);}

  .hours-summary-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(190px,1fr));gap:10px;}
  .hours-summary-item{
    display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius-md);padding:11px 13px;
  }
  .hours-summary-name{font-size:12.3px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hours-summary-meta{font-size:11px;color:var(--ink-soft);font-family:var(--font-mono);}
  .meeting-pill.internal{background:var(--warn-soft);color:var(--warn);}
  .meeting-pill.internal:hover{background:#F2E3C4;}
  .meeting-pill-sm.internal{background:var(--warn);color:#fff;}
  .meeting-pill-sm.internal:hover{background:#9A6F22;}
  .hours-summary-value{margin-left:auto;font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--accent-ink);white-space:nowrap;}

  /* TAREFAS */
  .page-tabs-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px;}
  table.tarefas-tbl{width:100%;border-collapse:collapse;font-size:12.4px;min-width:1100px;}
  table.tarefas-tbl th{
    text-align:left;padding:9px 12px;font-size:10.5px;font-family:var(--font-mono);text-transform:uppercase;
    letter-spacing:0.4px;color:var(--ink-soft);border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);
  }
  table.tarefas-tbl td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  table.tarefas-tbl tr:hover td{background:var(--surface-2);}
  .tarefa-titulo-cell{cursor:pointer;max-width:340px;}
  .tarefa-titulo-text{font-size:12.4px;line-height:1.4;color:var(--ink);}
  .tarefa-titulo-cell:hover .tarefa-titulo-text{color:var(--accent-ink);text-decoration:underline;}
  .tarefa-resp-select{
    width:100%;min-width:118px;padding:6px 7px;border-radius:7px;border:1px solid transparent;background:var(--surface-2);
    font-size:11.6px;color:var(--ink);outline:none;
  }
  .tarefa-resp-select:hover{border-color:var(--line);}
  .tarefa-resp-select:focus{border-color:var(--accent);background:var(--surface);}
  .tarefa-resp-select.empty{color:#B8BCC9;}

  /* FINANCEIRO / P&L */
  .kpi-hero{
    background:linear-gradient(135deg, var(--sidebar) 0%, #1B2036 100%);
    border-radius:var(--radius-lg);padding:26px 28px;color:#fff;position:relative;overflow:hidden;
    box-shadow:var(--shadow-md);
  }
  .kpi-hero-label{font-family:var(--font-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:0.8px;color:#9BA0B8;margin-bottom:10px;}
  .kpi-hero-value{font-family:var(--font-display);font-size:44px;font-weight:700;line-height:1;margin-bottom:8px;}
  .kpi-hero-value.negative{color:#F3A18C;}
  .kpi-hero-value.positive{color:#8FE0C4;}
  .kpi-hero-formula{font-size:12px;color:#8B90A8;font-family:var(--font-mono);}
  .kpi-hero-period{
    position:absolute;top:26px;right:28px;font-family:var(--font-mono);font-size:11px;color:#C7CBDB;
    background:rgba(255,255,255,0.08);padding:5px 11px;border-radius:20px;
  }
  .kpi-hero-detail{display:flex;gap:26px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.12);}
  .kpi-hero-detail-item{}
  .kpi-hero-detail-label{font-size:10.5px;color:#8B90A8;font-family:var(--font-mono);text-transform:uppercase;margin-bottom:3px;}
  .kpi-hero-detail-value{font-size:14px;font-weight:600;}

  table.pnl-tbl{width:100%;border-collapse:collapse;font-size:12.2px;min-width:820px;}
  table.pnl-tbl th{
    padding:9px 12px;font-size:10.5px;font-family:var(--font-mono);text-transform:uppercase;color:var(--ink-soft);
    border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;background:var(--surface-2);
  }
  table.pnl-tbl th:first-child{text-align:left;}
  table.pnl-tbl td{padding:9px 12px;border-bottom:1px solid var(--line-soft);text-align:right;white-space:nowrap;font-family:var(--font-mono);}
  table.pnl-tbl td:first-child{text-align:left;font-family:var(--font-body);white-space:normal;}
  table.pnl-tbl tr.pnl-row-main td:first-child{font-weight:700;color:var(--ink);}
  table.pnl-tbl tr.pnl-row-sub td:first-child{padding-left:26px;color:var(--ink-soft);font-size:11.6px;}
  table.pnl-tbl tr.pnl-row-total td{border-top:1.5px solid var(--ink);font-weight:700;color:var(--ink);}
  table.pnl-tbl td.negative{color:var(--negative);}
  table.pnl-tbl td.positive{color:var(--positive);}
  table.pnl-tbl td.empty-val{color:#C7CBD8;}

  /* UPSELL SCORE */
  table.upsell-tbl{width:100%;border-collapse:collapse;font-size:11.8px;min-width:1180px;}
  table.upsell-tbl th{
    padding:8px 6px;font-size:10px;font-family:var(--font-mono);text-transform:uppercase;color:var(--ink-soft);
    border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;background:var(--surface-2);
  }
  table.upsell-tbl th:first-child{text-align:left;padding-left:12px;}
  table.upsell-tbl td{padding:6px;border-bottom:1px solid var(--line-soft);text-align:center;vertical-align:middle;min-width:74px;}
  table.upsell-tbl td:first-child{text-align:left;padding-left:12px;white-space:normal;}
  tr.upsell-pillar-row td{background:var(--sidebar);color:#fff;font-family:var(--font-display);font-weight:700;padding-top:9px;padding-bottom:9px;}
  tr.upsell-pillar-row td:first-child{border-radius:0;}
  tr.upsell-kpi-row td:first-child{padding-left:26px;font-weight:600;color:var(--ink);font-size:11.6px;}
  tr.upsell-kpi-computed-row td:first-child{padding-left:26px;font-weight:700;color:var(--accent-ink);font-size:11.6px;}
  tr.upsell-kpi-computed-row td{background:var(--accent-soft);}
  tr.upsell-sub-row td:first-child{padding-left:40px;color:var(--ink-soft);font-size:11px;}
  .weekly-breakdown-tbl th:first-child, .weekly-breakdown-tbl td:first-child{
    position:sticky;left:0;z-index:2;background:var(--surface);box-shadow:2px 0 4px -2px rgba(20,22,35,0.12);
  }
  .weekly-breakdown-tbl th:first-child{z-index:3;background:var(--surface-2);}
  .upsell-input{
    width:56px;padding:4px 5px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);
    font-size:11.3px;text-align:center;font-family:var(--font-mono);
  }
  .upsell-input:focus{border-color:var(--accent);background:var(--surface);outline:none;}
  .upsell-score-badge{
    display:inline-block;margin-top:3px;font-family:var(--font-mono);font-size:10px;font-weight:700;
    padding:1px 6px;border-radius:10px;background:var(--positive-soft);color:var(--positive);
  }
  .upsell-score-badge.mid{background:var(--warn-soft);color:var(--warn);}
  .upsell-score-badge.low{background:var(--negative-soft);color:var(--negative);}
  .upsell-select{
    width:64px;padding:4px 3px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);
    font-size:10.6px;text-align:center;
  }
  .upsell-check{width:16px;height:16px;cursor:pointer;accent-color:var(--accent);}
  .upsell-pillar-score{font-size:13px;}

  /* COBERTURA DE DADOS */
  table.cobertura-tbl{width:100%;border-collapse:collapse;font-size:12px;min-width:760px;}
  table.cobertura-tbl th{
    padding:9px 10px;font-size:10.5px;font-family:var(--font-mono);text-transform:uppercase;color:var(--ink-soft);
    border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;background:var(--surface-2);
  }
  table.cobertura-tbl th:first-child{text-align:left;padding-left:14px;}
  table.cobertura-tbl td{padding:7px 8px;border-bottom:1px solid var(--line-soft);text-align:center;vertical-align:middle;}
  table.cobertura-tbl td:first-child{text-align:left;}
  tr.cobertura-base-row td{background:var(--sidebar);color:#fff;font-family:var(--font-display);font-weight:700;padding-top:9px;padding-bottom:9px;}
  tr.cobertura-base-row td:first-child{padding-left:14px;}
  tr.cobertura-item-row td:first-child{padding-left:30px;color:var(--ink-soft);font-size:11.6px;}
  tr.cobertura-total-row td{border-top:1.5px solid var(--ink);font-weight:700;color:var(--ink);background:var(--accent-soft);}
  tr.cobertura-total-row td:first-child{padding-left:14px;}
  .cobertura-check{
    display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;
    border:1.5px solid var(--line);cursor:pointer;background:var(--surface);color:transparent;transition:all 0.12s;
  }
  .cobertura-check:hover{border-color:var(--accent);}
  .cobertura-check.checked{background:var(--positive);border-color:var(--positive);color:#fff;}

  /* DEMANDAS */
  .demandas-filters-card{padding:16px 18px 18px;margin-bottom:16px;}
  .demandas-filter-label{
    font-size:11px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.5px;
    color:var(--ink-soft);margin-bottom:9px;display:flex;align-items:center;gap:8px;
  }
  .status-filter-chip{
    font-size:11.3px;font-weight:600;padding:5px 11px;border-radius:20px;border:1px solid transparent;
    cursor:pointer;transition:filter 0.12s, transform 0.1s;font-family:inherit;
  }
  .status-filter-chip:hover{filter:brightness(0.96);}
  .status-filter-chip.active{box-shadow:var(--shadow-sm);}
  .demandas-client-card{margin-bottom:16px;}
  .demandas-client-head{cursor:pointer;user-select:none;}
  .demandas-client-head:hover{background:var(--surface-2);}
  .demandas-expand-btn{
    width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--surface);
    color:var(--ink-soft);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;font-family:var(--font-mono);
  }
  .demandas-expand-btn:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);}
  table.demandas-tbl{width:100%;border-collapse:collapse;font-size:12.3px;min-width:2060px;}
  table.demandas-tbl th{
    text-align:left;padding:9px 12px;font-size:10.3px;font-family:var(--font-mono);text-transform:uppercase;
    letter-spacing:0.4px;color:var(--ink-soft);border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);
  }
  table.demandas-tbl td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  table.demandas-tbl tr:hover td{background:var(--surface-2);}
  .demanda-num{font-family:var(--font-mono);color:var(--ink-soft);white-space:nowrap;}
  .demanda-assunto{max-width:320px;font-size:12.3px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .demanda-resp{white-space:nowrap;font-size:12px;color:var(--ink-soft);}
  .demanda-dias{font-family:var(--font-mono);text-align:center;white-space:nowrap;}
  .status-pill{
    display:inline-block;font-size:10.8px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;
  }
  .demanda-select{
    width:100%;min-width:210px;padding:6px 7px;border-radius:7px;border:1px solid transparent;background:var(--surface-2);
    font-size:11.6px;color:#000;outline:none;
  }
  .demanda-select:hover{border-color:var(--line);}
  .demanda-select:focus{border-color:var(--accent);background:var(--surface);}
  .demanda-select.empty{color:#B8BCC9;}

// Converte as linhas cruas da planilha (array de arrays, cabeçalho na linha 0) no mesmo formato
// usado por DEMANDAS_SEED: {n, a, s, u, c, r, d}. Colunas esperadas (nessa ordem): Número, Assunto,
// Categoria, Status, Urgência, Serviço (1º Nível), Cliente (Organização), Responsável, Aberto em.
function transformMovideskRows(rows){
  const out = [];
  for(let i = 1; i < rows.length; i++){
    const row = rows[i];
    if(!row) continue;
    const numero = row[0];
    const assunto = row[1];
    const status = row[3];
    const urgencia = row[4];
    const clienteRaw = row[6];
    const responsavel = row[7];
    const abertoEmRaw = row[8];
    if(numero === undefined || numero === null || numero === '' || !clienteRaw || !status || !abertoEmRaw) continue;
    const firstClient = String(clienteRaw).split(',')[0].trim();
    const mapped = MOVIDESK_CLIENT_MAP[firstClient];
    if(!mapped) continue;
    const d = (abertoEmRaw instanceof Date) ? abertoEmRaw : new Date(abertoEmRaw);
    if(isNaN(d.getTime())) continue;
    const iso = d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()) + 'T'
      + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
    out.push({
      n: String(numero).trim(),
      a: (assunto || '').toString().trim(),
      s: (status || '').toString().trim(),
      u: (urgencia || '').toString().trim(),
      c: mapped,
      r: (responsavel || '').toString().trim(),
      d: iso,
    });
  }
  return out;
}

function daysBetween(iso, now){
  const start = new Date(iso);
  if(isNaN(start.getTime())) return null;
  const a = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  const b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((b - a) / 86400000);
}

function fmtDataAbertura(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '—';
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return dd + '/' + mm + '/' + d.getFullYear();
}

// Atrasado: se o ticket ainda está aberto, compara o prazo com hoje;
// se já foi concluído (Fechado/Resolvido), compara a data de conclusão informada com o prazo.
// Cancelado nunca é considerado atrasado.
function isDemandaAtrasado(prazo, status, concluidoEm){
  if(!prazo) return false;
  if(status === 'Cancelado') return false;
  const prazoDate = new Date(prazo + 'T00:00:00');
  if(isNaN(prazoDate.getTime())) return false;
  if(DEMANDA_STATUS_TERMINAL.includes(status)){
    if(!concluidoEm) return false;
    const concluidoDate = new Date(concluidoEm + 'T00:00:00');
    if(isNaN(concluidoDate.getTime())) return false;
    return concluidoDate > prazoDate;
  }
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return prazoDate < today;
}

// Concluída dentro do prazo: só é possível afirmar quando temos prazo E data de conclusão preenchidos.
function isDemandaConcluidaNoPrazo(prazo, status, concluidoEm){
  if(status !== 'Resolvido' && status !== 'Fechado') return false;
  if(!prazo || !concluidoEm) return false;
  return !isDemandaAtrasado(prazo, status, concluidoEm);
}

function parseCsat(v){
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}
function avgCsat(list){
  const nums = list.map(parseCsat).filter(n => n !== null);
  if(nums.length === 0) return null;
  return nums.reduce((a,b)=>a+b,0) / nums.length;
}

function buildDemandasMerged(customMap, baseRows){
  const custom = customMap || {};
  const now = new Date();
  const base = (baseRows && baseRows.length) ? baseRows : DEMANDAS_SEED;
  return base.map(o => {
    const c = custom[o.n] || {};
    const prazo = c.prazo || '';
    const concluidoEm = c.concluidoEm || '';
    // Dias em Aberto: se o ticket já foi finalizado (Fechado/Resolvido/Cancelado), usa o tempo até a
    // data de conclusão informada (senão fica indefinido — não dá pra saber quanto tempo ficou aberto).
    // Se ainda está aberto, usa o tempo decorrido até hoje.
    let dias;
    if(DEMANDA_STATUS_TERMINAL.includes(o.s)){
      dias = concluidoEm ? daysBetween(o.d, new Date(concluidoEm + 'T00:00:00')) : null;
    } else {
      dias = daysBetween(o.d, now);
    }
    return {
      numero: o.n,
      assunto: o.a,
      status: o.s,
      urgencia: o.u,
      cliente: o.c,
      responsavel: o.r,
      abertoEm: o.d,
      diasEmAberto: dias,
      csat: o.csat || '', // ainda não disponível na base do Movidesk; placeholder até a coluna existir na exportação
      classificacao: c.classificacao || '',
      tipo: c.tipo || '',
      responsavelDesenvolvimentoId: c.responsavelDesenvolvimentoId || '',
      prazo: prazo,
      concluidoEm: concluidoEm,
      mesPlanning: c.mesPlanning || '',
      prioridade: c.prioridade || '',
      atrasado: isDemandaAtrasado(prazo, o.s, concluidoEm),
      concluidaNoPrazo: isDemandaConcluidaNoPrazo(prazo, o.s, concluidoEm),
      editMeta: c._editMeta || {},
    };
  });
}

// Formata o metadado de última edição de um campo para exibir em tooltip.
// meta = { by: 'nome ou e-mail', at: 'ISO timestamp' }
function fmtEditMetaTooltip(meta){
  if(!meta || !meta.by || !meta.at) return null;
  const d = new Date(meta.at);
  if(isNaN(d.getTime())) return null;
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const mo = String(d.getMonth()+1).padStart(2,'0');
  return `Última edição feita por ${meta.by} às ${hh}:${mm} do dia ${dd}.${mo}`;
}

const TIME_SLOTS = (() => {
  const slots = [];
  for(let h=9; h<=18; h++){
    slots.push(pad2(h)+':00');
    if(h<18) slots.push(pad2(h)+':30');
  }
  return slots;
})();
const HOUR_MARK_OPTIONS = TIME_SLOTS.filter(t => t.endsWith(':00') && t !== '18:00');
function randomHourSlot(){
  return HOUR_MARK_OPTIONS[Math.floor(Math.random() * HOUR_MARK_OPTIONS.length)];
}

function colorForArea(area){
  if(!area) return '#8A8FA6';
  let hash = 0;
  for(let i=0;i<area.length;i++){ hash = area.charCodeAt(i) + ((hash<<5)-hash); }
  return AREA_PALETTE[Math.abs(hash) % AREA_PALETTE.length];
}
function initials(name){
  if(!name) return '?';
  const parts = name.trim().split(/\s+/);
  if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
}
function uid(){ return 'id_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

}
function isUrlLike(str){
  return typeof str === 'string' && /^https?:\/\//i.test(str.trim());
}
function fmtCurrency(v){
  if(v === undefined || v === null || v === '') return null;
  const n = Number(v)||0;
  const sign = n < 0 ? '-' : '';
  return sign + 'R$ ' + Math.abs(n).toLocaleString('pt-BR');
}
function fmtPercent(v, digits){
  const n = Number(v)||0;
  return n.toLocaleString('pt-BR', {minimumFractionDigits: digits ?? 1, maximumFractionDigits: digits ?? 1}) + '%';
}

// Re-applies the org-chart-based participant rules to already-persisted routines
// that match a known seed (same dia + título + cliente). Custom routines the
// person created themselves (no matching spec) are left untouched.
function reconcileRotinaParticipants(pessoas, clientes, rotinas){
  const cid = (nome) => findClienteId(clientes, nome);
  const specs = buildRotinaSpecs(pessoas);
  let changed = false;
  const next = (rotinas || []).map(r => {
    const match = specs.find(s => s.dia === r.dia && s.titulo === r.titulo && cid(s.cliente) === r.clienteId);
    if(!match) return r;
    const same = JSON.stringify([...match.participantes].sort()) === JSON.stringify([...(r.participanteIds||[])].sort());
    if(same) return r;
    changed = true;
    return {...r, participanteIds: match.participantes};
  });
  return {rotinas: next, changed};
}

function clampNum(v, min, max){ return Math.min(max, Math.max(min, v)); }
function isEmptyVal(v){ return v === null || v === undefined || v === ''; }

function scorePct100(v){ if(isEmptyVal(v)) return null; return clampNum(Number(v),0,100)/100*10; }
function scoreTempo(v){
  if(isEmptyVal(v)) return null;
  const t = Number(v);
  if(t<=30) return 10;
  return clampNum(10 - Math.ceil((t-30)/30), 0, 10);
}
function scoreCSAT(v){ if(isEmptyVal(v)) return null; return clampNum(Number(v)*2, 0, 10); }
function scoreDiasAberto(v){
  if(isEmptyVal(v)) return null;
  const d = Number(v);
  const table = [[5,10],[8,9],[10,8],[12,7],[14,6],[16,5],[18,4],[20,3],[22,2],[24,1]];
  for(const [max,score] of table){ if(d<=max) return score; }
  return 0;
}
const SUBFAT_TABLE = [[0,0],[0.1,1],[0.4,2],[0.7,3],[0.9,4],[1.2,5],[1.5,6],[2,7],[3,8],[4,9],[5,10]];
const CONTASAUTO_TABLE = [[0,0],[1,1],[4,2],[6,3],[8,4],[10,5],[15,6],[20,7],[30,8],[40,9],[50,10]];
function scoreBracketAsc(v, table){
  if(isEmptyVal(v)) return null;
  const n = Number(v);
  let result = table[0][1];
  for(const [min,score] of table){ if(n>=min) result = score; }
  return result;
}
const TERMOMETRO_MAP = {quente:2.5, morno:2, frio:0};
function scoreTermometro(sub){
  if(!sub) return null;
  let sum = 0, any = false;
  Object.keys(sub).forEach(k => { if(sub[k]){ sum += TERMOMETRO_MAP[sub[k]] || 0; any = true; } });
  return any ? clampNum(sum, 0, 10) : null;
}
function scoreRitos(sub){
  if(!sub) return null;
  let sum = 0, any = false;
  Object.keys(sub).forEach(k => { if(sub[k]){ sum += 2.5; any = true; } });
  return any ? clampNum(sum, 0, 10) : null;
}
function computeKpiScore(kpi, monthData){
  if(!monthData) return null;
  const raw = monthData[kpi.key];
  switch(kpi.tipo){
    case 'pct100': return scorePct100(raw);
    case 'tempo': return scoreTempo(raw);
    case 'csat': return scoreCSAT(raw);
    case 'diasAberto': return scoreDiasAberto(raw);
    case 'subfat': return scoreBracketAsc(raw, SUBFAT_TABLE);
    case 'contasAuto': return scoreBracketAsc(raw, CONTASAUTO_TABLE);
    case 'termometro': return scoreTermometro(raw);
    case 'ritos': return scoreRitos(raw);
    default: return null;
  }
}
function computePillarScore(pillar, monthData){
  const scores = pillar.kpis.map(k => computeKpiScore(k, monthData)).filter(s => s !== null && s !== undefined);
  if(scores.length === 0) return null;
  return scores.reduce((a,b)=>a+b,0) / scores.length;
}
function computeUpsellScore(monthData){
  const scores = UPSELL_PILLARS.map(p => computePillarScore(p, monthData)).filter(s => s !== null && s !== undefined);
  if(scores.length === 0) return null;
  return scores.reduce((a,b)=>a+b,0) / scores.length;
}
function fmtScore(v){
  if(v === null || v === undefined) return '—';
  return v.toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1});
}
function avgOf(values){
  const nums = values.filter(v => v !== null && v !== undefined && !isNaN(v));
  if(nums.length === 0) return null;
  return nums.reduce((a,b)=>a+b,0) / nums.length;
}

function reconcileTarefaTitles(tarefas){
  let changed = false;
  const next = (tarefas || []).map(t => {
    const novo = TASK_TITLE_UPDATES[t.titulo];
    if(novo && novo !== t.titulo){
      changed = true;
      return {...t, titulo: novo};
    }
    return t;
  });
  return {tarefas: next, changed};
}

function runMigrations(parsed){
      let changed = false;
      // migrate: seed the org chart if no one has been added yet
      if(!parsed.pessoas || parsed.pessoas.length === 0){
        parsed.pessoas = buildSeedPessoas();
        changed = true;
      }
      // migrate: rename "Client Lead" area label to "Deployment Lead"
      if(parsed.pessoas && parsed.pessoas.some(p => p.area === 'Client Lead')){
        parsed.pessoas = parsed.pessoas.map(p => p.area === 'Client Lead' ? {...p, area: 'Deployment Lead'} : p);
        changed = true;
      }
      // migrate: ensure the "Interno" client exists
      if(!parsed.clientes) parsed.clientes = [];
      if(!parsed.clientes.some(c => c.nome.toLowerCase() === 'interno')){
        parsed.clientes = [...parsed.clientes, {id: uid(), nome: 'Interno'}];
        changed = true;
      }
      // migrate: seed rotinas if none exist yet
      if(!parsed.rotinas || parsed.rotinas.length === 0){
        parsed.rotinas = buildSeedRotinas(parsed.pessoas, parsed.clientes);
        changed = true;
      } else {
        const {rotinas: fixed, changed: fixedChanged} = reconcileRotinaParticipants(parsed.pessoas, parsed.clientes, parsed.rotinas);
        if(fixedChanged){ parsed.rotinas = fixed; changed = true; }
      }
      // migrate: seed tarefas if none exist yet
      if(!parsed.tarefas || parsed.tarefas.length === 0){
        parsed.tarefas = buildSeedTarefas(parsed.pessoas, parsed.clientes);
        changed = true;
      } else {
        const {tarefas: fixedTitles, changed: titlesChanged} = reconcileTarefaTitles(parsed.tarefas);
        if(titlesChanged){ parsed.tarefas = fixedTitles; changed = true; }
      }
      // migrate: seed financeiro/P&L data if missing
      if(!parsed.financeiro || !parsed.financeiro.pnl || Object.keys(parsed.financeiro.pnl).length === 0){
        parsed.financeiro = buildSeedFinanceiro();
        changed = true;
      } else if(!parsed.financeiro.contasFinalizadas){
        parsed.financeiro.contasFinalizadas = buildSeedFinanceiro().contasFinalizadas;
        changed = true;
      }
      // migrate: ensure upsellScore field exists
      if(!parsed.upsellScore){
        parsed.upsellScore = {};
        changed = true;
      }
      // migrate: ensure efetividadeRegras field exists
      if(!parsed.efetividadeRegras){
        parsed.efetividadeRegras = {};
        changed = true;
      }
      // migrate: ensure penetracaoRegras field exists
      if(!parsed.penetracaoRegras){
        parsed.penetracaoRegras = {};
        changed = true;
      }
      // migrate: ensure budget fields (definidos direto na tela do indicador) existem
      if(!parsed.efetividadeRegrasBudget){
        parsed.efetividadeRegrasBudget = {};
        changed = true;
      }
      if(!parsed.penetracaoRegrasBudget){
        parsed.penetracaoRegrasBudget = {};
        changed = true;
      }
      if(parsed.financeiro && !parsed.financeiro.contasFinalizadasBudget){
        parsed.financeiro.contasFinalizadasBudget = {};
        changed = true;
      }
      // migrate: seed/convert NPS data to the manual per-client editable format
      if(!parsed.nps || Object.keys(parsed.nps).length === 0){
        parsed.nps = buildSeedNPSManual(parsed.clientes);
        changed = true;
      } else {
        const yearData = parsed.nps[CURRENT_YEAR] || {};
        const validIds = new Set(parsed.clientes.map(c => c.id));
        const looksOld = Object.keys(yearData).some(k => k !== '_total' && !validIds.has(k));
        if(looksOld){
          parsed.nps = buildSeedNPSManual(parsed.clientes);
          changed = true;
        }
      }
      // migrate: ensure coberturaDados field exists
      if(!parsed.coberturaDados){
        parsed.coberturaDados = {};
        changed = true;
      } else {
        // migrate: coberturaDados passou a ter uma dimensão de mês (ano -> mês -> rowKey -> clienteId).
        // formato antigo era plano (rowKey -> clienteId -> true). Detecta pelo formato das chaves de topo.
        const topKeys = Object.keys(parsed.coberturaDados);
        const looksOldFlat = topKeys.some(k => k.includes('__'));
        if(looksOldFlat){
          const oldFlat = parsed.coberturaDados;
          const nowMonth = new Date().getMonth() + 1;
          parsed.coberturaDados = {[CURRENT_YEAR]: {[nowMonth]: oldFlat}};
          changed = true;
        } else if(!parsed.coberturaDados[CURRENT_YEAR]){
          parsed.coberturaDados[CURRENT_YEAR] = {};
          changed = true;
        }
      }
      // migrate: adiciona as novas funções de Papéis e Responsabilidades (Deployment/Produto) cadastradas em Ago/2026,
      // caso ainda não existam na base salva (checagem por título, idempotente)
      if(parsed.tarefas){
        const titulosExistentes = new Set(parsed.tarefas.map(t => t.titulo));
        const faltantes = NOVAS_FUNCOES_2026_08_TITULOS.filter(t => !titulosExistentes.has(t));
        if(faltantes.length){
          const todasNovas = buildSeedTarefas(parsed.pessoas, parsed.clientes)
            .filter(t => faltantes.includes(t.titulo));
          parsed.tarefas = [...parsed.tarefas, ...todasNovas];
          changed = true;
        }
      }
      // migrate: ensure demandasCustom field exists (campos editáveis por nº de ticket)
      if(!parsed.demandasCustom){
        parsed.demandasCustom = {};
        changed = true;
      }
      // migrate: associa cada meta ao slug do indicador correspondente, para conectar o Realizado automático
      if(parsed.metas && parsed.metas.some(m => !m.slug)){
        const byTitulo = {};
        INDICADORES.forEach(ind => { byTitulo[ind.titulo] = ind.slug; });
        const sameLength = parsed.metas.length === INDICADORES.length;
        parsed.metas = parsed.metas.map((m, i) => {
          if(m.slug) return m;
          const slugByTitulo = byTitulo[m.titulo];
          const slug = slugByTitulo || (sameLength ? INDICADORES[i].slug : undefined);
          return slug ? {...m, slug} : m;
        });
        changed = true;
      }
      // migrate: atualiza a Fonte de cada meta para o valor correto mais recente, pelo slug do indicador
      if(parsed.metas){
        const fonteBySlug = {};
        INDICADORES.forEach(ind => { fonteBySlug[ind.slug] = ind.fonte; });
        let fonteChanged = false;
        parsed.metas = parsed.metas.map(m => {
          const fonteCorreta = m.slug && fonteBySlug[m.slug];
          if(fonteCorreta && m.fonte !== fonteCorreta){
            fonteChanged = true;
            return {...m, fonte: fonteCorreta};
          }
          return m;
        });
        if(fonteChanged) changed = true;
      }
      return {data: parsed, changed};
}

// Fonte de dados legada (antes da migração para Firebase): usada apenas UMA VEZ,
// para semear a base compartilhada do Firestore com os dados já existentes localmente
// na primeira vez que este arquivo é aberto após a migração. Depois disso, o Firestore
// passa a ser a única fonte de verdade (tempo real, compartilhada entre usuários).
async function loadLegacyLocalData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      const {data} = runMigrations(parsed);
      return data;
    }
  }catch(e){ /* key not found or storage unavailable */ }
  return buildDefaultData();
}

/* ---------------------------------------------------------------
   FIRESTORE (base compartilhada em tempo real)
--------------------------------------------------------------- */
const FIRESTORE_COLLECTION = 'gestaoAuditoria';
const FIRESTORE_DOC_ID = 'appData';

function waitForFirebase(){
  return new Promise(resolve => {
    if(window.__firebaseReady) return resolve(window.__firebase);
    const iv = setInterval(() => {
      if(window.__firebaseReady){ clearInterval(iv); resolve(window.__firebase); }
    }, 30);
  });
}

async function getAppDataDocRef(){
  const fb = await waitForFirebase();
  return fb.doc(fb.db, FIRESTORE_COLLECTION, FIRESTORE_DOC_ID);
}

// Garante que o documento compartilhado existe no Firestore. Se ainda não existir
// (primeiro uso após a migração), semeia com os dados locais já existentes neste
// computador (ou com a base padrão, se não houver nada salvo localmente).
async function ensureFirestoreSeeded(){
  const fb = await waitForFirebase();
  const ref = await getAppDataDocRef();
  const snap = await fb.getDoc(ref);
  if(!snap.exists()){
    const seed = await loadLegacyLocalData();
    await fb.setDoc(ref, seed);
    return seed;
  }
  return null;
}

async function persistPatch(patch){
  try{
    const fb = await waitForFirebase();
    const ref = await getAppDataDocRef();
    await fb.updateDoc(ref, patch);
    return true;
  }catch(e){
    console.error('Firestore write error', e);
    return false;
  }
}

function MultiSelect({options, value, onChange, placeholder, colorFn}){
  const [open, setOpen] = useState(false);

  useEffect(() => {
    function onDoc(e){ if(ref.current && !ref.current.contains(e.target)) setOpen(false); }

/* ---------------------------------------------------------------
   BAR CHART (SVG) — Budget vs Realizado ready
--------------------------------------------------------------- */
function fmtChartValue(v, unidade){
  if(v === null || v === undefined || isNaN(v)) return '—';
  return unidade === '%' ? fmtPercent(v) : fmtNumber(v);
}

function BudgetChart({budgetsByMonth, realizedByMonth, unidade}){
  const W = 640, H = 240, padL = 40, padB = 28, padT = 12, padR = 12;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const values = MONTHS.map(m => Number(budgetsByMonth[m.n]) || 0);
  const realized = realizedByMonth ? MONTHS.map(m => Number(realizedByMonth[m.n]) || 0) : null;
  const maxVal = Math.max(1, ...values, ...(realized || [0]));
  const minVal = Math.min(0, ...values, ...(realized || [0]));
  const range = (maxVal - minVal) || 1;
  const zeroY = padT + (maxVal / range) * chartH;
  const barGroupW = chartW / MONTHS.length;
  const barW = realized ? barGroupW * 0.28 : barGroupW * 0.46;
  const gridLines = 4;

  const wrapRef = useRef(null);
  const [hoverIdx, setHoverIdx] = useState(null);
  const [tooltipLeftPct, setTooltipLeftPct] = useState(50);

  const handleMove = (e) => {
    if(!wrapRef.current) return;
    const rect = wrapRef.current.getBoundingClientRect();
    if(rect.width === 0) return;
    const fracX = (e.clientX - rect.left) / rect.width;
    const svgX = fracX * W;
    const idx = Math.floor((svgX - padL) / barGroupW);
    if(idx < 0 || idx >= MONTHS.length){ setHoverIdx(null); return; }
    setHoverIdx(idx);
    setTooltipLeftPct(Math.min(92, Math.max(8, fracX * 100)));
  };
  const handleLeave = () => setHoverIdx(null);
  const hoveredMonth = hoverIdx !== null ? MONTHS[hoverIdx] : null;

  return (
    <div style={{position:'relative'}}>
      <div className="chart-legend">
        <div className="legend-item"><span className="legend-swatch" style={{background:'var(--accent)'}}></span>Budget</div>
        {realized && <div className="legend-item"><span className="legend-swatch" style={{background:'var(--positive)'}}></span>Realizado</div>}
      </div>
      <div ref={wrapRef} onMouseMove={handleMove} onMouseLeave={handleLeave} style={{position:'relative'}}>
        <svg viewBox={"0 0 " + W + " " + H} width="100%" height="240" style={{overflow:'visible'}}>
          {Array.from({length: gridLines+1}).map((_, i) => {
            const y = padT + (chartH / gridLines) * i;
            const val = maxVal - (range / gridLines) * i;
            return (
              <g key={i}>
                <line x1={padL} x2={W-padR} y1={y} y2={y} stroke="#EEF0F4" strokeWidth="1"/>
                <text x={padL-8} y={y+3} fontSize="9.5" fill="#93970F" textAnchor="end" fontFamily="IBM Plex Mono, monospace" opacity="0.75">
                  {val >= 1000 ? Math.round(val/1000)+'k' : Math.round(val)}
                </text>
              </g>
            );
          })}
          {hoverIdx !== null && (
            <rect x={padL + barGroupW*hoverIdx} y={padT} width={barGroupW} height={chartH} fill="rgba(30,62,112,0.06)"/>
          )}
          {MONTHS.map((m, i) => {
            const gx = padL + barGroupW * i;
            const bH = Math.abs(values[i] / range) * chartH;
            const bx = gx + barGroupW/2 - (realized ? barW + 2 : barW/2);
            const rH = realized ? Math.abs(realized[i] / range) * chartH : 0;
            const rx = gx + barGroupW/2 + 2;
            const bY = values[i] >= 0 ? zeroY - bH : zeroY;
            const rY = realized && realized[i] >= 0 ? zeroY - rH : zeroY;
            return (
              <g key={m.n}>
                <rect x={bx} y={bY} width={barW} height={bH} rx="2.5" fill="var(--accent)" opacity={hoverIdx===null || hoverIdx===i ? 0.92 : 0.45}/>
                {realized && <rect x={rx} y={rY} width={barW} height={rH} rx="2.5" fill="var(--positive)" opacity={hoverIdx===null || hoverIdx===i ? 0.92 : 0.45}/>}
                <text x={gx + barGroupW/2} y={H-8} fontSize="10.5" fill="#5D6274" textAnchor="middle" fontFamily="Inter, sans-serif">{m.label}</text>
              </g>
            );
          })}
          <line x1={padL} x2={padL} y1={padT} y2={padT+chartH} stroke="#E6E8EE"/>
          <line x1={padL} x2={W-padR} y1={zeroY} y2={zeroY} stroke="#E6E8EE"/>
        </svg>
        {hoveredMonth && (
          <div className="chart-tooltip" style={{left: tooltipLeftPct + '%'}}>
            <div className="chart-tooltip-title">{hoveredMonth.label} · {CURRENT_YEAR}</div>
            <div className="chart-tooltip-row"><span className="chart-tooltip-dot" style={{background:'var(--accent)'}}></span>Budget: <b>{fmtChartValue(values[hoverIdx], unidade)}</b></div>
            {realized && <div className="chart-tooltip-row"><span className="chart-tooltip-dot" style={{background:'var(--positive)'}}></span>Realizado: <b>{fmtChartValue(realized[hoverIdx], unidade)}</b></div>}
          </div>
        )}
      </div>
    </div>
  );
}

    const validIds = new Set(pessoas.map(p => p.id));
    return pessoas.filter(p => !p.reportsToId || !validIds.has(p.reportsToId));
  }, [pessoas]);

  // roots go in the __root__ bucket already via reportsToId falsy; orphaned managers also treated as roots
  const rootsForRender = useMemo(() => {
    const rootIds = new Set(roots.map(r => r.id));
    return pessoas.filter(p => rootIds.has(p.id));
  }, [roots, pessoas]);

  return (
    <div className="card">
      <div className="section-block-head" style={{padding:'18px 22px 0'}}>
        <div>
          <div className="section-block-title">Organograma</div>
          <div className="section-block-desc">Estrutura do time — cadastro central de pessoas.</div>
        </div>
        <button className="btn btn-primary btn-sm" onClick={()=>setModal('new')}><IconPlus width="14" height="14"/>Adicionar pessoa</button>
      </div>

      {pessoas.length === 0 ? (
        <EmptyState icon={IconUsers} title="Nenhuma pessoa cadastrada"
          sub="Adicione as pessoas do time para montar o organograma e liberar a seleção delas em Responsabilidades e Metas."
          action={<button className="btn btn-primary btn-sm" onClick={()=>setModal('new')}><IconPlus width="14" height="14"/>Adicionar pessoa</button>}
        />
      ) : (
        <div className="orgchart-wrap">
          <div className="orgchart" style={{flexDirection:'row', alignItems:'flex-start', justifyContent:'center', gap:32}}>
            {rootsForRender.map(root => (
              <OrgNode key={root.id} person={root} childrenByManager={childrenByManager}
                onEditPerson={(p)=>setModal(p)} onDeletePerson={(p)=>setConfirmDel(p)}/>
            ))}
          </div>
        </div>
      )}

      <datalist id="area-suggestions">
        {areaOptions.map(a => <option value={a} key={a}/>)}
      </datalist>

      {modal && (
        <PersonModal
          initial={modal === 'new' ? null : modal}
          allPessoas={pessoas}
          onClose={()=>setModal(null)}
          onSave={(data) => { modal === 'new' ? onAdd(data) : onEdit(modal.id, data); setModal(null); }}
        />

      <ConfirmDialog
        open={!!confirmDel}
        title="Excluir pessoa"
        text={confirmDel ? 'Tem certeza que deseja excluir "' + confirmDel.nome + '"? As pessoas que reportam para ela passam a ficar no topo do organograma, e ela será removida das responsabilidades e metas em que estiver associada.' : ''}
        onCancel={()=>setConfirmDel(null)}
        onConfirm={()=>{ onDelete(confirmDel.id); setConfirmDel(null); }}
      />
    </div>
  );
}
