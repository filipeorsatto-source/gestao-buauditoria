// Slide 15 — Produto: 3 colunas (Features Produto, Entregas Produto, Monitoramento) com os KPIs
// consolidados de produto.
function addPlanningProdutoSlide(pptx, data, mesN, mesLabel){
  const slide = pptx.addSlide();
  slide.background = {color: RIVIO_PPTX.branco};
  addPlanningHeader(pptx, slide, 'Iniciativas do mês · projetos', 'Produto');

  const mesAnt = mesAnteriorPlanning(mesN);
  const respProduto = (getAreaResponsavelGeralPlanning(data, 'Produto') || '—').toUpperCase();

  const realizadoYear = (data.produtoFuncoesRealizado && data.produtoFuncoesRealizado[CURRENT_YEAR]) || {};
  const budgetYear = (data.produtoFuncoesBudget && data.produtoFuncoesBudget[CURRENT_YEAR]) || {};
  const funcoesRealRaw = mesAnt ? (realizadoYear.funcoes || {})[mesAnt] : null;
  const funcoesMetaRaw = (budgetYear.funcoes || {})[mesN];
  const coberturaRealRaw = mesAnt ? (realizadoYear.cobertura || {})[mesAnt] : null;
  const coberturaMetaRaw = (budgetYear.cobertura || {})[mesN];
  const isVazio = v => v === undefined || v === null || v === '';

  const merged = buildDemandasMerged(data.demandasCustom, data.demandasBase, data.demandasManuais);
  const csatProdutoReal = mesAnt
    ? avgCsat(merged.filter(m => m.classificacao === 'Desenvolvimento Produto' && String(m.mesConclusao) === String(mesAnt)).map(m => m.csat))
    : null;

  const coberturaDadosReal = mesAnt ? getKpiRealBudgetNoMes(data, 'cobertura-dados', mesAnt, null, null).real : null;
  const coberturaDadosMeta = getKpiRealBudgetNoMes(data, 'cobertura-dados', mesN, null, null).budget;

  const gap = 0.22, colW = (12.53 - gap*2)/3, startX = 0.4, startY = 1.9, colH = 5.2;

  const cols = [
    {nome:'Features Produto', stats:[
      {label:'FUNÇÕES MAPEADAS', real: isVazio(funcoesRealRaw) ? '—' : String(funcoesRealRaw), meta: isVazio(funcoesMetaRaw) ? '—' : String(funcoesMetaRaw)},
      {label:'COBERTURA PRODUTO', real: fmtMetaValorReport(coberturaRealRaw, '%'), meta: fmtMetaValorReport(coberturaMetaRaw, '%')},
    ]},
    {nome:'Entregas Produto', stats:[
      {label:'CSAT PRODUTO', real: csatProdutoReal === null ? '—' : csatProdutoReal.toLocaleString('pt-BR', {maximumFractionDigits:1}), meta:'4,0'},
    ]},
    {nome:'Monitoramento', stats:[
      {label:'COBERTURA DADOS', real: fmtMetaValorReport(coberturaDadosReal, '%'), meta: fmtMetaValorReport(coberturaDadosMeta, '%')},
    ]},
  ];

  cols.forEach((col, i) => {
    const x = startX + i*(colW+gap);
    slide.addShape(pptx.ShapeType.roundRect, {x, y:startY, w:colW, h:colH, rectRadius:0.05, fill:{color:RIVIO_PPTX.branco}, line:{color:'E6E6E6', width:1}});
    slide.addText(respProduto, {x:x+0.16, y:startY+0.16, w:colW-0.32, h:0.22, fontFace:RIVIO_PPTX.fontFace, fontSize:10, bold:true, color:'9AA0A6'});
    slide.addText(col.nome, {x:x+0.14, y:startY+0.42, w:colW-0.28, h:0.5, fontFace:RIVIO_PPTX.fontFace, fontSize:21, color:RIVIO_PPTX.tinta});
    let y = startY + 1.1;
    const boxW = colW - 0.32;
    col.stats.forEach(stat => {
      slide.addText(stat.label, {x:x+0.16, y, w:boxW, h:0.24, fontFace:RIVIO_PPTX.fontFace, fontSize:10, bold:true, color:RIVIO_PPTX.azul});
      y += 0.3;
      slide.addShape(pptx.ShapeType.roundRect, {x:x+0.16, y, w:boxW, h:0.44, rectRadius:0.05, fill:{color:PLANNING_STAT_BG}, line:{color:PLANNING_CARD_LINE, width:1}});
      slide.addText(stat.real, {x:x+0.16, y, w:boxW, h:0.28, fontFace:RIVIO_PPTX.fontFace, fontSize:12, bold:true, color:RIVIO_PPTX.tinta, align:'center', valign:'middle'});
      slide.addText('REAL', {x:x+0.16, y:y+0.26, w:boxW, h:0.16, fontFace:RIVIO_PPTX.fontFace, fontSize:7, bold:true, color:RIVIO_PPTX.tintaSoft, align:'center'});
      y += 0.44 + 0.1;
      slide.addShape(pptx.ShapeType.roundRect, {x:x+0.16, y, w:boxW, h:0.44, rectRadius:0.05, fill:{color:PLANNING_STAT_BG}, line:{color:PLANNING_CARD_LINE, width:1}});
      slide.addText(stat.meta, {x:x+0.16, y, w:boxW, h:0.28, fontFace:RIVIO_PPTX.fontFace, fontSize:12, bold:true, color:RIVIO_PPTX.tinta, align:'center', valign:'middle'});
      slide.addText('META', {x:x+0.16, y:y+0.26, w:boxW, h:0.16, fontFace:RIVIO_PPTX.fontFace, fontSize:7, bold:true, color:RIVIO_PPTX.tintaSoft, align:'center'});
      y += 0.44 + 0.28;
    });
  });
}

async function gerarPlanningPptx(data, mesN, formato){
  if(formato === 'pdf'){
    await Promise.all([
      preloadPdfImage('image/png;base64,' + RIVIO_LOGO_PRETO_B64),
      preloadPdfImage('image/png;base64,' + RIVIO_LOGO_BRANCO_B64),
    ]);
  }
  const pptx = criarPptxDestino(formato, 'Plano de Trabalho do Mês — Rivio');

  const mesNome = mesPlanningNome(mesN);
  const mesLabel = mesNome + '/' + CURRENT_YEAR;

  addPlanningCoverSlide(pptx, mesNome);

  const clientesTodos = DEMANDAS_CLIENTES_ORDEM.filter(c => c.toLowerCase() !== 'interno');
  clientesTodos.forEach(cliente => addPlanningClienteSlide(pptx, cliente, data, mesN, mesLabel));

  addPlanningDeploymentGeralSlide(pptx, data, mesN, mesLabel);

  const devs = (data.pessoas || []).filter(p => p.area === 'Desenvolvimento').slice().sort((a,b) => a.nome.localeCompare(b.nome,'pt-BR'));
  if(devs.length){
    for(let i=0; i<devs.length; i+=2){
      addPlanningDevSlide(pptx, [devs[i], devs[i+1] || null], data, mesN, mesLabel);
    }
  } else {
    addPlanningDevSlide(pptx, [null, null], data, mesN, mesLabel);
  }

  addPlanningAuditoriaGeralSlide(pptx, data, mesN, mesLabel);
  addPlanningAtendimentoKpisSlide(pptx, data, mesN, mesLabel);

  // Pedido em 29/08/2026: os "especialistas" desta tela são as pessoas cadastradas no organograma com
  // area==='Atendimento' E funcao==='Especialista' (hoje, só a Angela Censi) — não mais inferidos a
  // partir dos tickets, pra sempre aparecer mesmo num mês sem nenhuma demanda de personalização aberta.
  const especialistasAtendimento = (data.pessoas || []).filter(p => p.area === 'Atendimento' && p.funcao === 'Especialista')
    .sort((a,b) => a.nome.localeCompare(b.nome,'pt-BR'));
  if(especialistasAtendimento.length){
    for(let i=0; i<especialistasAtendimento.length; i+=2){
      addPlanningAtendimentoPersonalizacaoSlide(pptx, [especialistasAtendimento[i], especialistasAtendimento[i+1] || null], data, mesN, mesLabel);
    }
  } else {
    addPlanningAtendimentoPersonalizacaoSlide(pptx, [null, null], data, mesN, mesLabel);
  }

  addPlanningProdutoSlide(pptx, data, mesN, mesLabel);

  await finalizarExportacao(pptx, 'Planning - ' + mesNome + ' ' + CURRENT_YEAR, formato);
}


// Tela exibida em "Acompanhamento de Metas" quando nenhum indicador está selecionado no menu lateral —
// antes era só uma mensagem vazia; agora funciona como geradora do Report Mensal em PPTX (pedido em
// 27/08/2026), reaproveitando os mesmos dados/cálculos já usados no resto do app.
function TrackingIndexPage({data}){
  const [mesRelatorio, setMesRelatorio] = useState(() => {
    const hoje = new Date();
    return hoje.getFullYear() === CURRENT_YEAR ? (hoje.getMonth() + 1) : 12;
  });
  const [gerando, setGerando] = useState(false);
  const [erro, setErro] = useState('');
  const [gerandoPlanning, setGerandoPlanning] = useState(false);
  const [erroPlanning, setErroPlanning] = useState('');
  // Pedido em 30/08/2026: além do mês, escolher o formato de exportação — PPTX (como sempre foi) ou PDF
  // (cada slide "fotografado" e virando uma página de imagem dentro do PDF — ver CanvasPdfPptx). Um único
  // seletor vale pros dois botões (Gerar Report e Gerar Planning).
  const [formatoExport, setFormatoExport] = useState('pptx');

  const handleGerar = async () => {
    setGerando(true);
    setErro('');
    try{
      await gerarReportPptx(data, mesRelatorio, formatoExport);
    }catch(e){
      console.error('Erro ao gerar Report', e);
      setErro((e && e.message) || 'Não foi possível gerar o report. Tente novamente.');
    }finally{
      setGerando(false);
    }
  };

  // Segundo gerador (pedido em 29/08/2026): monta o "Plano de Trabalho do Mês" a partir do mesmo mês
  // escolhido no dropdown acima — reaproveita mesRelatorio e formatoExport, mas mantém seu próprio estado
  // de carregamento/erro para não interferir com o botão "Gerar Report".
  const handleGerarPlanning = async () => {
    setGerandoPlanning(true);
    setErroPlanning('');
    try{
      await gerarPlanningPptx(data, mesRelatorio, formatoExport);
    }catch(e){
      console.error('Erro ao gerar Planning', e);
      setErroPlanning((e && e.message) || 'Não foi possível gerar o planning. Tente novamente.');
    }finally{
      setGerandoPlanning(false);
    }
  };

  const [gerandoOnePager, setGerandoOnePager] = useState(false);
  const [erroOnePager, setErroOnePager] = useState('');
  // Terceiro gerador (pedido em 30/08/2026): a MESMA visão geral por área do Slide 1 do Report Mensal,
  // só que como uma única imagem .png em formato retrato — pra colar quase em página cheia num
  // documento Word. Não depende do seletor de formato PPTX/PDF acima (esse botão sempre gera .png).
  const handleGerarOnePager = async () => {
    setGerandoOnePager(true);
    setErroOnePager('');
    try{
      await gerarOnePagerPng(data, mesRelatorio);
    }catch(e){
      console.error('Erro ao gerar One-Pager', e);
      setErroOnePager((e && e.message) || 'Não foi possível gerar o one-pager. Tente novamente.');
    }finally{
      setGerandoOnePager(false);
    }
  };

  const features = [
    {icon: IconGrid, cor: '#2C5AA0', nome: 'Visão geral por área', desc: 'Real x Budget dos 15 KPIs das 5 áreas (Deployment, Auditoria, Desenvolvimento, Atendimento e Produto), lado a lado.'},
    {icon: IconUsers, cor: '#1F8A70', nome: 'Abertura por cliente', desc: 'Um slide por área com a tabela Cliente x KPI e a evolução mês a mês (Real e Budget) de cada indicador.'},
    {icon: IconTarget, cor: '#8A4FBE', nome: 'Ranking individual', desc: 'Um slide por área com todas as pessoas e o desempenho de cada uma frente ao budget, sinalizado em verde/vermelho.'},
  ];

  return (
    <div>
      <div className="report-hero">
        <div className="report-hero-icon"><IconTrend width="22" height="22"/></div>
        <div className="report-hero-label">Acompanhamento de Metas</div>
        <div className="report-hero-title">Report Mensal</div>
        <div className="report-hero-sub">
          Escolha um indicador no menu lateral para ver o acompanhamento detalhado dele, ou gere aqui o
          Report Mensal ou o Planning do mês, em .pptx ou .pdf — com os principais KPIs e a estrutura de
          trabalho de todas as áreas, prontos para apresentar, no padrão visual das apresentações Rivio.
        </div>
      </div>

      <div className="report-grid">
        <div className="card">
          <div className="report-card-title">O que o report inclui</div>
          <div className="report-card-sub">11 slides gerados a partir dos dados já carregados no app — nenhuma configuração extra.</div>
          {features.map(f => (
            <div className="report-feature-item" key={f.nome}>
              <span className="report-feature-icon" style={{background:f.cor}}><f.icon width="17" height="17"/></span>
              <div>
                <div className="report-feature-name">{f.nome}</div>
                <div className="report-feature-desc">{f.desc}</div>
              </div>
            </div>
          ))}
        </div>

        <div className="card report-generate-card">
          <div className="report-card-title">Gerar report</div>
          <div className="report-card-sub">O download começa automaticamente assim que o report terminar de ser montado.</div>
          <div className="field">
            <label>Mês da análise</label>
            <select className="select" value={mesRelatorio} onChange={e => setMesRelatorio(Number(e.target.value))}>
              {MESES_PLANNING.map(m => <option value={m.n} key={m.n}>{m.nome} · {CURRENT_YEAR}</option>)}
            </select>
          </div>
          <div className="field">
            <label>Formato de exportação</label>
            <select className="select" value={formatoExport} onChange={e => setFormatoExport(e.target.value)}>
              <option value="pptx">PowerPoint (.pptx)</option>
              <option value="pdf">PDF (.pdf)</option>
            </select>
          </div>
          <button type="button" className="btn btn-primary report-generate-btn" disabled={gerando} onClick={handleGerar}>
            {gerando ? 'Gerando report…' : 'Gerar Report'}
          </button>
          {erro && <div style={{marginTop:12, color:'var(--negative)', fontSize:12.5}}>{erro}</div>}

          <button type="button" className="btn btn-ghost report-generate-btn" style={{marginTop:10}} disabled={gerandoPlanning} onClick={handleGerarPlanning}>
            {gerandoPlanning ? 'Gerando planning…' : 'Gerar Planning'}
          </button>
          {erroPlanning && <div style={{marginTop:12, color:'var(--negative)', fontSize:12.5}}>{erroPlanning}</div>}

          <button type="button" className="btn btn-ghost report-generate-btn" style={{marginTop:10}} disabled={gerandoOnePager} onClick={handleGerarOnePager}>
            {gerandoOnePager ? 'Gerando one-pager…' : 'Gerar One-Pager'}
          </button>
          <div style={{marginTop:6, fontSize:11.5, color:'var(--ink-soft)'}}>Visão geral por área (mesmo conteúdo do 1º slide do Report), em uma única imagem .png, em formato retrato — pronta para colar num documento.</div>
          {erroOnePager && <div style={{marginTop:12, color:'var(--negative)', fontSize:12.5}}>{erroOnePager}</div>}
        </div>
      </div>
    </div>
  );
}

function MargemBrutaPage({financeiro, financeiroSync, actions}){
  const ticketMedioBudgetYear = (financeiro && financeiro.ticketMedioReceitaBudget && financeiro.ticketMedioReceitaBudget[CURRENT_YEAR]) || {};
  const pnlYear = (financeiro && financeiro.pnl && financeiro.pnl[CURRENT_YEAR]) || {};
  const filledMonths = MONTHS.filter(m => pnlYear[m.n]);

  const [syncing, setSyncing] = useState(false);
  const [syncError, setSyncError] = useState(null);

  const handleSyncMargemBruta = async () => {
    setSyncing(true);
    setSyncError(null);
    try{
      const fb = await waitForFirebase();
      const provider = new fb.GoogleAuthProvider();
      provider.addScope('https://www.googleapis.com/auth/drive.readonly');
      const result = await fb.signInWithPopup(fb.auth, provider);
      const credential = fb.credentialFromResult ? fb.credentialFromResult(result) : null;
      const accessToken = credential && credential.accessToken;
      if(!accessToken) throw new Error('Não foi possível obter permissão de acesso ao Google Drive.');
      const res = await fetch('https://www.googleapis.com/drive/v3/files/' + MARGEM_BRUTA_SHEET_ID + '/export?mimeType=text/csv', {
        headers: { Authorization: 'Bearer ' + accessToken },
      });
      if(!res.ok) throw new Error('Não foi possível baixar a planilha do Drive (HTTP ' + res.status + ').');
      const text = await res.text();
      const rows = parseCSVText(text);
      const monthsData = transformFinanceRows(rows);
      if(!Object.keys(monthsData).length) throw new Error('A planilha foi baixada, mas nenhum mês com dados foi encontrado.');
      actions.importMargemBrutaBase(monthsData);
    }catch(e){
      console.error('Margem Bruta sync error', e);
      setSyncError(e.message || 'Erro ao atualizar a base de Margem Bruta.');
    }finally{
      setSyncing(false);
    }
  };
  const lastMonth = filledMonths.length ? filledMonths[filledMonths.length - 1] : null;
  const lastData = lastMonth ? pnlYear[lastMonth.n] : null;
  const kpi = lastData ? (lastData.grossProfit / lastData.receitaTotal) * 100 : null;

  // Descobre dinamicamente quais sub-linhas existem sob cada linha principal (ex.: clientes sob "Total
  // revenues", categorias como "Tecnologia"/"Viagens" sob "(-) COGS"), mesclando a ordem de todos os
  // meses já sincronizados — assim, uma linha nova adicionada na aba Finance aparece automaticamente,
  // sem precisar editar o painel.
  const subLinhasPorMain = {};
  filledMonths.forEach(m => {
    const order = pnlYear[m.n] && pnlYear[m.n].subLinhasOrder;
    if(!order) return;
    Object.keys(order).forEach(mainKey => {
      if(!subLinhasPorMain[mainKey]) subLinhasPorMain[mainKey] = [];
      order[mainKey].forEach(label => {
        if(!subLinhasPorMain[mainKey].includes(label)) subLinhasPorMain[mainKey].push(label);
      });
    });
  });

  const clientNames = (subLinhasPorMain.receitaTotal && subLinhasPorMain.receitaTotal.length)
    ? subLinhasPorMain.receitaTotal
    : FINANCE_CLIENT_ROWS_FALLBACK;

  const rows = [];
  const pushMainRow = (key, label, type) => {
    rows.push({key, label, type});
    if(key === 'receitaTotal'){
      clientNames.forEach(nome => rows.push({key:'cliente:'+nome, label:nome, type:'sub', subOf:'receitaTotal', subLabel:nome}));
    }else if(subLinhasPorMain[key] && subLinhasPorMain[key].length){
      subLinhasPorMain[key].forEach((label2, idx) => rows.push({key:'sub:'+key+':'+idx, label:label2, type:'sub', subOf:key, subLabel:label2}));
    }
  };
  pushMainRow('receitaTotal', 'Total revenues', 'main');
  pushMainRow('taxasReceita', '(-) Taxes on revenues', 'main');
  pushMainRow('cogs', '(-) COGS', 'main');
  pushMainRow('payroll', '(-) Payroll', 'main');
  pushMainRow('grossProfit', '(=) Gross profit', 'total');
  pushMainRow('gea', '(-) G&A', 'main');
  pushMainRow('sem', '(-) S&M', 'main');
  pushMainRow('ebitda', '(=) EBITDA / burn', 'total');

  const cellValue = (row, month) => {
    const data = pnlYear[month.n];
    if(!data) return null;
    if(row.subOf === 'receitaTotal'){
      return data.receitaPorCliente ? data.receitaPorCliente[row.subLabel] : null;
    }
    if(row.subOf){
      return data.subLinhas && data.subLinhas[row.subOf] ? data.subLinhas[row.subOf][row.subLabel] : null;
    }
    return data[row.key];
  };

  return (
    <div>
      <div className="section-block">
        <div className="kpi-hero">
          {lastMonth && <div className="kpi-hero-period">Fechamento · {lastMonth.label}/{CURRENT_YEAR}</div>}
          <div className="kpi-hero-label">Margem Bruta</div>
          {kpi !== null ? (
            <div className={"kpi-hero-value" + (kpi < 0 ? ' negative' : ' positive')}>{fmtPercent(kpi)}</div>
          ) : (
            <div className="kpi-hero-value" style={{fontSize:22, color:'#9BA0B8'}}>Sem dados de fechamento</div>
          )}
          <div className="kpi-hero-formula">Gross Profit / Receita Líquida</div>
          {lastData && (
            <div className="kpi-hero-detail">
              <div className="kpi-hero-detail-item">
                <div className="kpi-hero-detail-label">Receita Líquida</div>
                <div className="kpi-hero-detail-value">{fmtCurrency(lastData.receitaTotal)}</div>
              </div>
              <div className="kpi-hero-detail-item">
                <div className="kpi-hero-detail-label">Gross Profit</div>
                <div className="kpi-hero-detail-value">{fmtCurrency(lastData.grossProfit)}</div>
              </div>
              <div className="kpi-hero-detail-item">
                <div className="kpi-hero-detail-label">EBITDA / burn</div>
                <div className="kpi-hero-detail-value">{fmtCurrency(lastData.ebitda)}</div>
              </div>
            </div>
          )}
        </div>
      </div>

      <div className="card">
        <div className="section-block-head" style={{padding:'18px 22px 0'}}>
          <div>
            <div className="section-block-title">P&amp;L · {CURRENT_YEAR}</div>
            <div className="section-block-desc">Dados carregados da aba Finance da planilha de metas.</div>
            <div style={{marginTop:6, fontSize:12.5, fontStyle:'italic', color:'#8a8fa3'}}>
              {financeiroSync
                ? `Última atualização: ${financeiroSync.by} em ${fmtDataAbertura(financeiroSync.at)} · ${financeiroSync.count} mês${financeiroSync.count===1?'':'es'}`
                : 'Base ainda não atualizada a partir do Drive — exibindo dados estáticos.'}
            </div>
          </div>
          <div style={{display:'flex', flexDirection:'column', alignItems:'flex-end', gap:6}}>
            <button
              type="button"
              className="btn btn-primary btn-sm"
              disabled={syncing}
              onClick={handleSyncMargemBruta}
              style={{whiteSpace:'nowrap', opacity: syncing ? 0.6 : 1, cursor: syncing ? 'not-allowed' : 'pointer'}}
            >
              {syncing ? 'Atualizando…' : 'Atualizar base Margem Bruta'}
            </button>
            {syncError && (
              <div style={{fontSize:12.5, color:'#c0392b', maxWidth:320, textAlign:'right'}}>{syncError}</div>
            )}
          </div>
        </div>
        <div className="table-wrap">
          <table className="pnl-tbl">
            <thead>
              <tr>
                <th></th>
                {MONTHS.map(m => <th key={m.n}>{m.label}</th>)}
              </tr>
            </thead>
            <tbody>
              {rows.map(row => (
                <tr key={row.key} className={"pnl-row-" + row.type}>
                  <td>{row.label}</td>
                  {MONTHS.map(m => {
                    const val = cellValue(row, m);
                    const formatted = fmtCurrency(val);
                    return (
                      <td key={m.n} className={formatted === null ? 'empty-val' : (val < 0 ? 'negative' : '')}>
                        {formatted === null ? '—' : formatted}
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      <div className="card" style={{marginTop:16}}>
        <div className="section-block-head" style={{padding:'18px 22px 0'}}>
          <div>
            <div className="section-block-title">Ticket Médio · {CURRENT_YEAR}</div>
            <div className="section-block-desc">Receita Líquida / número de clientes ({TICKET_MEDIO_CLIENTES}).</div>
          </div>
        </div>
        <div className="table-wrap">
          <table className="pnl-tbl">
            <thead>
              <tr>
                <th></th>
                {MONTHS.map(m => <th key={m.n}>{m.label}</th>)}
              </tr>
            </thead>
            <tbody>
              <tr className="pnl-row-total">
                <td>Ticket Médio</td>
                {MONTHS.map(m => {
                  const val = computeTicketMedio(pnlYear[m.n]);
                  const formatted = fmtCurrency(val);
                  return (
                    <td key={m.n} className={formatted === null ? 'empty-val' : ''}>
                      {formatted === null ? '—' : formatted}
                    </td>
                  );
                })}
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div className="card" style={{marginTop:16}}>
        <div className="section-block-head" style={{padding:'18px 22px 0'}}>
          <div>
            <div className="section-block-title">Budget de Receita por Cliente · {CURRENT_YEAR}</div>
            <div className="section-block-desc">
              Preenchimento manual por cliente e mês. Usado para calcular o budget da meta "Ticket Médio" em Gestão de
              Metas — a meta vira a média desse budget entre os clientes considerados, o que permite filtrar por
              responsável (ex.: só os clientes de uma pessoa) e ver o Ticket Médio real e budget calculados só com os
              clientes dela.
            </div>
          </div>
        </div>
        <div className="table-wrap">
          <table className="upsell-tbl">
            <thead>
              <tr>
                <th></th>
                {MONTHS.map(m => <th key={m.n}>{m.label}</th>)}
              </tr>
            </thead>
            <tbody>
              {clientNames.map(cliente => (
                <tr key={cliente}>
                  <td style={{textAlign:'left', paddingLeft:12, fontWeight:600}}>{cliente}</td>
                  {MONTHS.map(m => {
                    const raw = (ticketMedioBudgetYear[cliente]||{})[m.n];
                    return (
                      <td key={m.n}>
                        <input
                          type="number"
                          className="upsell-input"
                          defaultValue={isEmptyVal(raw) ? '' : raw}
                          key={m.n + '-' + (raw ?? '')}
                          placeholder="—"
                          step="1"
                          onBlur={e => actions.setTicketMedioReceitaBudget(m.n, cliente, e.target.value === '' ? null : e.target.value)}
                        />
                      </td>
                    );
                  })}
                </tr>
              ))}
              <tr className="upsell-pillar-row">
                <td style={{textAlign:'left', paddingLeft:12}}>Total</td>
                {MONTHS.map(m => {
                  const vals = clientNames.map(c => (ticketMedioBudgetYear[c]||{})[m.n]).filter(v => v !== undefined && v !== null && v !== '').map(Number);
                  const soma = vals.length ? vals.reduce((a,b)=>a+b,0) : null;
                  return <td key={m.n} className="upsell-pillar-score">{soma === null ? '—' : fmtCurrency(soma)}</td>;
                })}
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function scoreBadgeClass(v){
  if(v === null || v === undefined) return '';
  if(v >= 7) return '';
  if(v >= 4) return 'mid';
  return 'low';
}

function MonthUpsellTable({mes, monthData, clientesCols, actions, expanded, onToggle}){
  const monthLabel = MONTHS.find(m => m.n === mes.n).label;
  const totalOverall = avgOf(clientesCols.map(c => computeUpsellScore((monthData||{})[c.id])));

  const setVal = (clienteId, kpiKey, raw) => actions.setUpsellValue(mes.n, clienteId, kpiKey, raw === '' ? null : raw);
  const setSub = (clienteId, kpiKey, subKey, raw) => actions.setUpsellSubValue(mes.n, clienteId, kpiKey, subKey, raw);

  return (
    <div className="card" style={{marginBottom:14}}>
      <div className="group-card-head" style={{cursor:'pointer'}} onClick={onToggle}>
        <IconChevron className={"nav-caret" + (expanded ? ' open' : '')} width="14" height="14" style={{color:'var(--ink-soft)'}}/>
        {monthLabel} · {CURRENT_YEAR}
        <span className="group-card-count" style={totalOverall !== null ? {background:'var(--accent-soft)', color:'var(--accent-ink)'} : undefined}>
          {totalOverall !== null ? 'Total ' + fmtScore(totalOverall) : 'Sem dados'}
        </span>
      </div>
      {expanded && (
        <div className="table-wrap">
          <table className="upsell-tbl">
            <thead>
              <tr>
                <th>Pilar / KPI</th>
                {clientesCols.map(c => <th key={c.id}>{c.nome}</th>)}
                <th>Total</th>
              </tr>
            </thead>
            <tbody>
              {UPSELL_PILLARS.map(pillar => (
                <React.Fragment key={pillar.n}>
                  <tr className="upsell-pillar-row">
                    <td>{pillar.n}. {pillar.nome}</td>
                    {clientesCols.map(c => {
                      const score = computePillarScore(pillar, (monthData||{})[c.id]);
                      return <td key={c.id} className="upsell-pillar-score">{fmtScore(score)}</td>;
                    })}
                    <td className="upsell-pillar-score">
                      {fmtScore(avgOf(clientesCols.map(c => computePillarScore(pillar, (monthData||{})[c.id]))))}
                    </td>
                  </tr>

                  {pillar.kpis.map(kpi => {
                    if(kpi.tipo === 'termometro' || kpi.tipo === 'ritos'){
                      return (
                        <React.Fragment key={kpi.key}>
                          {kpi.subitens.map(sub => (
                            <tr className="upsell-sub-row" key={sub}>
                              <td>{sub}</td>
                              {clientesCols.map(c => {
                                const clienteData = (monthData||{})[c.id] || {};
                                const subData = clienteData[kpi.key] || {};
                                if(kpi.tipo === 'termometro'){
                                  return (
                                    <td key={c.id}>
                                      <select className="upsell-select" value={subData[sub] || ''}
                                        onChange={e => setSub(c.id, kpi.key, sub, e.target.value || null)}>
                                        <option value="">—</option>
                                        <option value="quente">Quente</option>
                                        <option value="morno">Morno</option>
                                        <option value="frio">Frio</option>
                                      </select>
                                    </td>
                                  );
                                }
                                return (
                                  <td key={c.id}>
                                    <input type="checkbox" className="upsell-check" checked={!!subData[sub]}
                                      onChange={e => setSub(c.id, kpi.key, sub, e.target.checked)}/>
                                  </td>
                                );
                              })}
                              <td>—</td>
                            </tr>
                          ))}
                          <tr className="upsell-kpi-computed-row">
                            <td><span className="kpi-name-hint" title={UPSELL_KPI_RATIONALE[kpi.key] || undefined}>{kpi.nome}</span></td>
                            {clientesCols.map(c => {
                              const score = computeKpiScore(kpi, (monthData||{})[c.id]);
                              return <td key={c.id}>{fmtScore(score)}</td>;
                            })}
                            <td>{fmtScore(avgOf(clientesCols.map(c => computeKpiScore(kpi, (monthData||{})[c.id]))))}</td>
                          </tr>
                        </React.Fragment>
                      );
                    }
                    return (
                      <tr className="upsell-kpi-row" key={kpi.key}>
                        <td><span className="kpi-name-hint" title={UPSELL_KPI_RATIONALE[kpi.key] || undefined}>{kpi.nome}{kpi.sufixo ? ' (' + kpi.sufixo + ')' : ''}</span></td>
                        {clientesCols.map(c => {
                          const clienteData = (monthData||{})[c.id] || {};
                          const raw = clienteData[kpi.key];
                          const score = computeKpiScore(kpi, clienteData);
                          return (
                            <td key={c.id}>
                              <input
                                type="number"
                                className="upsell-input"
                                defaultValue={isEmptyVal(raw) ? '' : raw}
                                key={c.id + '-' + (raw ?? '')}
                                placeholder="—"
                                onBlur={e => setVal(c.id, kpi.key, e.target.value)}
                              />
                              <div><span className={"upsell-score-badge " + scoreBadgeClass(score)}>{fmtScore(score)}</span></div>
                            </td>
                          );
                        })}
                        <td>
                          {fmtScore(avgOf(clientesCols.map(c => computeKpiScore(kpi, ((monthData||{})[c.id]||{})))))}
                        </td>
                      </tr>
                    );
                  })}
                </React.Fragment>

// Botão + status de sincronização reutilizado pelas 4 metas cujo Realizado vem de uma aba dedicada na
// planilha "Gestão Metas" (mesmo padrão visual do botão "Atualizar base Margem Bruta"). `onSync` deve
// retornar uma string de aviso (não bloqueante, exibida em âmbar) ou nada; erros devem ser lançados
// (exibidos em vermelho).
function SyncRealizadoButton({label, onSync}){
  const [syncing, setSyncing] = useState(false);
  const [error, setError] = useState(null);
  const [warning, setWarning] = useState(null);

  const handleClick = async () => {
    setSyncing(true);
    setError(null);
    setWarning(null);
    try{
      const warn = await onSync();
      if(warn) setWarning(warn);
    }catch(e){
      console.error('Sync realizado error', e);
      setError(e.message || 'Erro ao atualizar a base.');
    }finally{
      setSyncing(false);
    }
  };

  return (
    <div style={{display:'flex', flexDirection:'column', alignItems:'flex-end', gap:6}}>
      <button
        type="button"
        className="btn btn-primary btn-sm"
        disabled={syncing}
        onClick={handleClick}
        style={{whiteSpace:'nowrap', opacity: syncing ? 0.6 : 1, cursor: syncing ? 'not-allowed' : 'pointer'}}
      >
        {syncing ? 'Atualizando…' : label}
      </button>
      {error && <div style={{fontSize:12.5, color:'#c0392b', maxWidth:320, textAlign:'right'}}>{error}</div>}
      {warning && <div style={{fontSize:12.5, color:'#9a6b00', maxWidth:320, textAlign:'right'}}>{warning}</div>}
    </div>
  );
}

function syncStatusText(sync){
  return sync
    ? `Última atualização: ${sync.by} em ${fmtDataAbertura(sync.at)} · ${sync.count} cliente${sync.count===1?'':'s'}`
    : 'Base ainda não atualizada a partir da planilha — exibindo dados existentes.';
}

// Página genérica para metas percentuais por cliente e mês (Realizado + Budget), seguindo o mesmo
// modelo visual de ContasFinalizadasPage — usada por Subfaturamento (Realizado manual) e % Contas
// Automático (Realizado sincronizado da planilha — passe `sync`/`onSync`/`descRealizado` nesse caso;
// o Budget continua sempre manual, para as duas).
// rowLabels (opcional): rótulos das linhas da tabela — por padrão os 7 clientes faturáveis, mas
// também usado com categorias fixas (ex.: Tempo Processamento: Importação/Recálculo/LLM), já que o
// formato "label nas linhas, Jan..Dez nas colunas" é o mesmo independente do que o label representa.
function PercentClientGoalPage({titulo, financeiro, dataKey, budgetKey, setRealizado, setBudget, sync, onSync, descRealizado, unidade, totalMode, rowLabels}){
  const un = unidade || '%';
  const fmtVal = v => fmtChartValue(v, un);
  const data = (financeiro && financeiro[dataKey] && financeiro[dataKey][CURRENT_YEAR]) || {};
  const budgetData = (financeiro && financeiro[budgetKey] && financeiro[budgetKey][CURRENT_YEAR]) || {};
  const clientNames = rowLabels || ['Einstein SP','Einstein GO','Sírio SP','Sírio BSB','HCOR','HAOC','AC Camargo'];
  const realizadoReadOnly = !!onSync;
  // Totalizador entre clientes: "média" (padrão, ex.: Subfaturamento, um percentual) ou "soma" (ex.: %
  // Contas Automático, que agora guarda valores absolutos — faz mais sentido somar do que tirar a média).
  const isSoma = totalMode === 'soma';
  const totalLabel = isSoma ? 'Total' : 'Média';

  const colAvg = (source, m) => {
    const vals = clientNames.map(c => (source[c]||{})[m.n]).filter(v => v !== undefined && v !== null && v !== '').map(Number);
    if(!vals.length) return null;
    const soma = vals.reduce((a,b)=>a+b,0);
    return isSoma ? soma : soma / vals.length;
  };

  const filledMonths = MONTHS.filter(m => colAvg(data, m) !== null);
  const lastMonth = filledMonths.length ? filledMonths[filledMonths.length - 1] : null;
  const lastTotal = lastMonth ? colAvg(data, lastMonth) : null;

  return (
    <div>
      <div className="section-block">
        <div className="kpi-hero">
          {lastMonth && <div className="kpi-hero-period">Último mês · {lastMonth.label}/{CURRENT_YEAR}</div>}
          <div className="kpi-hero-label">{titulo}</div>
          {lastTotal !== null ? (
            <div className="kpi-hero-value positive">{fmtVal(lastTotal)}</div>
          ) : (
            <div className="kpi-hero-value" style={{fontSize:22, color:'#9BA0B8'}}>Sem dados preenchidos</div>
          )}
          <div className="kpi-hero-formula">{isSoma ? 'Soma entre clientes, no mês' : 'Média entre clientes, no mês'}</div>
        </div>
      </div>

      <div className="card" style={{marginBottom:16}}>
        <div className="section-block-head" style={{padding:'18px 22px 0'}}>
          <div>
            <div className="section-block-title">{titulo} · {CURRENT_YEAR}</div>
            <div className="section-block-desc">{descRealizado || 'Preenchimento manual por cliente e mês.'}</div>
            {realizadoReadOnly && <div style={{marginTop:6, fontSize:12.5, fontStyle:'italic', color:'#8a8fa3'}}>{syncStatusText(sync)}</div>}
          </div>
          {realizadoReadOnly && <SyncRealizadoButton label={`Atualizar base ${titulo}`} onSync={onSync}/>}
        </div>
        <div className="table-wrap">
          <table className="upsell-tbl">
            <thead>
              <tr>
                <th></th>
                {MONTHS.map(m => <th key={m.n}>{m.label}</th>)}
              </tr>
            </thead>
            <tbody>
              {clientNames.map(cliente => (
                <tr key={cliente}>
                  <td style={{textAlign:'left', paddingLeft:12, fontWeight:600}}>{cliente}</td>
                  {MONTHS.map(m => {
                    const raw = (data[cliente]||{})[m.n];
                    if(realizadoReadOnly){
                      return (
                        <td key={m.n} className={isEmptyVal(raw) ? 'empty-val' : ''} style={{textAlign:'center'}}>
                          {isEmptyVal(raw) ? '—' : fmtVal(Number(raw))}
                        </td>
                      );
                    }
                    return (
                      <td key={m.n}>
                        <input
                          type="number"
                          className="upsell-input"
                          defaultValue={isEmptyVal(raw) ? '' : raw}
                          key={m.n + '-' + (raw ?? '')}
                          placeholder="—"
                          step="0.1"
                          onBlur={e => setRealizado(m.n, cliente, e.target.value === '' ? null : e.target.value)}
                        />
                      </td>
                    );
                  })}
                </tr>
              ))}
              <tr className="upsell-pillar-row">
                <td style={{textAlign:'left', paddingLeft:12}}>{totalLabel}</td>
                {MONTHS.map(m => {
                  const t = colAvg(data, m);
                  return <td key={m.n} className="upsell-pillar-score">{t === null ? '—' : fmtVal(t)}</td>;
                })}
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div className="card">
        <div className="section-block-head" style={{padding:'18px 22px 0'}}>
          <div>
            <div className="section-block-title">Budget · {titulo} · {CURRENT_YEAR}</div>
            <div className="section-block-desc">Preenchimento manual por cliente e mês. Esse é o valor usado como Budget da meta em Gestão de Metas.</div>
          </div>
        </div>
        <div className="table-wrap">
          <table className="upsell-tbl">
            <thead>
              <tr>
                <th></th>
                {MONTHS.map(m => <th key={m.n}>{m.label}</th>)}
              </tr>
            </thead>
            <tbody>
              {clientNames.map(cliente => (
                <tr key={cliente}>
                  <td style={{textAlign:'left', paddingLeft:12, fontWeight:600}}>{cliente}</td>
                  {MONTHS.map(m => {
                    const raw = (budgetData[cliente]||{})[m.n];
                    return (
                      <td key={m.n}>
                        <input
                          type="number"
                          className="upsell-input"
                          defaultValue={isEmptyVal(raw) ? '' : raw}
                          key={m.n + '-' + (raw ?? '')}
                          placeholder="—"
                          step="0.1"
                          onBlur={e => setBudget(m.n, cliente, e.target.value === '' ? null : e.target.value)}
                        />
                      </td>
                    );
                  })}
                </tr>
              ))}
              <tr className="upsell-pillar-row">
                <td style={{textAlign:'left', paddingLeft:12}}>{totalLabel}</td>
                {MONTHS.map(m => {
                  const t = colAvg(budgetData, m);
                  return <td key={m.n} className="upsell-pillar-score">{t === null ? '—' : fmtVal(t)}</td>;
                })}
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function ProdutoFuncaoModal({initial, categoriasExistentes, onSave, onClose}){
  const [categoria, setCategoria] = useState(initial ? initial.categoria : '');
  const [descricao, setDescricao] = useState(initial ? initial.descricao : '');
  const canSave = categoria.trim() && descricao.trim();
  return (
    <Modal title={initial ? 'Editar função' : 'Adicionar função'} onClose={onClose} footer={
      <>
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" disabled={!canSave} style={!canSave ? {opacity:0.5}: undefined}
          onClick={()=> canSave && onSave({categoria: categoria.trim(), descricao: descricao.trim()})}>
          Salvar
        </button>
      </>
    }>
      <div className="field">
        <label>Categoria<span className="required-mark">*</span></label>
        <input className="input" value={categoria} onChange={e=>setCategoria(e.target.value)} placeholder="Ex.: Alertas" list="produto-funcao-categorias" autoFocus/>
        <datalist id="produto-funcao-categorias">{(categoriasExistentes||[]).map(c => <option value={c} key={c}/>)}</datalist>
      </div>
      <div className="field">
        <label>Descrição<span className="required-mark">*</span></label>
        <textarea className="input" value={descricao} onChange={e=>setDescricao(e.target.value)} placeholder="Descreva a função do produto"/>
      </div>
    </Modal>
  );
}

function ProdutoFuncoesKpiTable({titulo, desc, yearData, setValue}){
  return (
    <div className="card" style={{marginBottom:16}}>
      <div className="section-block-head" style={{padding:'18px 22px 0'}}>
        <div>
          <div className="section-block-title">{titulo}</div>
          <div className="section-block-desc">{desc}</div>
        </div>
      </div>
      <div className="table-wrap">
        <table className="upsell-tbl">
          <thead>
            <tr>
              <th></th>
              {MONTHS.map(m => <th key={m.n}>{m.label}</th>)}
            </tr>
          </thead>
          <tbody>
            {PRODUTO_FUNCOES_KPIS.map(kpi => {
              const kpiData = yearData[kpi.key] || {};
              return (
                <tr key={kpi.key}>
                  <td style={{textAlign:'left', paddingLeft:12, fontWeight:600}}>{kpi.label}</td>
                  {MONTHS.map(m => {
                    const raw = kpiData[m.n];
                    return (
                      <td key={m.n}>
                        <input
                          type="number"
                          className="upsell-input"
                          defaultValue={isEmptyVal(raw) ? '' : raw}
                          key={kpi.key + '-' + m.n + '-' + (raw ?? '')}
                          placeholder="—"
                          step="0.1"
                          onBlur={e => setValue(kpi.key, m.n, e.target.value === '' ? null : e.target.value)}
                        />
                      </td>
                    );
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function ProdutoFuncoesPage({data, actions}){
  const clientesCols = useMemo(() => data.clientes.filter(c => c.nome.toLowerCase() !== 'interno'), [data.clientes]);
  const funcoes = data.produtoFuncoes || [];
  const checks = data.produtoFuncoesChecks || {};
  const [modal, setModal] = useState(null); // null | 'new' | funcao (edição)
  const [confirmDel, setConfirmDel] = useState(null);

  const categorias = useMemo(() => {
    const ordered = [];
    funcoes.forEach(f => { if(!ordered.includes(f.categoria)) ordered.push(f.categoria); });
    return ordered;
  }, [funcoes]);

  const getCheckState = (funcaoId, clienteId) => normalizeProdutoFuncaoCheckState(checks[funcaoId] && checks[funcaoId][clienteId]);

  // Pedido em 30/08/2026: cada categoria vira uma linha "recolhível" (drill down opcional pras funções)
  // com o "%" de cobertura da categoria mostrado à direita do nome. Por padrão todas as categorias
  // começam expandidas (comportamento igual ao anterior).
  const [colapsadas, setColapsadas] = useState({});
  const toggleCategoria = (categoria) => setColapsadas(prev => ({...prev, [categoria]: !prev[categoria]}));

  // Cálculo da cobertura considerando os 4 estados do check (pedido em 30/08/2026): 'ativo' conta 1,
  // 'refinado' conta 0,5, branco conta 0 (mas entra no denominador), e 'na' não entra nem no numerador
  // nem no denominador — por isso o total de campos não é mais um simples "funções × clientes" fixo, e
  // sim contado célula a célula.
  const somaCobertura = (listaFuncoes) => {
    let total = 0;
    let checados = 0;
    listaFuncoes.forEach(f => clientesCols.forEach(c => {
      const peso = produtoFuncaoCheckWeight(getCheckState(f.id, c.id));
      if(peso === null) return; // 'na' — não conta em nada
      total++;
      checados += peso;
    }));
    return { total, checados, pct: total ? (checados / total * 100) : null };
  };

  const statsPorCategoria = useMemo(() => {
    const map = {};
    categorias.forEach(categoria => {
      map[categoria] = somaCobertura(funcoes.filter(f => f.categoria === categoria));
    });
    return map;
  }, [categorias, funcoes, clientesCols, checks]);

  // KPIs "atuais" — calculados ao vivo a partir da grade de checks, refletem o estado presente (não um
  // fechamento de mês, que fica nas tabelas manuais de Realizado/Budget abaixo).
  const { total: totalFields, checados: totalChecks, pct: coberturaAtual } = useMemo(() => somaCobertura(funcoes), [funcoes, clientesCols, checks]);
  const funcoesMapeadasAtual = funcoes.length;

  const realizadoYearData = (data.produtoFuncoesRealizado && data.produtoFuncoesRealizado[CURRENT_YEAR]) || {};
  const budgetYearData = (data.produtoFuncoesBudget && data.produtoFuncoesBudget[CURRENT_YEAR]) || {};

  return (
    <div>
      <div style={{display:'flex', gap:16, marginBottom:16, flexWrap:'wrap'}}>
        <div className="kpi-hero" style={{flex:'1 1 260px', margin:0}}>
          <div className="kpi-hero-label">Cobertura Produto (atual)</div>
          {coberturaAtual !== null ? (
            <div className={"kpi-hero-value" + (coberturaAtual >= 70 ? ' positive' : (coberturaAtual < 40 ? ' negative' : ''))} style={coberturaAtual>=40 && coberturaAtual<70 ? {color:'#F2CB8A'} : undefined}>
              {fmtNumber(coberturaAtual.toFixed(1))}%
            </div>
          ) : (
            <div className="kpi-hero-value" style={{fontSize:20, color:'#9BA0B8'}}>Sem funções cadastradas</div>
          )}
          <div className="kpi-hero-formula">Pontuação (Ativo=1, Refinado=0,5, N/A não conta) / campos aplicáveis — {fmtNumber(totalChecks.toFixed(1))} de {totalFields}</div>
        </div>
        <div className="kpi-hero" style={{flex:'1 1 260px', margin:0}}>
          <div className="kpi-hero-label">Funções Mapeadas (atual)</div>
          <div className="kpi-hero-value">{funcoesMapeadasAtual}</div>
          <div className="kpi-hero-formula">Total de funções de produto cadastradas na grade abaixo</div>
        </div>
      </div>

      <ProdutoFuncoesKpiTable
        titulo={"Fechamento mensal · Real · " + CURRENT_YEAR}
        desc='Ao fechar o mês, registre aqui o valor de cada KPI (Cobertura Produto % e Funções Mapeadas) referente àquele fechamento — preenchimento manual, mês a mês.'
        yearData={realizadoYearData}
        setValue={actions.setProdutoFuncoesRealizado}
      />
      <ProdutoFuncoesKpiTable
        titulo={"Budget · " + CURRENT_YEAR}
        desc="Preenchimento manual por mês. Esse é o valor usado como Budget da meta Cobertura Produto em Gestão de Metas."
        yearData={budgetYearData}
        setValue={actions.setProdutoFuncoesBudget}
      />

      <div className="section-block-head">
        <div>
          <div className="section-block-title">Funções do produto x clientes</div>
          <div className="section-block-desc">Cadastre as funções do produto e marque, por cliente, se a função está presente. Agrupado por categoria.</div>
        </div>
        <button className="btn btn-primary btn-sm" onClick={()=>setModal('new')}><IconPlus width="14" height="14"/>Nova função</button>
      </div>

      {funcoes.length > 0 && (
        <div className="cobertura-legend">
          <span className="cobertura-legend-item"><span className="cobertura-check checked" style={{pointerEvents:'none'}}><IconCheck width="14" height="14"/></span>Ativo (conta 1)</span>
          <span className="cobertura-legend-item"><span className="cobertura-check refinado" style={{pointerEvents:'none'}}><IconCheck width="14" height="14"/></span>Refinado, ainda não ativo (conta 0,5)</span>
          <span className="cobertura-legend-item"><span className="cobertura-check na" style={{pointerEvents:'none'}}>NA</span>Não se aplica (não conta)</span>
          <span className="cobertura-legend-item"><span className="cobertura-check" style={{pointerEvents:'none'}}><IconCheck width="14" height="14"/></span>Em branco — não desenvolvido/refinado (conta 0)</span>
        </div>
      )}

      {funcoes.length === 0 ? (
        <EmptyState icon={IconLayers} title="Nenhuma função cadastrada"
          sub="Cadastre as funções do produto para começar a acompanhar a cobertura por cliente."
          action={<button className="btn btn-primary btn-sm" onClick={()=>setModal('new')}><IconPlus width="14" height="14"/>Nova função</button>}
        />
      ) : (
        <div className="card">
          <div className="table-wrap">
            <table className="cobertura-tbl">
              <thead>
                <tr>
                  <th>Categoria / Função</th>
                  {clientesCols.map(c => <th key={c.id}>{c.nome}</th>)}
                  <th></th>
                </tr>
              </thead>
              <tbody>
                {categorias.map(categoria => {
                  const isCollapsed = !!colapsadas[categoria];
                  const stats = statsPorCategoria[categoria] || {pct: null};
                  return (
                  <React.Fragment key={categoria}>
                    <tr className="cobertura-base-row" style={{cursor:'pointer'}} onClick={()=>toggleCategoria(categoria)} title={isCollapsed ? 'Clique para expandir' : 'Clique para recolher'}>
                      <td colSpan={clientesCols.length + 2}>
                        <div className="cobertura-cat-head">
                          <span className="cobertura-cat-toggle">{isCollapsed ? '+' : '−'}</span>
                          <span>{categoria}</span>
                          <span className="cobertura-cat-pct">
                            {stats.pct !== null ? fmtNumber(stats.pct.toFixed(0)) + '% cobertas' : 'Sem clientes'}
                          </span>
                        </div>
                      </td>
                    </tr>
                    {!isCollapsed && funcoes.filter(f => f.categoria === categoria).map(f => (
                      <tr className="cobertura-item-row" key={f.id}>
                        <td>{f.descricao}</td>
                        {clientesCols.map(c => {
                          const state = getCheckState(f.id, c.id);
                          return (
                          <td key={c.id}>
                            <span
                              className={"cobertura-check" + (state === 'ativo' ? ' checked' : '') + (state === 'refinado' ? ' refinado' : '') + (state === 'na' ? ' na' : '')}
                              onClick={() => actions.cycleProdutoFuncaoCheck(f.id, c.id)}
                              title={(state ? PRODUTO_FUNCAO_CHECK_LABELS[state] : 'Em branco — ainda não desenvolvido nem refinado, conta 0') + ' — clique para avançar'}
                            >
                              {state === 'na' ? 'NA' : <IconCheck width="14" height="14"/>}
                            </span>
                          </td>
                          );
                        })}
                        <td>
                          <div className="row-actions">
                            <button className="btn-icon" onClick={()=>setModal(f)}><IconEdit width="13" height="13"/></button>
                            <button className="btn-icon danger" onClick={()=>setConfirmDel(f)}><IconTrash width="13" height="13"/></button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </React.Fragment>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {modal && (
        <ProdutoFuncaoModal initial={modal==='new' ? null : modal} categoriasExistentes={categorias} onClose={()=>setModal(null)}
          onSave={(f)=>{ modal==='new' ? actions.addProdutoFuncao(f) : actions.editProdutoFuncao(modal.id, f); setModal(null); }} />
      )}
      <ConfirmDialog open={!!confirmDel} title="Excluir função"
        text={confirmDel ? 'Tem certeza que deseja excluir "' + confirmDel.descricao + '"? Os checks marcados para essa função também serão removidos.' : ''}
        onCancel={()=>setConfirmDel(null)} onConfirm={()=>{ actions.deleteProdutoFuncao(confirmDel.id); setConfirmDel(null); }} />
    </div>
  );
}

function ManualPercentTablePage({data, actions, dataKey, setActionName, budgetKey, budgetSetActionName, titulo, formulaHint, sync, onSync, descRealizado}){
  const clientesCols = useMemo(() => data.clientes.filter(c => c.nome.toLowerCase() !== 'interno'), [data.clientes]);
  const yearData = (data[dataKey] && data[dataKey][CURRENT_YEAR]) || {};
  const budgetYearData = (data[budgetKey] && data[budgetKey][CURRENT_YEAR]) || {};
  const setValue = actions[setActionName];
  const setBudgetValue = actions[budgetSetActionName];
  const realizadoReadOnly = !!onSync;

  const monthAvgOf = (yd, m) => {
    const vals = clientesCols
      .map(c => (yd[c.id]||{})[m.n])
      .filter(v => v !== undefined && v !== null && v !== '')
      .map(Number);
    if(vals.length === 0) return null;
    return vals.reduce((a,b)=>a+b,0) / vals.length;
  };
  const monthAvg = (m) => monthAvgOf(yearData, m);
  const budgetMonthAvg = (m) => monthAvgOf(budgetYearData, m);

  const filledMonths = MONTHS.filter(m => monthAvg(m) !== null);
  const lastMonth = filledMonths.length ? filledMonths[filledMonths.length - 1] : null;
  const lastAvg = lastMonth ? monthAvg(lastMonth) : null;

  return (
    <div>
      <div className="section-block">
        <div className="kpi-hero">
          {lastMonth && <div className="kpi-hero-period">Último mês · {lastMonth.label}/{CURRENT_YEAR}</div>}
          <div className="kpi-hero-label">{titulo}</div>
          {lastAvg !== null ? (
            <div className={"kpi-hero-value" + (lastAvg >= 70 ? ' positive' : (lastAvg < 40 ? ' negative' : ''))} style={lastAvg>=40 && lastAvg<70 ? {color:'#F2CB8A'} : undefined}>
              {fmtPercent(lastAvg)}
            </div>
          ) : (
            <div className="kpi-hero-value" style={{fontSize:22, color:'#9BA0B8'}}>Sem dados preenchidos</div>
          )}
          <div className="kpi-hero-formula">{formulaHint}</div>
        </div>
      </div>

      <div className="card" style={{marginBottom:16}}>
        <div className="section-block-head" style={{padding:'18px 22px 0'}}>
          <div>
            <div className="section-block-title">{titulo} · {CURRENT_YEAR}</div>
            <div className="section-block-desc">{descRealizado || 'Preenchimento manual por cliente e mês. O total do mês é calculado automaticamente.'}</div>
            {realizadoReadOnly && <div style={{marginTop:6, fontSize:12.5, fontStyle:'italic', color:'#8a8fa3'}}>{syncStatusText(sync)}</div>}
          </div>
          {realizadoReadOnly && <SyncRealizadoButton label={`Atualizar base ${titulo}`} onSync={onSync}/>}
        </div>
        <div className="table-wrap">
          <table className="upsell-tbl">
            <thead>
              <tr>
                <th></th>
                {MONTHS.map(m => <th key={m.n}>{m.label}</th>)}
              </tr>
            </thead>
            <tbody>
              {clientesCols.map(c => (
                <tr key={c.id}>

function MonthCoberturaTable({mes, monthData, clientesCols, actions, expanded, onToggle}){
  const monthLabel = MONTHS.find(m => m.n === mes.n).label;
  const totalCampos = COBERTURA_BASES.length * COBERTURA_ITENS.length;

  const isChecked = (rowKey, clienteId) => !!((monthData||{})[rowKey] && (monthData||{})[rowKey][clienteId]);

  const baseProgressForClient = (baseKey, clienteId) => {
    let checked = 0;
    COBERTURA_ITENS.forEach(item => { if(isChecked(coberturaRowKey(baseKey, item), clienteId)) checked++; });
    return checked;
  };

  const clienteProgress = (clienteId) => {
    let checked = 0;
    COBERTURA_BASES.forEach(base => COBERTURA_ITENS.forEach(item => {
      if(isChecked(coberturaRowKey(base.key, item), clienteId)) checked++;
    }));
    return checked / totalCampos * 100;
  };

  let checkedAll = 0;
  clientesCols.forEach(c => {
    COBERTURA_BASES.forEach(base => COBERTURA_ITENS.forEach(item => {
      if(isChecked(coberturaRowKey(base.key, item), c.id)) checkedAll++;
    }));
  });
  const totalFields = totalCampos * clientesCols.length;
  const pctAll = (monthData && totalFields) ? (checkedAll / totalFields * 100) : null;

  return (
    <div className="card" style={{marginBottom:14}}>
      <div className="group-card-head" style={{cursor:'pointer'}} onClick={onToggle}>
        <IconChevron className={"nav-caret" + (expanded ? ' open' : '')} width="14" height="14" style={{color:'var(--ink-soft)'}}/>
        {monthLabel} · {CURRENT_YEAR}
        <span className="group-card-count" style={pctAll !== null ? {background:'var(--accent-soft)', color:'var(--accent-ink)'} : undefined}>
          {pctAll !== null ? fmtNumber(pctAll.toFixed(1)) + '%' : 'Sem dados'}
        </span>
      </div>
      {expanded && (
        <div className="table-wrap">
          <table className="cobertura-tbl">
            <thead>
              <tr>
                <th>Base / Item</th>
                {clientesCols.map(c => <th key={c.id}>{c.nome}</th>)}
              </tr>
            </thead>
            <tbody>
              {COBERTURA_BASES.map((base, i) => (
                <React.Fragment key={base.key}>
                  <tr className="cobertura-base-row">
                    <td>{i+1}. {base.nome}</td>
                    {clientesCols.map(c => (
                      <td key={c.id}>{baseProgressForClient(base.key, c.id)}/{COBERTURA_ITENS.length}</td>
                    ))}
                  </tr>
                  {COBERTURA_ITENS.map(item => {
                    const rowKey = coberturaRowKey(base.key, item);
                    return (
                      <tr className="cobertura-item-row" key={rowKey}>
                        <td>{item}</td>
                        {clientesCols.map(c => (
                          <td key={c.id}>
                            <span
                              className={"cobertura-check" + (isChecked(rowKey, c.id) ? ' checked' : '')}
                              onClick={() => actions.toggleCoberturaDados(mes.n, rowKey, c.id)}
                              title={isChecked(rowKey, c.id) ? 'Check' : 'Não Check'}
                            >
                              <IconCheck width="14" height="14"/>
                            </span>
                          </td>
                        ))}
                      </tr>
                    );
                  })}
                </React.Fragment>
              ))}
              <tr className="cobertura-total-row">
                <td>Total</td>
                {clientesCols.map(c => (
                  <td key={c.id}>{fmtNumber(clienteProgress(c.id).toFixed(1))}%</td>
                ))}
              </tr>
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function CoberturaDadosPage({data, actions}){
  const clientesCols = useMemo(() => data.clientes.filter(c => c.nome.toLowerCase() !== 'interno'), [data.clientes]);
  const coberturaYear = (data.coberturaDados && data.coberturaDados[CURRENT_YEAR]) || {};
  const totalCampos = COBERTURA_BASES.length * COBERTURA_ITENS.length;

  const [expandedMonths, setExpandedMonths] = useState(() => new Set());
  const toggleMonth = (n) => setExpandedMonths(prev => {
    const next = new Set(prev);
    if(next.has(n)) next.delete(n); else next.add(n);
    return next;
  });

  const monthPct = (mesN) => {
    const monthData = coberturaYear[mesN];
    if(!monthData) return null;
    let checked = 0;
    clientesCols.forEach(c => {
      COBERTURA_BASES.forEach(base => COBERTURA_ITENS.forEach(item => {
        const rowKey = coberturaRowKey(base.key, item);
        if(monthData[rowKey] && monthData[rowKey][c.id]) checked++;
      }));
    });
    const totalFields = totalCampos * clientesCols.length;
    return totalFields ? (checked / totalFields * 100) : null;
  };

  const filledMonths = MONTHS.filter(m => !!coberturaYear[m.n]);
  const lastMonth = filledMonths.length ? filledMonths[filledMonths.length - 1] : null;
  const lastPct = lastMonth ? monthPct(lastMonth.n) : null;

  return (
    <div>
      <div className="section-block">
        <div className="kpi-hero">
          {lastMonth && <div className="kpi-hero-period">Último mês · {lastMonth.label}/{CURRENT_YEAR}</div>}
          <div className="kpi-hero-label">Cobertura de Dados</div>
          {lastPct !== null ? (
            <div className={"kpi-hero-value" + (lastPct >= 70 ? ' positive' : (lastPct < 40 ? ' negative' : ''))} style={lastPct>=40 && lastPct<70 ? {color:'#F2CB8A'} : undefined}>
              {fmtNumber(lastPct.toFixed(1))}%
            </div>
          ) : (
            <div className="kpi-hero-value" style={{fontSize:22, color:'#9BA0B8'}}>Sem dados preenchidos</div>
          )}
          <div className="kpi-hero-formula">Campos cobertos / campos totais (todos os clientes), apurado mês a mês</div>
        </div>
      </div>

      <div className="section-block-head">
        <div>
          <div className="section-block-title">Cobertura de Dados por cliente</div>
          <div className="section-block-desc">Uma tabela por mês — marque Check quando o item estiver disponível para o cliente naquele mês. O total é calculado automaticamente.</div>
        </div>
      </div>

      {MONTHS.map(m => (
        <MonthCoberturaTable
          key={m.n}
          mes={m}
          monthData={coberturaYear[m.n]}
          clientesCols={clientesCols}
          actions={actions}
          expanded={expandedMonths.has(m.n)}
          onToggle={() => toggleMonth(m.n)}
        />
      ))}
    </div>
  );
}

function EntregasPrazoPage({data}){
  const merged = useMemo(() => buildDemandasMerged(data.demandasCustom, data.demandasBase, data.demandasManuais), [data.demandasCustom, data.demandasBase, data.demandasManuais]);
  const devTeam = useMemo(() => (data.pessoas||[]).filter(p => p.area === 'Desenvolvimento' || p.area === 'Atendimento'), [data.pessoas]);
  const devNameById = useMemo(() => { const m={}; devTeam.forEach(p=>{ m[p.id]=p.nome; }); return m; }, [devTeam]);

  const base = useMemo(() => merged.filter(m => m.classificacao && m.classificacao.startsWith('Desenvolvimento')), [merged]);
  const classifOptions = useMemo(() => DEMANDA_CLASSIFICACAO_OPTIONS.filter(o => o.startsWith('Desenvolvimento')), []);

  const [mesFilter, setMesFilter] = useState('');
  const [respFilter, setRespFilter] = useState('');
  const [classifFilter, setClassifFilter] = useState('');
  const [tipoFilter, setTipoFilter] = useState('');

  const filtered = useMemo(() => base.filter(m => {
    if(mesFilter && String(m.mesPlanning) !== String(mesFilter)) return false;
    if(respFilter && m.responsavelDesenvolvimentoId !== respFilter) return false;
    if(classifFilter && m.classificacao !== classifFilter) return false;
    if(tipoFilter && m.tipo !== tipoFilter) return false;
    return true;
  }), [base, mesFilter, respFilter, classifFilter, tipoFilter]);

  const planningScope = useMemo(() => filtered.filter(m => m.mesPlanning), [filtered]);
  const concluidasNoPrazo = planningScope.filter(m => m.concluidaNoPrazo).length;
  const totalPlanning = planningScope.length;
  const kpiPct = totalPlanning > 0 ? (concluidasNoPrazo / totalPlanning * 100) : null;

  // matriz (meses x responsáveis) — respeita os filtros de responsável/classificação/tipo, mas não o de mês,
  // para mostrar a evolução completa ao longo do ano.
  const matrixBase = useMemo(() => base.filter(m => {
    if(respFilter && m.responsavelDesenvolvimentoId !== respFilter) return false;
    if(classifFilter && m.classificacao !== classifFilter) return false;
    if(tipoFilter && m.tipo !== tipoFilter) return false;
    return !!m.mesPlanning;
  }), [base, respFilter, classifFilter, tipoFilter]);

  const respRows = useMemo(() => {
    const idsComDados = new Set(matrixBase.map(m => m.responsavelDesenvolvimentoId).filter(Boolean));
    const rows = devTeam.filter(p => idsComDados.has(p.id)).map(p => ({key:p.id, label:p.nome}));
    if(matrixBase.some(m => !m.responsavelDesenvolvimentoId)) rows.push({key:'', label:'Sem responsável'});
    return rows;
  }, [matrixBase, devTeam]);

  function pctForRowMes(rowKey, mesN){
    const subset = matrixBase.filter(m => (m.responsavelDesenvolvimentoId || '') === rowKey && String(m.mesPlanning) === String(mesN));
    if(subset.length === 0) return null;
    const ok = subset.filter(m => m.concluidaNoPrazo).length;
    return ok / subset.length * 100;
  }

  const byCliente = useMemo(() => {
    const map = {};
    filtered.forEach(m => { (map[m.cliente] = map[m.cliente] || []).push(m); });
    Object.keys(map).forEach(k => map[k].sort((a,b) => new Date(b.abertoEm) - new Date(a.abertoEm)));
    return map;
  }, [filtered]);
  const clientesComDados = useMemo(() => DEMANDAS_CLIENTES_ORDEM.filter(c => byCliente[c] && byCliente[c].length > 0), [byCliente]);

  return (
    <div>
      <div className="kpi-hero" style={{marginBottom:16}}>
        <div className="kpi-hero-label">% Entregas no Prazo{mesFilter ? (' · ' + mesPlanningNome(mesFilter)) : ''}</div>
        {kpiPct !== null ? (
          <div className={"kpi-hero-value" + (kpiPct >= 80 ? ' positive' : (kpiPct < 50 ? ' negative' : ''))} style={kpiPct>=50 && kpiPct<80 ? {color:'#F2CB8A'} : undefined}>
            {fmtPercent(kpiPct, 0)}
          </div>
        ) : (
          <div className="kpi-hero-value" style={{fontSize:20, color:'#9BA0B8'}}>Sem demandas na planning</div>
        )}
        <div className="kpi-hero-formula">Demandas concluídas no prazo / Demandas total — considerando apenas tickets de Desenvolvimento com Prazo definido ({concluidasNoPrazo} de {totalPlanning})</div>
      </div>

      <div className="card demandas-filters-card">
        <div className="demandas-filter-label">Filtros</div>
        <div className="filters-bar" style={{margin:0}}>
          <select className="filter-select" value={mesFilter} onChange={e=>setMesFilter(e.target.value)}>
            <option value="">Todos os meses (planning)</option>
            {MESES_PLANNING.map(m => <option value={m.n} key={m.n}>{m.nome}</option>)}
          </select>
          <select className="filter-select" value={respFilter} onChange={e=>setRespFilter(e.target.value)}>
            <option value="">Todos os responsáveis desenvolvimento</option>
            {devTeam.map(p => <option value={p.id} key={p.id}>{p.nome}</option>)}
          </select>
          <select className="filter-select" value={classifFilter} onChange={e=>setClassifFilter(e.target.value)}>
            <option value="">Todas as classificações</option>
            {classifOptions.map(o => <option value={o} key={o}>{o}</option>)}
          </select>
          <select className="filter-select" value={tipoFilter} onChange={e=>setTipoFilter(e.target.value)}>
            <option value="">Todos os tipos</option>
            {DEMANDA_TIPO_OPTIONS.map(o => <option value={o} key={o}>{o}</option>)}
          </select>
          {(mesFilter||respFilter||classifFilter||tipoFilter) && (
            <button className="btn btn-ghost btn-sm" onClick={()=>{ setMesFilter(''); setRespFilter(''); setClassifFilter(''); setTipoFilter(''); }}>Limpar filtros</button>
          )}
        </div>
      </div>

      <div className="card" style={{marginBottom:16}}>
        <div className="section-block-head" style={{padding:'18px 22px 0'}}>
          <div>
            <div className="section-block-title">% de entrega no prazo por responsável e mês</div>
            <div className="section-block-desc">Baseado no mês do Prazo de cada ticket de Desenvolvimento. Respeita os filtros de responsável, classificação e tipo (o filtro de mês não se aplica à matriz, para mostrar a evolução completa do ano).</div>
          </div>
        </div>
        {respRows.length === 0 ? (
          <div style={{padding:'0 22px 20px'}}>
            <EmptyState icon={IconTrend} title="Sem demandas na planning"
              sub="Preencha o Prazo nos tickets de Desenvolvimento na aba Demandas para ver a evolução aqui."/>
          </div>
        ) : (
          <div className="table-wrap">
            <table className="upsell-tbl">
              <thead>
                <tr><th></th>{MESES_PLANNING.map(m => <th key={m.n}>{m.nome.slice(0,3)}</th>)}</tr>
              </thead>
              <tbody>
                {respRows.map(r => (
                  <tr key={r.key || '__none'}>
                    <td style={{textAlign:'left', paddingLeft:12, fontWeight:600}}>{r.label}</td>
                    {MESES_PLANNING.map(m => {
                      const pct = pctForRowMes(r.key, m.n);
                      return <td key={m.n}>{pct === null ? '—' : fmtPercent(pct, 0)}</td>;
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {clientesComDados.length === 0 ? (
        <div className="card"><EmptyState icon={IconClipboard} title="Nenhum ticket de Desenvolvimento encontrado"
          sub="Ajuste os filtros para ver os tickets."/></div>
      ) : clientesComDados.map(cliente => (
        <EntregasPrazoClienteTable key={cliente} cliente={cliente} rows={byCliente[cliente]} devNameById={devNameById}/>
      ))}
    </div>
  );
}
