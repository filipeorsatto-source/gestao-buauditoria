/* ---------------------------------------------------------------
   EXPORTAÇÃO EM PDF (pedido em 30/08/2026) — "gêmeo" em <canvas> do PptxGenJS
   -----------------------------------------------------------------
   O PptxGenJS não sabe gravar .pdf (só .pptx). Pra oferecer PDF sem depender de nenhum serviço externo
   de conversão, as classes abaixo (CanvasPdfPptx/CanvasPdfSlide) imitam a MESMA fatia da API do
   PptxGenJS que as funções addReportSlide1/addPlanning*Slide/etc. já usam (addSlide, addText, addShape,
   addImage, addTable, addChart, ShapeType, ChartType) — só que desenhando num <canvas> em vez de montar
   XML do PowerPoint. Assim, TODAS as funções addXSlide já existentes funcionam sem nenhuma alteração,
   não importa se recebem um PptxGenJS de verdade ou um destes objetos "de mentira": só quem CRIA o objeto
   pptx (gerarReportPptx/gerarPlanningPptx) e quem finaliza o arquivo (writeFile vs. salvar como PDF)
   precisa saber a diferença. Cada slide vira uma imagem (canvas -> JPEG) e cada imagem vira uma página do
   PDF (via jsPDF) — o texto fica "achatado" (não é selecionável), mas o layout sai fiel ao do .pptx.
--------------------------------------------------------------- */
const PDF_CANVAS_DPI = 140; // pixels por polegada do canvas de cada slide — qualidade boa sem pesar demais
const __pdfImageCache = {}; // chave: mesma string passada em addImage({data}) — pré-carregada antes de gerar os slides

function preloadPdfImage(dataSemPrefixo){
  return new Promise((resolve, reject) => {
    if(__pdfImageCache[dataSemPrefixo]){ resolve(__pdfImageCache[dataSemPrefixo]); return; }
    const img = new Image();
    img.onload = () => { __pdfImageCache[dataSemPrefixo] = img; resolve(img); };
    img.onerror = () => reject(new Error('Falha ao carregar uma imagem embutida do report para o PDF.'));
    img.src = 'data:' + dataSemPrefixo;
  });
}

class CanvasPdfSlide{
  constructor(widthIn, heightIn, dpi){
    this.dpi = dpi;
    this.widthIn = widthIn;
    this.heightIn = heightIn;
    this.canvas = document.createElement('canvas');
    this.canvas.width = Math.round(widthIn * dpi);
    this.canvas.height = Math.round(heightIn * dpi);
    this.ctx = this.canvas.getContext('2d');
    this.ctx.fillStyle = '#ffffff';
    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
  }
  px(v){ return (v || 0) * this.dpi; }
  pt(v){ return this.px((v || 0) / 72); } // pontos (fonte/linha, como no PptxGenJS) -> px

  set background(bg){
    if(bg && bg.color){
      this.ctx.fillStyle = '#' + bg.color;
      this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    }
  }

  _roundRectPath(x, y, w, h, r){
    const ctx = this.ctx;
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  addShape(shapeType, opts){
    const ctx = this.ctx;
    const x = this.px(opts.x), y = this.px(opts.y), w = this.px(opts.w), h = this.px(opts.h);
    ctx.save();
    if(shapeType === 'line'){
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + w, y + h);
      ctx.lineWidth = Math.max(1, this.pt(opts.line && opts.line.width || 1));
      ctx.strokeStyle = '#' + ((opts.line && opts.line.color) || '000000');
      ctx.stroke();
      ctx.restore();
      return;
    }
    if(opts.shadow){
      ctx.shadowColor = 'rgba(0,0,0,' + (opts.shadow.opacity != null ? opts.shadow.opacity : 0.2) + ')';
      ctx.shadowBlur = this.pt(opts.shadow.blur || 0);
      ctx.shadowOffsetY = this.pt(opts.shadow.offset || 0);
    }
    if(shapeType === 'ellipse'){
      ctx.beginPath();
      ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
    } else { // rect ou roundRect
      const r = shapeType === 'roundRect' ? this.px(opts.rectRadius || 0) : 0;
      this._roundRectPath(x, y, w, h, r);
    }
    if(opts.fill && opts.fill.color){ ctx.fillStyle = '#' + opts.fill.color; ctx.fill(); }
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; // sombra só na área preenchida, não na borda
    if(opts.line && opts.line.type !== 'none' && opts.line.color){
      ctx.lineWidth = Math.max(0.5, this.pt(opts.line.width || 1));
      ctx.strokeStyle = '#' + opts.line.color;
      ctx.stroke();
    }
    ctx.restore();
  }

  addImage(opts){
    const img = __pdfImageCache[opts.data];
    if(!img) return; // não pré-carregada — só usado pras logos, sempre pré-carregadas antes de montar os slides
    this.ctx.drawImage(img, this.px(opts.x), this.px(opts.y), this.px(opts.w), this.px(opts.h));
  }

  // Monta a fonte CSS equivalente ao par fontFace/fontSize/bold/italic do PptxGenJS.
  _fontFor(style){
    const sizePx = Math.max(1, this.pt(style.fontSize || 12));
    return (style.italic ? 'italic ' : '') + (style.bold ? 'bold ' : '') + sizePx.toFixed(1) + 'px "' + (style.fontFace || 'Arial') + '", Arial, sans-serif';
  }

  // addText aceita tanto uma string simples quanto um array de "runs" ({text, options}) com estilos
  // diferentes por trecho (usado, por ex., em "Meta Contas Finalizadas: <valor em negrito>"). Faz quebra
  // de linha automática (wrap) respeitando a largura w, e alinhamento horizontal/vertical dentro de w×h.
  addText(text, opts){
    const ctx = this.ctx;
    const x0 = this.px(opts.x), y0 = this.px(opts.y), w = this.px(opts.w), h = this.px(opts.h);
    if(opts.fill && opts.fill.color){ ctx.fillStyle = '#' + opts.fill.color; ctx.fillRect(x0, y0, w, h); }

    const runs = Array.isArray(text) ? text : [{text: text, options: {}}];
    const paragraphs = [];
    let currentPara = [];
    runs.forEach(run => {
      const style = {...opts, ...(run.options || {})};
      const runText = run.text != null ? String(run.text) : '';
      const partes = runText.split('\n');
      partes.forEach((parte, idx) => {
        if(idx > 0){ paragraphs.push(currentPara); currentPara = []; }
        parte.split(/(\s+)/).filter(s => s.length).forEach(word => currentPara.push({word, style}));
      });
      if(run.options && run.options.breakLine){ paragraphs.push(currentPara); currentPara = []; }
    });
    paragraphs.push(currentPara);

    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    const lines = [];
    paragraphs.forEach(para => {
      let currentLine = [], currentWidth = 0;
      if(!para.length){ lines.push({tokens: [], width: 0}); return; }
      para.forEach(tok => {
        ctx.font = this._fontFor(tok.style);
        const wWord = ctx.measureText(tok.word).width;
        if(/^\s+$/.test(tok.word)){
          if(currentLine.length){ currentLine.push(tok); currentWidth += wWord; }
          return;
        }
        if(currentWidth + wWord > w && currentLine.length){
          lines.push({tokens: currentLine, width: currentWidth});
          currentLine = [tok]; currentWidth = wWord;
        } else {
          currentLine.push(tok); currentWidth += wWord;
        }
      });
      lines.push({tokens: currentLine, width: currentWidth});
    });

    const lineHeight = Math.max(1, this.pt((opts.fontSize || 12) * 1.22));
    const totalH = lineHeight * lines.length;
    let startY;
    if(opts.valign === 'middle') startY = y0 + (h - totalH) / 2;
    else if(opts.valign === 'bottom') startY = y0 + h - totalH;
    else startY = y0;

    lines.forEach((line, i) => {
      const ly = startY + i * lineHeight + lineHeight * 0.78;
      let lx;
      if(opts.align === 'center') lx = x0 + (w - line.width) / 2;
      else if(opts.align === 'right') lx = x0 + w - line.width;
      else lx = x0;
      line.tokens.forEach(tok => {
        ctx.font = this._fontFor(tok.style);
        ctx.fillStyle = '#' + (tok.style.color || '000000');
        ctx.fillText(tok.word, lx, ly);
        lx += ctx.measureText(tok.word).width;
      });
    });
  }

  // Tabela genérica (cabeçalho + linhas), com suporte a colspan e estilo por célula — cobre os 4 usos de
  // addTable no Report/Planning (abertura por cliente, ranking individual, demandas por cliente).
  addTable(rows, opts){
    const ctx = this.ctx;
    const x0 = this.px(opts.x), y0 = this.px(opts.y);
    const colWsIn = opts.colW && opts.colW.length ? opts.colW : null;
    const nCols = colWsIn ? colWsIn.length : Math.max(1, ...rows.map(r => r.reduce((sum, c) => sum + ((c && c.options && c.options.colspan) || 1), 0)));
    const colWsPx = (colWsIn || Array(nCols).fill((opts.w || 10) / nCols)).map(v => this.px(v));
    const rowHsPx = Array.isArray(opts.rowH) ? opts.rowH.map(v => this.px(v)) : rows.map(() => this.px(opts.rowH || 0.3));

    let y = y0;
    rows.forEach((row, ri) => {
      const rh = rowHsPx[ri] != null ? rowHsPx[ri] : rowHsPx[rowHsPx.length - 1];
      let x = x0, colIdx = 0;
      row.forEach(cellRaw => {
        const cell = (cellRaw && typeof cellRaw === 'object' && 'text' in cellRaw) ? cellRaw : {text: cellRaw, options: {}};
        const cOpts = cell.options || {};
        const span = cOpts.colspan || 1;
        const cellW = colWsPx.slice(colIdx, colIdx + span).reduce((a, b) => a + b, 0);
        if(cOpts.fill && cOpts.fill.color){ ctx.fillStyle = '#' + cOpts.fill.color; ctx.fillRect(x, y, cellW, rh); }
        if(opts.border){
          ctx.strokeStyle = '#' + (opts.border.color || 'CCCCCC');
          ctx.lineWidth = Math.max(0.5, this.pt(opts.border.pt || 0.5));
          ctx.strokeRect(x, y, cellW, rh);
        }
        this.addText(cell.text != null ? String(cell.text) : '', {
          x: x / this.dpi + 0.02, y: y / this.dpi, w: cellW / this.dpi - 0.04, h: rh / this.dpi,
          fontFace: opts.fontFace, fontSize: cOpts.fontSize || opts.fontSize || 9,
          bold: cOpts.bold, italic: cOpts.italic, color: cOpts.color || '333333',
          align: cOpts.align || 'left', valign: 'middle',
        });
        x += cellW;
        colIdx += span;
      });
      y += rh;
    });
  }

  // Gráfico de barras agrupadas (Real x Budget por mês) — único tipo de gráfico usado no Report
  // (addReportAreaClienteSlide). Aproximação visual do gráfico do PptxGenJS: barras + grade + rótulos de
  // categoria + legenda, sem pretender ser pixel-a-pixel idêntico.
  addChart(chartType, chartData, opts){
    const ctx = this.ctx;
    const x0 = this.px(opts.x), y0 = this.px(opts.y), w = this.px(opts.w), h = this.px(opts.h);
    const legendH = opts.showLegend ? this.px(0.22) : 0;
    const axisLabelH = this.px(0.2);
    const plotH = h - legendH - axisLabelH;
    const series = chartData || [];
    const labels = (series[0] && series[0].labels) || [];
    const nCats = Math.max(1, labels.length);
    const allVals = series.flatMap(s => (s.values || []).filter(v => v !== null && v !== undefined));
    const maxVal = Math.max(1, ...allVals, 0);
    const groupW = w / nCats;
    const barGap = groupW * 0.14;
    const barW = Math.max(1, (groupW - barGap * 2) / Math.max(1, series.length));

    if(opts.valGridLine && opts.valGridLine.style !== 'none'){
      ctx.strokeStyle = '#' + (opts.valGridLine.color || 'DDDDDD');
      ctx.lineWidth = 1;
      for(let g = 0; g <= 4; g++){
        const gy = y0 + plotH - (plotH * g / 4);
        ctx.beginPath(); ctx.moveTo(x0, gy); ctx.lineTo(x0 + w, gy); ctx.stroke();
      }
    }

    series.forEach((s, si) => {
      ctx.fillStyle = '#' + ((opts.chartColors && opts.chartColors[si]) || '2C5AA0');
      (s.values || []).forEach((v, ci) => {
        if(v === null || v === undefined) return;
        const barH = maxVal ? (v / maxVal) * plotH : 0;
        const bx = x0 + ci * groupW + barGap + si * barW;
        const by = y0 + plotH - barH;
        ctx.fillRect(bx, by, barW, Math.max(0, barH));
      });
    });

    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.font = this.pt(opts.catAxisLabelFontSize || 7).toFixed(1) + 'px Arial';
    ctx.fillStyle = '#' + (opts.catAxisLabelColor || '888888');
    labels.forEach((lab, ci) => {
      ctx.fillText(String(lab), x0 + ci * groupW + groupW / 2, y0 + plotH + this.px(0.14));
    });

    if(opts.showLegend){
      const swatchGap = this.px(0.9);
      let lx = x0 + w / 2 - (series.length * swatchGap) / 2;
      const ly = y0 + plotH + axisLabelH + this.px(0.04);
      ctx.textAlign = 'left';
      series.forEach((s, si) => {
        ctx.fillStyle = '#' + ((opts.chartColors && opts.chartColors[si]) || '2C5AA0');
        ctx.fillRect(lx, ly, this.px(0.12), this.px(0.12));
        ctx.fillStyle = '#333333';
        ctx.font = this.pt(opts.legendFontSize || 7).toFixed(1) + 'px Arial';
        ctx.fillText(s.name, lx + this.px(0.16), ly + this.px(0.11));
        lx += swatchGap;
      });
    }
    ctx.textAlign = 'left';
  }
}

class CanvasPdfPptx{
  constructor(){
    this.slides = [];
    this.ShapeType = {rect: 'rect', roundRect: 'roundRect', ellipse: 'ellipse', line: 'line'};
    this.ChartType = {bar: 'bar'};
    this._layout = {width: 13.333, height: 7.5};
  }
  defineLayout(opts){ this._layout = {width: opts.width, height: opts.height}; }
  set layout(_v){ /* no-op — o tamanho já vem de defineLayout, chamado sempre antes */ }
  set author(v){ this._author = v; }
  set company(v){ this._company = v; }
  set title(v){ this._title = v; }
  addSlide(){
    // dpi maior que o padrão pro One-Pager (ver gerarOnePagerPng) — a imagem final é usada quase em
    // página cheia dentro de um Word, então pede mais resolução do que os slides do Report/Planning.
    const slide = new CanvasPdfSlide(this._layout.width, this._layout.height, this._dpi || PDF_CANVAS_DPI);
    this.slides.push(slide);
    return slide;
  }
  // Converte cada slide (canvas) numa página de imagem do PDF final, na mesma proporção 16:9 usada no
  // .pptx, e dispara o download — mesmo "contrato" externo de pptx.writeFile({fileName}).
  async salvarComoPdf(fileName){
    const jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
    if(!jsPDFCtor) throw new Error('A biblioteca de geração de PDF não carregou — verifique sua conexão com a internet e tente novamente (ou dê um Ctrl+Shift+R e tente de novo).');
    const doc = new jsPDFCtor({orientation: 'landscape', unit: 'in', format: [this._layout.width, this._layout.height]});
    this.slides.forEach((slide, i) => {
      if(i > 0) doc.addPage([this._layout.width, this._layout.height], 'landscape');
      const imgData = slide.canvas.toDataURL('image/jpeg', 0.92);
      doc.addImage(imgData, 'JPEG', 0, 0, this._layout.width, this._layout.height);
    });
    if(this._title) doc.setProperties({title: this._title, author: this._author || '', creator: this._company || ''});
    doc.save(fileName);
  }
}

// As 15 metas cobertas pelo report, agrupadas nas 5 áreas — mesma ordem/agrupamento pedido em
// 27/08/2026 (Slide 1 e Ranking Individual). Propositalmente NÃO inclui as metas de área "Geral" (NPS,
// Margem Bruta/Ticket Médio), que ficaram fora do pedido original.
const REPORT_AREAS = [
  {nome:'Deployment', kpis:['contas-finalizadas','upsell-score']},
  {nome:'Auditoria', kpis:['penetracao-regras','efetividade-regras','subfaturamento','contas-automatico']},
  {nome:'Desenvolvimento', kpis:['entregas-prazo','csat-tech','tempo-processamento']},
  {nome:'Atendimento', kpis:['dias-ticket-aberto','sla-primeira-resposta','csat-atendimento']},
  {nome:'Produto', kpis:['cobertura-produto','csat-produto','cobertura-dados']},
];

function getMetaBySlug(data, slug){
  return (data.metas || []).find(m => m.slug === slug) || null;
}

// Formata um valor de KPI de acordo com a unidade de medida da meta (mesmo padrão usado no resto do
// app — ver fmtPercent/fmtCurrency/fmtNumber) — usado só na montagem do Report (texto dentro do pptx).
function fmtMetaValorReport(v, unidade){
  if(v === null || v === undefined || v === '') return '—';
  if(unidade === '%') return fmtPercent(v, 1);
  if(unidade === 'R$') return fmtCurrency(v) || '—';
  return v.toLocaleString('pt-BR', {maximumFractionDigits: 1});
}
// Pedido em 30/08/2026: no card "visão geral por área" (Slide 1 do Report Mensal, e também no
// One-Pager, que reaproveita o mesmo conteúdo), o valor de BUDGET sempre aparece arredondado, sem casa
// decimal — inclusive quando o budget "linearizado" do mês em andamento (ver
// linearizarBudgetContasFinalizadasReport) dá um número quebrado (ex.: 96,8 contas). O valor Real
// continua com a formatação normal (fmtMetaValorReport), só o Budget dessa tela é que arredonda.
function fmtMetaValorReportArredondado(v, unidade){
  if(v === null || v === undefined || v === '') return '—';
  if(unidade === '%') return fmtPercent(v, 0);
  if(unidade === 'R$') return fmtCurrency(Math.round(Number(v))) || '—';
  return Math.round(Number(v)).toLocaleString('pt-BR');
}

// Pedido em 30/08/2026: no Report Mensal (gerarReportPptx — Slide 1, abertura por cliente e ranking
// individual), o budget de "Contas Finalizadas" usado pra comparar com o real precisa ser proporcional
// ao dia do mês quando o mês escolhido pro report é o mês CORRENTE (ainda em andamento) — senão o KPI
// fica sinalizado em vermelho o mês inteiro, até o último dia, mesmo estando no ritmo certo. Ex.: budget
// cheio do mês = 100, hoje é dia 15 de um mês de 31 dias -> budget comparável vira 100 × 15/31 ≈ 48,4.
// Quando o mês do report já é um mês FECHADO (anterior ao corrente), ou ainda nem começou (futuro), usa
// o budget cheio normalmente — só o mês em andamento precisa da régua linear. Escopo: só o slug
// 'contas-finalizadas' (único citado pelo usuário) e só dentro do Report Mensal — não mexe no budget
// "oficial" mostrado na tela de Gestão de Metas nem no gerador do Planning (que usa outro caminho de
// dados, getClienteBudgetComFallback, propositalmente não tocado aqui).
function linearizarBudgetContasFinalizadasReport(budgetCheio, slug, mesN){
  if(slug !== 'contas-finalizadas') return budgetCheio;
  if(budgetCheio === null || budgetCheio === undefined || budgetCheio === '') return budgetCheio;
  const hoje = new Date();
  const mesAtual = hoje.getMonth() + 1;
  if(mesN !== mesAtual || hoje.getFullYear() !== CURRENT_YEAR) return budgetCheio; // mês fechado ou futuro: budget cheio
  const diasNoMes = new Date(hoje.getFullYear(), mesAtual, 0).getDate();
  const diaAtual = hoje.getDate();
  return Number(budgetCheio) * (diaAtual / diasNoMes);
}

// Real + Budget de uma meta num mês específico, com filtro opcional por cliente/pessoa — encapsula a
// escolha entre getMetaBudgetOverrideByMonth (metas com budget nativo por cliente/tela própria) e
// goal.budgets (as demais), do mesmo jeito que GoalDetailPage/GoalClienteMesTable já fazem.
function getKpiRealBudgetNoMes(data, slug, mesN, clienteNomesFilter, pessoaId){
  const goal = getMetaBySlug(data, slug);
  if(!goal) return {real: null, budget: null, unidade: 'Absoluto', titulo: slug};
  const isExterno = META_BUDGET_EXTERNO_SLUGS.includes(slug);
  const realByMonth = getMetaRealizadoByMonth(slug, data, clienteNomesFilter, pessoaId);
  const budgetByMonth = isExterno
    ? getMetaBudgetOverrideByMonth(slug, data, clienteNomesFilter)
    : (goal.budgets[CURRENT_YEAR] || {});
  return {
    real: realByMonth ? realByMonth[mesN] : null,
    budget: linearizarBudgetContasFinalizadasReport(budgetByMonth ? budgetByMonth[mesN] : null, slug, mesN),
    unidade: goal.unidadeMedida,
    titulo: goal.titulo,
  };
}

// Monta o resumo do Slide 1: para cada área, o Real/Budget de cada KPI no mês escolhido (visão da
// empresa inteira, sem filtro de cliente/pessoa).
function buildReportAreaSummary(data, mesN){
  return REPORT_AREAS.map(area => ({
    nome: area.nome,
    kpis: area.kpis.map(slug => ({slug, ...getKpiRealBudgetNoMes(data, slug, mesN, null, null)})),
  }));
}

// Monta a abertura por cliente (Slides 2 a 6): para os KPIs de uma área que têm granularidade por
// cliente (META_GRANULAR_CLIENTE_SLUGS), Real/Budget de cada cliente naquele mês. KPIs sem granularidade
// por cliente (ex.: Tempo Processamento) ficam de fora da tabela por cliente, mas continuam no Slide 1.
function buildReportClienteBreakdown(data, mesN, areaKpiSlugs){
  const granularSlugs = areaKpiSlugs.filter(s => META_GRANULAR_CLIENTE_SLUGS.includes(s));
  const clientesTodos = (data.clientes || []).filter(c => c.nome.toLowerCase() !== 'interno');
  const nomesComDados = new Set();
  granularSlugs.forEach(slug => {
    clientesTodos.forEach(c => {
      MONTHS.filter(m => m.n === mesN).forEach(() => {
        const v = getMetaRealizadoPorClienteMes(slug, data, c.id, c.nome, mesN, null);
        if(v !== null) nomesComDados.add(c.nome);
      });
    });
  });
  const clientesCols = clientesTodos.filter(c => nomesComDados.has(c.nome));
  const budgetIsPerClienteSlugs = ['contas-finalizadas','penetracao-regras','efetividade-regras','subfaturamento','contas-automatico','ticket-medio'];
  const rows = clientesCols.map(c => {
    const valores = {};
    granularSlugs.forEach(slug => {
      const goal = getMetaBySlug(data, slug);
      const real = getMetaRealizadoPorClienteMes(slug, data, c.id, c.nome, mesN, null);
      let budget = budgetIsPerClienteSlugs.includes(slug) ? getMetaBudgetPorClienteMes(slug, data, c.id, c.nome, mesN) : null;
      if(budget === null && goal){
        const isExterno = META_BUDGET_EXTERNO_SLUGS.includes(slug);
        const flatBudgetByMonth = isExterno ? getMetaBudgetOverrideByMonth(slug, data, null) : (goal.budgets[CURRENT_YEAR] || {});
        budget = flatBudgetByMonth ? flatBudgetByMonth[mesN] : null;
      }
      valores[slug] = {real, budget: linearizarBudgetContasFinalizadasReport(budget, slug, mesN), unidade: goal ? goal.unidadeMedida : 'Absoluto'};
    });
    return {cliente: c.nome, valores};
  });
  return {granularSlugs, rows};
}

// Monta o Ranking Individual de UMA área (agora um slide por área, no formato de tabela pedido em
// 27/08/2026 — BGT / REAL / vs BGT % por KPI, uma tabela por área em vez de uma tabela única gigante
// com as 15 metas): para cada pessoa da área, para cada KPI daquela área em que ela está associada
// (meta.pessoaIds), o Real/Budget "mais específico possível" — por cliente quando o KPI tem
// granularidade por cliente e a pessoa tem clientes associados (via tarefas — mesmo critério já usado no
// filtro por pessoa de Gestão de Metas, ver getPessoaClienteNomes), e o valor GLOBAL da empresa quando o
// KPI é um número único. Critério confirmado com o usuário em 27/08/2026.
function buildReportPessoaRankingArea(data, mesN, area){
  const pessoas = (data.pessoas || []).slice().sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  const rows = pessoas.map(p => {
    const clienteNomesFilter = getPessoaClienteNomes(p.id, data);
    const valores = {};
    area.kpis.forEach(slug => {
      const goal = getMetaBySlug(data, slug);
      if(!goal || !(goal.pessoaIds||[]).includes(p.id)){ valores[slug] = null; return; }
      valores[slug] = getKpiRealBudgetNoMes(data, slug, mesN, clienteNomesFilter, p.id);
    });
    return {pessoa: p.nome, valores};
  }).filter(r => area.kpis.some(slug => r.valores[slug]));
  return rows;
}

// Série mensal (12 meses do ano corrente) de Real e Budget de um KPI, para o gráfico mês a mês de cada
// meta nos slides de área (pedido em 27/08/2026) — sempre a visão GLOBAL da empresa (sem filtro de
// cliente/pessoa), igual ao gráfico que já existe na própria tela do indicador em Acompanhamento de Metas.
function getKpiSeriesForYear(data, slug){
  const goal = getMetaBySlug(data, slug);
  if(!goal) return {real: MONTHS.map(()=>null), budget: MONTHS.map(()=>null)};
  const isExterno = META_BUDGET_EXTERNO_SLUGS.includes(slug);
  const realByMonth = getMetaRealizadoByMonth(slug, data, null, null) || {};
  const budgetByMonth = isExterno ? (getMetaBudgetOverrideByMonth(slug, data, null) || {}) : (goal.budgets[CURRENT_YEAR] || {});
  return {
    real: MONTHS.map(m => (realByMonth[m.n] === undefined || realByMonth[m.n] === null) ? null : Number(realByMonth[m.n])),
    budget: MONTHS.map(m => (budgetByMonth[m.n] === undefined || budgetByMonth[m.n] === null || budgetByMonth[m.n] === '') ? null : Number(budgetByMonth[m.n])),
  };
}

// Cor de status (verde forte = dentro/acima da meta, vermelho forte = fora) de um KPI, considerando que
// alguns são "quanto menor, melhor" (ver META_MENOR_MELHOR_SLUGS) — cinza quando não há budget definido
// pra comparar. Trocado de verde/laranja pra verde/vermelho fortes em 27/08/2026, a pedido do usuário.
function kpiStatusColorReport(real, budget, slug){
  if(real === null || real === undefined || budget === null || budget === undefined || budget === '') return RIVIO_PPTX.tintaSoft;
  const menorMelhor = META_MENOR_MELHOR_SLUGS.includes(slug);
  const atingiu = menorMelhor ? Number(real) <= Number(budget) : Number(real) >= Number(budget);
  return atingiu ? RIVIO_PPTX.verde : RIVIO_PPTX.vermelho;
}

// Variação percentual do Real em relação ao Budget ("vs BGT %"), sempre com o sinal orientado como
// "positivo = bom": para KPIs normais (quanto maior melhor), real acima do budget é positivo; para os
// "quanto menor, melhor" (ver META_MENOR_MELHOR_SLUGS), real ABAIXO do budget é que vira positivo — bate
// com a cor (verde quando positivo, vermelho quando negativo) usada no Ranking Individual.
function kpiVsBudgetPct(real, budget, slug){
  if(real === null || real === undefined || budget === null || budget === undefined || budget === '' || Number(budget) === 0) return null;
  const menorMelhor = META_MENOR_MELHOR_SLUGS.includes(slug);
  const pct = ((Number(real) - Number(budget)) / Math.abs(Number(budget))) * 100;
  return menorMelhor ? -pct : pct;
}
function fmtVsBudgetPct(pct){
  if(pct === null || pct === undefined) return '—';
  const sign = pct > 0 ? '+' : '';
  return sign + pct.toLocaleString('pt-BR', {maximumFractionDigits: 0}) + '%';
}

// Slide 1: 5 colunas (uma por área), cada uma com um card branco por KPI mostrando Real x Budget do mês.
function addReportSlide1(pptx, areaSummary, mesLabel){

  areaSummary.forEach((area, i) => {

    });
    let y = startY + 0.46;

    area.kpis.forEach(kpi => {
      slide.addShape(pptx.ShapeType.roundRect, {
        x, y, w: colW, h: cardH, rectRadius: 0.08,
        fill: {color: RIVIO_PPTX.branco}, line: {color: RIVIO_PPTX.linhaClara, width: 1},
        shadow: {type: 'outer', color: '0A0A0A', opacity: 0.16, blur: 6, offset: 2, angle: 90},
      });
      const cor = kpiStatusColorReport(kpi.real, kpi.budget, kpi.slug);
      slide.addText(kpi.titulo, {
        x: x + 0.12, y: y + 0.08, w: colW - 0.24, h: 0.28,
        fontFace: RIVIO_PPTX.fontFace, fontSize: 9.5, color: RIVIO_PPTX.tintaSoft, valign: 'top',
      });
      slide.addText(fmtMetaValorReport(kpi.real, kpi.unidade), {

/* ---------------------------------------------------------------
   ONE-PAGER EM PNG (pedido em 30/08/2026) — mesmo conteúdo do Slide 1 do Report Mensal (visão geral por
   área), só que desenhado direto num <canvas> em formato RETRATO (não passa pelo PptxGenJS, nem monta um
   .pptx/.pdf de verdade) e exportado como uma única imagem .png — pensado pra colar quase em página
   cheia num documento Word, como pedido pelo usuário. Reaproveita CanvasPdfSlide (o mesmo "gêmeo" em
   canvas usado no export em PDF) só que com dimensões de página A4/carta em retrato em vez do slide
   16:9, e uma versão compacta do cabeçalho/cards (colunas mais estreitas, fontes menores) — o layout de
   5 colunas lado a lado do Slide 1 não cabe do jeito landscape original numa página estreita e alta.
--------------------------------------------------------------- */
function downloadDataUrl(dataUrl, fileName){
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function addOnePagerContent(slide, areaSummary, mesLabel, pageW, pageH){

  // retrato em vez dos 13.333in do slide 16:9).

  slide.addShape('ellipse', {x: 0.5 + 0.3/2 - 0.028, y: 0.42 + 0.3/2 - 0.028, w: 0.056, h: 0.056, fill: {color: RIVIO_PPTX.azul}, line: {type: 'none'}});

// Ponto de entrada: monta o .pptx inteiro (11 slides: 1 visão geral + 5 abertura por cliente/evolução
// mensal + 5 ranking individual, um de cada por área) e dispara o download no navegador do usuário.
// Cria o objeto "pptx" (PptxGenJS de verdade, ou o CanvasPdfPptx "de mentira" — ver bloco acima) de
// acordo com o formato escolhido pelo usuário (pedido em 30/08/2026: seletor PPTX/PDF ao lado do mês,
// tanto no Report Mensal quanto no Planning). Usado por gerarReportPptx e gerarPlanningPptx.
function criarPptxDestino(formato, titulo){
  if(formato === 'pdf'){
    const pptx = new CanvasPdfPptx();
    pptx.defineLayout({name: 'RIVIO_16X9', width: 13.333, height: 7.5});
    pptx.layout = 'RIVIO_16X9';
    pptx.author = 'Painel Auditoria — Rivio';
    pptx.company = 'Rivio';
    pptx.title = titulo;
    return pptx;
  }
  const PptxCtor = window.PptxGenJS;
  if(!PptxCtor) throw new Error('A biblioteca de geração de PPTX não carregou — verifique sua conexão com a internet e tente novamente (ou dê um Ctrl+Shift+R e tente de novo).');
  const pptx = new PptxCtor();
  pptx.defineLayout({name: 'RIVIO_16X9', width: 13.333, height: 7.5});
  pptx.layout = 'RIVIO_16X9';
  pptx.author = 'Painel Auditoria — Rivio';
  pptx.company = 'Rivio';
  pptx.title = titulo;
  return pptx;
}

// Grava o arquivo final no formato escolhido — mesmo "contrato" externo (dispara o download no
// navegador) nos dois casos, só troca a extensão e o mecanismo por trás.
async function finalizarExportacao(pptx, fileNameSemExtensao, formato){
  if(formato === 'pdf'){
    await pptx.salvarComoPdf(fileNameSemExtensao + '.pdf');
  } else {
    await pptx.writeFile({fileName: fileNameSemExtensao + '.pptx'});
  }
}

async function gerarReportPptx(data, mesN, formato){
  if(formato === 'pdf'){
    // As únicas imagens usadas no Report/Planning são as 2 logos (preta/branca) — pré-carrega as duas
    // ANTES de montar os slides, porque addImage do CanvasPdfSlide precisa ser síncrono (desenha direto
    // no canvas), diferente do addImage do PptxGenJS (que só referencia os dados, sem decodificar nada
    // na hora).
    await Promise.all([
      preloadPdfImage('image/png;base64,' + RIVIO_LOGO_PRETO_B64),
      preloadPdfImage('image/png;base64,' + RIVIO_LOGO_BRANCO_B64),

  }

/* ---------------------------------------------------------------
   PLANNING MENSAL EM PPTX — pedido em 29/08/2026: segundo gerador de apresentação (.pptx), separado
   do Report Mensal acima, replicando o "Plano de Trabalho do Mês" que o time monta manualmente hoje
   (arquivo de referência enviado pelo usuário) — 1 capa + 1 slide por cliente + visões gerais de
   Deployment/Desenvolvimento/Auditoria/Atendimento/Produto. Reaproveita os mesmos helpers de dados do
   Report Mensal acima (getMetaBySlug, getMetaRealizadoPorClienteMes, getMetaBudgetPorClienteMes,
   buildDemandasMerged, etc.).

   Convenção combinada com o usuário: em TODO o Planning, "real" é sempre o valor de FECHAMENTO DO MÊS
   ANTERIOR ao mês escolhido no filtro — só os campos de Meta/Budget usam o próprio mês escolhido. Em
   Janeiro não existe mês anterior dentro do ano corrente, então os KPIs "real" ficam em branco ("—")
   nesse caso (mesAnteriorPlanning retorna null).
--------------------------------------------------------------- */

function mesAnteriorPlanning(mesN){
  return mesN > 1 ? mesN - 1 : null;
}

function getClienteIdByNomePlanning(data, nome){
  const c = (data.clientes || []).find(x => x.nome === nome);
  return c ? c.id : null;
}

function pessoaNomePlanning(data, id){
  if(!id) return '';
  const p = (data.pessoas || []).find(x => x.id === id);
  return p ? p.nome : '';
}

// Responsável "fixo" de um cliente numa área do organograma (Deployment/Auditoria) — o nome que aparece
// com mais frequência entre as tarefas daquela área com esse cliente atribuído em "Papéis e
// Responsabilidades" (data.tarefas[].responsaveis: {clienteId: pessoaId}). Vazio quando não há ninguém
// alocado.
function getClienteResponsavelPlanning(data, clienteNome, area){
  const clienteId = getClienteIdByNomePlanning(data, clienteNome);
  if(!clienteId) return '';
  const pessoaById = Object.fromEntries((data.pessoas || []).map(p => [p.id, p.nome]));
  const counts = {};
  (data.tarefas || []).forEach(t => {
    if(t.area !== area) return;
    const pid = (t.responsaveis || {})[clienteId];
    if(pid && pessoaById[pid]) counts[pessoaById[pid]] = (counts[pessoaById[pid]] || 0) + 1;
  });
  let best = '', bestCount = 0;
  Object.entries(counts).forEach(([nome, c]) => { if(c > bestCount){ best = nome; bestCount = c; } });
  return best;
}

// Responsável "geral" de uma área (sem recorte por cliente) — usado no Slide de Produto, cujos cards não
// são por cliente. Mesma lógica de contagem, só que somando entre todos os clientes.
function getAreaResponsavelGeralPlanning(data, area){
  const pessoaById = Object.fromEntries((data.pessoas || []).map(p => [p.id, p.nome]));
  const counts = {};
  (data.tarefas || []).forEach(t => {
    if(t.area !== area) return;
    Object.values(t.responsaveis || {}).forEach(pid => {
      if(pid && pessoaById[pid]) counts[pessoaById[pid]] = (counts[pessoaById[pid]] || 0) + 1;
    });
  });
  let best = '', bestCount = 0;
  Object.entries(counts).forEach(([nome, c]) => { if(c > bestCount){ best = nome; bestCount = c; } });
  return best;
}

// Budget/Meta de um KPI, por cliente e mês, com o mesmo fallback usado no Report Mensal
// (buildReportClienteBreakdown): usa o budget nativo por cliente quando existir (Contas Finalizadas,
// Penetração/Efetividade Regras, Subfaturamento, Contas Automático, Ticket Médio); senão cai pro budget
// único do mês (goal.budgets ou getMetaBudgetOverrideByMonth, dependendo da meta).
const PLANNING_BUDGET_POR_CLIENTE_SLUGS = ['contas-finalizadas','penetracao-regras','efetividade-regras','subfaturamento','contas-automatico','ticket-medio'];
function getClienteBudgetComFallback(data, slug, clienteId, clienteNome, mesN){
  const goal = getMetaBySlug(data, slug);
  let budget = PLANNING_BUDGET_POR_CLIENTE_SLUGS.includes(slug) ? getMetaBudgetPorClienteMes(slug, data, clienteId, clienteNome, mesN) : null;
  if(budget === null && goal){
    const isExterno = META_BUDGET_EXTERNO_SLUGS.includes(slug);
    const flatBudgetByMonth = isExterno ? getMetaBudgetOverrideByMonth(slug, data, null) : (goal.budgets[CURRENT_YEAR] || {});
    budget = flatBudgetByMonth ? flatBudgetByMonth[mesN] : null;
  }
  return budget;
}

// Fechado) — mesmo critério já usado em todo o resto do app (ver defaultStatusSet em DemandasPage).
// Importante: usa m.statusEfetivo, não m.status — um ticket com "Concluído Em" preenchido manualmente
// (via duplo clique, quando fica em aberto no Movidesk aguardando o cliente) já é tratado como Resolvido
// pelo statusEfetivo (ver buildDemandasMerged), então cai fora do Planning mesmo com status bruto em
// aberto (ajuste pedido em 29/08/2026 — antes usava m.status e continuava contando esses tickets).
function demandaEmAbertoPlanning(m){
  return !DEMANDA_STATUS_TERMINAL.includes(m.statusEfetivo);
}

// Grade de mini-tags com o código de cada ticket no Movidesk (pedido em 29/08/2026, seção "Ajustes
// Backlog" dos slides por cliente) — replica o visual do arquivo de referência (roundRect cinza-claro,
// texto pequeno centralizado), quebrando em linhas de "porRow" tags. Se não couberem todas dentro de
// "maxRows" linhas, mostra "+N mais" na última linha em vez de estourar o card.
function addPlanningTicketCodeGrid(pptx, slide, x, y, w, codigos, opts){
  opts = opts || {};
  // pillW um pouco mais largo que a proporção do arquivo de referência (que só tinha códigos de 4
  // dígitos, "2073") pra também caber com folga códigos de 5-6 dígitos sem quebrar em 2 linhas.
  const pillW = opts.pillW || 0.56, pillH = opts.pillH || 0.19, hGap = opts.hGap || 0.06, vGap = opts.vGap || 0.07;
  const porRow = opts.porRow || Math.max(1, Math.floor((w + hGap) / (pillW + hGap)));
  const maxRows = opts.maxRows || 5;
  const maxShown = porRow * maxRows;
  const overflow = codigos.length > maxShown;
  const shown = overflow ? codigos.slice(0, maxShown - porRow) : codigos;
  shown.forEach((codigo, idx) => {
    const col = idx % porRow, row = Math.floor(idx / porRow);
    const px = x + col * (pillW + hGap), py = y + row * (pillH + vGap);
    slide.addShape(pptx.ShapeType.roundRect, {x:px, y:py, w:pillW, h:pillH, rectRadius:0.15, fill:{color:'F2F2F2'}, line:{color:'A6A6A6', width:0.75}});
    slide.addText(String(codigo), {x:px, y:py, w:pillW, h:pillH, fontFace:RIVIO_PPTX.fontFace, fontSize:7, color:RIVIO_PPTX.tinta, align:'center', valign:'middle'});
  });
  if(overflow){
    const lastRow = Math.floor(shown.length / porRow);
    slide.addText('+' + (codigos.length - shown.length) + ' mais', {
      x, y: y + lastRow * (pillH + vGap), w: porRow * (pillW + hGap) - hGap, h: pillH,
      fontFace:RIVIO_PPTX.fontFace, fontSize:7, italic:true, color:RIVIO_PPTX.tintaSoft, align:'center', valign:'middle',
    });
  }
}

// Tabela genérica de listagem — usada por quase todos os slides do Planning. colWs pode ter entradas
// `null`, que dividem igualmente a largura restante depois de descontar as colunas com largura fixa
// (mesmo padrão de "coluna elástica" já usado no Report Mensal). Sem linhas, mostra uma linha única de
// estado vazio (a não ser que opts.manual, caso em que fica só com o cabeçalho — tabela pra preencher à
// mão depois de exportado, como a de Auditoria por cliente).
// Estima em quantas linhas um texto quebra numa coluna de largura colWIn (polegadas) num fontSize dado —
// heurística simples (não é medição real de texto, mas suficiente pra dimensionar a altura da linha da
// tabela com folga). Usada pra evitar o bug de "lista de demandas extensa demais" (29/08/2026): antes a
// altura de linha era uma média fixa pra todas as linhas, então textos longos que precisavam de 2-3
// linhas estouravam a altura calculada e a tabela toda vazava pra fora do card/slide.
function estimarLinhasTexto(texto, colWIn, fontSize){
  if(!texto) return 1;
  const avgCharW = fontSize * 0.0072;
  const usableW = Math.max(0.3, colWIn - 0.1);
  const charsPerLine = Math.max(4, Math.floor(usableW / avgCharW));
  return Math.max(1, Math.ceil(String(texto).length / charsPerLine));
}

function addPlanningListTable(pptx, slide, x, y, w, h, headers, rows, colWs, opts){
  opts = opts || {};
  // fontSize (pedido em 29/08/2026 para as tabelas de demandas, reduzindo de 9/8.5 pro corpo/cabeçalho
  // padrão pra ~8 em ambos, depois pra 7) — opcional, cai no tamanho padrão quando não informado, pra não
  // afetar as outras tabelas (Deployment, Auditoria geral, etc.) que não precisaram desse ajuste.
  const bodyFontSize = opts.fontSize || 9;
  const headerFontSize = opts.fontSize || 8.5;

  let colW = colWs;
  if(colW){
    const fixedTotal = colW.filter(v => v !== null).reduce((a,b) => a+b, 0);
    const nullCount = colW.filter(v => v === null).length;
    const flexW = nullCount ? Math.max(0.4, (w - fixedTotal) / nullCount) : 0;
    colW = colW.map(v => v === null ? flexW : v);
  }

  const header = headers.map(htext => ({text: htext, options:{bold:true, fill:{color:'F4F4F5'}, fontSize:headerFontSize, color:RIVIO_PPTX.tintaSoft}}));
  const headerH = 0.2;
  const lineH = bodyFontSize * 1.22 / 72 + 0.06; // altura de 1 linha de texto + folga de padding da célula

  let bodyRows;
  if(rows && rows.length){
    // Calcula a altura necessária de cada linha (o maior número de linhas quebradas entre as células
    // daquela linha) e para de adicionar linhas assim que ultrapassar a altura disponível — em vez de
    // deixar a tabela vazar pra fora do card, mostra "+N mais" na última linha (mesmo padrão já usado na
    // grade de códigos do Movidesk).
    const rowHeights = rows.map(r => {
      const maxLinhas = r.reduce((max, val, i) => {
        const texto = val === null || val === undefined ? '' : String(val);
        const linhas = estimarLinhasTexto(texto, colW ? colW[i] : w / r.length, bodyFontSize);
        return Math.max(max, linhas);
      }, 1);
      return Math.max(0.19, maxLinhas * lineH);
    });
    const available = h - headerH;
    let usedH = 0, cutAt = rows.length;
    for(let i = 0; i < rowHeights.length; i++){
      if(usedH + rowHeights[i] > available){ cutAt = i; break; }
      usedH += rowHeights[i];
    }
    const overflow = cutAt < rows.length;
    // Se sobrar só espaço pra 1 linha a mais, reserva ela pra mensagem "+N mais" em vez da última
    // demanda que coubesse (evita deixar só metade de uma linha visível e depois o resumo).
    const shownRows = overflow ? rows.slice(0, Math.max(0, cutAt)) : rows;
    const shownHeights = overflow ? rowHeights.slice(0, Math.max(0, cutAt)) : rowHeights;
    bodyRows = shownRows.map(r => r.map(val => ({text: val === null || val === undefined ? '' : String(val), options:{fontSize:bodyFontSize, color:RIVIO_PPTX.tinta}})));
    let finalRowH = [headerH, ...shownHeights];
    if(overflow){
      bodyRows.push([{text: '+' + (rows.length - shownRows.length) + ' demanda(s) não exibida(s)', options:{fontSize:bodyFontSize, italic:true, color:RIVIO_PPTX.tintaSoft, colspan: headers.length, align:'center'}}]);
      finalRowH.push(0.19);
    }
    slide.addTable([header, ...bodyRows], {
      x, y, w, colW,
      fontFace: RIVIO_PPTX.fontFace, border: {type:'solid', color:RIVIO_PPTX.linhaClara, pt:0.5},
      autoPage: false, rowH: finalRowH,
    });
    return;
  }

  if(opts.manual){
    bodyRows = Array.from({length:8}, () => headers.map(() => ({text:'', options:{fontSize:bodyFontSize}})));
  } else {
    bodyRows = [[{text: opts.emptyText || 'Nenhuma demanda encontrada', options:{fontSize:bodyFontSize, italic:true, color:RIVIO_PPTX.tintaSoft, colspan: headers.length, align:'center'}}]];
  }
  const nRows = bodyRows.length;
  const rowH = Math.max(0.2, Math.min(0.34, h / (nRows + 1)));
  slide.addTable([header, ...bodyRows], {
    x, y, w, colW,
    fontFace: RIVIO_PPTX.fontFace, border: {type:'solid', color:RIVIO_PPTX.linhaClara, pt:0.5},
    autoPage: false, rowH,
  });
}

// Slides 2 a 8 — um por cliente: Meta Contas Finalizadas no topo + 3 colunas (Desenvolvimento, Auditoria,
// Atendimento).
// Ajuste pedido em 29/08/2026 (4ª rodada): com a coluna Prioridade encolhida pra 0,84cm (~0,33"), o valor
// "Despriorizado" (13 caracteres) não cabe nem quebrando em 2 linhas — o LibreOffice/PowerPoint acaba
// quebrando letra a letra (sem espaço pra quebrar por palavra), o que fica visualmente quebrado. Como
// P0/P1/P2 já são curtos o bastante pra essa largura, só abreviamos o valor longo especificamente nessa
// coluna estreita das tabelas de demanda por cliente — o valor "cru" (usado em filtros, outras telas etc)
// continua intacto em todo o resto do app.
function prioridadeAbrevPlanning(p){
  // Testado visualmente (render LibreOffice) nessa coluna de ~0,33" com fonte 7: até "DP" (2 letras)
  // ainda quebrava em 2 linhas — letras maiúsculas são mais largas que os dígitos de "P0"/"P1"/"P2",
  // que cabem numa linha só. Só um único caractere garante não quebrar; "D" fica como código enxuto de
  // "Despriorizado" (mesma ideia de "P0/P1/P2", só que sem prioridade nenhuma).
  if (p === 'Despriorizado') return 'D';
  return p || '—';
}

  const clienteId = getClienteIdByNomePlanning(data, clienteNome);
  const merged = buildDemandasMerged(data.demandasCustom, data.demandasBase, data.demandasManuais);
  const planningDoCliente = merged.filter(m => m.cliente === clienteNome && demandaEmAbertoPlanning(m) && m.tipo === 'Planning');

  const metaContas = getClienteBudgetComFallback(data, 'contas-finalizadas', clienteId, clienteNome, mesN);
  slide.addShape(pptx.ShapeType.roundRect, {x:0.4, y:1.5, w:12.53, h:0.44, rectRadius:0.05, fill:{color:PLANNING_CARD_BG}, line:{color:PLANNING_CARD_LINE, width:1}});
  slide.addText([
    {text:'Meta Contas Finalizadas: ', options:{color:RIVIO_PPTX.azul, bold:false}},
    {text: fmtMetaValorReport(metaContas, 'Absoluto'), options:{color:RIVIO_PPTX.azul, bold:true}},
  ], {x:0.6, y:1.5, w:6.5, h:0.44, fontFace:RIVIO_PPTX.fontFace, fontSize:13, valign:'middle'});

  // Larguras das 3 colunas ajustadas em 29/08/2026 (2ª rodada) a partir do "Cliente Template.pptx"
  // enviado pelo usuário: a tabela de Desenvolvimento (a que mais tende a ficar extensa) e a de
  // Atendimento ficam bem mais largas; a coluna de Auditoria fica mais estreita, já que perdeu a tabela
  // manual (ficava sempre em branco) e agora só tem os cards de KPI empilhados + "Ajustes Backlog".
  const colY = 2.14, colH = 4.9, gap = 0.085;
  const devW = 5.31, audW = 2.83, atdW = 4.22;
  const devX = 0.4, audX = devX + devW + gap, atdX = audX + audW + gap;

  // ---- Desenvolvimento ----
  slide.addShape(pptx.ShapeType.roundRect, {x:devX, y:colY, w:devW, h:colH, rectRadius:0.05, fill:{color:RIVIO_PPTX.branco}, line:{color:'E6E6E6', width:1}});
  slide.addText('Desenvolvimento', {x:devX+0.16, y:colY+0.1, w:devW-0.32, h:0.3, fontFace:RIVIO_PPTX.fontFace, fontSize:14, bold:true, color:RIVIO_PPTX.tinta});
  const devRows = planningDoCliente.filter(m => m.classificacao && PLANNING_CLASSIF_DEV.includes(m.classificacao));
  // Cabeçalho da coluna de prioridade fica em branco (pedido em 29/08/2026) — os valores (P0/P1/P2/
  // Despriorizado) já deixam claro do que se trata, e isso libera espaço pra coluna Demanda, que estava
  // ficando estreita demais e deixando a tabela "extensa" (texto quebrando em várias linhas por ticket).
  // Ajuste pedido em 29/08/2026 (3ª rodada): mesmo com a coluna Demanda bem mais larga, algumas listas
  // ainda não cabiam por completo — encolhemos mais a coluna RESP. (a maior parte só mostra "—" mesmo,
  // já que responsavelDesenvolvimentoId raramente está preenchido nas demandas de Planning) e baixamos a
  // fonte pra 7, liberando ainda mais espaço pra coluna Demanda (que continua com largura flexível).
  // Ajuste pedido em 29/08/2026 (4ª rodada): Prioridade ainda menor (0,84cm≈0,33") e RESP. um pouco maior
  // (2,33cm≈0,92") — a altura de linha dinâmica (ver addPlanningListTable) já cobre com segurança
  // qualquer quebra extra de linha que isso cause em "Despriorizado".

  // ---- Auditoria ----

  // mais estreita). No lugar da tabela, entra um novo KPI "Ajustes Backlog": contagem de tickets em

  const backlogBoxW = (audStatW - 0.08) / 2;

  addPlanningTicketCodeGrid(pptx, slide, audX+0.16, colY+3.46, audStatW, backlogTickets.map(m => m.numero).filter(Boolean), {maxRows:5});

  // ---- Atendimento ----

  slide.addText('Atendimento', {x:atdX+0.16, y:colY+0.1, w:atdW-0.32, h:0.3, fontFace:RIVIO_PPTX.fontFace, fontSize:14, bold:true, color:RIVIO_PPTX.tinta});
  const diasReal = mesAnt ? getMetaRealizadoPorClienteMes('dias-ticket-aberto', data, clienteId, clienteNome, mesAnt, null) : null;
  addPlanningStatPairCard(pptx, slide, atdX+0.16, colY+0.48, atdW-0.32, 0.9, 'Média Dias em Aberto',
    {value: fmtMetaValorReport(diasReal, 'Absoluto'), label:'REAL'}, {value:'5,0', label:'META MÊS'});
  const atdRows = planningDoCliente.filter(m => m.classificacao === 'Atendimento Personalização');
  addPlanningListTable(pptx, slide, atdX+0.16, colY+1.56, atdW-0.32, colH-1.72, ['DEMANDA','','RESP.'],
    atdRows.map(m => [m.assunto || '(sem assunto)', prioridadeAbrevPlanning(m.prioridade), m.responsavel || '—']),
    [null, 0.33, 0.92], {fontSize:7});

// Slide 12 — Geral Auditoria: 4 tabelas (Efetividade Regras / Cobertura Regras / Subfaturamento /
// Contas Automáticos), grade 2x2, todas com todos os clientes e coluna PLUS = META × 1,2 arredondado
// para cima.
function addPlanningAuditoriaGeralSlide(pptx, data, mesN, mesLabel){
  const slide = pptx.addSlide();
  slide.background = {color: RIVIO_PPTX.branco};
  addPlanningHeader(pptx, slide, 'Visão geral · auditoria', 'Geral · Auditoria');

  const clientesTodos = DEMANDAS_CLIENTES_ORDEM.filter(c => c.toLowerCase() !== 'interno');
  const mesAnt = mesAnteriorPlanning(mesN);
  const specs = [
    {titulo:'Efetividade Regras', slug:'efetividade-regras', unidade:'%'},
    {titulo:'Cobertura Regras', slug:'penetracao-regras', unidade:'%'},
    {titulo:'Subfaturamento', slug:'subfaturamento', unidade:'%'},
    // Ajuste pedido em 29/08/2026: apesar do nome antigo "% Contas Automático" usado no resto do app,
    // esse KPI guarda valores ABSOLUTOS (quantidade de contas), não percentual — o título e a formatação
    // aqui no Planning refletem isso (sem "%"), diferente das outras 3 tabelas desta tela.
    {titulo:'Contas Automáticos', slug:'contas-automatico', unidade:'Absoluto'},
  ];
  const gap = 0.24, colW = (12.53-gap)/2, rowGap = 0.22, rowH = (5.2-rowGap)/2;
  const startX = 0.4, startY = 1.9;
  specs.forEach((spec, i) => {
    const col = i % 2, row = Math.floor(i/2);
    const x = startX + col*(colW+gap);
    const y = startY + row*(rowH+rowGap);
    slide.addShape(pptx.ShapeType.roundRect, {x, y, w:colW, h:rowH, rectRadius:0.05, fill:{color:RIVIO_PPTX.branco}, line:{color:'E6E6E6', width:1}});
    slide.addText(spec.titulo, {x:x+0.16, y:y+0.08, w:colW-0.32, h:0.28, fontFace:RIVIO_PPTX.fontFace, fontSize:13, bold:true, color:RIVIO_PPTX.tinta});
    const rows = clientesTodos.map(cliente => {
      const clienteId = getClienteIdByNomePlanning(data, cliente);
      // Nas 4 tabelas desta tela (grid 2x2, pouca altura por linha) só o primeiro nome do responsável é
      // exibido — um nome completo mais longo (ex.: "Larissa Hildebrando") quebra em 2 linhas e estoura
      // a altura fixa da linha, cortando as últimas linhas da tabela para fora do slide.
      const resp = getClienteResponsavelPlanning(data, cliente, 'Auditoria');
      const respPrimeiroNome = resp ? resp.split(' ')[0] : resp;
      const atual = mesAnt ? getMetaRealizadoPorClienteMes(spec.slug, data, clienteId, cliente, mesAnt, null) : null;
      const meta = getClienteBudgetComFallback(data, spec.slug, clienteId, cliente, mesN);
      const plus = (meta === null || meta === undefined) ? null : Math.ceil(Number(meta) * 1.2);
      const plusTxt = plus === null ? '—' : (spec.unidade === '%' ? (plus + '%') : String(plus));
      return [cliente, respPrimeiroNome || '—', fmtMetaValorReport(atual, spec.unidade), fmtMetaValorReport(meta, spec.unidade), plusTxt];
    });
    addPlanningListTable(pptx, slide, x+0.16, y+0.38, colW-0.32, rowH-0.52, ['CLIENTE','RESP.','ATUAL','META','PLUS'], rows,
      [null, 0.75, 0.7, 0.7, 0.7]);

// Slide 13 — Atendimento KPIs: 3 tabelas (CSAT / SLA 1ª Resposta / Média dias em Aberto), agrupadas por
// pessoa de atendimento (campo "Responsável" de cada ticket).
function addPlanningAtendimentoKpisSlide(pptx, data, mesN, mesLabel){
  const slide = pptx.addSlide();
  slide.background = {color: RIVIO_PPTX.branco};
  addPlanningHeader(pptx, slide, 'Visão geral · atendimento', 'Geral · Atendimento');

  const mesAnt = mesAnteriorPlanning(mesN);
  const merged = buildDemandasMerged(data.demandasCustom, data.demandasBase, data.demandasManuais);
  const base = merged.filter(m => demandaEmAbertoPlanning(m) && m.classificacao && PLANNING_CLASSIF_ATENDIMENTO.includes(m.classificacao));
  // Pedido em 29/08/2026: só entram nomes de pessoas de fato cadastradas no organograma com
  // area==='Atendimento' — antes qualquer texto distinto encontrado no campo "Responsável" dos tickets
  // virava uma linha (incluindo nomes com erro de digitação ou de gente que já saiu do time).
  const nomesAtendimentoOrganograma = new Set((data.pessoas || []).filter(p => p.area === 'Atendimento').map(p => p.nome));
  const responsaveis = Array.from(new Set(base.map(m => m.responsavel).filter(Boolean)))
    .filter(nome => nomesAtendimentoOrganograma.has(nome))
    .sort((a,b) => a.localeCompare(b,'pt-BR'));

  const gap = 0.2, colW = (12.53 - gap*2)/3, startX = 0.4, startY = 1.9, colH = 5.2;

  const specs = [
    {titulo:'CSAT', headers:['RESP.','CSAT REAL','CSAT META'], meta:'4,0',
      calc: resp => {
        if(!mesAnt) return null;
        const subset = base.filter(m => m.responsavel === resp && String(m.mesConclusao) === String(mesAnt));
        return avgCsat(subset.map(m => m.csat));
      }},
    {titulo:'SLA 1ª RESPOSTA', headers:['RESP.','SLA REAL','SLA META'], meta:'240',
      calc: resp => {
        if(!mesAnt) return null;
        const subset = base.filter(m => m.responsavel === resp && m.tempoPrimeiraResposta !== null && mesAnoAbertura(m.abertoEm, mesAnt));
        return subset.length ? avgOf(subset.map(m => m.tempoPrimeiraResposta)) : null;
      }},
    {titulo:'MÉDIA DIAS EM ABERTO', headers:['RESP.','MÉDIA REAL','MÉDIA META'], meta:'5,0',
      calc: resp => {
        if(!mesAnt) return null;
        const subset = base.filter(m => m.responsavel === resp);
        const dias = subset.map(m => diasAbertoNoFimDoMes(m.abertoEm, m.concluidoEm, m.statusEfetivo, CURRENT_YEAR, mesAnt)).filter(v => v !== null);
        return dias.length ? avgOf(dias) : null;
      }},
  ];

  specs.forEach((spec, i) => {
    const x = startX + i*(colW+gap);
    slide.addShape(pptx.ShapeType.roundRect, {x, y:startY, w:colW, h:colH, rectRadius:0.05, fill:{color:RIVIO_PPTX.branco}, line:{color:'E6E6E6', width:1}});
    slide.addText(spec.titulo, {x:x+0.16, y:startY+0.1, w:colW-0.32, h:0.3, fontFace:RIVIO_PPTX.fontFace, fontSize:14, bold:true, color:RIVIO_PPTX.tinta});
    const rows = responsaveis.map(resp => {
      const v = spec.calc(resp);
      return [resp, v === null ? '—' : v.toLocaleString('pt-BR', {maximumFractionDigits:1}), spec.meta];
    });
    addPlanningListTable(pptx, slide, x+0.16, startY+0.5, colW-0.32, colH-0.66, spec.headers, rows, [null, 1.0, 1.0]);
  });
}
