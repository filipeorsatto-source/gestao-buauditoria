<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BU Auditoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- Geração do Report em PPTX (aba "Acompanhamento de Metas", ver gerarReportPptx) — inteiramente no
     navegador, sem servidor: lê os dados já carregados do Firestore e monta o arquivo .pptx localmente.
     IMPORTANTE: pptxgenjs NÃO está hospedado no cdnjs.cloudflare.com (confirmado ao vivo em produção em
     27/08/2026 — a URL de cdnjs devolvia 404/503) apesar de todas as outras libs do app estarem lá; por
     isso este script (só este) vem do jsdelivr, que serve o pacote do npm diretamente e foi confirmado
     funcionando ao vivo. Não "corrigir" isso de volta para cdnjs sem antes testar a URL de verdade.  -->
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<!-- Export em PDF do Report Mensal/Planning (pedido em 30/08/2026): como o PptxGenJS acima só sabe
     gravar .pptx, quando o usuário escolhe "PDF" no seletor de formato os mesmos slides são desenhados
     num <canvas> (ver CanvasPdfPptx/CanvasPdfSlide, que imitam a API do PptxGenJS usada pelas funções
     addXSlide já existentes) e cada canvas vira uma página de imagem dentro de um PDF via jsPDF — o PDF
     final tem o texto "achatado" em imagem (não é selecionável/editável), mas fica fiel ao layout, sem
     depender de nenhum serviço externo de conversão. jsPDF está disponível no cdnjs normalmente. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut
  } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';
  import {
    initializeFirestore, persistentLocalCache, doc, getDoc, setDoc, updateDoc, onSnapshot, runTransaction
  } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyAHQaqtuw4twxmQ9uYfqmqGaLvlJJLY8A4",
    authDomain: "gestao-auditoria-21357.firebaseapp.com",
    databaseURL: "https://gestao-auditoria-21357-default-rtdb.firebaseio.com",
    projectId: "gestao-auditoria-21357",
    storageBucket: "gestao-auditoria-21357.firebasestorage.app",
    messagingSenderId: "755190959980",
    appId: "1:755190959980:web:467a0513e8c5524482ed49"
  };

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  let db;
  try{
    db = initializeFirestore(fbApp, { localCache: persistentLocalCache() });
  }catch(e){
    // Falls back if persistence can't init (e.g. multiple tabs) — Firestore still works without offline cache.
    const { getFirestore } = await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js');
    db = getFirestore(fbApp);
  }

  window.__firebase = {
    auth, db, doc, getDoc, setDoc, updateDoc, onSnapshot, signOut, runTransaction,
    GoogleAuthProvider, signInWithPopup, onAuthStateChanged,
    credentialFromResult: GoogleAuthProvider.credentialFromResult,
  };
  window.__firebaseReady = true;
</script>
<style>
  :root{
    --bg:#F4F5F8;
    --surface:#FFFFFF;
    --surface-2:#FBFBFD;
    --sidebar:#11131C;
    --sidebar-hover:#1B1E2B;
    --sidebar-active:#232740;
    --sidebar-text:#9297AA;
    --sidebar-text-active:#FFFFFF;
    --ink:#151725;
    --ink-soft:#5D6274;
    --ink-faint:#93970F;
    --line:#E6E8EE;
    --line-soft:#EEF0F4;
    --accent:#2C5AA0;
    --accent-ink:#1E3E70;
    --accent-soft:#E7EEF9;
    --accent-soft-2:#DCE6F5;
    --positive:#1F8A70;
    --positive-soft:#E4F4EF;
    --negative:#C4432B;
    --negative-soft:#FBEAE6;
    --warn:#B8862B;
    --warn-soft:#F8EFDF;
    --radius-sm:6px;
    --radius-md:10px;
    --radius-lg:16px;
    --shadow-sm:0 1px 2px rgba(20,22,35,0.06);
    --shadow-md:0 6px 20px rgba(20,22,35,0.08);
    --shadow-lg:0 20px 45px rgba(15,17,28,0.16);
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body,#root{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-soft-2);}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#D7DAE2;border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  .app-shell{display:flex;min-height:100vh;}

  /* SIDEBAR */
  .sidebar{
    width:264px;
    flex-shrink:0;
    background:var(--sidebar);
    color:var(--sidebar-text);
    display:flex;
    flex-direction:column;
    padding:22px 14px 18px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .sidebar-brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 10px 22px;
  }
  .sidebar-brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(135deg,var(--accent) 0%, #4776C4 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;color:#fff;font-size:15px;
    flex-shrink:0;
  }
  .sidebar-brand-text{display:flex;flex-direction:column;}
  .sidebar-brand-title{font-family:var(--font-display);font-weight:600;color:#fff;font-size:15px;letter-spacing:0.2px;}
  .sidebar-brand-sub{font-size:11px;color:#6D7290;font-family:var(--font-mono);letter-spacing:0.5px;text-transform:uppercase;margin-top:1px;}

  .nav-group{margin-bottom:4px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;
    border-radius:var(--radius-sm);
    cursor:pointer;
    font-size:13.5px;
    font-weight:500;
    color:var(--sidebar-text);
    transition:background 0.14s, color 0.14s;
    user-select:none;
    position:relative;
  }
  .nav-item:hover{background:var(--sidebar-hover);color:#E4E6F0;}
  .nav-item.active{background:var(--sidebar-active);color:var(--sidebar-text-active);}
  .nav-item.active::before{
    content:'';position:absolute;left:-14px;top:8px;bottom:8px;width:3px;
    background:var(--accent);border-radius:0 3px 3px 0;
  }
  .nav-icon{width:16px;height:16px;flex-shrink:0;opacity:0.9;}
  .nav-caret{margin-left:auto;width:14px;height:14px;transition:transform 0.16s;opacity:0.7;}
  .nav-caret.open{transform:rotate(90deg);}
  .nav-sub{overflow:hidden;transition:max-height 0.18s ease;}
  .nav-subitem{
    display:flex;align-items:center;gap:9px;
    padding:8px 12px 8px 34px;
    border-radius:var(--radius-sm);
    cursor:pointer;font-size:12.8px;color:#8A8FA6;
    transition:background 0.14s,color 0.14s;
  }
  .nav-subitem:hover{background:var(--sidebar-hover);color:#E4E6F0;}
  .nav-subitem.active{background:var(--sidebar-active);color:#fff;}
  .nav-subitem-dot{width:5px;height:5px;border-radius:50%;background:#565A72;flex-shrink:0;}
  .nav-subitem.active .nav-subitem-dot{background:var(--accent);}

  .sidebar-footer{
    margin-top:auto;padding:14px 12px 4px;
    border-top:1px solid #23263A;
    font-size:11px;color:#5D6180;
    font-family:var(--font-mono);
  }

  /* MAIN */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 32px;
    border-bottom:1px solid var(--line);
    background:var(--surface);
    position:sticky;top:0;z-index:20;
  }
  .topbar-title{font-family:var(--font-display);font-size:19px;font-weight:600;color:var(--ink);}
  .topbar-eyebrow{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:3px;}
  .content{flex:1;padding:28px 32px 60px;max-width:1320px;width:100%;margin:0 auto;}
  .content-demandas{max-width:none;margin:0;}
  /* Pedido em 29/08/2026: Organograma e Papéis e Responsabilidades ganham a largura toda disponível
     (sem o max-width/centralização padrão) e uma folga menor até a barra lateral, pra caber mais
     conteúdo do organograma sem precisar de scroll lateral. */
  .content-wide{max-width:none;margin:0;padding-left:20px;padding-right:20px;}
  .kpi-name-hint{border-bottom:1px dotted var(--ink-soft);cursor:help;}

  .section-block{margin-bottom:34px;}
  .section-block-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
  .section-block-title{font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--ink);}
  .section-block-desc{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

  .btn{
    display:inline-flex;align-items:center;gap:7px;
    padding:9px 15px;border-radius:var(--radius-sm);
    font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;
    transition:transform 0.08s, box-shadow 0.14s, background 0.14s;
    white-space:nowrap;text-decoration:none;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm);}
  .btn-primary:hover{background:var(--accent-ink);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border-color:var(--line);}
  .btn-ghost:hover{background:var(--surface-2);color:var(--ink);}
  .btn-danger{background:var(--negative-soft);color:var(--negative);}
  .btn-danger:hover{background:#F6D9D2;}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .btn-icon{padding:7px;border-radius:var(--radius-sm);background:transparent;border:1px solid var(--line);color:var(--ink-soft);cursor:pointer;display:flex;}
  .btn-icon:hover{background:var(--surface-2);color:var(--ink);}
  .btn-icon.danger:hover{background:var(--negative-soft);color:var(--negative);border-color:transparent;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);}
  .card-pad{padding:20px 22px;}

  /* ORG CHART */
  .orgchart-wrap{overflow-x:auto;padding:10px 4px 20px;}
  .orgchart{display:flex;flex-direction:column;align-items:center;min-width:fit-content;}
  .orgchart-root{
    background:var(--sidebar);color:#fff;font-family:var(--font-display);font-weight:600;font-size:13.5px;
    padding:11px 22px;border-radius:var(--radius-md);box-shadow:var(--shadow-md);letter-spacing:0.2px;
  }
  .orgchart-trunk{width:2px;height:22px;background:var(--line);}
  .orgchart-branches{display:flex;gap:6px;position:relative;padding-top:22px;}
  .orgchart-branches::before{
    content:'';position:absolute;top:0;left:calc(50% - 0px);height:1px;background:var(--line);
    right:0;left:0;
  }
  .orgchart-area{display:flex;flex-direction:column;align-items:center;padding:0 16px;min-width:190px;}
  .orgchart-area-stem{width:1px;height:22px;background:var(--line);margin-top:-1px;}
  .orgchart-area-head{
    display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11px;
    text-transform:uppercase;letter-spacing:0.6px;color:var(--ink-soft);margin-bottom:10px;
  }
  .orgchart-area-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .orgchart-people{display:flex;flex-direction:column;gap:8px;width:100%;}
  .orgchart-person{
    display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius-md);padding:9px 11px;box-shadow:var(--shadow-sm);position:relative;
  }
  .orgchart-person:hover .orgchart-person-actions{opacity:1;}
  .orgchart-avatar{
    width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:600;font-size:12px;color:#fff;
  }
  .orgchart-person-info{min-width:0;flex:1;}
  .orgchart-person-name{font-size:12.8px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .orgchart-person-role{font-size:11.3px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .orgchart-person-actions{display:flex;gap:3px;opacity:0;transition:opacity 0.14s;}
  .orgchart-person-name.lideranca{color:var(--accent-ink);font-weight:700;}
  .orgnode{display:flex;flex-direction:column;align-items:center;}
  .orgchart-stem-small{width:1px;height:18px;background:var(--line);}
  .orgchart-branches-inline{display:flex;gap:22px;position:relative;padding-top:18px;align-items:flex-start;}
  .orgchart-branches-inline::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--line);}
  .orgchart-branches-inline.single::before{display:none;}
  .orgchart-area-col{display:flex;flex-direction:column;align-items:center;min-width:168px;padding:0 4px;}
  .orgchart-area-col-stem{width:1px;height:18px;background:var(--line);margin-top:-1px;}
  .orgchart-people-nested{display:flex;flex-direction:column;gap:8px;width:100%;}
  .orgchart-node-item{display:flex;flex-direction:column;align-items:center;width:100%;}

  /* TABLE */
  .table-wrap{overflow-x:auto;}
  table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
  table.tbl th{
    text-align:left;padding:9px 14px;font-size:11px;font-family:var(--font-mono);text-transform:uppercase;
    letter-spacing:0.5px;color:var(--ink-soft);border-bottom:1px solid var(--line);white-space:nowrap;
  }
  table.tbl td{padding:12px 14px;border-bottom:1px solid var(--line-soft);color:var(--ink);vertical-align:middle;}
  table.tbl tr:last-child td{border-bottom:none;}
  table.tbl tr:hover td{background:var(--surface-2);}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}

  .link-title{font-weight:600;font-size:13px;}
  .link-desc{color:var(--ink-soft);font-size:12.3px;margin-top:1px;}
  .link-url{
    display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-size:12.5px;font-weight:600;
    text-decoration:none;
  }
  .link-url:hover{text-decoration:underline;}

  /* EMPTY STATE */
  .empty{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:52px 24px;text-align:center;color:var(--ink-soft);
  }
  .empty-icon{width:38px;height:38px;color:#C7CBD8;margin-bottom:12px;}
  .empty-title{font-family:var(--font-display);font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:4px;}
  .empty-sub{font-size:12.8px;max-width:340px;line-height:1.5;}

  /* LOADING */
  .loading-screen{display:flex;align-items:center;justify-content:center;height:100vh;width:100%;color:var(--ink-soft);gap:10px;font-size:13px;}
  .spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin 0.7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* AUTH / LOGIN */
  .auth-screen{display:flex;align-items:center;justify-content:center;height:100vh;width:100%;background:var(--bg);}
  .auth-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:40px 44px;width:380px;max-width:90vw;text-align:center;}
  .auth-mark{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--accent) 0%, #4776C4 100%);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;color:#fff;font-size:19px;margin:0 auto 18px;}
  .auth-title{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--ink);margin-bottom:6px;}
  .auth-sub{font-size:13px;color:var(--ink-soft);margin-bottom:24px;line-height:1.5;}
  .auth-google-btn{
    display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    padding:11px 16px;border-radius:var(--radius-md);border:1px solid var(--line);
    background:#fff;color:var(--ink);font-size:13.5px;font-weight:600;cursor:pointer;
    transition:background 0.14s,box-shadow 0.14s;
  }
  .auth-google-btn:hover{background:var(--surface-2);box-shadow:var(--shadow-sm);}
  .auth-google-btn:disabled{opacity:0.6;cursor:default;}
  .auth-error{margin-top:16px;font-size:12.5px;color:var(--negative);background:var(--negative-soft);border-radius:var(--radius-sm);padding:10px 12px;line-height:1.5;}
  .topbar-user{display:flex;align-items:center;gap:10px;}
  .topbar-user-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--accent-soft);flex-shrink:0;}
  .topbar-user-avatar-fallback{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .topbar-user-email{font-size:12.5px;color:var(--ink-soft);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .topbar-signout-btn{font-size:12px;color:var(--ink-soft);background:none;border:1px solid var(--line);border-radius:var(--radius-sm);padding:5px 10px;cursor:pointer;transition:background 0.14s;}
  .topbar-signout-btn:hover{background:var(--surface-2);color:var(--ink);}
  .sync-indicator{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft);font-family:var(--font-mono);}
  .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--positive);}
  .sync-dot.offline{background:var(--warn);}

  /* MODAL */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(14,16,26,0.48);backdrop-filter:blur(2px);
    display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:5vh 20px;overflow-y:auto;
    animation:fadeIn 0.14s ease;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal{
    background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
    width:100%;max-width:560px;animation:modalIn 0.16s ease;
  }
  @keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(0.99);}to{opacity:1;transform:none;}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--line);}
  .modal-title{font-family:var(--font-display);font-size:16px;font-weight:600;}
  .modal-body{padding:22px 24px;max-height:64vh;overflow-y:auto;}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--line);}
  .modal-close{background:transparent;border:none;color:var(--ink-soft);cursor:pointer;padding:4px;border-radius:6px;display:flex;}
  .modal-close:hover{background:var(--surface-2);color:var(--ink);}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin-bottom:6px;}
  .field .hint{font-size:11px;color:var(--ink-soft);margin-top:4px;}
  .budget-note{font-size:11px;font-weight:400;font-style:italic;color:var(--ink-soft);margin-top:8px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .input, .select, textarea.input{
    width:100%;padding:9px 11px;border-radius:var(--radius-sm);border:1px solid var(--line);
    background:var(--surface-2);font-size:13px;color:var(--ink);outline:none;transition:border-color 0.14s, background 0.14s;
  }
  .input:focus, .select:focus, textarea.input:focus{border-color:var(--accent);background:var(--surface);}
  textarea.input{resize:vertical;min-height:64px;line-height:1.5;}

  .chip{
    display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent-ink);
    font-size:11.5px;font-weight:600;padding:4px 8px 4px 9px;border-radius:20px;
  }
  .chip button{background:none;border:none;color:var(--accent-ink);cursor:pointer;display:flex;padding:0;opacity:0.6;}
  .chip button:hover{opacity:1;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}

  .multiselect{position:relative;}
  .multiselect-control{
    min-height:38px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);
    padding:6px 8px;display:flex;flex-wrap:wrap;gap:5px;cursor:pointer;align-items:center;
  }
  .multiselect-control:hover{border-color:#C6CBDB;}
  .multiselect-placeholder{color:var(--ink-soft);font-size:12.8px;padding:2px 4px;}
  .multiselect-dropdown{
    position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius-sm);box-shadow:var(--shadow-md);z-index:40;max-height:220px;overflow-y:auto;padding:5px;
  }
  .multiselect-option{
    display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:6px;cursor:pointer;font-size:12.8px;
  }
  .multiselect-option:hover{background:var(--surface-2);}
  .checkbox{width:15px;height:15px;border-radius:4px;border:1.5px solid #C6CBDB;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .checkbox.checked{background:var(--accent);border-color:var(--accent);}

  /* TABS / FILTERS */
  .tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:var(--radius-md);width:fit-content;}
  .tab{padding:7px 14px;border-radius:8px;font-size:12.6px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .tab.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);}
  .filters-bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0;}
  .filter-select{
    padding:8px 11px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface);
    font-size:12.6px;color:var(--ink);min-width:150px;
  }

  /* GROUP CARDS (roles) */
  .group-card{margin-bottom:16px;}
  .group-card-head{
    display:flex;align-items:center;gap:9px;padding:13px 18px;font-family:var(--font-display);
    font-weight:600;font-size:13.5px;border-bottom:1px solid var(--line);
  }
  .group-card-count{
    margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);font-weight:400;
    background:var(--surface-2);padding:2px 8px;border-radius:20px;
  }
  .role-item{padding:12px 18px;border-bottom:1px solid var(--line-soft);display:flex;gap:12px;align-items:flex-start;}
  .role-item:last-child{border-bottom:none;}
  .role-item-title{font-weight:600;font-size:13px;}
  .role-item-desc{font-size:12.3px;color:var(--ink-soft);margin-top:2px;line-height:1.5;}
  .role-item-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
  .tag{
    font-size:10.8px;font-weight:600;padding:3px 8px;border-radius:20px;background:var(--surface-2);
    color:var(--ink-soft);border:1px solid var(--line);
  }
  .tag-client{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent;}
  .tag-area{background:var(--positive-soft);color:var(--positive);border-color:transparent;}

  /* GOALS GRID */
  .goals-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(272px,1fr));gap:14px;}
  .goal-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px 18px 16px;
    cursor:pointer;transition:box-shadow 0.14s, transform 0.1s;box-shadow:var(--shadow-sm);position:relative;
  }
  .goal-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
  .goal-card-unit{
    position:absolute;top:16px;right:16px;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft);
    background:var(--surface-2);padding:3px 8px;border-radius:20px;
  }
  .goal-card-title{font-family:var(--font-display);font-weight:600;font-size:14.5px;margin-bottom:6px;padding-right:56px;}
  .goal-card-desc{font-size:12.2px;color:var(--ink-soft);line-height:1.5;margin-bottom:14px;min-height:34px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .goal-card-foot{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);
    border-top:1px solid var(--line-soft);padding-top:11px;}
  .goal-card-budget{font-family:var(--font-mono);font-weight:600;color:var(--ink);font-size:12.5px;}
  .avatars-stack{display:flex;}
  .avatars-stack .mini-avatar{margin-left:-6px;}
  .avatars-stack .mini-avatar:first-child{margin-left:0;}
  .mini-avatar{
    width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);display:flex;align-items:center;
    justify-content:center;font-size:9px;font-weight:700;color:#fff;font-family:var(--font-display);
  }

  /* GOAL DETAIL */
  .detail-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;}
  .back-link{
    display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);font-size:12.5px;font-weight:600;
    cursor:pointer;margin-bottom:10px;
  }
  .back-link:hover{color:var(--ink);}
  /* Layout padrão do bloco de uma meta em Gestão de Metas: gráfico à esquerda e painel de Detalhes à
     direita, dentro do MESMO card branco (um único fundo/borda/sombra) — antes eram dois .card
     separados lado a lado, o que deixava o painel de Detalhes "flutuando" mais à direita/desalinhado
     em metas sem a tabela Clientes x Meses (menos conteúdo à esquerda). */
  .detail-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:0;align-items:stretch;}
  @media(max-width:900px){.detail-grid{grid-template-columns:1fr;}}
  /* min-width:0 é necessário pra o item do grid respeitar o overflow-x:auto do .table-wrap por dentro
     (ex.: a tabela "Clientes x Meses") em vez de forçar a coluna — e o card inteiro — a alargar além da
     tela; sem isso, metas com essa tabela empurravam o painel de Detalhes pra fora da viewport. */
  .detail-grid-chart{padding:20px 22px;min-width:0;}
  .detail-grid-side{padding:20px 22px;border-left:1px solid var(--line-soft);min-width:0;}
  @media(max-width:900px){.detail-grid-side{border-left:none;border-top:1px solid var(--line-soft);}}
  /* Painel de Detalhes em fonte/espaçamento reduzidos — não deve competir visualmente com o gráfico. */
  .detail-grid-side .section-block-title{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);}
  .detail-grid-side .kv-row{padding:8px 0;font-size:12px;}
  /* Tabela Clientes x Meses (quando a meta tem uma) — largura total do card, abaixo do gráfico e do
     painel de Detalhes, em vez de dividir espaço com a coluna do gráfico. */
  .detail-grid-table-full{padding:0 22px 20px;border-top:1px solid var(--line-soft);margin-top:4px;}
  .detail-grid-table-full > *:first-child{margin-top:14px;}
  .goals-mission-banner{
    background:var(--accent-soft, #eef1ff);color:var(--accent-ink, var(--ink));
    border-radius:var(--radius-lg);padding:16px 22px;margin-bottom:18px;
    font-size:14px;font-weight:600;line-height:1.5;font-style:italic;
  }
  .kv-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:12.8px;}
  .kv-row:last-child{border-bottom:none;}
  .kv-label{color:var(--ink-soft);}
  .kv-value{font-weight:600;text-align:right;max-width:60%;}

  .chart-legend{display:flex;gap:16px;margin-bottom:6px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);}
  .legend-swatch{width:10px;height:10px;border-radius:3px;}
  .chart-tooltip{
    position:absolute;top:6px;transform:translateX(-50%);background:#1E2233;color:#fff;
    padding:9px 12px;border-radius:9px;font-size:11.5px;line-height:1.6;pointer-events:none;
    white-space:nowrap;z-index:5;box-shadow:var(--shadow-md);
  }
  .chart-tooltip-title{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.4px;opacity:0.7;margin-bottom:3px;}
  .chart-tooltip-row{display:flex;align-items:center;gap:6px;}
  .chart-tooltip-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

  .month-budget-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .month-budget-cell label{font-size:10.6px;color:var(--ink-soft);font-family:var(--font-mono);text-transform:uppercase;}

  /* PLACEHOLDER (tracking) */
  .placeholder-card{
    display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:40px 34px;
  }
  .placeholder-badge{
    font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.6px;
    color:var(--warn);background:var(--warn-soft);padding:4px 10px;border-radius:20px;
  }
  .placeholder-title{font-family:var(--font-display);font-size:20px;font-weight:600;}
  .placeholder-text{font-size:13.3px;color:var(--ink-soft);max-width:520px;line-height:1.6;}

  /* TOAST */
  .toast-stack{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:200;}
  .toast{
    background:var(--sidebar);color:#fff;padding:11px 16px;border-radius:var(--radius-sm);font-size:12.8px;
    box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;animation:toastIn 0.18s ease;min-width:200px;
  }
  @keyframes toastIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .toast-dot{width:7px;height:7px;border-radius:50%;background:var(--positive);flex-shrink:0;}
  .toast.error .toast-dot{background:var(--negative);}

  /* CONFIRM */
  .confirm-modal{max-width:400px;}
  .confirm-text{font-size:13px;color:var(--ink-soft);line-height:1.55;}

  .stat-row{display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap;}
  .stat-box{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:15px 17px;}
  .stat-box-label{font-size:11px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);margin-bottom:6px;}
  .stat-box-value{font-family:var(--font-display);font-size:22px;font-weight:600;}

  .required-mark{color:var(--negative);margin-left:2px;}

  /* ROTINAS */
  .rotinas-table-wrap{overflow-x:auto;}
  table.rotinas-tbl{width:100%;border-collapse:collapse;font-size:12.6px;min-width:900px;}
  table.rotinas-tbl th{
    padding:11px 12px;font-size:11px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.4px;
    color:#fff;background:var(--sidebar);text-align:center;white-space:nowrap;
  }
  table.rotinas-tbl th.internal-col{background:var(--warn);}
  table.drilldown-tbl th.internal-col{background:var(--warn-soft);color:var(--warn);}
  table.rotinas-tbl th:first-child{text-align:left;border-radius:0;}
  table.rotinas-tbl td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;background:var(--surface);}
  .dia-cell{
    background:var(--sidebar) !important;color:#fff;font-family:var(--font-display);font-weight:600;font-size:13px;
    cursor:pointer;white-space:nowrap;min-width:110px;
  }
  .dia-cell-inner{display:flex;align-items:center;gap:8px;}
  .dia-cell .nav-caret{color:#fff;opacity:0.85;}
  .meeting-pill{
    display:block;background:var(--accent-soft);color:var(--accent-ink);border-radius:7px;padding:5px 8px;
    font-size:11.3px;font-weight:600;margin-bottom:5px;cursor:pointer;line-height:1.35;
  }
  .meeting-pill:hover{background:var(--accent-soft-2);}
  .meeting-pill .meeting-time{font-family:var(--font-mono);font-weight:500;opacity:0.75;margin-right:4px;}
  .empty-cell-hint{color:#C7CBD8;font-size:15px;text-align:center;display:block;}
  .drilldown-row td{padding:0;border:none;background:var(--surface-2);}
  .drilldown-wrap{padding:14px;}
  table.drilldown-tbl{width:100%;border-collapse:collapse;font-size:11.8px;}
  table.drilldown-tbl th{
    padding:7px 8px;font-size:10.2px;font-family:var(--font-mono);text-transform:uppercase;color:var(--ink-soft);
    background:var(--surface);border:1px solid var(--line);text-align:center;white-space:nowrap;
  }
  table.drilldown-tbl td{
    border:1px solid var(--line-soft);padding:4px 6px;height:30px;vertical-align:top;background:var(--surface);
    position:relative;min-width:110px;
  }
  .drilldown-time-cell{
    background:var(--surface-2) !important;font-family:var(--font-mono);color:var(--ink-soft);font-size:10.8px;
    text-align:right;white-space:nowrap;width:56px;
  }
  .slot-cell{cursor:pointer;}
  .slot-cell:hover{background:var(--accent-soft);}
  .slot-add-btn{opacity:0;display:flex;align-items:center;justify-content:center;color:var(--accent);width:100%;height:100%;min-height:18px;}
  .slot-cell:hover .slot-add-btn{opacity:1;}
  .meeting-pill-sm{
    background:var(--accent);color:#fff;border-radius:6px;padding:3px 6px;font-size:10.6px;font-weight:600;
    cursor:pointer;line-height:1.3;display:block;
  }
  .meeting-pill-sm:hover{background:var(--accent-ink);}

  .hours-summary-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(190px,1fr));gap:10px;}
  .hours-summary-item{
    display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius-md);padding:11px 13px;
  }
  .hours-summary-name{font-size:12.3px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hours-summary-meta{font-size:11px;color:var(--ink-soft);font-family:var(--font-mono);}
  .meeting-pill.internal{background:var(--warn-soft);color:var(--warn);}
  .meeting-pill.internal:hover{background:#F2E3C4;}
  .meeting-pill-sm.internal{background:var(--warn);color:#fff;}
  .meeting-pill-sm.internal:hover{background:#9A6F22;}
  .hours-summary-value{margin-left:auto;font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--accent-ink);white-space:nowrap;}

  /* TAREFAS */
  .page-tabs-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px;}
  table.tarefas-tbl{width:100%;border-collapse:collapse;font-size:12.4px;min-width:1100px;}
  table.tarefas-tbl th{
    text-align:left;padding:9px 12px;font-size:10.5px;font-family:var(--font-mono);text-transform:uppercase;
    letter-spacing:0.4px;color:var(--ink-soft);border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);
  }
  table.tarefas-tbl td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  table.tarefas-tbl tr:hover td{background:var(--surface-2);}
  .tarefa-titulo-cell{cursor:pointer;max-width:340px;}
  .tarefa-titulo-text{font-size:12.4px;line-height:1.4;color:var(--ink);}
  .tarefa-titulo-cell:hover .tarefa-titulo-text{color:var(--accent-ink);text-decoration:underline;}
  .tarefa-resp-select{
    width:100%;min-width:118px;padding:6px 7px;border-radius:7px;border:1px solid transparent;background:var(--surface-2);
    font-size:11.6px;color:var(--ink);outline:none;
  }
  .tarefa-resp-select:hover{border-color:var(--line);}
  .tarefa-resp-select:focus{border-color:var(--accent);background:var(--surface);}
  .tarefa-resp-select.empty{color:#B8BCC9;}

  /* FINANCEIRO / P&L */
  .kpi-hero{
    background:linear-gradient(135deg, var(--sidebar) 0%, #1B2036 100%);
    border-radius:var(--radius-lg);padding:26px 28px;color:#fff;position:relative;overflow:hidden;
    box-shadow:var(--shadow-md);
  }
  .kpi-hero-label{font-family:var(--font-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:0.8px;color:#9BA0B8;margin-bottom:10px;}
  .kpi-hero-value{font-family:var(--font-display);font-size:44px;font-weight:700;line-height:1;margin-bottom:8px;}
  .kpi-hero-value.negative{color:#F3A18C;}
  .kpi-hero-value.positive{color:#8FE0C4;}
  .kpi-hero-formula{font-size:12px;color:#8B90A8;font-family:var(--font-mono);}
  .kpi-hero-period{
    position:absolute;top:26px;right:28px;font-family:var(--font-mono);font-size:11px;color:#C7CBDB;
    background:rgba(255,255,255,0.08);padding:5px 11px;border-radius:20px;
  }
  .kpi-hero-detail{display:flex;gap:26px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.12);}
  .kpi-hero-detail-item{}
  .kpi-hero-detail-label{font-size:10.5px;color:#8B90A8;font-family:var(--font-mono);text-transform:uppercase;margin-bottom:3px;}
  .kpi-hero-detail-value{font-size:14px;font-weight:600;}

  /* REPORT MENSAL (tela de "Acompanhamento de Metas" sem indicador selecionado) — pedido em 27/08/2026
     pra deixar de ser uma tela vazia/genérica (EmptyState) e virar uma tela própria, no mesmo padrão
     visual de destaque usado no hero financeiro (.kpi-hero) acima. */
  .report-hero{
    background:linear-gradient(135deg, var(--sidebar) 0%, #1B2036 100%);
    border-radius:var(--radius-lg);padding:34px 36px;color:#fff;position:relative;overflow:hidden;
    box-shadow:var(--shadow-md);margin-bottom:20px;
  }
  .report-hero::after{
    content:'';position:absolute;top:-70px;right:-70px;width:240px;height:240px;border-radius:50%;
    background:radial-gradient(circle, rgba(44,90,160,0.4), transparent 70%);
  }
  .report-hero-icon{
    width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,0.08);
    display:flex;align-items:center;justify-content:center;color:#8FE0C4;margin-bottom:18px;position:relative;
  }
  .report-hero-label{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:#9BA0B8;margin-bottom:8px;position:relative;}
  .report-hero-title{font-family:var(--font-display);font-size:29px;font-weight:700;margin:0 0 10px 0;position:relative;}
  .report-hero-sub{font-size:13.2px;color:#C7CBDB;max-width:640px;line-height:1.6;position:relative;}

  .report-grid{display:grid;grid-template-columns:1.15fr 0.85fr;gap:18px;align-items:start;}
  @media(max-width:920px){.report-grid{grid-template-columns:1fr;}}

  .report-card-title{font-weight:700;font-size:13.5px;color:var(--ink);margin-bottom:4px;}
  .report-card-sub{font-size:12px;color:var(--ink-soft);margin-bottom:14px;}
  .report-feature-item{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--line-soft);}
  .report-feature-item:last-child{border-bottom:none;padding-bottom:2px;}
  .report-feature-icon{
    width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;color:#fff;
  }
  .report-feature-name{font-weight:700;font-size:13px;color:var(--ink);margin-bottom:2px;}
  .report-feature-desc{font-size:12px;color:var(--ink-soft);line-height:1.5;}

  .report-generate-card .field{margin-bottom:16px;}
  .report-generate-btn{width:100%;justify-content:center;padding-top:11px;padding-bottom:11px;font-size:13.5px;}

  table.pnl-tbl{width:100%;border-collapse:collapse;font-size:12.2px;min-width:820px;}
  table.pnl-tbl th{
    padding:9px 12px;font-size:10.5px;font-family:var(--font-mono);text-transform:uppercase;color:var(--ink-soft);
    border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;background:var(--surface-2);
  }
  table.pnl-tbl th:first-child{text-align:left;}
  table.pnl-tbl td{padding:9px 12px;border-bottom:1px solid var(--line-soft);text-align:right;white-space:nowrap;font-family:var(--font-mono);}
  table.pnl-tbl td:first-child{text-align:left;font-family:var(--font-body);white-space:normal;}
  table.pnl-tbl tr.pnl-row-main td:first-child{font-weight:700;color:var(--ink);}
  table.pnl-tbl tr.pnl-row-sub td:first-child{padding-left:26px;color:var(--ink-soft);font-size:11.6px;}
  table.pnl-tbl tr.pnl-row-total td{border-top:1.5px solid var(--ink);font-weight:700;color:var(--ink);}
  table.pnl-tbl td.negative{color:var(--negative);}
  table.pnl-tbl td.positive{color:var(--positive);}
  table.pnl-tbl td.empty-val{color:#C7CBD8;}

  /* UPSELL SCORE */
  table.upsell-tbl{width:100%;border-collapse:collapse;font-size:11.8px;min-width:1180px;}
  table.upsell-tbl th{
    padding:8px 6px;font-size:10px;font-family:var(--font-mono);text-transform:uppercase;color:var(--ink-soft);
    border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;background:var(--surface-2);
  }
  table.upsell-tbl th:first-child{text-align:left;padding-left:12px;}
  table.upsell-tbl td{padding:6px;border-bottom:1px solid var(--line-soft);text-align:center;vertical-align:middle;min-width:74px;}
  table.upsell-tbl td:first-child{text-align:left;padding-left:12px;white-space:normal;}
  tr.upsell-pillar-row td{background:var(--sidebar);color:#fff;font-family:var(--font-display);font-weight:700;padding-top:9px;padding-bottom:9px;}
  tr.upsell-pillar-row td:first-child{border-radius:0;}
  tr.upsell-kpi-row td:first-child{padding-left:26px;font-weight:600;color:var(--ink);font-size:11.6px;}

  table.demandas-tbl th{
    text-align:left;padding:9px 12px;font-size:10.3px;font-family:var(--font-mono);text-transform:uppercase;

  /* IMPORTANTE: display:flex fica no innerelemento (.demanda-concluido-cell-inner /

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState, useEffect, useRef, useMemo, useCallback} = React;

/* ---------------------------------------------------------------
   CONSTANTS
--------------------------------------------------------------- */
const MONTHS = [
  {n:1, label:'Jan'},{n:2, label:'Fev'},{n:3, label:'Mar'},{n:4, label:'Abr'},
  {n:5, label:'Mai'},{n:6, label:'Jun'},{n:7, label:'Jul'},{n:8, label:'Ago'},
  {n:9, label:'Set'},{n:10, label:'Out'},{n:11, label:'Nov'},{n:12, label:'Dez'}
];
const CURRENT_YEAR = new Date().getFullYear();

// Identificador da versão do código, atualizado manualmente a cada entrega — aparece no rodapé da barra
// lateral (ver Sidebar). Serve pra confirmar rapidamente se o navegador/GitHub Pages está mesmo servindo
// a versão mais recente antes de investigar um bug "que já devia ter sido corrigido": se o número aqui
// não bater com o da última versão enviada, é cache (do navegador ou do GitHub Pages), não um bug novo.
const APP_BUILD_ID = '2026-08-30.27';

const CLIENTES_DEFAULT = ['Einstein SP','Einstein GO','Sírio SP','Sírio BSB','HCOR','HAOC','AC Camargo','Interno'];

// Número de clientes usado como divisor do Ticket Médio (Margem Bruta / Gestão de Metas).
const TICKET_MEDIO_CLIENTES = 7;
function computeTicketMedio(pnlMonthData){
  if(!pnlMonthData || pnlMonthData.receitaTotal === undefined || pnlMonthData.receitaTotal === null) return null;
  // Sempre arredondado, sem casas decimais — usado em toda exibição de Ticket Médio (Margem Bruta,
  // Gestão de Metas, gráficos).
  return Math.round(pnlMonthData.receitaTotal / TICKET_MEDIO_CLIENTES);
}

// Nome do arquivo "Movidesk.xlsx" que o Orsatto atualiza periodicamente (exporta do Movidesk, exclui
// o arquivo antigo e sobe um novo com o mesmo nome). Como excluir e subir de novo cria um ARQUIVO
// NOVO no Drive (com um ID diferente a cada vez, mesmo com o nome idêntico), o botão "Atualizar base
// do Movidesk" não pode depender de um ID fixo — em vez disso, ele busca pelo nome a cada
// sincronização (ver handleSyncMovidesk) e usa sempre o arquivo mais recente encontrado. Isso também
// cobre o caso do Drive converter automaticamente o upload para uma planilha nativa do Google Sheets
// (troca o método de download conforme o mimeType).
//
// A busca tenta primeiro dentro de MOVIDESK_DRIVE_FOLDER_ID (mais rápido e específico); se não achar
// nada lá, cai para uma busca pelo nome em todo o Drive do usuário (sem restrição de pasta). Esse
// fallback existe porque uma pasta acessada via "Compartilhados comigo" no Drive costuma ser um
// ATALHO (shortcut), que tem um ID PRÓPRIO diferente do ID real da pasta de destino — então o ID
// copiado da barra de endereço pode não bater com o "in parents" de fato usado pela API.
const MOVIDESK_DRIVE_FOLDER_ID = '1IpVv7L7U3UvSxPoTqZTXoL9ZbKsWBwAK';
const MOVIDESK_DRIVE_FILENAME = 'Movidesk.xlsx';

// Mapeia o nome da organização como aparece no Movidesk para o nome de cliente usado neste painel.
// Organizações fora dessa lista (outras contas do Movidesk que não são desta BU) são ignoradas.
// 'Rivio' é a própria empresa — tickets internos, mapeados para o pseudo-cliente "Interno".
const MOVIDESK_CLIENT_MAP = {
  'Albert Einstein': 'Einstein SP',
  'Goiânia Einstein': 'Einstein GO',
  'Sírio Libanês - São Paulo': 'Sírio SP',
  'Sírio Libanês - Distrito Federal': 'Sírio BSB',
  'Hospital Hcor': 'HCOR',
  'Alemão Oswaldo Cruz': 'HAOC',
  'AC Camargo': 'AC Camargo',
  'Rivio': 'Interno',
};

// Remove acentuação, normaliza espaços/traços e caixa — usado para casar o nome de cliente da
// planilha com MOVIDESK_CLIENT_MAP mesmo quando o Movidesk exporta com pequenas variações de
// grafia (ex.: "Sírio Libanes - São Paulo" sem o acento em "Libanês", espaçamento diferente ao
// redor do traço etc.), que antes faziam a linha ser silenciosamente ignorada.
const DIACRITICS_RE = new RegExp('[̀-ͯ]', 'g');
function normalizeClientName(s){
  return String(s || '')
    .normalize('NFD').replace(DIACRITICS_RE, '')
    .toLowerCase()
    .replace(/\s*-\s*/g, ' - ')
    .replace(/\s+/g, ' ')
    .trim();
}
const MOVIDESK_CLIENT_MAP_NORMALIZED = Object.fromEntries(
  Object.entries(MOVIDESK_CLIENT_MAP).map(([nome, mapped]) => [normalizeClientName(nome), mapped])
);

// Como normalizeClientName, mas também remove qualquer caractere que não seja letra/número (inclusive
// símbolos como "º"/"ª" de "1º Resposta") — usado para casar nomes de coluna do cabeçalho da planilha
// de forma tolerante a pequenas variações de pontuação/símbolo.
function normalizeHeaderName(s){
  return normalizeClientName(s).replace(/[^a-z0-9]+/g, ' ').trim();
}

// Converte o valor bruto da coluna "Tempo 1º Resposta" (duração) em minutos. Aceita os formatos mais
// comuns de exportação: "H:MM:SS" / "H:MM" (texto), um horário (a planilha às vezes formata duração
// como se fosse um horário do dia — nesse caso os componentes de hora/min/seg já SÃO a duração), ou um
// número puro (assumido já em minutos).
function parseDuracaoParaMinutos(raw){
  if(raw === undefined || raw === null || raw === '') return null;
  if(raw instanceof Date){
    return raw.getHours()*60 + raw.getMinutes() + raw.getSeconds()/60;
  }
  const s = String(raw).trim();
  if(s === '') return null;
  const m = s.match(/^(\d+):(\d{1,2})(?::(\d{1,2}))?$/);
  if(m){
    const h = Number(m[1]), min = Number(m[2]), sec = m[3] ? Number(m[3]) : 0;
    return h*60 + min + sec/60;
  }
  const n = parseBRNumber(s);
  return (n === null || isNaN(n)) ? null : n;
}

// Converte as linhas cruas da planilha (array de arrays, cabeçalho na linha 0) no mesmo formato
// usado por DEMANDAS_SEED: {n, a, s, u, c, r, d}. Colunas esperadas (nessa ordem): Número, Assunto,
// Categoria, Status, Urgência, Serviço (1º Nível), Cliente (Organização), Responsável, Aberto em.
// Retorna também "stats" com diagnóstico de quantas linhas foram ignoradas e por quê — em especial
// quais nomes de cliente apareceram na planilha mas não têm correspondência em MOVIDESK_CLIENT_MAP,
// já que isso historicamente é a causa mais comum de "sincronizei e nada mudou" (a planilha mudou o
// nome da organização, ou tem uma organização nova, e as linhas ficam sendo ignoradas silenciosamente).
function transformMovideskRows(rows){
  const out = [];
  const unmappedClients = {}; // nome cru (primeira organização da célula) -> contagem de linhas
  let skippedMissingFields = 0;
  let skippedInvalidDate = 0;
  const totalDataRows = Math.max(0, rows.length - 1);

  // Colunas "Resolvido Em" e "Tempo 1º Resposta" localizadas pelo nome do cabeçalho (linha 0), em vez
  // de uma posição fixa — diferente das colunas históricas acima (Número, Assunto, ...), essas foram
  // adicionadas depois e podem estar em qualquer posição da planilha, além de poderem não existir
  // ainda em exportações antigas.
  const headerRow = rows[0] || [];
  const resolvidoEmCol = headerRow.findIndex(h => normalizeHeaderName(h) === 'resolvido em');
  // Casamento por tokens (não por igualdade exata) para tolerar variações reais de nomenclatura no
  // export do Movidesk — ex.: cabeçalho real confirmado "1° Resposta (Horas Corridas)" é bem diferente
  // do texto originalmente assumido "Tempo 1º Resposta", mas ambos contêm os tokens "1" e "resposta".
  const tempo1aRespostaCol = headerRow.findIndex(h => {
    const tokens = normalizeHeaderName(h).split(' ').filter(Boolean);
    return tokens.includes('resposta') && tokens.includes('1');
  });
  // Coluna "CSAT" (opcional) — se o usuário adicionar uma coluna com esse nome DIRETO na mesma planilha
  // do Movidesk (ex.: via VLOOKUP/PROCV puxando a nota da aba de Avaliação pelo número do ticket, feito
  // uma vez na própria planilha em vez de depender de uma sincronização separada no app), o CSAT passa a
  // vir junto com o resto dos dados do ticket nesta mesma sincronização — sem precisar de uma gravação
  // separada em demandasCustom (e, portanto, sem o risco de "perda de atualização" entre sincronizações
  // concorrentes que esse caminho separado tinha). Se a coluna não existir, csat fica vazio aqui e o app
  // continua aceitando o valor da sincronização separada de CSAT (ver importCsatAvaliacao) como fallback
  // — csatSheet (dessa sincronização separada) tem prioridade sobre este valor, ver buildDemandasMerged.
  const csatCol = headerRow.findIndex(h => normalizeHeaderName(h) === 'csat');

  for(let i = 1; i < rows.length; i++){
    const row = rows[i];
    if(!row) continue;
    const numero = row[0];
    const assunto = row[1];
    const status = row[3];
    const urgencia = row[4];
    const clienteRaw = row[6];
    const responsavel = row[7];
    const abertoEmRaw = row[8];
    if(numero === undefined || numero === null || numero === '' || !clienteRaw || !status || !abertoEmRaw){ skippedMissingFields++; continue; }
    const firstClient = String(clienteRaw).split(',')[0].trim();
    // Casa primeiro pelo nome exato; se não bater, tenta pelo nome normalizado (sem acento, sem
    // diferenças de espaçamento/maiúsculas) — cobre pequenas variações de grafia na exportação do
    // Movidesk sem precisar atualizar o mapeamento a cada mudança cosmética.
    const mapped = MOVIDESK_CLIENT_MAP[firstClient] || MOVIDESK_CLIENT_MAP_NORMALIZED[normalizeClientName(firstClient)];
    if(!mapped){ unmappedClients[firstClient] = (unmappedClients[firstClient]||0) + 1; continue; }
    const d = (abertoEmRaw instanceof Date) ? abertoEmRaw : new Date(abertoEmRaw);
    if(isNaN(d.getTime())){ skippedInvalidDate++; continue; }
    const iso = d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()) + 'T'
      + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());

    // "Resolvido Em" — se a coluna existe e tem um valor legível como data, vira a data de conclusão
    // automática do ticket (substitui o preenchimento manual de "Concluído em" nas Demandas).
    let resolvidoEmIso = '';
    if(resolvidoEmCol !== -1){
      const raw = row[resolvidoEmCol];
      if(raw){
        const rd = (raw instanceof Date) ? raw : new Date(raw);
        if(!isNaN(rd.getTime())){
          resolvidoEmIso = rd.getFullYear() + '-' + pad2(rd.getMonth()+1) + '-' + pad2(rd.getDate()) + 'T'
            + pad2(rd.getHours()) + ':' + pad2(rd.getMinutes()) + ':' + pad2(rd.getSeconds());
        }
      }
    }

    // "Tempo 1º Resposta" — convertido para minutos (ver parseDuracaoParaMinutos). null quando a
    // coluna não existe na exportação ou está vazia para o ticket.
    const tempo1aResposta = tempo1aRespostaCol !== -1 ? parseDuracaoParaMinutos(row[tempo1aRespostaCol]) : null;
    // "CSAT" — aceita tanto o texto (Péssimo..Ótimo) quanto a nota numérica 1-5 já calculada pela
    // planilha (ex.: resultado de um VLOOKUP/PROCV), reaproveitando o mesmo parser da sincronização
    // separada de CSAT (ver avaliacaoTextoParaNota).
    const csatDaMovidesk = csatCol !== -1 ? avaliacaoTextoParaNota(row[csatCol]) : null;

    out.push({
      n: String(numero).trim(),
      a: (assunto || '').toString().trim(),
      s: (status || '').toString().trim(),
      u: (urgencia || '').toString().trim(),
      c: mapped,
      r: (responsavel || '').toString().trim(),
      d: iso,
      re: resolvidoEmIso,
      tr: tempo1aResposta,
      csat: csatDaMovidesk || '',
    });
  }
  const stats = {
    totalDataRows,
    imported: out.length,
    skippedMissingFields,
    skippedInvalidDate,
    unmappedClients: Object.entries(unmappedClients).map(([nome, count]) => ({nome, count})).sort((a,b) => b.count - a.count),
  };
  return {rows: out, stats};
}

// A planilha "Movidesk" pode ter mais de uma aba (o link do Orsatto, por exemplo, abre direto numa
// aba específica via "#gid=..."), e a ordem das abas no arquivo exportado nem sempre corresponde à
// aba que está sendo vista no navegador. Em vez de sempre pegar a primeira aba do workbook (o que
// pode pegar a aba errada silenciosamente), procura a aba cujo cabeçalho da primeira coluna é
// "Número" (com ou sem acento) — que é a aba com os tickets. Se nenhuma bater, cai para a primeira
// aba mesmo, para não travar a sincronização por completo.
function findMovideskSheetRows(wb){
  for(const nome of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[nome], { header: 1, raw: true, defval: null });
    if(rows.length && normalizeClientName(rows[0] && rows[0][0]) === 'numero'){
      return rows;
    }
  }
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: null });
}

const CSAT_AVALIACAO_SHEET_ID = '1TpINpL8Kttd61YCYzwpAxO-4-hFKzyqs';

// Converte o texto de avaliação da planilha de CSAT numa nota de 1 a 5. Insensível a maiúsculas e
// acentos, pra tolerar pequenas variações de digitação ("Otimo" vs "Ótimo").
function normalizarTextoAvaliacao(str){
  return String(str || '')
    .normalize('NFD').replace(DIACRITICS_RE, '') // remove acentos
    .trim().toLowerCase();
}
const CSAT_AVALIACAO_PARA_NOTA = {
  'pessimo': 1,
  'ruim': 2,
  'neutro': 3,
  'bom': 4,
  'otimo': 5,
};
// Além do texto (Péssimo..Ótimo), também aceita a célula já vir como o número da nota (1 a 5) — comum
// em exportações de formulário que gravam a nota numérica escolhida em vez do rótulo, ou uma planilha
// que já converteu o texto pra número numa coluna auxiliar.
function avaliacaoTextoParaNota(raw){
  if(typeof raw === 'number' && Number.isInteger(raw) && raw >= 1 && raw <= 5) return raw;
  const s = String(raw === undefined || raw === null ? '' : raw).trim();
  if(/^[1-5]$/.test(s)) return Number(s);
  const nota = CSAT_AVALIACAO_PARA_NOTA[normalizarTextoAvaliacao(raw)];
  return nota || null;
}

const MONTH_NAME_TO_N = {

  'Julho':7, 'Agosto':8, 'Setembro':9, 'Outubro':10, 'Novembro':11, 'Dezembro':12,

// Números no formato brasileiro (ponto = separador de milhar, vírgula = decimal). Também aceita
// negativos com "-" na frente.
function parseBRNumber(str){
  if(str === undefined || str === null) return null;
  let s = String(str).trim();
  if(s === '') return null;
  const negative = s.startsWith('-');
  if(negative) s = s.slice(1);
  s = s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/\./g, '');
  const n = Number(s);
  if(isNaN(n)) return null;
  return negative ? -n : n;
}

// Parser simples de CSV (RFC4180-ish): lida com campos entre aspas contendo vírgulas/aspas escapadas.
function parseCSVText(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else if(c === '"'){ inQuotes = true; }
    else if(c === ','){ row.push(field); field = ''; }
    else if(c === '\r'){ /* ignora */ }
    else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
    else field += c;
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

// Converte as linhas cruas do CSV exportado da aba Finance no formato { [mesN]: {receitaTotal,
// receitaPorCliente:{...}, taxasReceita, cogs, payroll, grossProfit, gea, sem, ebitda,
// subLinhas:{ [mainKey]: {label: valor} }, subLinhasOrder:{ [mainKey]: [label, ...] }} }.
//
// Qualquer linha da aba que não seja uma das linhas principais conhecidas (FINANCE_ROW_MAP) é tratada
// como um detalhamento (sub-linha) da última linha principal encontrada acima dela — por exemplo, os
// clientes listados logo abaixo de "Total revenues", ou categorias como "Tecnologia"/"Viagens" logo
// abaixo de "(-) COGS". Isso é detectado dinamicamente a partir da própria planilha, então novas linhas
// adicionadas na aba Finance (sob qualquer linha principal) aparecem automaticamente no painel, sem
// precisar de alteração de código. Sub-linhas de "Total revenues" continuam no campo `receitaPorCliente`
// por compatibilidade com dados já sincronizados antes desta mudança; as demais vão em `subLinhas`.
function transformFinanceRows(rows){
  let headerRowIdx = -1, monthStartCol = -1;
  for(let i = 0; i < rows.length && headerRowIdx === -1; i++){
    const row = rows[i] || [];
    for(let j = 0; j < row.length; j++){
      if(MONTH_NAME_TO_N[String(row[j]).trim()]){ headerRowIdx = i; monthStartCol = j; break; }
    }
  }
  if(headerRowIdx === -1) throw new Error('Não foi possível localizar o cabeçalho de meses na aba Finance.');

  const headerRow = rows[headerRowIdx];
  const monthCols = [];
  for(let j = monthStartCol; j < headerRow.length; j++){
    const n = MONTH_NAME_TO_N[String(headerRow[j]).trim()];
    if(n) monthCols.push({col: j, n});
  }
  if(!monthCols.length) throw new Error('Nenhum mês reconhecido no cabeçalho da aba Finance.');

  const labelCol = monthStartCol - 1;
  const monthsData = {};
  let foundTotalRevenues = false;
  let lastMainKey = null;
  const subLinhasOrder = {}; // { mainKey: [label, ...] } — mesma ordem/estrutura para o ano inteiro

  const ensureMonth = (n) => {
    if(!monthsData[n]) monthsData[n] = {receitaPorCliente:{}, subLinhas:{}};
  };

  for(let i = headerRowIdx + 1; i < rows.length; i++){
    const row = rows[i] || [];
    const label = String(row[labelCol] || '').trim();
    if(!label) continue;
    const key = FINANCE_ROW_MAP[label];

    if(key){
      lastMainKey = key;
      if(label === 'Total revenues') foundTotalRevenues = true;
      monthCols.forEach(({col, n}) => {
        const val = parseBRNumber(row[col]);
        if(val === null) return;
        ensureMonth(n);
        monthsData[n][key] = val;
      });
      continue;
    }

    if(!lastMainKey) continue; // linha antes de qualquer linha principal reconhecida — ignora
    if(!subLinhasOrder[lastMainKey]) subLinhasOrder[lastMainKey] = [];
    if(!subLinhasOrder[lastMainKey].includes(label)) subLinhasOrder[lastMainKey].push(label);

    monthCols.forEach(({col, n}) => {
      const val = parseBRNumber(row[col]);
      if(val === null) return;
      ensureMonth(n);
      if(lastMainKey === 'receitaTotal') monthsData[n].receitaPorCliente[label] = val;
      else{
        if(!monthsData[n].subLinhas[lastMainKey]) monthsData[n].subLinhas[lastMainKey] = {};
        monthsData[n].subLinhas[lastMainKey][label] = val;
      }
    });
  }

  if(!foundTotalRevenues) throw new Error('A aba não contém a linha "Total revenues" — confirme se a primeira aba da planilha "Gestão Metas" é a aba "Finance".');
  Object.keys(monthsData).forEach(n => { monthsData[n].subLinhasOrder = subLinhasOrder; });
  return monthsData;
}

const MONTH_ABBR_TO_N = {

const CANONICAL_CLIENT_NAMES_NORMALIZED = Object.fromEntries(FINANCE_CLIENT_ROWS_FALLBACK.map(n => [normalizeClientName(n), n]));
function canonicalizeClientName(nome){

// Obtém um access token do Google com permissão de leitura no Drive — mesmo fluxo usado pelas
// sincronizações de Margem Bruta e do Movidesk, reaproveitado aqui.
async function getGoogleDriveAccessToken(){
  const fb = await waitForFirebase();
  const provider = new fb.GoogleAuthProvider();
  provider.addScope('https://www.googleapis.com/auth/drive.readonly');
  const result = await fb.signInWithPopup(fb.auth, provider);
  const credential = fb.credentialFromResult ? fb.credentialFromResult(result) : null;
  const accessToken = credential && credential.accessToken;
  if(!accessToken) throw new Error('Não foi possível obter permissão de acesso ao Google Drive.');
  return accessToken;
}

// Lê uma aba específica (por nome) da planilha "Gestão Metas" via API do Google Sheets — diferente do
// export de CSV do Drive (usado pela Margem Bruta), que só consegue exportar a primeira aba do
// arquivo. O escopo de leitura do Drive (acima) já é suficiente para essa chamada.
// `spreadsheetId` é opcional (default = planilha "Gestão Metas") pra permitir ler outras planilhas
// (ex.: a planilha separada de CSAT) sem duplicar essa função.
async function fetchSheetTabValues(accessToken, sheetName, spreadsheetId){
  const sheetId = spreadsheetId || MARGEM_BRUTA_SHEET_ID;
  // Sem nome de aba definido, usa um range sem prefixo de aba — a API do Sheets interpreta isso como
  // a primeira aba da planilha. Usado pela planilha de CSAT, cujo nome de aba não foi informado.
  const range = encodeURIComponent(sheetName ? `'${sheetName}'!A1:Z300` : 'A1:Z5000');
  const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${range}`, {
    headers: { Authorization: 'Bearer ' + accessToken },
  });
  if(!res.ok){
    // Tenta extrair o motivo real que o Google retornou (ex.: "Google Sheets API has not been used in
    // project ... or it is disabled") em vez de só o código HTTP — isso é diferente da API do Drive
    // (usada pela Margem Bruta), então um 403 aqui geralmente significa que a Google Sheets API ainda
    // não foi habilitada no projeto do Google Cloud vinculado a este app, mesmo que a do Drive já esteja.
    let detail = '';
    try{
      const body = await res.json();
      detail = (body && body.error && body.error.message) ? ` — ${body.error.message.replace(/\.+$/, '')}` : '';
    }catch(e){ /* corpo não veio como JSON — segue sem detalhe extra */ }
    const dica = res.status === 403
      ? ' Se a mensagem acima mencionar a API estar desabilitada, é preciso habilitar a "Google Sheets API" no Google Cloud Console (APIs e Serviços → Biblioteca) do projeto vinculado a este app — a API do Drive, usada pela Margem Bruta, é habilitada separadamente e não cobre isso.'
      : ' Confirme se o nome da aba continua o mesmo.';
    throw new Error(`Não foi possível ler a aba "${sheetName || '(primeira aba)'}" da planilha (HTTP ${res.status})${detail}.${dica}`);
  }
  const json = await res.json();
  return json.values || [];
}

// Como parseBRNumber, mas também aceita valores percentuais (ex.: "67%" -> 67).
function parseBRNumberOrPercent(str){
  if(str === undefined || str === null) return null;
  const s = String(str).replace('%', '').trim();
  if(s === '') return null;
  return parseBRNumber(s);
}

// Converte os valores brutos de uma aba no formato "cliente nas linhas, Jan..Dez (abreviado) nas
// colunas" em { [nomeCanônicoDoCliente]: {mesN: valor} }. Ignora a linha "Total" (calculada pelo
// próprio painel) e qualquer linha sem uma das colunas de mês reconhecida.
function parseClienteMesSheet(values){
  let headerRowIdx = -1, monthStartCol = -1;
  for(let i = 0; i < values.length && headerRowIdx === -1; i++){
    const row = values[i] || [];
    for(let j = 0; j < row.length; j++){
      if(MONTH_ABBR_TO_N[String(row[j]).trim()]){ headerRowIdx = i; monthStartCol = j; break; }
    }
  }
  if(headerRowIdx === -1) throw new Error('Não foi possível localizar o cabeçalho de meses (Jan, Fev, ...) na aba.');

  const headerRow = values[headerRowIdx];
  const monthCols = [];
  for(let j = monthStartCol; j < headerRow.length; j++){
    const n = MONTH_ABBR_TO_N[String(headerRow[j]).trim()];
    if(n) monthCols.push({col: j, n});
  }
  if(!monthCols.length) throw new Error('Nenhum mês reconhecido no cabeçalho da aba.');

  const labelCol = monthStartCol - 1;
  const porCliente = {};
  for(let i = headerRowIdx + 1; i < values.length; i++){
    const row = values[i] || [];
    const label = String((labelCol >= 0 ? row[labelCol] : '') || '').trim();
    if(!label || normalizeClientName(label) === 'total') continue;
    const nomeCanonico = canonicalizeClientName(label);
    monthCols.forEach(({col, n}) => {
      const val = parseBRNumberOrPercent(row[col]);
      if(val === null) return;
      if(!porCliente[nomeCanonico]) porCliente[nomeCanonico] = {};
      porCliente[nomeCanonico][n] = val;
    });
  }
  if(!Object.keys(porCliente).length) throw new Error('Nenhum dado de cliente encontrado na aba (confirme se há uma linha por cliente, com Jan..Dez nas colunas).');
  return porCliente;
}

// Formato diferente do "cliente x mês" acima: uma linha por avaliação de ticket, com colunas
// "Ticket" (número, linka com a base do Movidesk) e "Avaliação" (texto livre convertido pra nota de
// 1 a 5 via avaliacaoTextoParaNota). Localiza as colunas pelo nome do cabeçalho (não por posição
// fixa), pra tolerar colunas extras/reordenadas na planilha do usuário.
function parseCsatAvaliacaoSheet(values){
  let headerRowIdx = -1, colTicket = -1, colAvaliacao = -1;
  for(let i = 0; i < values.length && headerRowIdx === -1; i++){
    const row = values[i] || [];
    for(let j = 0; j < row.length; j++){
      const label = normalizarTextoAvaliacao(row[j]);
      if(label === 'ticket') colTicket = j;
      if(label === 'avaliacao' || label === 'avaliação') colAvaliacao = j;
    }
    if(colTicket !== -1 && colAvaliacao !== -1) headerRowIdx = i;
    else { colTicket = -1; colAvaliacao = -1; }
  }
  if(headerRowIdx === -1) throw new Error('Não foi possível localizar as colunas "Ticket" e "Avaliação" na planilha.');

  const porTicket = {};
  const amostrasIgnoradas = []; // {numero, avaliacaoBruta} — só as primeiras, pra diagnóstico sem poluir a mensagem
  let ignoradas = 0;
  for(let i = headerRowIdx + 1; i < values.length; i++){
    const row = values[i] || [];
    const numero = String(row[colTicket] || '').trim();
    if(!numero) continue;
    const nota = avaliacaoTextoParaNota(row[colAvaliacao]);
    if(nota === null){
      ignoradas++;
      if(amostrasIgnoradas.length < 15) amostrasIgnoradas.push({numero, avaliacaoBruta: row[colAvaliacao]});
      continue;
    }
    porTicket[numero] = nota;
  }
  return { porTicket, total: Object.keys(porTicket).length, ignoradas, amostrasIgnoradas };
}

// Nome (pode vir truncado no cabeçalho da aba, ex.: o Sheets corta nomes de aba longos) da aba de
// dentro da planilha de CSAT que tem as colunas "Ticket"/"Avaliação".
const CSAT_AVALIACAO_SHEET_TAB = 'Resultado da pesquisa de satisf';

// Localiza, dentro do workbook baixado da planilha de CSAT, a aba certa — tenta pelo nome configurado
// em CSAT_AVALIACAO_SHEET_TAB (tolerante a acento/caixa/truncamento em qualquer direção, já que nomes
// de aba longos às vezes aparecem cortados de formas diferentes), e cai para a primeira aba em que as
// colunas "Ticket"/"Avaliação" sejam reconhecidas, ou a primeira aba do arquivo como último recurso —
// pra não travar a sincronização por completo se o nome da aba mudar.
// raw:true (não raw:false) é importante aqui: com raw:false o SheetJS devolve o texto FORMATADO da
// célula (respeitando a formatação numérica aplicada no Excel/Sheets — separador de milhar, casas
// decimais etc.), que pode não bater com o número puro do ticket ("2.961" ou "2961,00" em vez de
// "2961"). Isso fazia a coluna Ticket da planilha de CSAT não casar com o número do ticket vindo do
// Movidesk mesmo quando a sincronização "dava certo" (linhas lidas, mas nenhuma batendo) — com raw:true
// a célula numérica vem como número puro do JS, sem formatação, igual ao que já é feito para a coluna
// Número na sincronização do Movidesk (ver transformMovideskRows).
function findCsatSheetRows(wb){
  const alvo = normalizarTextoAvaliacao(CSAT_AVALIACAO_SHEET_TAB);
  for(const nome of wb.SheetNames){
    const n = normalizarTextoAvaliacao(nome);
    if(n === alvo || n.startsWith(alvo) || alvo.startsWith(n)){
      return XLSX.utils.sheet_to_json(wb.Sheets[nome], { header: 1, raw: true, defval: null });
    }
  }
  for(const nome of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[nome], { header: 1, raw: true, defval: null });
    try{
      const r = parseCsatAvaliacaoSheet(rows);
      if(r.total > 0) return rows;
    }catch(e){ /* essa aba não tem as colunas "Ticket"/"Avaliação" — tenta a próxima */ }
  }
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: null });
}

// Próximo número sequencial para um ticket manual novo — prefixo "M" para nunca colidir com um número
// de ticket real do Movidesk (que são só dígitos). Calculado a partir do maior número manual já
// existente, então continua incrementando mesmo se algum ticket manual antigo for excluído no meio.
function nextManualDemandaNumero(demandasManuais){
  const nums = (demandasManuais || [])
    .map(o => o.n)
    .filter(n => /^M\d+$/.test(n))
    .map(n => Number(n.slice(1)));
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return 'M' + String(next).padStart(4, '0');
}
